function CourtApp({ dispatch }) {
  const [roomCode, setRoomCode] = useState(null);
  // Consumed exactly once, same pattern as in BunkerApp — an invite link
  // pre-fills the join code so the player only has to type their name.
  const [inviteCode] = useState(() => {
    if (pendingInviteParams && pendingInviteParams.game === "court") {
      const code = pendingInviteParams.room;
      pendingInviteParams = null;
      return code;
    }
    return null;
  });
  const [playerId] = useState(() => {
    try {
      const saved = sessionStorage.getItem("courtPlayerId");
      if (saved) return saved;
    } catch (e) {}
    const id = genCourtPlayerId();
    try {
      sessionStorage.setItem("courtPlayerId", id);
    } catch (e) {}
    return id;
  });
  const [room, setRoom] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  // "idle" | "reconnecting" | "offline" — same reasoning as Bunker.
  const [connStatus, setConnStatus] = useState("idle");

  const roomRef = useRef(null);
  const roomCodeRef = useRef(null);
  const channelRef = useRef(null);
  const joinTimeoutRef = useRef(null);
  const prevPlayerCountRef = useRef(null);
  const isHostRef = useRef(false);
  const initializedRef = useRef(false);

  useEffect(() => {
    roomRef.current = room;
  }, [room]);
  useEffect(() => {
    roomCodeRef.current = roomCode;
  }, [roomCode]);

  // Bell sound whenever a new participant shows up while everyone is still
  // in the lobby (fires for the Judge and for every other participant already in).
  useEffect(() => {
    if (!room || !room.players || room.status !== "lobby") return;
    const count = Object.keys(room.players).length;
    if (prevPlayerCountRef.current !== null && count > prevPlayerCountRef.current) {
      playChimeSound();
      vibrate([30, 40, 30]);
    }
    prevPlayerCountRef.current = count;
  }, [room]);

  // On mount, try to silently resume whatever room we were last in — a page
  // refresh, or a phone browser reloading a backgrounded tab. See the
  // matching effect in BunkerApp for the full reasoning, including why this
  // is gated on pendingReconnectScreen (CourtApp also mounts on every
  // in-app tap of the Суд tile, not just on a real reload).
  useEffect(() => {
    const eligible = pendingReconnectScreen === "court";
    pendingReconnectScreen = null;
    if (!eligible) {
      clearCourtSession();
      return;
    }
    const saved = loadCourtSession();
    if (!saved || !saved.code) return;
    if (saved.isHost && saved.room) {
      isHostRef.current = true;
      initializedRef.current = true;
      setRoom(saved.room);
      setRoomCode(saved.code);
      setConnStatus("reconnecting");
      const channel = attachChannel(saved.code, true);
      channel.subscribe((status) => {
        if (status === "SUBSCRIBED") {
          setConnStatus("idle");
          broadcastState(saved.room);
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
          setConnStatus("offline");
        }
      });
    } else if (!saved.isHost) {
      setConnStatus("reconnecting");
      const channel = attachChannel(saved.code, false);
      channel.subscribe((status) => {
        if (status === "SUBSCRIBED") {
          channel.send({ type: "broadcast", event: "court_join", payload: { playerId, name: "Участник" } });
          joinTimeoutRef.current = setTimeout(() => {
            setConnStatus("idle");
            setRoomCode(null);
            clearCourtSession();
            supabaseClient.removeChannel(channel);
            channelRef.current = null;
          }, 6000);
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
          if (!initializedRef.current) setConnStatus("offline");
        }
      });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    return () => {
      if (joinTimeoutRef.current) clearTimeout(joinTimeoutRef.current);
      if (channelRef.current) {
        supabaseClient.removeChannel(channelRef.current);
        channelRef.current = null;
      }
      // Real unmount = in-app navigation back to the hub; a page refresh
      // remounts fresh and reads the saved session instead.
      clearCourtSession();
    };
  }, []);

  function broadcastState(nextRoom) {
    setRoom(nextRoom);
    if (isHostRef.current) persistCourtSession(roomCodeRef.current, true, nextRoom);
    if (channelRef.current) {
      channelRef.current.send({ type: "broadcast", event: "court_state", payload: { room: nextRoom } });
    }
  }

  // Creates (Judge) or joins (guest) the Supabase Realtime channel for a
  // room code, and wires up the broadcast events the Court game relies on.
  function attachChannel(code, isHostChannel) {
    const channel = supabaseClient.channel("court-room-" + code, {
      config: { broadcast: { self: true } },
    });

    channel.on("broadcast", { event: "court_state" }, ({ payload }) => {
      if (!payload || !payload.room) return;
      if (joinTimeoutRef.current) {
        clearTimeout(joinTimeoutRef.current);
        joinTimeoutRef.current = null;
      }
      initializedRef.current = true;
      setRoom(payload.room);
      setRoomCode(code);
      setBusy(false);
      setConnStatus("idle");
      if (!isHostChannel) persistCourtSession(code, false, null);
    });

    // Only the Judge's channel resolves join/reveal/vote/tally/verdict
    // requests into authoritative state and rebroadcasts it — every other
    // client just renders what it gets.
    if (isHostChannel) {
      channel.on("broadcast", { event: "court_join" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload || !payload.playerId) return;
        const players = { ...current.players };
        const existing = players[payload.playerId];
        players[payload.playerId] = {
          name: (existing && existing.name) || (payload.name || "Участник").trim().slice(0, 20) || "Участник",
          isHost: payload.playerId === current.hostId,
          joinedAt: existing ? existing.joinedAt : Date.now(),
          role: existing ? existing.role : null,
          evidence: existing ? existing.evidence : null,
          vote: existing ? existing.vote : null,
        };
        broadcastState({ ...current, players });
      });

      channel.on("broadcast", { event: "court_reveal" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload || !current.players[payload.playerId]) return;
        const target = current.players[payload.playerId];
        if (!target.evidence) return;
        const players = {
          ...current.players,
          [payload.playerId]: { ...target, evidence: { ...target.evidence, revealed: true } },
        };
        broadcastState({ ...current, players });
      });

      channel.on("broadcast", { event: "court_vote" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload || !current.players[payload.playerId]) return;
        const target = current.players[payload.playerId];
        if (target.role !== "juror") return;
        if (payload.vote !== "guilty" && payload.vote !== "victim") return;
        const players = { ...current.players, [payload.playerId]: { ...target, vote: payload.vote } };
        broadcastState({ ...current, players });
      });

      channel.on("broadcast", { event: "court_tally" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload) return;
        const target = current.players[payload.playerId];
        if (!target || target.role !== "secretary") return;
        const guilty = Math.max(0, parseInt(payload.guilty, 10) || 0);
        const victim = Math.max(0, parseInt(payload.victim, 10) || 0);
        broadcastState({ ...current, tally: { guilty, victim, submittedBy: payload.playerId } });
      });

      channel.on("broadcast", { event: "court_verdict" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload) return;
        const target = current.players[payload.playerId];
        if (!target || target.role !== "judge") return;
        const text = (payload.text || "").trim().slice(0, 280);
        if (!text) return;
        broadcastState({ ...current, status: "verdict", verdict: { text, decidedBy: payload.playerId } });
      });
    }

    channelRef.current = channel;
    return channel;
  }

  function handleCreate(name) {
    setBusy(true);
    setError("");
    isHostRef.current = true;
    initializedRef.current = false;
    const code = genCourtCode();
    const initialRoom = {
      status: "lobby",
      hostId: playerId,
      case: null,
      tally: null,
      verdict: null,
      players: {
        [playerId]: { name: name.trim().slice(0, 20) || "Судья", isHost: true, joinedAt: Date.now(), role: null, evidence: null, vote: null },
      },
    };
    const channel = attachChannel(code, true);
    channel.subscribe((status) => {
      if (status === "SUBSCRIBED") {
        if (!initializedRef.current) {
          initializedRef.current = true;
          setRoom(initialRoom);
          setRoomCode(code);
          setBusy(false);
          persistCourtSession(code, true, initialRoom);
        } else if (roomRef.current) {
          // Reconnected mid-session after a drop — resync everyone to the
          // real current state, never to the stale object captured above.
          setConnStatus("idle");
          broadcastState(roomRef.current);
        }
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        if (!initializedRef.current) {
          setError("Не удалось подключиться к Supabase. Проверьте интернет-соединение.");
          setBusy(false);
        } else {
          setConnStatus("offline");
        }
      }
    });
  }

  function handleJoin(name, code) {
    if (!/^\d{4}$/.test(code)) {
      setError("Введите 4-значный код");
      return;
    }
    if (!name.trim()) {
      setError("Введите имя");
      return;
    }
    setBusy(true);
    setError("");
    isHostRef.current = false;
    initializedRef.current = false;
    const channel = attachChannel(code, false);
    channel.subscribe((status) => {
      if (status === "SUBSCRIBED") {
        channel.send({ type: "broadcast", event: "court_join", payload: { playerId, name: name.trim().slice(0, 20) } });
        if (!initializedRef.current) {
          joinTimeoutRef.current = setTimeout(() => {
            setError("Заседание не найдено или Судья сейчас offline. Проверьте код.");
            setBusy(false);
            supabaseClient.removeChannel(channel);
            channelRef.current = null;
          }, 4000);
        } else {
          setConnStatus("idle");
        }
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        if (!initializedRef.current) {
          setError("Не удалось подключиться к Supabase. Проверьте интернет-соединение.");
          setBusy(false);
        } else {
          setConnStatus("offline");
        }
      }
    });
  }

  function handleStart() {
    const current = roomRef.current;
    if (!current || !current.players) return;
    if (Object.keys(current.players).length < 4) return;
    const { courtCase, players } = assignCourtRound(current.players, current.hostId);
    broadcastState({ ...current, status: "playing", case: courtCase, tally: null, verdict: null, voteTimer: null, players });
  }

  // Judge-only: starts a fresh case in the same room without kicking anyone
  // back to the lobby, archiving the case that just finished into
  // verdictHistory first so it can still be reviewed later in the session.
  function handleNewCase() {
    const current = roomRef.current;
    if (!current || !current.players) return;
    if (Object.keys(current.players).length < 4) return;
    const { courtCase, players } = assignCourtRound(current.players, current.hostId);
    const verdictHistory = current.verdict
      ? [...(current.verdictHistory || []), { case: current.case, verdict: current.verdict, tally: current.tally }]
      : current.verdictHistory || [];
    broadcastState({ ...current, status: "playing", case: courtCase, tally: null, verdict: null, voteTimer: null, players, verdictHistory });
  }

  function handleReveal() {
    if (!channelRef.current) return;
    channelRef.current.send({ type: "broadcast", event: "court_reveal", payload: { playerId } });
  }

  function handleVote(vote) {
    if (!channelRef.current) return;
    channelRef.current.send({ type: "broadcast", event: "court_vote", payload: { playerId, vote } });
  }

  function handleTally(guilty, victim) {
    if (!channelRef.current) return;
    channelRef.current.send({ type: "broadcast", event: "court_tally", payload: { playerId, guilty, victim } });
  }

  function handleVerdict(text) {
    if (!channelRef.current || !text || !text.trim()) return;
    channelRef.current.send({ type: "broadcast", event: "court_verdict", payload: { playerId, text } });
  }

  // Judge-only, direct: the timer is encoded as an absolute end timestamp
  // rather than a ticking "remaining seconds" value, so every device can
  // render its own countdown locally without the Judge's client having to
  // broadcast an update every second.
  function handleStartVoteTimer(durationSec) {
    const current = roomRef.current;
    if (!current) return;
    broadcastState({ ...current, voteTimer: { endsAt: Date.now() + durationSec * 1000, durationSec } });
  }

  function handleStopVoteTimer() {
    const current = roomRef.current;
    if (!current) return;
    broadcastState({ ...current, voteTimer: null });
  }

  if (!roomCode || !room) {
    if (connStatus === "reconnecting") {
      return (
        <div className="h-full min-h-0 flex flex-col">
          <TopBar onBack={() => dispatch({ type: "GO_HUB" })} title="СУД" right={<IconBank size={18} className="text-[var(--court)]" />} />
          <div className="flex-1 flex items-center justify-center px-8">
            <p className="text-sm text-[var(--text-dim)] text-center">Переподключение к заседанию…</p>
          </div>
        </div>
      );
    }
    return <CourtMenu dispatch={dispatch} onCreate={handleCreate} onJoin={handleJoin} busy={busy} error={error} initialCode={inviteCode} />;
  }
  if (room.status === "playing" || room.status === "verdict") {
    return (
      <CourtGame
        room={room}
        roomCode={roomCode}
        playerId={playerId}
        dispatch={dispatch}
        onReveal={handleReveal}
        onVote={handleVote}
        onTally={handleTally}
        onVerdict={handleVerdict}
        onNewCase={handleNewCase}
        onStartVoteTimer={handleStartVoteTimer}
        onStopVoteTimer={handleStopVoteTimer}
        connStatus={connStatus}
      />
    );
  }
  return (
    <CourtLobby
      room={room}
      roomCode={roomCode}
      playerId={playerId}
      dispatch={dispatch}
      onStart={handleStart}
      error={error}
      busy={busy}
      connStatus={connStatus}
    />
  );
}


/* ---------------------------------------------------------------- */
/* App shell                                                          */
/* ---------------------------------------------------------------- */
function App() {
  const [state, dispatch] = useReducer(reducer, initialState, () => {
    const merged = mergeWithDefaults(loadSavedState());
    // An invite link (?room=1234&game=bunker) jumps straight to that
    // screen on first paint — done here, in the lazy initializer, rather
    // than in an effect, so there's no flash of the Hub first.
    if (pendingInviteParams) return { ...merged, screen: pendingInviteParams.game };
    return merged;
  });

  useEffect(() => {
    try {
      sessionStorage.setItem(SAVED_STATE_KEY, JSON.stringify({ state, savedAt: Date.now() }));
    } catch {}
  }, [state]);

  // Publishes the current screen so SupportChatWidget (rendered as App's
  // sibling, not its child — see the render root below) can hide its
  // floating button once a game has been picked. See hatsitCurrentScreen.
  useEffect(() => {
    setHatsitCurrentScreen(state.screen);
  }, [state.screen]);

  // Clean the ?room=&game= params out of the address bar once — the code
  // itself is consumed separately by BunkerApp/CourtApp (see
  // pendingInviteParams above), this just keeps the URL tidy afterward.
  useEffect(() => {
    if (!pendingInviteParams) return;
    try {
      window.history.replaceState(null, "", window.location.pathname);
    } catch (e) {}
  }, []);

  let screen;
  if (state.screen === "spy-setup") screen = <SpySetup state={state} dispatch={dispatch} />;
  else if (state.screen === "spy-reveal") screen = <SpyReveal state={state} dispatch={dispatch} />;
  else if (state.screen === "spy-playing") screen = <SpyPlaying state={state} dispatch={dispatch} />;
  else if (state.screen === "spy-end") screen = <SpyEnd state={state} dispatch={dispatch} />;
  else if (state.screen === "alias-setup") screen = <AliasSetup state={state} dispatch={dispatch} />;
  else if (state.screen === "alias-team-intro") screen = <AliasTeamIntro state={state} dispatch={dispatch} />;
  else if (state.screen === "alias-playing") screen = <AliasPlaying state={state} dispatch={dispatch} />;
  else if (state.screen === "alias-round-end") screen = <AliasRoundEnd state={state} dispatch={dispatch} />;
  else if (state.screen === "mafia-setup") screen = <MafiaSetup state={state} dispatch={dispatch} />;
  else if (state.screen === "mafia-reveal") screen = <MafiaReveal state={state} dispatch={dispatch} />;
  else if (state.screen === "mafia-roster") screen = <MafiaRoster state={state} dispatch={dispatch} />;
  else if (state.screen === "mafia-game") screen = <MafiaGame state={state} dispatch={dispatch} />;
  else if (state.screen === "mafia-end") screen = <MafiaEnd state={state} dispatch={dispatch} />;
  else if (state.screen === "bunker") screen = <BunkerApp dispatch={dispatch} />;
  else if (state.screen === "court") screen = <CourtApp dispatch={dispatch} />;
  else screen = <Hub dispatch={dispatch} />;

  return (
    <div
      className="app-shell max-w-md mx-auto relative"
      style={{
        background: "var(--bg)",
        paddingTop: "env(safe-area-inset-top, 0px)",
        paddingBottom: "env(safe-area-inset-bottom, 0px)",
        boxSizing: "border-box",
        overflow: "hidden",
      }}
    >
      <FadeIn key={state.screen} className="h-full">
        {screen}
      </FadeIn>
    </div>
  );
}

// Catches render-time crashes anywhere in the app tree (event-handler and
// promise errors are already caught by the plain-JS overlay registered
// above, before this script even ran). Renders nothing itself — the
// vanilla overlay is the actual fallback UI, so it keeps working even if
// something about React's own state is what broke.
// Tells people already using the installed/open app that a newer deploy
// exists, instead of them silently staying on stale cached JS until they
// happen to fully close and reopen the app. sw.js registration itself
// stays in the plain <script> below (so it still works even if this
// component never mounts because of an earlier crash) — this component
// only listens for the resulting "controllerchange" and nudges the
// browser to check for updates more often than it would on its own.
function AppUpdateBanner() {
  const [updateAvailable, setUpdateAvailable] = useState(false);

  useEffect(() => {
    if (!("serviceWorker" in navigator)) return;
    // A controllerchange also fires on the very first page load once the
    // initial service worker takes control — that's not "an update", so
    // only the *second* one onward means a newer sw.js actually replaced
    // an existing one while this tab was open.
    let hadController = !!navigator.serviceWorker.controller;

    function onControllerChange() {
      if (!hadController) { hadController = true; return; }
      setUpdateAvailable(true);
    }
    navigator.serviceWorker.addEventListener("controllerchange", onControllerChange);

    function pokeForUpdate() {
      navigator.serviceWorker.ready.then((reg) => reg.update().catch(() => {})).catch(() => {});
    }
    function onVisible() {
      if (document.visibilityState === "visible") pokeForUpdate();
    }
    const interval = setInterval(pokeForUpdate, 60000);
    document.addEventListener("visibilitychange", onVisible);

    return () => {
      navigator.serviceWorker.removeEventListener("controllerchange", onControllerChange);
      document.removeEventListener("visibilitychange", onVisible);
      clearInterval(interval);
    };
  }, []);

  if (!updateAvailable) return null;
  return (
    <div
      className="fixed left-0 right-0 z-[60] flex justify-center px-4"
      style={{ bottom: "calc(1rem + env(safe-area-inset-bottom, 0px))" }}
    >
      <div className="flex items-center gap-3 bg-[var(--surface)] border border-[var(--border-strong)] rounded-2xl px-4 py-3 max-w-md w-full" style={{ boxShadow: "0 8px 30px rgba(0,0,0,.35)" }}>
        <IconRefresh size={18} className="shrink-0 text-[#c084fc]" />
        <p className="text-sm flex-1">Доступна новая версия Хатсит</p>
        <button
          onClick={() => window.location.reload()}
          className="text-sm font-medium px-3.5 py-1.5 rounded-full text-white shrink-0 touch-manipulation active:scale-95 transition-transform"
          style={{ background: "linear-gradient(135deg, #a855f7, #7c3aed)" }}
        >
          Обновить
        </button>
      </div>
    </div>
  );
}

class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false };
  }
  static getDerivedStateFromError() {
    return { hasError: true };
  }
  componentDidCatch(error, info) {
    hatsitShowCrashOverlay(hatsitFormatErrorReport(error, info));
  }
  render() {
    if (this.state.hasError) return null;
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <AppErrorBoundary>
    <App />
    <SupportChatWidget />
    <AppUpdateBanner />
  </AppErrorBoundary>
);
</script>

<script>
  // Service worker for offline support of the fully local games (Шпион,
  // Алиас, Мафия). See sw.js for the caching strategy and, importantly,
  // for why it's deliberately "network-first" everywhere it can be — an
  // earlier, buggier version of this left people stuck on a stale cached
  // copy of the site, which is why this registration is intentionally
  // this conservative. If sw.js is ever missing from a deploy (e.g. only
  // index.html got uploaded), registration just fails silently below and
  // the app keeps working online exactly as before, just without offline
  // support until sw.js is present again.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
