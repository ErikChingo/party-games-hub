function CourtVoteTimer({ room, isJudge, onStart, onStop }) {
  const t = useT();
  const [now, setNow] = useState(Date.now());
  const timer = room.voteTimer;

  useEffect(() => {
    if (!timer) return;
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, [timer]);

  const remaining = timer ? Math.max(0, Math.ceil((timer.endsAt - now) / 1000)) : 0;
  const expired = !!timer && remaining <= 0;

  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2 text-[var(--court)]">
          <IconTimer size={18} />
          <span className="text-xs uppercase tracking-[0.25em]">{t("court.voteTime")}</span>
        </div>
        {timer && (
          <span className={"font-mono text-lg font-semibold tabular-nums " + (expired ? "text-[var(--danger)]" : "text-[var(--text)]")}>
            {fmtTime(remaining)}
          </span>
        )}
      </div>
      {isJudge ? (
        timer ? (
          <button
            onClick={onStop}
            className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-sm font-semibold py-2.5 rounded-xl active:scale-[0.98] transition-transform"
          >
            {t("court.stopTimer")}
          </button>
        ) : (
          <div className="flex gap-2">
            {[60, 120, 180].map((sec) => (
              <button
                key={sec}
                onClick={() => onStart(sec)}
                className="flex-1 bg-[var(--court)] text-[var(--court-ink)] font-semibold text-sm py-2.5 rounded-xl active:scale-[0.98] transition-transform"
              >
                {Math.round(sec / 60)} {t("common.minutes")}
              </button>
            ))}
          </div>
        )
      ) : (
        !timer && <p className="text-xs text-[var(--text-faint)]">{t("court.judgeNoTimer")}</p>
      )}
      {expired && <p className="text-xs text-[var(--danger)] mt-2">{t("court.timeUpVerdict")}</p>}
    </div>
  );
}

function CourtApp({ dispatch }) {
  const t = useT();

  // Host-only resolvers for what guests can *request* — see useGameRoom's
  // doc comment. Everything else (connect/reconnect/session persistence/
  // create/join) is the shared plumbing.
  const hostEvents = {
    join: (current, payload) => {
      if (!payload || !payload.playerId) return;
      const players = { ...current.players };
      const existing = players[payload.playerId];
      players[payload.playerId] = {
        name: (existing && existing.name) || (payload.name || t("court.participant")).trim().slice(0, 20) || t("court.participant"),
        isHost: payload.playerId === current.hostId,
        joinedAt: existing ? existing.joinedAt : Date.now(),
        role: existing ? existing.role : null,
        evidence: existing ? existing.evidence : null,
        vote: existing ? existing.vote : null,
      };
      return { ...current, players };
    },
    reveal: (current, payload) => {
      if (!payload || !current.players[payload.playerId]) return;
      const target = current.players[payload.playerId];
      if (!target.evidence) return;
      const players = {
        ...current.players,
        [payload.playerId]: { ...target, evidence: { ...target.evidence, revealed: true } },
      };
      return { ...current, players };
    },
    vote: (current, payload) => {
      if (!payload || !current.players[payload.playerId]) return;
      const target = current.players[payload.playerId];
      if (target.role !== "juror") return;
      if (payload.vote !== "guilty" && payload.vote !== "victim") return;
      const players = { ...current.players, [payload.playerId]: { ...target, vote: payload.vote } };
      return { ...current, players };
    },
    tally: (current, payload) => {
      if (!payload) return;
      const target = current.players[payload.playerId];
      if (!target || target.role !== "secretary") return;
      const guilty = Math.max(0, parseInt(payload.guilty, 10) || 0);
      const victim = Math.max(0, parseInt(payload.victim, 10) || 0);
      return { ...current, tally: { guilty, victim, submittedBy: payload.playerId } };
    },
    verdict: (current, payload) => {
      if (!payload) return;
      const target = current.players[payload.playerId];
      if (!target || target.role !== "judge") return;
      const text = (payload.text || "").trim().slice(0, 280);
      if (!text) return;
      return { ...current, status: "verdict", verdict: { text, decidedBy: payload.playerId } };
    },
  };

  const {
    roomCode, room, error, busy, connStatus, playerId, inviteCode,
    roomRef, handleCreate, handleJoin, broadcastState, sendEvent,
  } = useGameRoom({
    gameKey: "court",
    genPlayerId: () => genRoomPlayerId("c"),
    genRoomCode: genRoomCode4,
    buildInitialRoom: (playerId, name) => ({
      status: "lobby",
      hostId: playerId,
      caseIndex: null,
      tally: null,
      verdict: null,
      players: {
        [playerId]: { name: name.trim().slice(0, 20) || t("court.judge"), isHost: true, joinedAt: Date.now(), role: null, evidence: null, vote: null },
      },
    }),
    hostEvents,
    messages: {
      // These reuse the "bunker.*" keys on purpose, matching this app's
      // existing (generic, game-agnostic) connection-error copy.
      enterCode4: t("bunker.enterCode4"),
      enterNameError: t("bunker.enterNameError"),
      connectFailed: t("bunker.connectFailed"),
      notFound: t("court.sessionNotFound"),
      defaultName: t("court.participant"),
    },
  });

  // See the matching call in BunkerApp -- counts toward "Суд — сыграно
  // партий". Court can start a fresh case without leaving the room
  // (handleNewCase below flips status "playing" -> "verdict" -> "playing"
  // again), and the edge-triggered hook correctly counts each new case.
  useRecordGamePlayedOnStart(room && room.status, "court");

  function handleStart() {
    const current = roomRef.current;
    if (!current || !current.players) return;
    if (Object.keys(current.players).length < 4) return;
    const { courtCaseIndex, players } = assignCourtRound(current.players, current.hostId);
    broadcastState({ ...current, status: "playing", caseIndex: courtCaseIndex, tally: null, verdict: null, voteTimer: null, players });
  }

  // Judge-only: starts a fresh case in the same room without kicking anyone
  // back to the lobby, archiving the case that just finished into
  // verdictHistory first so it can still be reviewed later in the session.
  function handleNewCase() {
    const current = roomRef.current;
    if (!current || !current.players) return;
    if (Object.keys(current.players).length < 4) return;
    const { courtCaseIndex, players } = assignCourtRound(current.players, current.hostId);
    const verdictHistory = current.verdict
      ? [...(current.verdictHistory || []), { caseIndex: current.caseIndex, verdict: current.verdict, tally: current.tally }]
      : current.verdictHistory || [];
    broadcastState({ ...current, status: "playing", caseIndex: courtCaseIndex, tally: null, verdict: null, voteTimer: null, players, verdictHistory });
  }

  function handleReveal() {
    sendEvent("reveal", { playerId });
  }

  function handleVote(vote) {
    sendEvent("vote", { playerId, vote });
  }

  function handleTally(guilty, victim) {
    sendEvent("tally", { playerId, guilty, victim });
  }

  function handleVerdict(text) {
    if (!text || !text.trim()) return;
    sendEvent("verdict", { playerId, text });
  }

  // Judge-only, direct: the timer is encoded as an absolute end timestamp
  // rather than a ticking "remaining seconds" value, so every device can
  // render its own countdown locally without the Judge's client having to
  // broadcast an update every second.
  function handleStartVoteTimer(durationSec) {
    const current = roomRef.current;
    if (!current) return;
    broadcastState({ ...current, voteTimer: { endsAt: Date.now() + durationSec * 1000, durationSec } });
  }

  function handleStopVoteTimer() {
    const current = roomRef.current;
    if (!current) return;
    broadcastState({ ...current, voteTimer: null });
  }

  if (!roomCode || !room) {
    if (connStatus === "reconnecting") {
      return (
        <div className="h-full min-h-0 flex flex-col">
          <TopBar onBack={() => dispatch({ type: "GO_HUB" })} title={t("court.title")} right={<IconBank size={18} className="text-[var(--court)]" />} />
          <div className="flex-1 flex items-center justify-center px-8">
            <p className="text-sm text-[var(--text-dim)] text-center">{t("court.reconnecting")}</p>
          </div>
        </div>
      );
    }
    return <CourtMenu dispatch={dispatch} onCreate={handleCreate} onJoin={handleJoin} busy={busy} error={error} initialCode={inviteCode} />;
  }
  if (room.status === "playing" || room.status === "verdict") {
    return (
      <CourtGame
        room={room}
        roomCode={roomCode}
        playerId={playerId}
        dispatch={dispatch}
        onReveal={handleReveal}
        onVote={handleVote}
        onTally={handleTally}
        onVerdict={handleVerdict}
        onNewCase={handleNewCase}
        onStartVoteTimer={handleStartVoteTimer}
        onStopVoteTimer={handleStopVoteTimer}
        connStatus={connStatus}
      />
    );
  }
  return (
    <CourtLobby
      room={room}
      roomCode={roomCode}
      playerId={playerId}
      dispatch={dispatch}
      onStart={handleStart}
      error={error}
      busy={busy}
      connStatus={connStatus}
    />
  );
}


/* ---------------------------------------------------------------- */
/* App shell                                                          */
/* ---------------------------------------------------------------- */
function App() {
  const [state, dispatch] = useReducer(reducer, initialState, () => {
    const merged = mergeWithDefaults(loadSavedState());
    // An invite link (?room=1234&game=bunker) jumps straight to that
    // screen on first paint — done here, in the lazy initializer, rather
    // than in an effect, so there's no flash of the Hub first.
    if (pendingInviteParams) return { ...merged, screen: pendingInviteParams.game };
    return merged;
  });

  // Keeps the document's declared language (and browser tab title) in
  // sync with the in-app language setting. This matters for real
  // assistive tech (screen readers pick a pronunciation/voice from
  // <html lang>, browsers use it to decide whether to offer a translate
  // prompt) — it's not an SEO fix: crawlers that don't run JS (Discord,
  // Telegram, WhatsApp link previews) only ever see the static Russian
  // <head> tags, and there's only one URL for all three languages, so
  // Google can't index separate EN/HY results either way. Properly
  // localizing search snippets would need per-language URLs, which is a
  // separate, bigger change than this quick fix.
  const hatsitSettingsForLang = useHatsitSettings();
  const tForMeta = useT();
  const activeLang = HATSIT_LANGS.includes(hatsitSettingsForLang.language) ? hatsitSettingsForLang.language : "ru";
  useEffect(() => {
    try {
      document.documentElement.lang = activeLang;
      document.title = tForMeta("meta.title");
    } catch (e) {}
  }, [activeLang]);

  useEffect(() => {
    try {
      sessionStorage.setItem(SAVED_STATE_KEY, JSON.stringify({ state, savedAt: Date.now() }));
    } catch {}
  }, [state]);

  // Publishes the current screen so SupportChatWidget (rendered as App's
  // sibling, not its child — see the render root below) can hide its
  // floating button once a game has been picked. See hatsitCurrentScreen.
  useEffect(() => {
    setHatsitCurrentScreen(state.screen);
  }, [state.screen]);

  // Clean the ?room=&game= params out of the address bar once — the code
  // itself is consumed separately by BunkerApp/CourtApp (see
  // pendingInviteParams above), this just keeps the URL tidy afterward.
  useEffect(() => {
    if (!pendingInviteParams) return;
    try {
      window.history.replaceState(null, "", window.location.pathname);
    } catch (e) {}
  }, []);

  // Telegram Mini App bring-up. Runs once; every call here is a no-op
  // outside Telegram since tg() returns null on a plain web visit.
  useEffect(() => {
    const telegram = tg();
    if (!telegram) return;
    try {
      telegram.ready();
      // Mini Apps open collapsed to a half-height sheet by default --
      // expand() takes the full viewport immediately instead of waiting
      // for the player to drag it open themselves.
      telegram.expand();
      // Match Telegram's own chrome to the app's fixed dark theme (see
      // --bg in the :root block) instead of Telegram's default, so there's
      // no light-colored flash of native UI around the app on open.
      telegram.setHeaderColor("#0b0e14");
      telegram.setBackgroundColor("#0b0e14");
      // A stray swipe-down shouldn't lose someone's spot mid-Bunker-debate.
      if (typeof telegram.enableClosingConfirmation === "function") telegram.enableClosingConfirmation();
    } catch (e) {}
  }, []);

  // Telegram's native BackButton (top-left chevron in its own chrome, not
  // part of this page) mirrors whatever the in-page back arrow already
  // does: GO_HUB from anywhere except the Hub itself, where it should be
  // hidden so the only way "back" reads is out of the Mini App entirely.
  useEffect(() => {
    const telegram = tg();
    if (!telegram || !telegram.BackButton) return;
    const onBack = () => dispatch({ type: "GO_HUB" });
    if (state.screen === "hub") {
      telegram.BackButton.hide();
    } else {
      telegram.BackButton.show();
    }
    telegram.BackButton.onClick(onBack);
    return () => {
      try {
        telegram.BackButton.offClick(onBack);
      } catch (e) {}
    };
  }, [state.screen]);

  // Looks the current screen up in SCREEN_COMPONENTS (declared above, next
  // to GAMES) instead of a long if/else chain — see that registry's doc
  // comment for what registering a new game's screens here involves.
  const ScreenComponent = SCREEN_COMPONENTS[state.screen];
  const screen = ScreenComponent ? <ScreenComponent state={state} dispatch={dispatch} /> : <Hub state={state} dispatch={dispatch} />;

  return (
    <div
      className="app-shell mx-auto relative"
      style={{
        background: "var(--bg)",
        paddingTop: "env(safe-area-inset-top, 0px)",
        paddingBottom: "env(safe-area-inset-bottom, 0px)",
        boxSizing: "border-box",
        overflow: "hidden",
      }}
    >
      <FadeIn key={state.screen} className="h-full">
        {screen}
      </FadeIn>
    </div>
  );
}

// Catches render-time crashes anywhere in the app tree (event-handler and
// promise errors are already caught by the plain-JS overlay registered
// above, before this script even ran). Renders nothing itself — the
// vanilla overlay is the actual fallback UI, so it keeps working even if
// something about React's own state is what broke.
// Tells people already using the installed/open app that a newer deploy
// exists, instead of them silently staying on stale cached JS until they
// happen to fully close and reopen the app. sw.js registration itself
// stays in the plain <script> below (so it still works even if this
// component never mounts because of an earlier crash) — this component
// only listens for the resulting "controllerchange" and nudges the
// browser to check for updates more often than it would on its own.
function AppUpdateBanner() {
  const t = useT();
  const [updateAvailable, setUpdateAvailable] = useState(false);

  useEffect(() => {
    if (!("serviceWorker" in navigator)) return;
    // A controllerchange also fires on the very first page load once the
    // initial service worker takes control — that's not "an update", so
    // only the *second* one onward means a newer sw.js actually replaced
    // an existing one while this tab was open.
    let hadController = !!navigator.serviceWorker.controller;

    function onControllerChange() {
      if (!hadController) { hadController = true; return; }
      setUpdateAvailable(true);
    }
    navigator.serviceWorker.addEventListener("controllerchange", onControllerChange);

    function pokeForUpdate() {
      navigator.serviceWorker.ready.then((reg) => reg.update().catch(() => {})).catch(() => {});
    }
    function onVisible() {
      if (document.visibilityState === "visible") pokeForUpdate();
    }
    const interval = setInterval(pokeForUpdate, 60000);
    document.addEventListener("visibilitychange", onVisible);

    return () => {
      navigator.serviceWorker.removeEventListener("controllerchange", onControllerChange);
      document.removeEventListener("visibilitychange", onVisible);
      clearInterval(interval);
    };
  }, []);

  if (!updateAvailable) return null;
  return (
    <div
      className="update-banner fixed left-0 right-0 z-[60] flex justify-center px-4"
    >
      <div className="flex items-center gap-3 bg-[var(--surface)] border border-[var(--border-strong)] rounded-2xl px-4 py-3 sheet-w w-full" style={{ boxShadow: "0 8px 30px rgba(0,0,0,.35)" }}>
        <IconRefresh size={18} className="shrink-0 text-[#c084fc]" />
        <p className="text-sm flex-1">{t("update.available").replace("{brand}", t("brand.name"))}</p>
        <button
          onClick={() => window.location.reload()}
          className="text-sm font-medium px-3.5 py-1.5 rounded-full text-white shrink-0 touch-manipulation active:scale-95 transition-transform"
          style={{ background: "linear-gradient(135deg, #a855f7, #7c3aed)" }}
        >
          {t("update.button")}
        </button>
      </div>
    </div>
  );
}

class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false };
  }
  static getDerivedStateFromError() {
    return { hasError: true };
  }
  componentDidCatch(error, info) {
    hatsitShowCrashOverlay(hatsitFormatErrorReport(error, info));
  }
  render() {
    if (this.state.hasError) return null;
    return this.props.children;
  }
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <AppErrorBoundary>
    <App />
    <SupportChatWidget />
    <AppUpdateBanner />
  </AppErrorBoundary>
);
</script>

<script>
  // Service worker for offline support of the fully local games (Шпион,
  // Алиас, Мафия). See sw.js for the caching strategy and, importantly,
  // for why it's deliberately "network-first" everywhere it can be — an
  // earlier, buggier version of this left people stuck on a stale cached
  // copy of the site, which is why this registration is intentionally
  // this conservative. If sw.js is ever missing from a deploy (e.g. only
  // index.html got uploaded), registration just fails silently below and
  // the app keeps working online exactly as before, just without offline
  // support until sw.js is present again.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
</body>
