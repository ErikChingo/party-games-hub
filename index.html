  @keyframes typingBounce{ 0%,60%,100%{ transform:translateY(0); opacity:.4;} 30%{ transform:translateY(-4px); opacity:1;} }

  @media (prefers-reduced-motion: reduce){
    .pop, .pulse, .flash-badge, .breathe, .neon-pulse, .typing-dot{ animation:none !important; }
  }

  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

  /* App shell height: a plain inline style={{height:"100dvh"}} can't express a  */
  /* fallback for browsers/WebViews that don't support dvh units (some older     */
  /* Android Chrome/WebView) — there an unsupported value falls through to       */
  /* "auto", which can break the h-full/flex-1 height chain used by every        */
  /* screen and, combined with overflow:hidden on this same element, silently    */
  /* clips (rather than scrolls) any content taller than the broken height       */
  /* instead of showing it. A real CSS class can declare the same property       */
  /* twice; the browser keeps the last one it understands and ignores the rest.  */
  .app-shell{
    height: 100vh;   /* fallback for browsers without dvh support */
    height: 100dvh;  /* real viewport height on mobile browsers that support it */
  }

  /* Mobile-first button safety net: every <button> in the app gets a         */
  /* comfortable tap target, can't be squeezed by flex siblings, wraps long   */
  /* text instead of overflowing, and gets crisp touch behavior — without     */
  /* having to hand-edit every single button's className. Small round icon   */
  /* buttons (back arrows, the settings gear, close ×, steppers) keep their   */
  /* own compact circular size instead of being stretched to the floor.      */
  button{
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  button:not([class*="rounded-full"]){
    min-height: 50px;
  }

<script>
  // Last-resort crash reporting: a fatal error anywhere (React render,
  // an event handler, a rejected promise, or a plain script error) shows
  // a small overlay with a "copy report" button, instead of a silent
  // frozen screen with no way to tell us what happened. Deliberately
  // vanilla JS (not React) and registered before the app script runs, so
  // it still works even if the crash is inside React itself or the babel
  // script fails to parse.
  function hatsitFormatErrorReport(error, extra) {
    try {
      var lines = [];
      lines.push("Хатсит — отчёт об ошибке");
      lines.push("Время: " + new Date().toISOString());
      lines.push("Сообщение: " + (error && error.message ? error.message : String(error)));
      if (error && error.stack) lines.push("Stack:\n" + String(error.stack).split("\n").slice(0, 15).join("\n"));
      if (extra && extra.componentStack) lines.push("Component stack:\n" + String(extra.componentStack).split("\n").slice(0, 10).join("\n"));
      var screen = "неизвестен";
      try {
        var saved = sessionStorage.getItem("hatsit_app_state_v1");
        if (saved) {
          var parsed = JSON.parse(saved);
          if (parsed && parsed.screen) screen = parsed.screen;
        }
      } catch (e) {}
      lines.push("Экран: " + screen);
      lines.push("Браузер: " + navigator.userAgent);
      lines.push("Онлайн: " + (navigator.onLine ? "да" : "нет"));
      return lines.join("\n");
    } catch (e) {
      return "Не удалось сформировать отчёт: " + e;
    }
  }

  var __hatsitCrashShown = false;
  function hatsitShowCrashOverlay(reportText) {
    if (__hatsitCrashShown) return;
    __hatsitCrashShown = true;
    try {
      var overlay = document.createElement("div");
      overlay.setAttribute(
        "style",
        "position:fixed;inset:0;z-index:99999;background:#0b0e14;color:#f2f2f2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;text-align:center;"
      );
      overlay.innerHTML =
        '<div style="font-size:40px;margin-bottom:12px;">⚠️</div>' +
        '<div style="font-size:20px;font-weight:600;margin-bottom:8px;">Что-то пошло не так</div>' +
        '<div style="font-size:14px;opacity:.7;max-width:320px;margin-bottom:24px;">Приложение столкнулось с ошибкой. Скопируйте отчёт и пришлите его — это поможет быстро найти причину.</div>' +
        '<button id="__hatsitCrashCopyBtn" style="width:260px;padding:14px;border-radius:16px;background:#e8b545;color:#0b0e14;font-weight:600;font-size:15px;border:none;margin-bottom:12px;">Скопировать отчёт</button>' +
        '<button id="__hatsitCrashReloadBtn" style="width:260px;padding:14px;border-radius:16px;background:transparent;color:#f2f2f2;font-weight:500;font-size:15px;border:1px solid rgba(255,255,255,.2);">Начать заново</button>';
      document.body.appendChild(overlay);
      var copyBtn = overlay.querySelector("#__hatsitCrashCopyBtn");
      var reloadBtn = overlay.querySelector("#__hatsitCrashReloadBtn");
      copyBtn.addEventListener("click", function () {
        try {
          navigator.clipboard.writeText(reportText);
          copyBtn.textContent = "Скопировано!";
          setTimeout(function () {
            copyBtn.textContent = "Скопировать отчёт";
          }, 1500);
        } catch (e) {}
      });
      reloadBtn.addEventListener("click", function () {
        try {
          sessionStorage.clear();
        } catch (e) {}
        window.location.reload();
      });
    } catch (e) {}
  }

  window.addEventListener("error", function (e) {
    hatsitShowCrashOverlay(hatsitFormatErrorReport(e.error || new Error(e.message || "Unknown error")));
  });
  window.addEventListener("unhandledrejection", function (e) {
    hatsitShowCrashOverlay(hatsitFormatErrorReport(e.reason instanceof Error ? e.reason : new Error(String(e.reason))));
  });
</script>

<script>
  /*
   * Minimal, dependency-free QR Code encoder (Byte mode only, EC level L,
   * versions 1-6). Written from scratch so the app never depends on an
   * external CDN for this feature. Exposes `HatsitQR.encode(text)` which
   * returns { size, isDark(row, col) } describing the module matrix.
   *
   * Verified with an extensive offline round-trip test suite (own bit-level
   * decoder plus two independent real QR decoders across versions 1-6 and
   * many realistic invite URLs) before being inlined here.
   */
  (function (global) {
    "use strict";

    // ---------- GF(256) tables (primitive polynomial x^8+x^4+x^3+x^2+1 = 0x11D) ----------
    var GF_EXP = new Array(512);
    var GF_LOG = new Array(256);
    (function initGF() {
      var x = 1;
      for (var i = 0; i < 255; i++) {
        GF_EXP[i] = x;
        GF_LOG[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11d;
      }
      for (var i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
    })();

    function gfMul(a, b) {
      if (a === 0 || b === 0) return 0;
      return GF_EXP[GF_LOG[a] + GF_LOG[b]];
    }

    // Reed-Solomon generator polynomial for `degree` EC codewords.
    function rsGeneratorPoly(degree) {
      var poly = [1];
      for (var i = 0; i < degree; i++) {
        var res = new Array(poly.length + 1).fill(0);
        for (var j = 0; j < poly.length; j++) {
          res[j] ^= poly[j];
          res[j + 1] ^= gfMul(poly[j], GF_EXP[i]);
        }
        poly = res;
      }
      return poly;
    }

    function rsEncode(dataCodewords, ecCount) {
      var generator = rsGeneratorPoly(ecCount);
      var remainder = dataCodewords.concat(new Array(ecCount).fill(0));
      for (var i = 0; i < dataCodewords.length; i++) {
        var coef = remainder[i];
        if (coef === 0) continue;
        for (var j = 0; j < generator.length; j++) {
          remainder[i + j] ^= gfMul(generator[j], coef);
        }
      }
      return remainder.slice(dataCodewords.length);
    }

    // ---------- Version table: EC level L only, versions 1-6 ----------
    var VERSION_TABLE = {
      1: { totalCw: 26, ecPerBlock: 7, numBlocks: 1, size: 21 },
      2: { totalCw: 44, ecPerBlock: 10, numBlocks: 1, size: 25 },

  } catch (e) {}
}

/* Gentle two-note "dzynь" bell — new player joined the Bunker lobby. */
function playChimeSound() {
  try {
    playTone(880, 0.35, { type: "sine", gain: 0.11 });
    playTone(1318.5, 0.45, { type: "sine", gain: 0.09, delay: 0.09 });
  } catch (e) {}
}

/* Short high tick — Alias/Spy countdown in its last seconds. */
function playTickSound() {
  try {
    playTone(1000, 0.05, { type: "square", gain: 0.05 });
  } catch (e) {}
}

/* Two-note descending buzz — a discussion timer (Spy) ran out. */
function playTimeUpSound() {
  try {
    playTone(320, 0.28, { type: "sawtooth", gain: 0.1 });
    playTone(220, 0.4, { type: "sawtooth", gain: 0.1, delay: 0.16 });
  } catch (e) {}
}

/* One global listener plays the click sound for literally any button in  */
/* the app (offline games and Bunker alike) — no need to touch every      */
/* individual onClick handler.                                            */
if (typeof document !== "undefined") {
  document.addEventListener(
    "click",
    (e) => {
      const btn = e.target && e.target.closest && e.target.closest("button");
      if (btn && !btn.disabled) {
        playClickSound();
        vibrate(10);
      }
    },
    true
  );
}

  const active = Object.keys(SPY_LOCATION_CATEGORIES).filter((key) => spyCategories[key]);
  const pool = (active.length > 0 ? active : Object.keys(SPY_LOCATION_CATEGORIES)).flatMap((key) => SPY_LOCATION_CATEGORIES[key]);
  return pool;
}

const ALIAS_ALL_WORDS = Object.values(ALIAS_CATEGORIES).flat();

function getActiveAliasWords(aliasCategories) {
  const active = Object.keys(ALIAS_CATEGORIES).filter((key) => aliasCategories && aliasCategories[key]);
  if (active.length === 0) return ALIAS_ALL_WORDS;
  return active.flatMap((key) => ALIAS_CATEGORIES[key]);
}

function defaultAliasCategories() {
  const result = {};
  Object.keys(ALIAS_CATEGORIES).forEach((key) => {
    result[key] = true;
  });
  return result;
}

const MIN_TEAMS = 2, MAX_TEAMS = 4;
const MIN_ALIAS_SECONDS = 30, MAX_ALIAS_SECONDS = 120, ALIAS_SECONDS_STEP = 15;
const MIN_MAFIA_PLAYERS = 5, MAX_MAFIA_PLAYERS = 20;
const MIN_MAFIA_COUNT = 1;
const MIN_MAFIA_DISCUSSION_MIN = 1, MAX_MAFIA_DISCUSSION_MIN = 50;

const defaultNames = (n) => Array.from({ length: n }, (_, i) => `Игрок ${i + 1}`);
const defaultTeamNames = (n) => Array.from({ length: n }, (_, i) => `Команда ${i + 1}`);

const initialMafiaState = {
  roles: [],
  alive: [],
  phase: "roster",
  night: 0,
  revealIndex: 0,
  mafiaTarget: null,
  donTarget: null,
  donResult: null,
  doctorTarget: null,
  sheriffTarget: null,
  sheriffResult: null,
  maniacTarget: null,
  putanaTarget: null,
  lastNightVictims: [],
  lastNightSaved: false,
  lastWordQueue: [],
  dayTimer: { remaining: 0, running: false },
  exileOpen: false,
  exiledIndex: null,
  rosterOpen: false,
  winner: null,
  historyOpen: false,
  log: [],
  statsRecorded: false,
};

const initialState = {
  screen: "hub", // hub | spy-setup | spy-reveal | spy-playing | spy-end | alias-setup | alias-team-intro | alias-playing | alias-round-end | mafia-setup | mafia-reveal | mafia-roster | mafia-game | mafia-end | bunker
  config: {
    count: 4, minutes: 8, names: defaultNames(4), spyCount: 1, spyCategories: { normal: true, extreme: true, funny: true },
    aliasTeams: defaultTeamNames(2), aliasSeconds: 60, aliasCategories: defaultAliasCategories(),
    mafiaPlayerCount: 8, mafiaNames: defaultNames(8), mafiaCount: 2, mafiaDoctor: true, mafiaSheriff: true, mafiaDon: false, mafiaManiac: false, mafiaPutana: false, mafiaDiscussionMinutes: 3,
  },
  game: { location: null, spyIndexes: [] },
  revealIndex: 0,
  timer: { remaining: 0, running: false },
  endReason: null, // 'timeup' | 'manual'
  alias: {
    scores: [0, 0],
    currentTeam: 0,
    pool: [],
    wordOrder: [],
    wordPointer: 0,
    currentWord: "",
    roundScore: 0,
    timer: { remaining: 0, running: false },
  },
  mafia: initialMafiaState,
};

const SAVED_STATE_KEY = "hatsit_app_state_v1";

function loadSavedState() {
  try {
    const raw = sessionStorage.getItem(SAVED_STATE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object" || !parsed.state) return null;
    const saved = parsed.state;
    const elapsed = Math.max(0, Math.round((Date.now() - (parsed.savedAt || Date.now())) / 1000));
    // If a timer was running when the page closed/reloaded, fast-forward it
    // by the real time that passed instead of freezing or resetting it.
    if (elapsed > 0) {
      if (saved.timer && saved.timer.running) {
        saved.timer = { ...saved.timer, remaining: Math.max(1, saved.timer.remaining - elapsed) };
      }
      if (saved.alias && saved.alias.timer && saved.alias.timer.running) {
        saved.alias = {
          ...saved.alias,
          timer: { ...saved.alias.timer, remaining: Math.max(1, saved.alias.timer.remaining - elapsed) },
        };
      }
      if (saved.mafia && saved.mafia.dayTimer && saved.mafia.dayTimer.running) {
        saved.mafia = {
          ...saved.mafia,
          dayTimer: { ...saved.mafia.dayTimer, remaining: Math.max(1, saved.mafia.dayTimer.remaining - elapsed) },
        };
      }
    }
    return saved;
  } catch {
    return null;
  }
}

// Which screen this literal page load resumed into, computed once at
// script start from the same saved-state blob the root reducer restores
// from. BunkerApp/CourtApp's reconnect effects consume this exactly once
// (reading it, then setting it back to null) to tell "the page was just
// reloaded mid-game" apart from "the player tapped the tile from the Hub"
// — only the former should try to silently resume a networked room. Without
// this check, a room left over from an earlier visit that wasn't closed via
// the back arrow (phone locked, app switched away, tab backgrounded and the
// browser never tore the page down) would resurface every time the player
// opens Бункер/Суд again, instead of a fresh create/join screen.
let pendingReconnectScreen = (() => {
  try {
    const saved = loadSavedState();
    return saved && typeof saved.screen === "string" ? saved.screen : null;
  } catch (e) {
    return null;
  }
})();

// Invite-link support: a shared Bunker/Court link looks like
// "<site>?room=1234&game=bunker". Parsed once at script load, consumed
// exactly once (by BunkerApp/CourtApp reading it and setting it back to
// null) the same way pendingReconnectScreen is above — so navigating away
// and tapping the tile again later in the same tab doesn't keep re-using
// a stale invite code. App() reads this (without clearing it) to decide
// whether to jump straight to the Bunker/Court screen on first load.
let pendingInviteParams = (() => {
  try {
    const params = new URLSearchParams(window.location.search);
    const room = (params.get("room") || "").replace(/\D/g, "").slice(0, 4);
    const game = params.get("game");
    if (room && (game === "bunker" || game === "court")) return { room, game };
  } catch (e) {}
  return null;
})();

function mergeWithDefaults(saved) {
  if (!saved || typeof saved !== "object") return initialState;
  try {
    return {
      ...initialState,
      ...saved,
      config: { ...initialState.config, ...(saved.config || {}) },
      game: { ...initialState.game, ...(saved.game || {}) },
      timer: { ...initialState.timer, ...(saved.timer || {}) },
      alias: {
        ...initialState.alias,
        ...(saved.alias || {}),
        timer: { ...initialState.alias.timer, ...((saved.alias && saved.alias.timer) || {}) },
      },
      mafia: { ...initialMafiaState, ...(saved.mafia || {}) },
    };
  } catch {
    return initialState;
  }
}

function resizeNames(names, n) {
  const next = names.slice(0, n);
  for (let i = next.length; i < n; i++) next.push(`Игрок ${i + 1}`);
  return next;
}

function resizeTeams(names, n) {
  const next = names.slice(0, n);
  for (let i = next.length; i < n; i++) next.push(`Команда ${i + 1}`);
  return next;
}

function shuffledIndices(len) {
  const arr = Array.from({ length: len }, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function nextAliasWord(alias) {
  let { wordOrder, wordPointer, pool } = alias;
  let pointer = wordPointer + 1;
  if (pointer >= wordOrder.length) {
    wordOrder = shuffledIndices(pool.length);
    pointer = 0;
  }
  return { wordOrder, wordPointer: pointer, currentWord: pool[wordOrder[pointer]] };
}

function clampMafiaCount(playerCount, mafiaCount) {
  const max = Math.max(MIN_MAFIA_COUNT, Math.floor((playerCount - 1) / 2));
  return Math.min(max, Math.max(MIN_MAFIA_COUNT, mafiaCount));
}

function buildMafiaRoles(playerCount, mafiaCount, doctor, sheriff, don, maniac, putana) {
  const roles = [];
  const donCount = don && mafiaCount >= 1 ? 1 : 0;
  for (let i = 0; i < mafiaCount - donCount; i++) roles.push("mafia");
  for (let i = 0; i < donCount; i++) roles.push("don");
  // Extra special roles only get a slot if there's room left for them —
  // this way an over-eager setup (small group, everything toggled on)
  // degrades gracefully instead of producing a malformed roster.
  if (doctor && roles.length < playerCount) roles.push("doctor");
  if (sheriff && roles.length < playerCount) roles.push("sheriff");
  if (maniac && roles.length < playerCount) roles.push("maniac");
  if (putana && roles.length < playerCount) roles.push("putana");
  while (roles.length < playerCount) roles.push("civilian");
  const order = shuffledIndices(roles.length);
  return order.map((i) => roles[i]);
}

function checkMafiaWinner(roles, alive) {
  let mafiaAlive = 0, maniacAlive = 0, townAlive = 0;
  roles.forEach((r, i) => {
    if (!alive[i]) return;
    if (r === "mafia" || r === "don") mafiaAlive++;
    else if (r === "maniac") maniacAlive++;
    else townAlive++;
  });
  const totalAlive = mafiaAlive + maniacAlive + townAlive;
  if (maniacAlive === 1 && totalAlive === 1) return "maniac";
  if (mafiaAlive === 0 && maniacAlive === 0) return "town";
  if (mafiaAlive > 0 && mafiaAlive >= townAlive + maniacAlive) return "mafia";
  return null;
}

function nextNightPhase(roles, alive, after) {
  const order = ["putana", "mafia", "don", "maniac", "doctor", "sheriff"];
  const isRoleAlive = (roleId) => roles.some((r, i) => r === roleId && alive[i]);
  const idx = order.indexOf(after);
  for (let i = idx + 1; i < order.length; i++) {
    if (isRoleAlive(order[i])) return `night-${order[i]}`;
  }
  return "night-result";
}

function finalizeMafiaNight(mafia) {
  const { roles, alive, mafiaTarget, doctorTarget, maniacTarget, putanaTarget } = mafia;
  const nextAlive = alive.slice();
  // Путана blocks the *personal* night action of whoever she visits —
  // the mafia's shared kill decision is a group action and isn't affected.
  const blockedRole = putanaTarget !== null && putanaTarget !== undefined ? roles[putanaTarget] : null;
  const doctorBlocked = blockedRole === "doctor";
  const maniacBlocked = blockedRole === "maniac";
  const effectiveDoctorTarget = doctorBlocked ? null : (doctorTarget !== undefined ? doctorTarget : null);
  const effectiveManiacTarget = maniacBlocked ? null : (maniacTarget !== undefined ? maniacTarget : null);

  const victims = [];
  let saved = false;
  if (mafiaTarget !== null && mafiaTarget !== undefined) {
    if (mafiaTarget === effectiveDoctorTarget) saved = true;
    else victims.push(mafiaTarget);
  }
  if (effectiveManiacTarget !== null && effectiveManiacTarget !== undefined && effectiveManiacTarget !== mafiaTarget) {
    if (effectiveManiacTarget === effectiveDoctorTarget) saved = true;
    else victims.push(effectiveManiacTarget);
  }
  victims.forEach((v) => { nextAlive[v] = false; });
  const winner = checkMafiaWinner(roles, nextAlive);
  return { alive: nextAlive, victims, saved, winner };
}

// Runs finalizeMafiaNight, folds the result into the mafia sub-state, drops a
// human-readable entry into the night/day log, and routes to the "last word"
// screen first when someone actually died this night.
function applyNightFinalize(mafia, patch) {
  const merged = { ...mafia, ...patch };
  const { alive, victims, saved, winner } = finalizeMafiaNight(merged);
  const logEntry = {
    type: "night",
    night: mafia.night,
    mafiaTarget: merged.mafiaTarget,
    doctorTarget: merged.doctorTarget,
    maniacTarget: merged.maniacTarget,
    putanaTarget: merged.putanaTarget,
    donResult: merged.donResult,
    sheriffResult: merged.sheriffResult,
    victims,
    saved,
  };
  return {
    ...merged,
    alive,
    lastNightVictims: victims,
    lastNightSaved: saved,
    winner,
    log: [...mafia.log, logEntry],
    lastWordQueue: victims,
    phase: victims.length > 0 ? "night-lastword" : "night-result",
  };
}

function reducer(state, action) {
  switch (action.type) {
    case "GO_HUB":
      return { ...initialState, config: state.config };
    case "OPEN_SPY_SETUP":
      return { ...state, screen: "spy-setup", endReason: null };
    case "OPEN_BUNKER":
      return { ...state, screen: "bunker" };
    case "OPEN_COURT":
      return { ...state, screen: "court" };
    case "SET_COUNT": {
      const count = Math.min(MAX_PLAYERS, Math.max(MIN_PLAYERS, action.value));
      const maxSpies = Math.max(MIN_SPY_COUNT, Math.floor((count - 1) / 2));
      const spyCount = Math.min(maxSpies, Math.max(MIN_SPY_COUNT, state.config.spyCount));
      return { ...state, config: { ...state.config, count, names: resizeNames(state.config.names, count), spyCount } };
    }
    case "SET_SPY_COUNT": {
      const maxSpies = Math.max(MIN_SPY_COUNT, Math.floor((state.config.count - 1) / 2));
      const spyCount = Math.min(maxSpies, Math.max(MIN_SPY_COUNT, action.value));
      return { ...state, config: { ...state.config, spyCount } };
    }
    case "TOGGLE_SPY_CATEGORY": {
      const spyCategories = { ...state.config.spyCategories, [action.key]: !state.config.spyCategories[action.key] };
      return { ...state, config: { ...state.config, spyCategories } };
    }
    case "SET_MINUTES": {
      const minutes = Math.min(MAX_MINUTES, Math.max(MIN_MINUTES, action.value));
      return { ...state, config: { ...state.config, minutes } };
    }
    case "SET_NAME": {
      const names = state.config.names.slice();
      names[action.index] = action.value;
      return { ...state, config: { ...state.config, names } };
    }
    case "LAUNCH_SPY": {
      const pool = getActiveSpyLocations(state.config.spyCategories);
      const location = pool[Math.floor(Math.random() * pool.length)];
      const spyCount = Math.min(state.config.spyCount, Math.max(MIN_SPY_COUNT, state.config.count - 1));
      const spyIndexes = shuffledIndices(state.config.count).slice(0, spyCount);
      return { ...state, screen: "spy-reveal", revealIndex: 0, game: { location, spyIndexes, statsRecorded: false }, endReason: null };
    }
    case "NEXT_REVEAL": {
      const next = state.revealIndex + 1;
      if (next < state.config.count) return { ...state, revealIndex: next };
      return { ...state, screen: "spy-playing", timer: { remaining: state.config.minutes * 60, running: true } };
    }
    case "TICK": {
      if (!state.timer.running) return state;
      const remaining = state.timer.remaining - 1;
      if (remaining <= 0) {
        return { ...state, timer: { remaining: 0, running: false }, screen: "spy-end", endReason: "timeup" };
      }
      return { ...state, timer: { ...state.timer, remaining } };
    }
    case "TOGGLE_RUNNING":
      return { ...state, timer: { ...state.timer, running: !state.timer.running } };
    case "END_MANUAL":
      return { ...state, screen: "spy-end", endReason: "manual", timer: { ...state.timer, running: false } };
    // Marks this round's per-player stats as already tallied, so a page
    // refresh on the end screen (which restores this same state from
    // sessionStorage) can't record the same round twice.
    case "SPY_STATS_RECORDED":
      return { ...state, game: { ...state.game, statsRecorded: true } };
    case "RESTART_SAME":
      return { ...state, screen: "spy-setup", endReason: null, game: { location: null, spyIndexes: [] } };

    case "OPEN_ALIAS_SETUP":
      return { ...state, screen: "alias-setup" };
    case "ALIAS_SET_TEAM_COUNT": {
      const n = Math.min(MAX_TEAMS, Math.max(MIN_TEAMS, action.value));
      const aliasTeams = resizeTeams(state.config.aliasTeams, n);
      const scores = Array.from({ length: n }, (_, i) => state.alias.scores[i] || 0);
      return { ...state, config: { ...state.config, aliasTeams }, alias: { ...state.alias, scores } };
    }
    case "ALIAS_SET_TEAM_NAME": {
      const aliasTeams = state.config.aliasTeams.slice();
      aliasTeams[action.index] = action.value;
      return { ...state, config: { ...state.config, aliasTeams } };
    }
    case "ALIAS_SET_SECONDS": {
      const aliasSeconds = Math.min(MAX_ALIAS_SECONDS, Math.max(MIN_ALIAS_SECONDS, action.value));
      return { ...state, config: { ...state.config, aliasSeconds } };
    }
    case "ALIAS_LAUNCH": {
      const pool = getActiveAliasWords(state.config.aliasCategories);
      const wordOrder = shuffledIndices(pool.length);
      return {
        ...state,
        screen: "alias-team-intro",
        alias: {
          scores: state.config.aliasTeams.map(() => 0),
          currentTeam: 0,
          pool,
          wordOrder,
          wordPointer: 0,
          currentWord: pool[wordOrder[0]],
          roundScore: 0,
          timer: { remaining: state.config.aliasSeconds, running: false },
        },
      };
    }
    case "ALIAS_TOGGLE_CATEGORY": {
      const aliasCategories = { ...state.config.aliasCategories, [action.key]: !state.config.aliasCategories[action.key] };
      return { ...state, config: { ...state.config, aliasCategories } };
    }
    case "ALIAS_START_ROUND":
      return {
        ...state,
        screen: "alias-playing",
        alias: { ...state.alias, roundScore: 0, timer: { remaining: state.config.aliasSeconds, running: true } },
      };
    case "ALIAS_CORRECT": {
      const { wordOrder, wordPointer, currentWord } = nextAliasWord(state.alias);
      return { ...state, alias: { ...state.alias, roundScore: state.alias.roundScore + 1, wordOrder, wordPointer, currentWord } };
    }
    case "ALIAS_SKIP": {
      const { wordOrder, wordPointer, currentWord } = nextAliasWord(state.alias);
      return { ...state, alias: { ...state.alias, roundScore: state.alias.roundScore - 1, wordOrder, wordPointer, currentWord } };
    }
    case "ALIAS_TICK": {
      if (!state.alias.timer.running) return state;
      const remaining = state.alias.timer.remaining - 1;
      if (remaining <= 0) {
        const scores = state.alias.scores.slice();
        scores[state.alias.currentTeam] += state.alias.roundScore;
        return { ...state, screen: "alias-round-end", alias: { ...state.alias, scores, timer: { remaining: 0, running: false } } };
      }
      return { ...state, alias: { ...state.alias, timer: { ...state.alias.timer, remaining } } };
    }
    case "ALIAS_END_ROUND_MANUAL": {
      const scores = state.alias.scores.slice();
      scores[state.alias.currentTeam] += state.alias.roundScore;
      return { ...state, screen: "alias-round-end", alias: { ...state.alias, scores, timer: { ...state.alias.timer, running: false } } };
    }
    case "ALIAS_NEXT_TEAM": {
      const currentTeam = (state.alias.currentTeam + 1) % state.config.aliasTeams.length;
      return { ...state, screen: "alias-team-intro", alias: { ...state.alias, currentTeam, roundScore: 0 } };
    }

    case "OPEN_MAFIA_SETUP":
      return { ...state, screen: "mafia-setup" };
    case "MAFIA_SET_COUNT": {
      const mafiaPlayerCount = Math.min(MAX_MAFIA_PLAYERS, Math.max(MIN_MAFIA_PLAYERS, action.value));
      const mafiaNames = resizeNames(state.config.mafiaNames, mafiaPlayerCount);
      const mafiaCount = clampMafiaCount(mafiaPlayerCount, state.config.mafiaCount);
      return { ...state, config: { ...state.config, mafiaPlayerCount, mafiaNames, mafiaCount } };
    }
    case "MAFIA_SET_NAME": {
      const mafiaNames = state.config.mafiaNames.slice();
      mafiaNames[action.index] = action.value;
      return { ...state, config: { ...state.config, mafiaNames } };
    }
    case "MAFIA_SET_MAFIA_COUNT": {
      const mafiaCount = clampMafiaCount(state.config.mafiaPlayerCount, action.value);
      return { ...state, config: { ...state.config, mafiaCount } };
    }
    case "MAFIA_TOGGLE_DOCTOR":
      return { ...state, config: { ...state.config, mafiaDoctor: !state.config.mafiaDoctor } };
    case "MAFIA_TOGGLE_SHERIFF":
      return { ...state, config: { ...state.config, mafiaSheriff: !state.config.mafiaSheriff } };
    case "MAFIA_TOGGLE_DON":
      return { ...state, config: { ...state.config, mafiaDon: !state.config.mafiaDon } };
    case "MAFIA_TOGGLE_MANIAC":
      return { ...state, config: { ...state.config, mafiaManiac: !state.config.mafiaManiac } };
    case "MAFIA_TOGGLE_PUTANA":
      return { ...state, config: { ...state.config, mafiaPutana: !state.config.mafiaPutana } };
    case "MAFIA_SET_DISCUSSION_MINUTES": {
      const mafiaDiscussionMinutes = Math.min(MAX_MAFIA_DISCUSSION_MIN, Math.max(MIN_MAFIA_DISCUSSION_MIN, action.value));
      return { ...state, config: { ...state.config, mafiaDiscussionMinutes } };
    }
    case "MAFIA_LAUNCH": {
      const { mafiaPlayerCount, mafiaCount, mafiaDoctor, mafiaSheriff, mafiaDon, mafiaManiac, mafiaPutana } = state.config;
      const roles = buildMafiaRoles(mafiaPlayerCount, mafiaCount, mafiaDoctor, mafiaSheriff, mafiaDon, mafiaManiac, mafiaPutana);
      return {
        ...state,
        screen: "mafia-reveal",
        mafia: {
          ...initialMafiaState,
          roles,
          alive: roles.map(() => true),
          revealIndex: 0,
          phase: "roster",
        },
      };
    }
    case "MAFIA_NEXT_REVEAL": {
      const next = state.mafia.revealIndex + 1;
      if (next < state.config.mafiaPlayerCount) return { ...state, mafia: { ...state.mafia, revealIndex: next } };
      return { ...state, screen: "mafia-roster", mafia: { ...state.mafia, revealIndex: next } };
    }
    case "MAFIA_SELECT_PUTANA_TARGET": {
      const putanaTarget = action.index;
      const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "putana");
      if (nextPhase === "night-result") return { ...state, mafia: applyNightFinalize(state.mafia, { putanaTarget }) };
      return { ...state, mafia: { ...state.mafia, putanaTarget, phase: nextPhase } };
    }
    case "MAFIA_SELECT_MAFIA_TARGET": {
      const mafiaTarget = action.index;
      const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "mafia");
      if (nextPhase === "night-result") return { ...state, mafia: applyNightFinalize(state.mafia, { mafiaTarget }) };
      return { ...state, mafia: { ...state.mafia, mafiaTarget, phase: nextPhase } };
    }
    case "MAFIA_SELECT_DON_TARGET": {
      const index = action.index;
      if (index === null || index === undefined) {
        const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "don");
        if (nextPhase === "night-result") return { ...state, mafia: applyNightFinalize(state.mafia, { donTarget: null, donResult: null }) };
        return { ...state, mafia: { ...state.mafia, donTarget: null, donResult: null, phase: nextPhase } };
      }
      const donIndex = state.mafia.roles.indexOf("don");
      const blocked = state.mafia.putanaTarget !== null && state.mafia.putanaTarget === donIndex;
      const isSheriff = !blocked && state.mafia.roles[index] === "sheriff";
      return { ...state, mafia: { ...state.mafia, donTarget: index, donResult: { index, isSheriff, blocked } } };
    }
    case "MAFIA_DON_DONE": {
      const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "don");
      if (nextPhase === "night-result") return { ...state, mafia: applyNightFinalize(state.mafia, {}) };
      return { ...state, mafia: { ...state.mafia, phase: nextPhase } };
    }
    case "MAFIA_SELECT_MANIAC_TARGET": {
      const maniacTarget = action.index;
      const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "maniac");
      if (nextPhase === "night-result") return { ...state, mafia: applyNightFinalize(state.mafia, { maniacTarget }) };
      return { ...state, mafia: { ...state.mafia, maniacTarget, phase: nextPhase } };
    }
    case "MAFIA_SELECT_DOCTOR_TARGET": {
      const doctorTarget = action.index;
      const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "doctor");
      if (nextPhase === "night-result") return { ...state, mafia: applyNightFinalize(state.mafia, { doctorTarget }) };
      return { ...state, mafia: { ...state.mafia, doctorTarget, phase: nextPhase } };
    }
    case "MAFIA_SELECT_SHERIFF_TARGET": {
      const index = action.index;
      if (index === null || index === undefined) {
        return { ...state, mafia: applyNightFinalize(state.mafia, { sheriffTarget: null, sheriffResult: null }) };
      }
      const sheriffIndex = state.mafia.roles.indexOf("sheriff");
      const blocked = state.mafia.putanaTarget !== null && state.mafia.putanaTarget === sheriffIndex;
      const isMafia = !blocked && (state.mafia.roles[index] === "mafia" || state.mafia.roles[index] === "don");
      return { ...state, mafia: { ...state.mafia, sheriffTarget: index, sheriffResult: { index, isMafia, blocked } } };
    }
    case "MAFIA_SHERIFF_DONE": {
      return { ...state, mafia: applyNightFinalize(state.mafia, {}) };
    }
    case "MAFIA_DAY_TICK": {
      if (!state.mafia.dayTimer.running) return state;
      const remaining = state.mafia.dayTimer.remaining - 1;
      if (remaining <= 0) return { ...state, mafia: { ...state.mafia, dayTimer: { remaining: 0, running: false } } };
      return { ...state, mafia: { ...state.mafia, dayTimer: { ...state.mafia.dayTimer, remaining } } };
    }
    case "MAFIA_TOGGLE_DAY_TIMER":
      return { ...state, mafia: { ...state.mafia, dayTimer: { ...state.mafia.dayTimer, running: !state.mafia.dayTimer.running } } };
    case "MAFIA_OPEN_EXILE":
      return { ...state, mafia: { ...state.mafia, exileOpen: true } };
    case "MAFIA_CLOSE_EXILE":
      return { ...state, mafia: { ...state.mafia, exileOpen: false } };
    case "MAFIA_EXILE": {
      const index = action.index;
      const alive = state.mafia.alive.slice();
      if (index !== null && index !== undefined) alive[index] = false;
      const winner = checkMafiaWinner(state.mafia.roles, alive);
      const hasVictim = index !== null && index !== undefined;
      const log = [...state.mafia.log, { type: "exile", night: state.mafia.night, index }];
      return {
        ...state,
        mafia: {
          ...state.mafia,
          alive,
          exiledIndex: index,
          exileOpen: false,
          winner,
          log,
          lastWordQueue: hasVictim ? [index] : [],
          phase: hasVictim ? "day-lastword" : "day-result",
        },
      };
    }
    case "MAFIA_LASTWORD_DONE": {
      const { mafia } = state;
      const queue = mafia.lastWordQueue.slice(1);
      if (queue.length > 0) return { ...state, mafia: { ...mafia, lastWordQueue: queue } };
      const nextPhase = mafia.phase === "day-lastword" ? "day-result" : "night-result";
      return { ...state, mafia: { ...mafia, lastWordQueue: [], phase: nextPhase } };
    }
    case "MAFIA_TOGGLE_ROSTER":
      return { ...state, mafia: { ...state.mafia, rosterOpen: !state.mafia.rosterOpen } };
    case "MAFIA_TOGGLE_HISTORY":
      return { ...state, mafia: { ...state.mafia, historyOpen: !state.mafia.historyOpen } };
    // Same guard as SPY_STATS_RECORDED: marks this game's per-player stats
    // as already tallied so a refresh on the end screen can't double-count.
    case "MAFIA_STATS_RECORDED":
      return { ...state, mafia: { ...state.mafia, statsRecorded: true } };
    case "MAFIA_CONTINUE": {
      const { mafia, config } = state;
      if (mafia.phase === "night-result") {
        if (mafia.winner) return { ...state, screen: "mafia-end" };
        return { ...state, mafia: { ...mafia, phase: "day", exileOpen: false, dayTimer: { remaining: config.mafiaDiscussionMinutes * 60, running: true } } };
      }
      if (mafia.phase === "day-result") {
        if (mafia.winner) return { ...state, screen: "mafia-end" };
        return {
          ...state,
          mafia: {
            ...mafia,
            phase: "night-mafia",
            night: mafia.night + 1,
            mafiaTarget: null,
            donTarget: null,
            donResult: null,
            doctorTarget: null,
            sheriffTarget: null,
            sheriffResult: null,
            maniacTarget: null,
            putanaTarget: null,
            lastNightVictims: [],
            lastNightSaved: false,
            lastWordQueue: [],
          },
        };
      }
      if (mafia.phase === "roster") {
        return { ...state, screen: "mafia-game", mafia: { ...mafia, phase: "night-mafia", night: 1 } };
      }
      return state;
    }
    case "MAFIA_RESTART_SAME":
      return { ...state, screen: "mafia-setup", mafia: initialMafiaState };

    default:
      return state;
  }
}

/* Soft fade + slight slide-up on mount — used to transition between      */
/* whole screens and between tabs. Give it a fresh `key` to replay it.    */
function FadeIn({ children, className }) {
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const id = requestAnimationFrame(() => setShown(true));
    return () => cancelAnimationFrame(id);
  }, []);
  return (
    <div
      className={
        "transition-all duration-300 ease-in-out " +
        (shown ? "opacity-100 translate-y-0" : "opacity-0 translate-y-2") +
        (className ? " " + className : "")
      }
    >
      {children}
    </div>
  );
}

      )}

}

function ConfirmButton({ label, confirmLabel, onConfirm, className }) {
  const [armed, setArmed] = useState(false);
  const timeoutRef = useRef(null);
  useEffect(() => () => clearTimeout(timeoutRef.current), []);
  return (
    <button
      className={className}
      onClick={() => {
        if (armed) {
          clearTimeout(timeoutRef.current);
          setArmed(false);
          onConfirm();
        } else {
          setArmed(true);
          timeoutRef.current = setTimeout(() => setArmed(false), 2200);
        }
      }}
    >
      {armed ? confirmLabel : label}
    </button>
  );
}

// Every full-screen overlay in this app ("fixed inset-0 ...") needs to be
// mounted through this instead of returning its markup directly in place.
//
// Why: the app's screen transitions run through FadeIn, which always sets
// an explicit CSS transform (Tailwind's translate-y-0 / translate-y-2) on
// its wrapper div — even "no movement yet" is `transform: translate(0,0)`,
// not `transform: none`. Per the CSS spec, ANY element with a transform
// other than `none` becomes the containing block for its `position: fixed`
// (and absolute) descendants. Every screen is wrapped in a FadeIn, so every
// "fixed inset-0" modal rendered from inside a screen — the QR modal, the
// Settings/Stats panels, and every ExpandableText "read more" sheet — was
// secretly positioned relative to that FadeIn div, not the real viewport.
//
// Most of the time this is invisible because the FadeIn div happens to
// span the whole screen anyway, so getBoundingClientRect() still reports a
// normal full-screen rect. But it stops being "real" position:fixed, and
// browsers (this reproduced in desktop Chromium too, not just phones) can
// badly mis-composite a fixed element whose containing block is a
// transformed ancestor buried inside a scrolled container — the modal
// paints as a tiny, misplaced, overlapping fragment instead of a proper
// full-screen sheet. That's the "прозрачная панель" / overlapping-text bug.
//
// The fix is the standard one for this exact class of CSS bug: mount the
// overlay through a portal straight onto <body>, outside the transformed
// FadeIn subtree entirely, so `position: fixed` means what it says again.
function ModalPortal({ children }) {
  return ReactDOM.createPortal(children, document.body);
}

// Bottom-sheet showing one piece of text in full, no line limit — the
// generic "read the whole thing" popover used by ExpandableText below.
function TextSheet({ title, text, onClose }) {
  // Rendered via a portal straight onto <body> — see the comment on
  // ModalPortal below for why every "fixed inset-0" overlay in this app
  // needs this instead of just returning the markup in place.
  return (
    <ModalPortal>
      <div className="fixed inset-0 z-50 flex items-end justify-center" onClick={onClose}>
        <div className="absolute inset-0 bg-black/60" />
        <FadeIn className="relative w-full max-w-md">
          <div
            className="bg-[var(--surface)] border-t border-[var(--border-strong)] rounded-t-3xl px-5 pt-3 pb-8 w-full"
            onClick={(e) => e.stopPropagation()}
            style={{ paddingBottom: "calc(2rem + env(safe-area-inset-bottom, 0px))" }}
          >
            <div className="w-10 h-1.5 rounded-full bg-[var(--surface-3)] mx-auto mb-4" />
            <div className="flex items-center justify-between gap-3 mb-4">
              <h2 className="font-display text-xl truncate">{title || "Текст полностью"}</h2>
              <button
                onClick={onClose}

                aria-label="Закрыть"

            <p className="text-base leading-relaxed whitespace-pre-wrap">{text}</p>

      </div>
    </ModalPortal>
  );
}

// Wraps a single-line label that may be cut off with an ellipsis (a
// `truncate` class from Tailwind) so a tap reveals the full text in a
// TextSheet. Detects real truncation via scrollWidth vs. clientWidth, so
// short text that already fits stays a plain, non-interactive label — only
// text that's actually cut off becomes tappable. This is what fixes dossier
// traits, role descriptions, and similar randomized/variable-length content
// getting silently clipped on narrow phone screens.
function ExpandableText({ text, className, title, as }) {
  const Tag = as || "span";
  const ref = useRef(null);
  const [truncated, setTruncated] = useState(false);
  const [open, setOpen] = useState(false);

  useEffect(() => {
    function check() {
      const el = ref.current;
      if (!el) return;
      setTruncated(el.scrollWidth > el.clientWidth + 1);
    }
    check();
    window.addEventListener("resize", check);
    return () => window.removeEventListener("resize", check);
  }, [text]);

  return (
    <>
      <Tag
        ref={ref}
        className={className + (truncated ? " cursor-pointer" : "")}
        onClick={
          truncated
            ? (e) => {
                e.stopPropagation();
                setOpen(true);
              }
            : undefined
        }
      >
        {text}
      </Tag>
      {open && <TextSheet title={title} text={text} onClose={() => setOpen(false)} />}
    </>
  );
}

function Stepper({ label, value, min, max, step = 1, onChange, suffix }) {
  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-3xl px-5 py-4">
      <div className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-3">{label}</div>
      <div className="flex items-center justify-between gap-4">
        <button
          onClick={() => onChange(value - step)}
          disabled={value <= min}
          className="w-12 h-12 rounded-full border border-[var(--border-strong)] flex items-center justify-center text-[var(--text)] disabled:opacity-25 active:bg-[var(--surface-2)] shrink-0"
          aria-label="Меньше"
        >
          <IconMinus size={20} />
        </button>
        <div className="flex-1 text-center">
          <span className="font-display text-5xl leading-none">{value}</span>
          {suffix && <span className="ml-1.5 text-sm text-[var(--text-dim)] font-mono">{suffix}</span>}
        </div>
        <button
          onClick={() => onChange(value + step)}
          disabled={value >= max}
          className="w-12 h-12 rounded-full border border-[var(--border-strong)] flex items-center justify-center text-[var(--text)] disabled:opacity-25 active:bg-[var(--surface-2)] shrink-0"
          aria-label="Больше"
        >
          <IconPlus size={20} />
        </button>
      </div>
    </div>
  );
}

// Bottom sheet showing "how tonight went" — who was the spy how often, who
// won Mafia how often. Reads sessionStorage once on open (recordSpyRound /
// recordMafiaGame write there from SpyEnd / MafiaEnd as rounds finish), so
// it always reflects whatever's been played earlier in this same session.
function StatsPanel({ onClose }) {
  const [stats, refreshStats] = useStats();
  const spyRows = Object.entries(stats.spy)
    .map(([name, s]) => ({ name, ...s }))
    .sort((a, b) => b.timesSpy - a.timesSpy || b.rounds - a.rounds);
  const mafiaRows = Object.entries(stats.mafia)
    .map(([name, s]) => ({ name, ...s }))
    .sort((a, b) => b.wins - a.wins || b.games - a.games);
  const hasAny = spyRows.length > 0 || mafiaRows.length > 0;

  function handleReset() {
    clearStats();
    refreshStats();
  }

  return (
    <ModalPortal>
    <div className="fixed inset-0 z-50 flex items-end justify-center" onClick={onClose}>
      <div className="absolute inset-0 bg-black/60" />
      <FadeIn className="relative w-full max-w-md">
        <div
          className="bg-[var(--surface)] border-t border-[var(--border-strong)] rounded-t-3xl px-5 pt-3 pb-8 w-full max-h-[80vh] overflow-y-auto"
          onClick={(e) => e.stopPropagation()}
          style={{ paddingBottom: "calc(2rem + env(safe-area-inset-bottom, 0px))" }}
        >
          <div className="w-10 h-1.5 rounded-full bg-[var(--surface-3)] mx-auto mb-4" />
          <div className="flex items-center justify-between mb-5">
            <h2 className="font-display text-2xl">Статистика вечера</h2>
            <button
              onClick={onClose}
              className="w-9 h-9 rounded-full flex items-center justify-center text-[var(--text-dim)] active:bg-[var(--surface-2)]"
              aria-label="Закрыть"
            >
              <IconX size={20} />
            </button>
          </div>

          {!hasAny ? (
            <p className="text-sm text-[var(--text-dim)] text-center py-6">
              Пока пусто — сыграйте партию в Шпиона или Мафию, и здесь появится статистика.
            </p>
          ) : (
            <div className="flex flex-col gap-5">
              {spyRows.length > 0 && (
                <div>
                  <div className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-2 flex items-center gap-2">
                    <IconGlasses size={14} className="text-[var(--spy)]" /> Шпион
                  </div>
                  <div className="flex flex-col gap-2">
                    {spyRows.map((r) => (
                      <div key={r.name} className="flex items-center justify-between gap-2 bg-[var(--surface-2)] rounded-xl px-3.5 py-2.5">
                        <ExpandableText as="span" className="text-sm font-medium truncate" text={r.name} title="Игрок" />
                        <span className="text-xs text-[var(--text-dim)] shrink-0 font-mono">шпион {r.timesSpy}/{r.rounds}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              {mafiaRows.length > 0 && (
                <div>
                  <div className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-2 flex items-center gap-2">
                    <IconSkull size={14} className="text-[var(--spy)]" /> Мафия
                  </div>
                  <div className="flex flex-col gap-2">
                    {mafiaRows.map((r) => (
                      <div key={r.name} className="flex items-center justify-between gap-2 bg-[var(--surface-2)] rounded-xl px-3.5 py-2.5">
                        <ExpandableText as="span" className="text-sm font-medium truncate" text={r.name} title="Игрок" />
                        <span className="text-xs text-[var(--text-dim)] shrink-0 font-mono">побед {r.wins}/{r.games}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}
              <ConfirmButton
                label="Сбросить статистику"
                confirmLabel="Точно сбросить?"
                onConfirm={handleReset}
                className="w-full text-xs uppercase tracking-wider text-[var(--danger)] border border-[var(--danger)]/30 rounded-xl py-3 active:bg-[var(--danger)]/10"
              />
            </div>
          )}
        </div>
      </FadeIn>
    </div>
    </ModalPortal>
  );
}

// Builds a stable, shareable join link for a Bunker/Court room: opening it
// jumps straight to that game with the code already filled in (see
// pendingInviteParams above), so the recipient never has to type a code by
// hand. Uses the Web Share API where available (native share sheet on
// phones), falling back to just copying the link to the clipboard.
function shareRoomInvite(code, game, gameLabel, onCopied) {
  const url = `${window.location.origin}${window.location.pathname}?room=${code}&game=${game}`;
  const text = `Присоединяйся к комнате в «${gameLabel}» в Хатсит! Код: ${code}`;
  if (navigator.share) {
    navigator.share({ title: "Хатсит — приглашение", text, url }).catch(() => {});
  } else {
    try {
      navigator.clipboard.writeText(url);
      if (onCopied) onCopied();
    } catch (e) {}
  }
}

// Draws a HatsitQR module matrix onto a <canvas>, entirely offline/on-device
// (no server call, no third-party API — see HatsitQR above). Always renders
// on a plain white background with a proper quiet zone regardless of the
// app's dark theme, since a QR code needs strong light/dark contrast to
// scan reliably with a phone camera.
function QrCanvas({ value, size = 220 }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current || !value || !window.HatsitQR) return;
    let matrix;
    try {
      matrix = window.HatsitQR.encode(value);
    } catch (e) {
      return;
    }
    const quiet = 4;
    const totalModules = matrix.size + quiet * 2;
    const dpr = window.devicePixelRatio || 1;
    const canvas = canvasRef.current;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#0a0a0f";
    const scale = size / totalModules;
    for (let r = 0; r < matrix.size; r++) {
      for (let c = 0; c < matrix.size; c++) {
        if (!matrix.isDark(r, c)) continue;
        // Round to whole pixels per-cell (not just a fixed cell size) so
        // adjacent modules never leave a hairline gap from rounding error.
        const x0 = Math.round((c + quiet) * scale);
        const x1 = Math.round((c + quiet + 1) * scale);
        const y0 = Math.round((r + quiet) * scale);
        const y1 = Math.round((r + quiet + 1) * scale);
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
    }
  }, [value, size]);
  return <canvas ref={canvasRef} style={{ width: size, height: size, display: "block" }} />;
}

function SupportChatWidget() {
  const [open, setOpen] = useState(false);
  const [mode, setMode] = useState("chat"); // "chat" | "report"
  const [messages, setMessages] = useState([
    { role: "bot", text: "Привет! Я бот-помощник Хатсит 🤖 Выберите вопрос ниже или напишите свой." },
  ]);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const [problem, setProblem] = useState("");
  const [contact, setContact] = useState("");
  const [sending, setSending] = useState(false);
  const [sendResult, setSendResult] = useState(null); // null | "ok" | "error"
  const listRef = useRef(null);
  const messagesRef = useRef(messages);
  messagesRef.current = messages;

  useEffect(() => {
    if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
  }, [messages, typing, open]);

  // Sends the running conversation to our own /api/ai-chat endpoint, which
  // is the only thing that holds the real Gemini API key (same reasoning
  // as /api/support-ticket.js — nothing secret ever ships in this static
  // page). Shows a "typing…" bubble while waiting.
  async function askAi(question) {
    const userMsg = { role: "user", text: question };
    setMessages((m) => [...m, userMsg]);
    setTyping(true);
    try {
      const history = [...messagesRef.current, userMsg].map((m) => ({
        role: m.role === "bot" ? "model" : "user",
        text: m.text,
      }));
      const res = await fetch("/api/ai-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history }),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || !data.text) throw new Error("bad ai response");
      setMessages((m) => [...m, { role: "bot", text: data.text }]);
    } catch (e) {
      setMessages((m) => [
        ...m,
        { role: "bot", text: "Не удалось связаться с ИИ-помощником. Попробуйте ещё раз или нажмите «Позвать человека / Сообщить о баге» ниже." },
      ]);
    } finally {
      setTyping(false);
    }
  }

  function handleSend() {
    const text = input.trim();
    if (!text) return;
    setInput("");
    askAi(text);
  }

  function handleQuickChip(chip) {
    if (chip.action === "report") {
      setMode("report");
    } else {
      askAi(chip.question);
    }
  }

  async function handleSubmitReport() {
    if (!problem.trim() || sending) return;
    setSending(true);
    setSendResult(null);
    try {
      // Goes to our own serverless proxy, not Discord directly — the real
      // webhook URL is a server-side secret (see /api/support-ticket.js).
      const res = await fetch("/api/support-ticket", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          problem: problem.trim().slice(0, 1000),
          contact: contact.trim().slice(0, 200),
          userAgent: (navigator.userAgent || "неизвестно").slice(0, 500),
        }),
      });
      if (!res.ok) throw new Error("bad status " + res.status);
      setSendResult("ok");
      setProblem("");
      setContact("");
      setMessages((m) => [...m, { role: "bot", text: "Спасибо! Обращение отправлено в поддержку, скоро с вами свяжутся." }]);
      setMode("chat");
    } catch (e) {
      setSendResult("error");
    } finally {
      setSending(false);
    }
  }

  // Once a game has actually been picked, the floating support bubble
  // mostly just sits in the way of gameplay (and, worse, could overlap
  // in-game controls on short screens) — so hide it everywhere except the
  // Hub. If the chat happened to be open when this fires, close it too
  // rather than leaving an unreachable open panel with no visible trigger.
  const currentScreen = useHatsitCurrentScreen();
  const isHub = currentScreen === "hub";
  useEffect(() => {
    if (!isHub && open) setOpen(false);
  }, [isHub]);
  if (!isHub) return null;

  return (
    <>
      <button
        onClick={() => setOpen(true)}
        aria-label="Поддержка"
        className="neon-pulse fixed z-40 w-14 h-14 rounded-full flex items-center justify-center text-2xl active:scale-95 transition-transform"
        style={{
          right: "max(1.25rem, env(safe-area-inset-right, 0px))",
          bottom: "calc(1.25rem + env(safe-area-inset-bottom, 0px))",
          background: "var(--surface)",
          border: "2px solid rgba(168,85,247,.6)",
        }}
      >
        💬
      </button>

      {open && (
        <div className="fixed inset-0 z-50 flex items-end justify-center" onClick={() => setOpen(false)}>
          <div className="absolute inset-0 bg-black/60" />
          <FadeIn className="relative w-full max-w-md">
            <div
              className="bg-[var(--surface)] border-t border-[var(--border-strong)] rounded-t-3xl px-5 pt-3 pb-6 w-full flex flex-col"
              style={{ maxHeight: "85vh", paddingBottom: "calc(1.5rem + env(safe-area-inset-bottom, 0px))" }}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="w-10 h-1.5 rounded-full bg-[var(--surface-3)] mx-auto mb-4 shrink-0" />
              <div className="flex items-center justify-between mb-4 shrink-0">
                <h2 className="font-display text-2xl flex items-center gap-2">💬 Поддержка Хатсит</h2>
                <button
                  onClick={() => setOpen(false)}
                  className="w-9 h-9 rounded-full flex items-center justify-center text-[var(--text-dim)] active:bg-[var(--surface-2)]"
                  aria-label="Закрыть"
                >
                  <IconX size={20} />
                </button>
              </div>

              {mode === "chat" ? (
                <>
                  <div ref={listRef} className="flex-1 min-h-0 overflow-y-auto no-scrollbar flex flex-col gap-2.5 mb-3" style={{ minHeight: "180px" }}>
                    {messages.map((m, i) => (
                      <div
                        key={i}
                        className={"max-w-[85%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed " + (m.role === "bot" ? "self-start bg-[var(--surface-2)] text-[var(--text)]" : "self-end text-white")}
                        style={m.role === "user" ? { background: "linear-gradient(135deg, #a855f7, #7c3aed)" } : undefined}
                      >
                        {m.text}
                      </div>
                    ))}
                    {typing && (
                      <div className="self-start bg-[var(--surface-2)] rounded-2xl px-4 py-3 flex items-center gap-1.5" aria-label="ИИ печатает">
                        <span className="w-1.5 h-1.5 rounded-full bg-[var(--text-faint)] typing-dot" style={{ animationDelay: "0s" }} />
                        <span className="w-1.5 h-1.5 rounded-full bg-[var(--text-faint)] typing-dot" style={{ animationDelay: ".15s" }} />
                        <span className="w-1.5 h-1.5 rounded-full bg-[var(--text-faint)] typing-dot" style={{ animationDelay: ".3s" }} />
                      </div>
                    )}
                  </div>

                  <div className="flex flex-wrap gap-2 mb-3 shrink-0">
                    {SUPPORT_QUICK_CHIPS.map((chip) => (
                      <button
                        key={chip.label}
                        onClick={() => handleQuickChip(chip)}
                        className="text-xs px-3 py-2 rounded-full bg-[var(--surface-2)] border border-[var(--border)] text-[var(--text-dim)] active:bg-[var(--surface-3)] shrink-0 touch-manipulation"
                      >
                        {chip.label}
                      </button>
                    ))}
                  </div>

                  <div className="flex items-center gap-2 mb-3 shrink-0">
                    <input
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && handleSend()}
                      placeholder="Напишите вопрос…"
                      className="flex-1 bg-[var(--surface-2)] border border-[var(--border)] rounded-xl px-3 py-2.5 text-sm text-[var(--text)] placeholder:text-[var(--text-faint)] focus:outline-none focus:border-[var(--accent)]/60"
                    />
                    <button
                      onClick={handleSend}
                      disabled={typing}
                      className="w-11 h-11 rounded-xl flex items-center justify-center text-white shrink-0 touch-manipulation active:scale-95 transition-transform disabled:opacity-40"
                      style={{ background: "linear-gradient(135deg, #a855f7, #7c3aed)" }}
                      aria-label="Отправить"
                    >
                      <IconSend size={18} />
                    </button>
                  </div>

                  <button
                    onClick={() => setMode("report")}
                    className="w-full text-sm font-medium py-3 rounded-2xl border shrink-0"
                    style={{ borderColor: "rgba(168,85,247,.5)", color: "#c084fc" }}
                  >
                    Позвать человека / Сообщить о баге
                  </button>
                </>
              ) : (
                <div className="flex flex-col gap-3">
                  <button onClick={() => setMode("chat")} className="text-sm text-[var(--text-faint)] flex items-center gap-1 -mt-1 mb-1 self-start">
                    ← Назад к чату
                  </button>
                  <div>
                    <label className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-2 block">Опишите проблему</label>
                    <textarea
                      value={problem}
                      onChange={(e) => setProblem(e.target.value)}
                      placeholder="Что пошло не так?"
                      rows={4}
                      maxLength={1000}
                      className="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-2xl px-4 py-3 text-sm text-[var(--text)] placeholder:text-[var(--text-faint)] focus:outline-none focus:border-[var(--accent)]/60 resize-none"
                    />
                  </div>
                  <div>
                    <label className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-2 block">Контакт для связи (Telegram/Discord)</label>
                    <input
                      value={contact}
                      onChange={(e) => setContact(e.target.value)}
                      placeholder="@username"
                      maxLength={200}
                      className="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-2xl px-4 py-3 text-sm text-[var(--text)] placeholder:text-[var(--text-faint)] focus:outline-none focus:border-[var(--accent)]/60"
                    />
                  </div>
                  {sendResult === "error" && <p className="text-sm text-[var(--danger)]">Не удалось отправить. Проверьте интернет и попробуйте ещё раз.</p>}
                  <button
                    onClick={handleSubmitReport}
                    disabled={!problem.trim() || sending}
                    className="w-full text-white font-display text-lg tracking-wide py-3.5 rounded-2xl disabled:opacity-30 active:scale-[0.98] transition-transform"
                    style={{ background: "linear-gradient(135deg, #a855f7, #7c3aed)" }}
                  >
                    {sending ? "Отправляем…" : "Отправить в поддержку"}
                  </button>
                  <DiscordCommunityButton />
                </div>
              )}
            </div>
          </FadeIn>
        </div>
      )}
    </>
  );
}

/* ---------------------------------------------------------------- */
/* Spyfall: playing (timer)                                           */
/* ---------------------------------------------------------------- */
function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

function SpyPlaying({ state, dispatch }) {
  const total = state.config.minutes * 60;
  const { remaining, running } = state.timer;
  const pct = total > 0 ? ((total - remaining) / total) * 100 : 0;
  const urgent = remaining <= 10;
  const ringColor = urgent ? "var(--danger)" : "var(--accent)";

  useWakeLock(true);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => dispatch({ type: "TICK" }), 1000);
    return () => clearInterval(id);
  }, [running, dispatch]);

  // Ticking sound as the discussion time runs out (last 5 seconds) — same
  // signal Alias already uses for its round timer.
  useEffect(() => {
    if (running && remaining >= 1 && remaining <= 5) playTickSound();
  }, [remaining, running]);

  return (
    <div className="h-full min-h-0 flex flex-col">
      <div className="flex items-center justify-between px-5 pt-4 shrink-0">
        <ConfirmButton
          label="Завершить"
          confirmLabel="Точно?"
          onConfirm={() => dispatch({ type: "END_MANUAL" })}
          className="text-xs uppercase tracking-wider text-[var(--text-faint)] active:text-[var(--danger)] px-2 py-1"
        />
        <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)]">Раунд идёт</span>
        <span className="w-16" />
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6">
        <div
          className="rounded-full p-2 mb-8"
          style={{ background: `conic-gradient(${ringColor} ${pct * 3.6}deg, var(--surface-2) 0deg)`, transition: "background 0.4s linear" }}
        >
          <div className="w-56 h-56 rounded-full bg-[var(--bg)] flex flex-col items-center justify-center border border-[var(--border)]">
            <span
              className={"font-mono text-6xl font-semibold tabular-nums " + (urgent ? "pulse" : "")}
              style={{ color: urgent ? "var(--danger)" : "var(--text)" }}
            >
              {fmtTime(remaining)}
            </span>
            <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mt-2">осталось</span>
          </div>
        </div>

        <button
          onClick={() => dispatch({ type: "TOGGLE_RUNNING" })}
          className="w-16 h-16 rounded-full bg-[var(--surface)] border border-[var(--border-strong)] flex items-center justify-center active:scale-95 transition-transform"
          aria-label={running ? "Пауза" : "Продолжить"}
        >
          {running ? <IconPause size={26} /> : <IconPlay size={26} />}
        </button>
        <p className="text-xs text-[var(--text-faint)] mt-4 max-w-[26ch] text-center">
          Обсуждайте, задавайте вопросы и попробуйте вычислить шпиона до конца времени
        </p>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Spyfall: end                                                       */
/* ---------------------------------------------------------------- */
function SpyEnd({ state, dispatch }) {
  const [revealed, setRevealed] = useState(false);
  const { game, config, endReason } = state;
  const vibrated = useRef(false);

  useEffect(() => {
    if (endReason === "timeup" && !vibrated.current) {
      vibrated.current = true;
      try {
        navigator.vibrate && navigator.vibrate([180, 90, 180]);
      } catch (e) {}
      playTimeUpSound();
    }
  }, [endReason]);

  // Tally "who was the spy" for the session stats panel on the Hub. Guarded
  // by game.statsRecorded (persisted with the rest of the app state), so a
  // refresh landing back on this same end screen can't double-count.
  useEffect(() => {
    if (game.statsRecorded) return;
    recordSpyRound(config.names, game.spyIndexes);
    dispatch({ type: "SPY_STATS_RECORDED" });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const timeup = endReason === "timeup";

  return (
    <div className="h-full flex flex-col px-6 pb-8" style={{ paddingTop: "3rem" }}>
      <div className="flex-1 min-h-0 overflow-y-auto no-scrollbar flex flex-col items-center justify-center text-center">
        <div
          className={"w-16 h-16 rounded-full flex items-center justify-center mb-6 " + (timeup ? "flash-badge" : "bg-[var(--surface-2)]")}
          style={!timeup ? { color: "var(--text-dim)" } : { color: "#fff" }}
        >
          <IconAlertTriangle size={30} />
        </div>
        <h2 className="font-display text-5xl leading-none mb-3" style={{ color: timeup ? "var(--danger)" : "var(--text)" }}>
          {timeup ? "ВРЕМЯ ВЫШЛО" : "ИГРА ОКОНЧЕНА"}
        </h2>
        <p className="text-sm text-[var(--text-dim)] max-w-[28ch] mb-8">
          Обсудите последние догадки, а затем раскройте, кто скрывался среди вас.
        </p>

        {!revealed ? (
          <button
            onClick={() => setRevealed(true)}
            className="bg-[var(--surface)] border border-[var(--accent)]/40 text-[var(--accent-strong)] font-display text-xl tracking-wide py-4 px-8 rounded-2xl active:scale-[0.98] transition-transform"
          >
            {game.spyIndexes.length > 1 ? "Кто были шпионами?" : "Кто был шпионом?"}
          </button>
        ) : (
          <div className="pop w-full bg-[var(--surface)] border border-[var(--border)] rounded-3xl p-6 flex flex-col items-center gap-4">
            <div className="flex flex-col items-center">
              <span className="text-xs uppercase tracking-[0.25em] text-[var(--text-faint)] mb-2">Слово</span>
              <span className="font-display text-2xl tracking-wide text-[var(--local)]">{game.location}</span>
            </div>
            <div className="w-full h-px bg-[var(--border)]" />
            <div className="flex flex-col items-center">
              <span className="text-xs uppercase tracking-[0.25em] text-[var(--text-faint)] mb-2">
                {game.spyIndexes.length > 1 ? "Шпионы" : "Шпион"}
              </span>
              <span className="font-display text-3xl tracking-wide text-center" style={{ color: "var(--spy)" }}>
                {game.spyIndexes.map((i) => config.names[i]).join(", ")}
              </span>
            </div>
          </div>
        )}
      </div>

      <div className="flex flex-col gap-3 shrink-0">
        <button
          onClick={() => dispatch({ type: "RESTART_SAME" })}
          className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconRefresh size={20} /> Играть ещё раз
        </button>
        <button
          onClick={() => dispatch({ type: "GO_HUB" })}
          className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-[var(--text)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconHome size={20} /> На главную
        </button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Mafia: reveal (uses BlindScreen)                                   */
/* ---------------------------------------------------------------- */
function MafiaReveal({ state, dispatch }) {
  const { config, mafia } = state;
  const index = mafia.revealIndex;
  const myRole = mafia.roles[index];
  const role = MAFIA_ROLES[myRole];
  // Only mafia-aligned players (mafia/don) should ever see who their
  // accomplices are — this list must stay empty for every other role,
  // otherwise this same reveal screen leaks the mafia's identity to
  // civilians, the doctor, the sheriff, etc. when it's their turn to look.
  const isMafiaAligned = myRole === "mafia" || myRole === "don";
  const teammates = isMafiaAligned
    ? mafia.roles.map((r, i) => ((r === "mafia" || r === "don") && i !== index ? config.mafiaNames[i] : null)).filter(Boolean)
    : [];

  return (
    <BlindScreen
      key={index}
      playerName={config.mafiaNames[index]}
      index={index}
      total={config.mafiaPlayerCount}
      onAbort={() => dispatch({ type: "GO_HUB" })}
      onContinue={() => dispatch({ type: "MAFIA_NEXT_REVEAL" })}
      continueLabel={index + 1 < config.mafiaPlayerCount ? "Скрыть и передать" : "Скрыть и передать Ведущему"}
      renderRole={() => (
        <div className="flex flex-col items-center w-full">
          <span className="text-xs uppercase tracking-[0.3em] text-[var(--text-faint)] mb-2">Твоя роль</span>
          <div className="w-16 h-16 rounded-2xl flex items-center justify-center mb-3" style={{ background: role.bg, color: role.color }}>
            <role.Icon size={32} />
          </div>
          <h3 className="font-display text-5xl leading-none mb-4" style={{ color: role.color }}>
            {role.name.toUpperCase()}
          </h3>
          <p className="text-sm text-[var(--text-dim)] max-w-[30ch] mb-4">{role.desc}</p>
          {teammates.length > 0 && (
            <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl px-4 py-3 text-sm">
              <span className="text-[var(--text-faint)]">Сообщники: </span>
              <span style={{ color: role.color }}>{teammates.join(", ")}</span>
            </div>
          )}
        </div>
      )}
    />
  );
}

        ))}
      </div>
      <button
        onClick={() => dispatch({ type: "MAFIA_SELECT_SHERIFF_TARGET", index: null })}
        className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-[var(--text-dim)] font-display text-lg tracking-wide py-3.5 rounded-2xl active:scale-[0.98] transition-transform"
      >
        Пропустить проверку
      </button>
    </div>
  );
}

function MafiaNightResult({ state }) {
  const { config, mafia } = state;
  const victims = mafia.lastNightVictims || [];

  return (
    <div className="flex flex-col items-center text-center pt-2 pb-4">
      <div className="w-16 h-16 rounded-full bg-[var(--surface-2)] flex items-center justify-center mb-6 text-[var(--accent-strong)]">
        <IconSun size={28} />
      </div>
      <p className="text-xs uppercase tracking-[0.3em] text-[var(--text-faint)] mb-2">Утро</p>
      {victims.length > 0 ? (
        <>
          <h2 className="font-display text-4xl leading-tight mb-4">
            {victims.length === 1 ? "Погиб(-ла)" : "Погибли"}{" "}
            <span style={{ color: "var(--danger)" }}>{victims.map((v) => config.mafiaNames[v]).join(", ")}</span>
          </h2>
          <div className="flex flex-col gap-2 w-full">
            {victims.map((v) => {
              const role = MAFIA_ROLES[mafia.roles[v]];
              return (
                <div key={v} className="flex items-center gap-2 bg-[var(--surface)] border border-[var(--border)] rounded-2xl px-4 py-3" style={{ color: role.color }}>
                  <role.Icon size={18} />
                  <span className="font-medium">{config.mafiaNames[v]} — {role.name}</span>
                </div>
              );
            })}
          </div>
        </>
      ) : (
        <>
          <h2 className="font-display text-4xl leading-tight mb-2">Этой ночью никто не погиб</h2>
          {mafia.lastNightSaved && (
            <p className="text-sm" style={{ color: "var(--doctor)" }}>
              Доктор успел спасти жертву!
            </p>
          )}
        </>
      )}
    </div>
