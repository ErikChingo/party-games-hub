const SAVED_STATE_KEY = "hatsit_app_state_v1";

function loadSavedState() {
  try {
    const raw = sessionStorage.getItem(SAVED_STATE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object" || !parsed.state) return null;
    const saved = parsed.state;
    const elapsed = Math.max(0, Math.round((Date.now() - (parsed.savedAt || Date.now())) / 1000));
    // If a timer was running when the page closed/reloaded, fast-forward it
    // by the real time that passed instead of freezing or resetting it.
    if (elapsed > 0) {
      if (saved.timer && saved.timer.running) {
        saved.timer = { ...saved.timer, remaining: Math.max(1, saved.timer.remaining - elapsed) };
      }
      if (saved.alias && saved.alias.timer && saved.alias.timer.running) {
        saved.alias = {
          ...saved.alias,
          timer: { ...saved.alias.timer, remaining: Math.max(1, saved.alias.timer.remaining - elapsed) },
        };
      }
      if (saved.mafia && saved.mafia.dayTimer && saved.mafia.dayTimer.running) {
        saved.mafia = {
          ...saved.mafia,
          dayTimer: { ...saved.mafia.dayTimer, remaining: Math.max(1, saved.mafia.dayTimer.remaining - elapsed) },
        };
      }
    }
    return saved;
  } catch {
    return null;
  }
}

// Which screen this literal page load resumed into, computed once at
// script start from the same saved-state blob the root reducer restores
// from. BunkerApp/CourtApp's reconnect effects consume this exactly once
// (reading it, then setting it back to null) to tell "the page was just
// reloaded mid-game" apart from "the player tapped the tile from the Hub"
// — only the former should try to silently resume a networked room. Without
// this check, a room left over from an earlier visit that wasn't closed via
// the back arrow (phone locked, app switched away, tab backgrounded and the
// browser never tore the page down) would resurface every time the player
// opens Бункер/Суд again, instead of a fresh create/join screen.
let pendingReconnectScreen = (() => {
  try {
    const saved = loadSavedState();
    return saved && typeof saved.screen === "string" ? saved.screen : null;
  } catch (e) {
    return null;
  }
})();

// Invite-link support: a shared Bunker/Court link looks like
// "<site>?room=1234&game=bunker". Parsed once at script load, consumed
// exactly once (by BunkerApp/CourtApp reading it and setting it back to
// null) the same way pendingReconnectScreen is above — so navigating away
// and tapping the tile again later in the same tab doesn't keep re-using
// a stale invite code. App() reads this (without clearing it) to decide
// whether to jump straight to the Bunker/Court screen on first load.
let pendingInviteParams = (() => {
  try {
    const params = new URLSearchParams(window.location.search);
    const room = (params.get("room") || "").replace(/\D/g, "").slice(0, 4);
    const game = params.get("game");
    if (room && (game === "bunker" || game === "court")) return { room, game };
  } catch (e) {}
  // Same invite, Telegram's own shape: a Mini App opened via
  // t.me/<bot>/<app>?startapp=bunker_1234 gets that "bunker_1234" back as
  // start_param, not as a normal URL query string (Telegram strips those).
  // shareRoomInvite() below is what encodes a code into this shape.
  try {
    const telegram = tg();
    const startParam = telegram && telegram.initDataUnsafe && telegram.initDataUnsafe.start_param;
    const match = typeof startParam === "string" && startParam.match(/^(bunker|court)_(\d{4})$/);
    if (match) return { room: match[2], game: match[1] };
  } catch (e) {}
  return null;
})();

function mergeWithDefaults(saved) {
  if (!saved || typeof saved !== "object") return initialState;
  try {
    return {
      ...initialState,
      ...saved,
      config: { ...initialState.config, ...(saved.config || {}) },
      game: { ...initialState.game, ...(saved.game || {}) },
      timer: { ...initialState.timer, ...(saved.timer || {}) },
      alias: {
        ...initialState.alias,
        ...(saved.alias || {}),
        timer: { ...initialState.alias.timer, ...((saved.alias && saved.alias.timer) || {}) },
      },
      mafia: { ...initialMafiaState, ...(saved.mafia || {}) },
    };
  } catch {
    return initialState;
  }
}

function resizeNames(names, n) {
  const next = names.slice(0, n);
  const label = t_lookup("common.player", currentLangForDefaults());
  for (let i = next.length; i < n; i++) next.push(`${label} ${i + 1}`);
  return next;
}

function resizeTeams(names, n) {
  const next = names.slice(0, n);
  const label = t_lookup("common.team", currentLangForDefaults());
  for (let i = next.length; i < n; i++) next.push(`${label} ${i + 1}`);
  return next;
}

function shuffledIndices(len) {
  const arr = Array.from({ length: len }, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function nextAliasWord(alias) {
  let { wordOrder, wordPointer, pool } = alias;
  let pointer = wordPointer + 1;
  if (pointer >= wordOrder.length) {
    wordOrder = shuffledIndices(pool.length);
    pointer = 0;
  }
  return { wordOrder, wordPointer: pointer, currentWord: pool[wordOrder[pointer]] };
}

// "Без слов" ("The Mind"-style cooperative game): deals `level` unique
// numbers to each of `count` players for the current level, each hand
// sorted ascending. Numbers are re-drawn fresh every level — unlike a
// physical deck they never need to persist across levels, since nothing in
// the rules depends on which numbers were seen in an earlier, already-
// resolved level. The pool is normally 1..100, but widens past that for a
// level deep enough to need more unique numbers than that (e.g. level 13
// with all 8 players needs 104) — with MAX_WORDLESS_PLAYERS at 8, a long
// enough winning streak genuinely gets there, so this can't stay a fixed 100.
function dealWordlessHands(count, level) {
  const POOL_SIZE = Math.max(100, count * level);
  const order = shuffledIndices(POOL_SIZE);
  const drawn = order.slice(0, count * level).map((i) => i + 1);
  const hands = [];
  for (let p = 0; p < count; p++) {
    hands.push(drawn.slice(p * level, (p + 1) * level).sort((a, b) => a - b));
  }
  return hands;
}

// "Обратный отсчёт" (Countdown): decides what the upcoming round is — a
// fresh COUNTDOWN_HANDICAPS entry (every COUNTDOWN_RULE_INTERVAL-th round,
// while any remain unused) or the next COUNTDOWN_CHALLENGES entry — plus
// that round's timer length, which ratchets down every 4 rounds regardless
// (never below COUNTDOWN_SECONDS_FLOOR). Only stores indexes into the two
// content banks, never resolved text, so a language switch mid-game still
// renders correctly.
function advanceCountdownRound(countdown, round, baseSeconds) {
  let { challengeOrder, challengePointer, ruleOrder, rulePointer, activeRuleIndexes } = countdown;
  const isRuleRound = round % COUNTDOWN_RULE_INTERVAL === 0 && rulePointer + 1 < ruleOrder.length;
  let currentChallengeIndex = null;
  if (isRuleRound) {
    rulePointer += 1;
    activeRuleIndexes = [...activeRuleIndexes, ruleOrder[rulePointer]];
  } else {
    challengePointer += 1;
    if (challengePointer >= challengeOrder.length) {
      challengeOrder = shuffledIndices(COUNTDOWN_CHALLENGES.length);
      challengePointer = 0;
    }
    currentChallengeIndex = challengeOrder[challengePointer];
  }
  const seconds = Math.max(COUNTDOWN_SECONDS_FLOOR, baseSeconds - Math.floor((round - 1) / 4));
  return { challengeOrder, challengePointer, ruleOrder, rulePointer, activeRuleIndexes, currentChallengeIndex, isRuleRound, seconds };
}

// Resolves the current round's prompt text in the active language — a rule
// round shows the handicap that was just added (the last entry of
// activeRuleIndexes), otherwise the current challenge.
function countdownPromptText(countdown, lang) {
  return countdown.isRuleRound
    ? pickLang(COUNTDOWN_HANDICAPS[countdown.activeRuleIndexes[countdown.activeRuleIndexes.length - 1]], lang)
    : pickLang(COUNTDOWN_CHALLENGES[countdown.currentChallengeIndex], lang);
}

// "Испорченный телефон": turns the single running counter turnIndex into
// everything a given turn needs to know. Player order is fixed (0, 1, 2, ...)
// every round; what rotates is which chain each player is handed. Round r
// (r = 0 is the initial writing round) hands player p chain (p - r) mod
// count — i.e. every round everyone passes their chain to the next player in
// line — so over the course of the game every player touches every chain
// exactly once, always their own chain first (round 0, since chain index
// equals player index there) and never their own chain again right after
// (round 1 hands them chain p-1, not p). Step type alternates starting with
// a draw right after the writing round: write, draw, guess, draw, guess, ...
function telephoneTurnInfo(playerCount, turnIndex) {
  const round = Math.floor(turnIndex / playerCount);
  const playerIndex = turnIndex % playerCount;
  const chainIndex = ((playerIndex - round) % playerCount + playerCount) % playerCount;
  const stepType = round === 0 ? "write" : round % 2 === 1 ? "draw" : "guess";
  return { round, playerIndex, chainIndex, stepType };
}

function clampMafiaCount(playerCount, mafiaCount) {
  const max = Math.max(MIN_MAFIA_COUNT, Math.floor((playerCount - 1) / 2));
  return Math.min(max, Math.max(MIN_MAFIA_COUNT, mafiaCount));
}

function buildMafiaRoles(playerCount, mafiaCount, doctor, sheriff, don, maniac, putana) {
  const roles = [];
  const donCount = don && mafiaCount >= 1 ? 1 : 0;
  for (let i = 0; i < mafiaCount - donCount; i++) roles.push("mafia");
  for (let i = 0; i < donCount; i++) roles.push("don");
  // Extra special roles only get a slot if there's room left for them —
  // this way an over-eager setup (small group, everything toggled on)
  // degrades gracefully instead of producing a malformed roster.
  if (doctor && roles.length < playerCount) roles.push("doctor");
  if (sheriff && roles.length < playerCount) roles.push("sheriff");
  if (maniac && roles.length < playerCount) roles.push("maniac");
  if (putana && roles.length < playerCount) roles.push("putana");
  while (roles.length < playerCount) roles.push("civilian");
  const order = shuffledIndices(roles.length);
  return order.map((i) => roles[i]);
}

function checkMafiaWinner(roles, alive) {
  let mafiaAlive = 0, maniacAlive = 0, townAlive = 0;
  roles.forEach((r, i) => {
    if (!alive[i]) return;
    if (r === "mafia" || r === "don") mafiaAlive++;
    else if (r === "maniac") maniacAlive++;
    else townAlive++;
  });
  const totalAlive = mafiaAlive + maniacAlive + townAlive;
  if (maniacAlive === 1 && totalAlive === 1) return "maniac";
  if (mafiaAlive === 0 && maniacAlive === 0) return "town";
  if (mafiaAlive > 0 && mafiaAlive >= townAlive + maniacAlive) return "mafia";
  return null;
}

function nextNightPhase(roles, alive, after) {
  const order = ["putana", "mafia", "don", "maniac", "doctor", "sheriff"];
  const isRoleAlive = (roleId) => roles.some((r, i) => r === roleId && alive[i]);
  const idx = order.indexOf(after);
  for (let i = idx + 1; i < order.length; i++) {
    if (isRoleAlive(order[i])) return `night-${order[i]}`;
  }
  return "night-result";
}

function finalizeMafiaNight(mafia) {
  const { roles, alive, mafiaTarget, doctorTarget, maniacTarget, putanaTarget } = mafia;
  const nextAlive = alive.slice();
  // Путана blocks the *personal* night action of whoever she visits —
  // the mafia's shared kill decision is a group action and isn't affected.
  const blockedRole = putanaTarget !== null && putanaTarget !== undefined ? roles[putanaTarget] : null;
  const doctorBlocked = blockedRole === "doctor";
  const maniacBlocked = blockedRole === "maniac";
  const effectiveDoctorTarget = doctorBlocked ? null : (doctorTarget !== undefined ? doctorTarget : null);
  const effectiveManiacTarget = maniacBlocked ? null : (maniacTarget !== undefined ? maniacTarget : null);

  const victims = [];
  let saved = false;
  if (mafiaTarget !== null && mafiaTarget !== undefined) {
    if (mafiaTarget === effectiveDoctorTarget) saved = true;
    else victims.push(mafiaTarget);
  }
  if (effectiveManiacTarget !== null && effectiveManiacTarget !== undefined && effectiveManiacTarget !== mafiaTarget) {
    if (effectiveManiacTarget === effectiveDoctorTarget) saved = true;
    else victims.push(effectiveManiacTarget);
  }
  victims.forEach((v) => { nextAlive[v] = false; });
  const winner = checkMafiaWinner(roles, nextAlive);
  return { alive: nextAlive, victims, saved, winner };
}

// Runs finalizeMafiaNight, folds the result into the mafia sub-state, drops a
// human-readable entry into the night/day log, and routes to the "last word"
// screen first when someone actually died this night.
function applyNightFinalize(mafia, patch) {
  const merged = { ...mafia, ...patch };
  const { alive, victims, saved, winner } = finalizeMafiaNight(merged);
  const logEntry = {
    type: "night",
    night: mafia.night,
    mafiaTarget: merged.mafiaTarget,
    doctorTarget: merged.doctorTarget,
    maniacTarget: merged.maniacTarget,
    putanaTarget: merged.putanaTarget,
    donResult: merged.donResult,
    sheriffResult: merged.sheriffResult,
    victims,
    saved,
  };
  return {
    ...merged,
    alive,
    lastNightVictims: victims,
    lastNightSaved: saved,
    winner,
    log: [...mafia.log, logEntry],
    lastWordQueue: victims,
    phase: victims.length > 0 ? "night-lastword" : "night-result",
  };
}

function reducer(state, action) {
  switch (action.type) {
    case "GO_HUB": {
      // Ask "how was it?" on the way back to the Hub, for any screen that
      // means the player actually played something -- not a *-setup screen
      // (backed out before starting) and not the Hub itself. One shared
      // trigger point for all five games instead of hooking each game's own
      // (very differently-shaped) end state: Spy/Mafia have a clean "-end"
      // screen, Alias loops rounds with no final screen at all, and
      // Bunker/Court are open-ended debates the host ends by judgement call,
      // not a computed win condition. GO_HUB is the one moment every game
      // funnels through regardless.
      const leftScreen = state.screen;
      const feedbackPending = /-setup$/.test(leftScreen)
        ? null
        : leftScreen.startsWith("spy") ? "spy"
        : leftScreen.startsWith("alias") ? "alias"
        : leftScreen.startsWith("croc") ? "croc"
        : leftScreen.startsWith("wordless") ? "wordless"
        : leftScreen.startsWith("countdown") ? "countdown"
        : leftScreen.startsWith("telephone") ? "telephone"
        : leftScreen.startsWith("mafia") ? "mafia"
        : leftScreen === "bunker" ? "bunker"
        : leftScreen === "court" ? "court"
        : null;
      return { ...initialState, config: state.config, feedbackPending };
    }
    case "FEEDBACK_RESOLVED":
      return { ...state, feedbackPending: null };
    case "OPEN_SPY_SETUP":
      return { ...state, screen: "spy-setup", endReason: null };
    case "OPEN_BUNKER":
      return { ...state, screen: "bunker" };
    case "OPEN_COURT":
      return { ...state, screen: "court" };
    case "SET_COUNT": {
      const count = Math.min(MAX_PLAYERS, Math.max(MIN_PLAYERS, action.value));
      const maxSpies = Math.max(MIN_SPY_COUNT, Math.floor((count - 1) / 2));
      const spyCount = Math.min(maxSpies, Math.max(MIN_SPY_COUNT, state.config.spyCount));
      return { ...state, config: { ...state.config, count, names: resizeNames(state.config.names, count), spyCount } };
    }
    case "SET_SPY_COUNT": {
      const maxSpies = Math.max(MIN_SPY_COUNT, Math.floor((state.config.count - 1) / 2));
      const spyCount = Math.min(maxSpies, Math.max(MIN_SPY_COUNT, action.value));
      return { ...state, config: { ...state.config, spyCount } };
    }
    case "TOGGLE_SPY_CATEGORY": {
      const spyCategories = { ...state.config.spyCategories, [action.key]: !state.config.spyCategories[action.key] };
      return { ...state, config: { ...state.config, spyCategories } };
    }
    case "SET_MINUTES": {
      const minutes = Math.min(MAX_MINUTES, Math.max(MIN_MINUTES, action.value));
      return { ...state, config: { ...state.config, minutes } };
    }
    case "SET_NAME": {
      const names = state.config.names.slice();
      names[action.index] = action.value;
      return { ...state, config: { ...state.config, names } };
    }
    case "LAUNCH_SPY": {
      const pool = getActiveSpyLocations(state.config.spyCategories);
      const location = pool[Math.floor(Math.random() * pool.length)];
      const spyCount = Math.min(state.config.spyCount, Math.max(MIN_SPY_COUNT, state.config.count - 1));
      const spyIndexes = shuffledIndices(state.config.count).slice(0, spyCount);
      return { ...state, screen: "spy-reveal", revealIndex: 0, game: { location, spyIndexes, statsRecorded: false }, endReason: null };
    }
    case "NEXT_REVEAL": {
      const next = state.revealIndex + 1;
      if (next < state.config.count) return { ...state, revealIndex: next };
      return { ...state, screen: "spy-playing", timer: { remaining: state.config.minutes * 60, running: true } };
    }
    case "TICK": {
      if (!state.timer.running) return state;
      const remaining = state.timer.remaining - 1;
      if (remaining <= 0) {
        return { ...state, timer: { remaining: 0, running: false }, screen: "spy-end", endReason: "timeup" };
      }
      return { ...state, timer: { ...state.timer, remaining } };
    }
    case "TOGGLE_RUNNING":
      return { ...state, timer: { ...state.timer, running: !state.timer.running } };
    case "END_MANUAL":
      return { ...state, screen: "spy-end", endReason: "manual", timer: { ...state.timer, running: false } };
    // Marks this round's per-player stats as already tallied, so a page
    // refresh on the end screen (which restores this same state from
    // sessionStorage) can't record the same round twice.
    case "SPY_STATS_RECORDED":
      return { ...state, game: { ...state.game, statsRecorded: true } };
    case "RESTART_SAME":
      return { ...state, screen: "spy-setup", endReason: null, game: { location: null, spyIndexes: [] } };

    case "OPEN_ALIAS_SETUP":
      return { ...state, screen: "alias-setup" };
    case "ALIAS_SET_TEAM_COUNT": {
      const n = Math.min(MAX_TEAMS, Math.max(MIN_TEAMS, action.value));
      const aliasTeams = resizeTeams(state.config.aliasTeams, n);
      const scores = Array.from({ length: n }, (_, i) => state.alias.scores[i] || 0);
      return { ...state, config: { ...state.config, aliasTeams }, alias: { ...state.alias, scores } };
    }
    case "ALIAS_SET_TEAM_NAME": {
      const aliasTeams = state.config.aliasTeams.slice();
      aliasTeams[action.index] = action.value;
      return { ...state, config: { ...state.config, aliasTeams } };
    }
    case "ALIAS_SET_SECONDS": {
      const aliasSeconds = Math.min(MAX_ALIAS_SECONDS, Math.max(MIN_ALIAS_SECONDS, action.value));
      return { ...state, config: { ...state.config, aliasSeconds } };
    }
    case "ALIAS_LAUNCH": {
      const pool = getActiveAliasWords(state.config.aliasCategories);
      const wordOrder = shuffledIndices(pool.length);
      return {
        ...state,
        screen: "alias-team-intro",
        alias: {
          scores: state.config.aliasTeams.map(() => 0),
          currentTeam: 0,
          pool,
          wordOrder,
          wordPointer: 0,
          currentWord: pool[wordOrder[0]],
          roundScore: 0,
          timer: { remaining: state.config.aliasSeconds, running: false },
        },
      };
    }
    case "ALIAS_TOGGLE_CATEGORY": {
      const aliasCategories = { ...state.config.aliasCategories, [action.key]: !state.config.aliasCategories[action.key] };
      return { ...state, config: { ...state.config, aliasCategories } };
    }
    case "ALIAS_START_ROUND":
      return {
        ...state,
        screen: "alias-playing",
        alias: { ...state.alias, roundScore: 0, timer: { remaining: state.config.aliasSeconds, running: true } },
      };
    case "ALIAS_CORRECT": {
      const { wordOrder, wordPointer, currentWord } = nextAliasWord(state.alias);
      return { ...state, alias: { ...state.alias, roundScore: state.alias.roundScore + 1, wordOrder, wordPointer, currentWord } };
    }
    case "ALIAS_SKIP": {
      const { wordOrder, wordPointer, currentWord } = nextAliasWord(state.alias);
      return { ...state, alias: { ...state.alias, roundScore: state.alias.roundScore - 1, wordOrder, wordPointer, currentWord } };
    }
    case "ALIAS_TICK": {
      if (!state.alias.timer.running) return state;
      const remaining = state.alias.timer.remaining - 1;
      if (remaining <= 0) {
        const scores = state.alias.scores.slice();
        scores[state.alias.currentTeam] += state.alias.roundScore;
        return { ...state, screen: "alias-round-end", alias: { ...state.alias, scores, timer: { remaining: 0, running: false } } };
      }
      return { ...state, alias: { ...state.alias, timer: { ...state.alias.timer, remaining } } };
    }
    case "ALIAS_END_ROUND_MANUAL": {
      const scores = state.alias.scores.slice();
      scores[state.alias.currentTeam] += state.alias.roundScore;
      return { ...state, screen: "alias-round-end", alias: { ...state.alias, scores, timer: { ...state.alias.timer, running: false } } };
    }
    case "ALIAS_NEXT_TEAM": {
      const currentTeam = (state.alias.currentTeam + 1) % state.config.aliasTeams.length;
      return { ...state, screen: "alias-team-intro", alias: { ...state.alias, currentTeam, roundScore: 0 } };
    }

    // Charades ("Крокодил") — mirrors the Alias cases above exactly (same
    // shuffled-word-pool mechanic via nextAliasWord, which is generic
    // despite the name), just against state.croc / state.config.croc* so
    // the two games never share teams, timer or category selection.
    case "OPEN_CROC_SETUP":
      return { ...state, screen: "croc-setup" };
    case "CROC_SET_TEAM_COUNT": {
      const n = Math.min(MAX_TEAMS, Math.max(MIN_TEAMS, action.value));
      const crocTeams = resizeTeams(state.config.crocTeams, n);
      const scores = Array.from({ length: n }, (_, i) => state.croc.scores[i] || 0);
      return { ...state, config: { ...state.config, crocTeams }, croc: { ...state.croc, scores } };
    }
    case "CROC_SET_TEAM_NAME": {
      const crocTeams = state.config.crocTeams.slice();
      crocTeams[action.index] = action.value;
      return { ...state, config: { ...state.config, crocTeams } };
    }
    case "CROC_SET_SECONDS": {
      const crocSeconds = Math.min(MAX_ALIAS_SECONDS, Math.max(MIN_ALIAS_SECONDS, action.value));
      return { ...state, config: { ...state.config, crocSeconds } };
    }
    case "CROC_LAUNCH": {
      const pool = getActiveAliasWords(state.config.crocCategories);
      const wordOrder = shuffledIndices(pool.length);
      return {
        ...state,
        screen: "croc-team-intro",
        croc: {
          scores: state.config.crocTeams.map(() => 0),
          currentTeam: 0,
          pool,
          wordOrder,
          wordPointer: 0,
          currentWord: pool[wordOrder[0]],
          roundScore: 0,
          timer: { remaining: state.config.crocSeconds, running: false },
        },
      };
    }
    case "CROC_TOGGLE_CATEGORY": {
      const crocCategories = { ...state.config.crocCategories, [action.key]: !state.config.crocCategories[action.key] };
      return { ...state, config: { ...state.config, crocCategories } };
    }
    case "CROC_START_ROUND":
      return {
        ...state,
        screen: "croc-playing",
        croc: { ...state.croc, roundScore: 0, timer: { remaining: state.config.crocSeconds, running: true } },
      };
    case "CROC_CORRECT": {
      const { wordOrder, wordPointer, currentWord } = nextAliasWord(state.croc);
      return { ...state, croc: { ...state.croc, roundScore: state.croc.roundScore + 1, wordOrder, wordPointer, currentWord } };
    }
    case "CROC_SKIP": {
      const { wordOrder, wordPointer, currentWord } = nextAliasWord(state.croc);
      return { ...state, croc: { ...state.croc, roundScore: state.croc.roundScore - 1, wordOrder, wordPointer, currentWord } };
    }
    case "CROC_TICK": {
      if (!state.croc.timer.running) return state;
      const remaining = state.croc.timer.remaining - 1;
      if (remaining <= 0) {
        const scores = state.croc.scores.slice();
        scores[state.croc.currentTeam] += state.croc.roundScore;
        return { ...state, screen: "croc-round-end", croc: { ...state.croc, scores, timer: { remaining: 0, running: false } } };
      }
      return { ...state, croc: { ...state.croc, timer: { ...state.croc.timer, remaining } } };
    }
    case "CROC_END_ROUND_MANUAL": {
      const scores = state.croc.scores.slice();
      scores[state.croc.currentTeam] += state.croc.roundScore;
      return { ...state, screen: "croc-round-end", croc: { ...state.croc, scores, timer: { ...state.croc.timer, running: false } } };
    }
    case "CROC_NEXT_TEAM": {
      const currentTeam = (state.croc.currentTeam + 1) % state.config.crocTeams.length;
      return { ...state, screen: "croc-team-intro", croc: { ...state.croc, currentTeam, roundScore: 0 } };
    }

    // "Без слов" ("The Mind"-style cooperative game). See dealWordlessHands()
    // for the deal and the game's own components for the full flow: a
    // private per-player reveal (BlindScreen, like Spy) of that level's
    // hand, then real, silent, in-person play — the app's only job during
    // play is to let whoever believes it's their turn tap their own name,
    // which reveals their next card to the group and objectively checks it
    // against every card already played (no self-judging needed).
    case "OPEN_WORDLESS_SETUP":
      return { ...state, screen: "wordless-setup" };
    case "WORDLESS_SET_COUNT": {
      const n = Math.min(MAX_WORDLESS_PLAYERS, Math.max(MIN_WORDLESS_PLAYERS, action.value));
      return { ...state, config: { ...state.config, wordlessNames: resizeNames(state.config.wordlessNames, n) } };
    }
    case "WORDLESS_SET_NAME": {
      const wordlessNames = state.config.wordlessNames.slice();
      wordlessNames[action.index] = action.value;
      return { ...state, config: { ...state.config, wordlessNames } };
    }
    case "WORDLESS_SET_LIVES": {
      const wordlessLives = Math.min(MAX_WORDLESS_LIVES, Math.max(MIN_WORDLESS_LIVES, action.value));
      return { ...state, config: { ...state.config, wordlessLives } };
    }
    case "WORDLESS_LAUNCH": {
      const count = state.config.wordlessNames.length;
      return {
        ...state,
        screen: "wordless-reveal",
        wordless: {
          level: 1,
          lives: state.config.wordlessLives,
          hands: dealWordlessHands(count, 1),
          played: [],
          revealIndex: 0,
          lastMistake: null,
        },
      };
    }
    case "WORDLESS_NEXT_REVEAL": {
      const next = state.wordless.revealIndex + 1;
      if (next < state.config.wordlessNames.length) return { ...state, wordless: { ...state.wordless, revealIndex: next } };
      return { ...state, screen: "wordless-playing" };
    }
    case "WORDLESS_PLAY": {
      const { wordless, config } = state;
      const hand = wordless.hands[action.index];
      if (!hand || hand.length === 0) return state; // that player already played all their cards this level
      const card = hand[0];
      const isMistake = wordless.played.length > 0 && card < wordless.played[wordless.played.length - 1];
      const lives = isMistake ? wordless.lives - 1 : wordless.lives;
      const hands = wordless.hands.map((h, i) => (i === action.index ? h.slice(1) : h));
      const played = [...wordless.played, card];
      const lastMistake = isMistake ? { name: config.wordlessNames[action.index], value: card } : null;

      if (lives <= 0) {
        return { ...state, screen: "wordless-end", wordless: { ...wordless, hands, played, lives: 0, lastMistake } };
      }
      const totalCards = config.wordlessNames.length * wordless.level;
      if (played.length >= totalCards) {
        // Level cleared (with or without this last card being a mistake) — deal the next one.
        const level = wordless.level + 1;
        return {
          ...state,
          screen: "wordless-reveal",
          wordless: { level, lives, hands: dealWordlessHands(config.wordlessNames.length, level), played: [], revealIndex: 0, lastMistake: null },
        };
      }
      return { ...state, wordless: { ...wordless, hands, played, lives, lastMistake } };
    }

    // "Обратный отсчёт" (Countdown). See advanceCountdownRound() for how a
    // round's prompt (task or new handicap) and timer length are picked;
    // the app can't observe the group's real-life attempt, so — same as
    // Alias's correct/skip — the group self-reports the outcome, except a
    // timeout with no tap also counts as a fail (see COUNTDOWN_TICK).
    case "OPEN_COUNTDOWN_SETUP":
      return { ...state, screen: "countdown-setup" };
    case "COUNTDOWN_SET_LIVES": {
      const countdownLives = Math.min(MAX_COUNTDOWN_LIVES, Math.max(MIN_COUNTDOWN_LIVES, action.value));
      return { ...state, config: { ...state.config, countdownLives } };
    }
    case "COUNTDOWN_SET_SECONDS": {
      const countdownBaseSeconds = Math.min(MAX_COUNTDOWN_SECONDS, Math.max(MIN_COUNTDOWN_SECONDS, action.value));
      return { ...state, config: { ...state.config, countdownBaseSeconds } };
    }
    case "COUNTDOWN_LAUNCH": {
      const round = 1;
      const base = {
        challengeOrder: shuffledIndices(COUNTDOWN_CHALLENGES.length), challengePointer: -1,
        ruleOrder: shuffledIndices(COUNTDOWN_HANDICAPS.length), rulePointer: -1,
        activeRuleIndexes: [],
      };
      const next = advanceCountdownRound(base, round, state.config.countdownBaseSeconds);
      return {
        ...state,
        screen: "countdown-round-intro",
        countdown: { ...base, ...next, round, lives: state.config.countdownLives, timer: { remaining: 0, running: false } },
      };
    }
    case "COUNTDOWN_START_ROUND":
      return { ...state, screen: "countdown-playing", countdown: { ...state.countdown, timer: { remaining: state.countdown.seconds, running: true } } };
    case "COUNTDOWN_TICK": {
      if (!state.countdown.timer.running) return state;
      const remaining = state.countdown.timer.remaining - 1;
      if (remaining <= 0) {
        // Time ran out with no "Успех"/"Провал" tap — counts as a fail.
        const lives = state.countdown.lives - 1;
        if (lives <= 0) {
          return { ...state, screen: "countdown-end", countdown: { ...state.countdown, lives: 0, timer: { remaining: 0, running: false } } };
        }
        const round = state.countdown.round + 1;
        const next = advanceCountdownRound(state.countdown, round, state.config.countdownBaseSeconds);
        return { ...state, screen: "countdown-round-intro", countdown: { ...state.countdown, ...next, round, lives, timer: { remaining: 0, running: false } } };
      }
      return { ...state, countdown: { ...state.countdown, timer: { ...state.countdown.timer, remaining } } };
    }
    case "COUNTDOWN_SUCCESS": {
      const round = state.countdown.round + 1;
      const next = advanceCountdownRound(state.countdown, round, state.config.countdownBaseSeconds);
      return { ...state, screen: "countdown-round-intro", countdown: { ...state.countdown, ...next, round, timer: { remaining: 0, running: false } } };
    }
    case "COUNTDOWN_FAIL": {
      const lives = state.countdown.lives - 1;
      if (lives <= 0) {
        return { ...state, screen: "countdown-end", countdown: { ...state.countdown, lives: 0, timer: { remaining: 0, running: false } } };
      }
      const round = state.countdown.round + 1;
      const next = advanceCountdownRound(state.countdown, round, state.config.countdownBaseSeconds);
      return { ...state, screen: "countdown-round-intro", countdown: { ...state.countdown, ...next, round, lives, timer: { remaining: 0, running: false } } };
    }

    // "Испорченный телефон". See telephoneTurnInfo() for how turnIndex maps
    // to whose turn it is, which chain they're handed, and what they do with
    // it. There's no per-turn state to track here beyond turnIndex itself and
    // the chains' accumulated content -- the current player, chain and step
    // type are all derived, never stored.
    case "OPEN_TELEPHONE_SETUP":
      return { ...state, screen: "telephone-setup" };
    case "TELEPHONE_SET_COUNT": {
      const n = Math.min(MAX_TELEPHONE_PLAYERS, Math.max(MIN_TELEPHONE_PLAYERS, action.value));
      return { ...state, config: { ...state.config, telephoneNames: resizeNames(state.config.telephoneNames, n) } };
    }
    case "TELEPHONE_SET_NAME": {
      const telephoneNames = state.config.telephoneNames.slice();
      telephoneNames[action.index] = action.value;
      return { ...state, config: { ...state.config, telephoneNames } };
    }
    case "TELEPHONE_SET_SECONDS": {
      const telephoneSeconds = Math.min(MAX_TELEPHONE_SECONDS, Math.max(MIN_TELEPHONE_SECONDS, action.value));
      return { ...state, config: { ...state.config, telephoneSeconds } };
    }
    case "TELEPHONE_LAUNCH": {
      const count = state.config.telephoneNames.length;
      return {
        ...state,
        screen: "telephone-turn",
        telephone: { turnIndex: 0, chains: Array.from({ length: count }, () => []) },
      };
    }
    case "TELEPHONE_SUBMIT": {
      const { telephone, config } = state;
      const count = config.telephoneNames.length;
      const { round, chainIndex } = telephoneTurnInfo(count, telephone.turnIndex);
      const chains = telephone.chains.map((steps, i) => (i === chainIndex ? [...steps.slice(0, round), action.content] : steps));
      const turnIndex = telephone.turnIndex + 1;
      const screen = turnIndex >= count * count ? "telephone-end" : "telephone-turn";
      return { ...state, screen, telephone: { turnIndex, chains } };
    }

    case "OPEN_MAFIA_SETUP":
      return { ...state, screen: "mafia-setup" };
    case "MAFIA_SET_COUNT": {
      const mafiaPlayerCount = Math.min(MAX_MAFIA_PLAYERS, Math.max(MIN_MAFIA_PLAYERS, action.value));
      const mafiaNames = resizeNames(state.config.mafiaNames, mafiaPlayerCount);
      const mafiaCount = clampMafiaCount(mafiaPlayerCount, state.config.mafiaCount);
      return { ...state, config: { ...state.config, mafiaPlayerCount, mafiaNames, mafiaCount } };
    }
    case "MAFIA_SET_NAME": {
      const mafiaNames = state.config.mafiaNames.slice();
      mafiaNames[action.index] = action.value;
      return { ...state, config: { ...state.config, mafiaNames } };
    }
    case "MAFIA_SET_MAFIA_COUNT": {
      const mafiaCount = clampMafiaCount(state.config.mafiaPlayerCount, action.value);
      return { ...state, config: { ...state.config, mafiaCount } };
    }
    case "MAFIA_TOGGLE_DOCTOR":
      return { ...state, config: { ...state.config, mafiaDoctor: !state.config.mafiaDoctor } };
    case "MAFIA_TOGGLE_SHERIFF":
      return { ...state, config: { ...state.config, mafiaSheriff: !state.config.mafiaSheriff } };
    case "MAFIA_TOGGLE_DON":
      return { ...state, config: { ...state.config, mafiaDon: !state.config.mafiaDon } };
    case "MAFIA_TOGGLE_MANIAC":
      return { ...state, config: { ...state.config, mafiaManiac: !state.config.mafiaManiac } };
    case "MAFIA_TOGGLE_PUTANA":
      return { ...state, config: { ...state.config, mafiaPutana: !state.config.mafiaPutana } };
    case "MAFIA_SET_DISCUSSION_MINUTES": {
      const mafiaDiscussionMinutes = Math.min(MAX_MAFIA_DISCUSSION_MIN, Math.max(MIN_MAFIA_DISCUSSION_MIN, action.value));
      return { ...state, config: { ...state.config, mafiaDiscussionMinutes } };
    }
    case "MAFIA_LAUNCH": {
      const { mafiaPlayerCount, mafiaCount, mafiaDoctor, mafiaSheriff, mafiaDon, mafiaManiac, mafiaPutana } = state.config;
      const roles = buildMafiaRoles(mafiaPlayerCount, mafiaCount, mafiaDoctor, mafiaSheriff, mafiaDon, mafiaManiac, mafiaPutana);
      return {
        ...state,
        screen: "mafia-reveal",
        mafia: {
          ...initialMafiaState,
          roles,
          alive: roles.map(() => true),
          revealIndex: 0,
          phase: "roster",
        },
      };
    }
    case "MAFIA_NEXT_REVEAL": {
      const next = state.mafia.revealIndex + 1;
      if (next < state.config.mafiaPlayerCount) return { ...state, mafia: { ...state.mafia, revealIndex: next } };
      return { ...state, screen: "mafia-roster", mafia: { ...state.mafia, revealIndex: next } };
    }
    case "MAFIA_SELECT_PUTANA_TARGET": {
      const putanaTarget = action.index;
      const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "putana");
      if (nextPhase === "night-result") return { ...state, mafia: applyNightFinalize(state.mafia, { putanaTarget }) };
      return { ...state, mafia: { ...state.mafia, putanaTarget, phase: nextPhase } };
    }
    case "MAFIA_SELECT_MAFIA_TARGET": {
      const mafiaTarget = action.index;
      const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "mafia");
      if (nextPhase === "night-result") return { ...state, mafia: applyNightFinalize(state.mafia, { mafiaTarget }) };
      return { ...state, mafia: { ...state.mafia, mafiaTarget, phase: nextPhase } };
    }
    case "MAFIA_SELECT_DON_TARGET": {
      const index = action.index;
      if (index === null || index === undefined) {
        const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "don");
        if (nextPhase === "night-result") return { ...state, mafia: applyNightFinalize(state.mafia, { donTarget: null, donResult: null }) };
        return { ...state, mafia: { ...state.mafia, donTarget: null, donResult: null, phase: nextPhase } };
      }
      const donIndex = state.mafia.roles.indexOf("don");
      const blocked = state.mafia.putanaTarget !== null && state.mafia.putanaTarget === donIndex;
      const isSheriff = !blocked && state.mafia.roles[index] === "sheriff";
      return { ...state, mafia: { ...state.mafia, donTarget: index, donResult: { index, isSheriff, blocked } } };
    }
    case "MAFIA_DON_DONE": {
      const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "don");
      if (nextPhase === "night-result") return { ...state, mafia: applyNightFinalize(state.mafia, {}) };
      return { ...state, mafia: { ...state.mafia, phase: nextPhase } };
    }
    case "MAFIA_SELECT_MANIAC_TARGET": {
      const maniacTarget = action.index;
      const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "maniac");
      if (nextPhase === "night-result") return { ...state, mafia: applyNightFinalize(state.mafia, { maniacTarget }) };
      return { ...state, mafia: { ...state.mafia, maniacTarget, phase: nextPhase } };
    }
    case "MAFIA_SELECT_DOCTOR_TARGET": {
      const doctorTarget = action.index;
      const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "doctor");
      if (nextPhase === "night-result") return { ...state, mafia: applyNightFinalize(state.mafia, { doctorTarget }) };
      return { ...state, mafia: { ...state.mafia, doctorTarget, phase: nextPhase } };
    }
    case "MAFIA_SELECT_SHERIFF_TARGET": {
      const index = action.index;
      if (index === null || index === undefined) {
        return { ...state, mafia: applyNightFinalize(state.mafia, { sheriffTarget: null, sheriffResult: null }) };
      }
      const sheriffIndex = state.mafia.roles.indexOf("sheriff");
      const blocked = state.mafia.putanaTarget !== null && state.mafia.putanaTarget === sheriffIndex;
      const isMafia = !blocked && (state.mafia.roles[index] === "mafia" || state.mafia.roles[index] === "don");
      return { ...state, mafia: { ...state.mafia, sheriffTarget: index, sheriffResult: { index, isMafia, blocked } } };
    }
    case "MAFIA_SHERIFF_DONE": {
      return { ...state, mafia: applyNightFinalize(state.mafia, {}) };
    }
    case "MAFIA_DAY_TICK": {
      if (!state.mafia.dayTimer.running) return state;
      const remaining = state.mafia.dayTimer.remaining - 1;
      if (remaining <= 0) return { ...state, mafia: { ...state.mafia, dayTimer: { remaining: 0, running: false } } };
      return { ...state, mafia: { ...state.mafia, dayTimer: { ...state.mafia.dayTimer, remaining } } };
    }
    case "MAFIA_TOGGLE_DAY_TIMER":
      return { ...state, mafia: { ...state.mafia, dayTimer: { ...state.mafia.dayTimer, running: !state.mafia.dayTimer.running } } };
    case "MAFIA_OPEN_EXILE":
      return { ...state, mafia: { ...state.mafia, exileOpen: true } };
    case "MAFIA_CLOSE_EXILE":
      return { ...state, mafia: { ...state.mafia, exileOpen: false } };
    case "MAFIA_EXILE": {
      const index = action.index;
      const alive = state.mafia.alive.slice();
      if (index !== null && index !== undefined) alive[index] = false;
      const winner = checkMafiaWinner(state.mafia.roles, alive);
      const hasVictim = index !== null && index !== undefined;
      const log = [...state.mafia.log, { type: "exile", night: state.mafia.night, index }];
      return {
        ...state,
        mafia: {
          ...state.mafia,
          alive,
          exiledIndex: index,
          exileOpen: false,
          winner,
          log,
          lastWordQueue: hasVictim ? [index] : [],
          phase: hasVictim ? "day-lastword" : "day-result",
        },
      };
    }
    case "MAFIA_LASTWORD_DONE": {
      const { mafia } = state;
      const queue = mafia.lastWordQueue.slice(1);
      if (queue.length > 0) return { ...state, mafia: { ...mafia, lastWordQueue: queue } };
      const nextPhase = mafia.phase === "day-lastword" ? "day-result" : "night-result";
      return { ...state, mafia: { ...mafia, lastWordQueue: [], phase: nextPhase } };
    }
    case "MAFIA_TOGGLE_ROSTER":
      return { ...state, mafia: { ...state.mafia, rosterOpen: !state.mafia.rosterOpen } };
    case "MAFIA_TOGGLE_HISTORY":
      return { ...state, mafia: { ...state.mafia, historyOpen: !state.mafia.historyOpen } };
    // Same guard as SPY_STATS_RECORDED: marks this game's per-player stats
    // as already tallied so a refresh on the end screen can't double-count.
    case "MAFIA_STATS_RECORDED":
      return { ...state, mafia: { ...state.mafia, statsRecorded: true } };
    case "MAFIA_CONTINUE": {
      const { mafia, config } = state;
      if (mafia.phase === "night-result") {
        if (mafia.winner) return { ...state, screen: "mafia-end" };
        return { ...state, mafia: { ...mafia, phase: "day", exileOpen: false, dayTimer: { remaining: config.mafiaDiscussionMinutes * 60, running: true } } };
      }
      if (mafia.phase === "day-result") {
        if (mafia.winner) return { ...state, screen: "mafia-end" };
        return {
          ...state,
          mafia: {
            ...mafia,
            phase: "night-mafia",
            night: mafia.night + 1,
            mafiaTarget: null,
            donTarget: null,
            donResult: null,
            doctorTarget: null,
            sheriffTarget: null,
            sheriffResult: null,
            maniacTarget: null,
            putanaTarget: null,
            lastNightVictims: [],
            lastNightSaved: false,
            lastWordQueue: [],
          },
        };
      }
      if (mafia.phase === "roster") {
        return { ...state, screen: "mafia-game", mafia: { ...mafia, phase: "night-mafia", night: 1 } };
      }
      return state;
    }
    case "MAFIA_RESTART_SAME":
      return { ...state, screen: "mafia-setup", mafia: initialMafiaState };

    default:
      return state;
  }
}

/* Soft fade + slight slide-up on mount — used to transition between      */
/* whole screens and between tabs. Give it a fresh `key` to replay it.    */
function FadeIn({ children, className }) {
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const id = requestAnimationFrame(() => setShown(true));
    return () => cancelAnimationFrame(id);
  }, []);
  return (
    <div
      className={
        "transition-all duration-300 ease-in-out " +
        (shown ? "opacity-100 translate-y-0" : "opacity-0 translate-y-2") +
        (className ? " " + className : "")
      }
    >
      {children}
    </div>
  );
}

// Every full-screen overlay in this app ("fixed inset-0 ...") needs to be
// mounted through this instead of returning its markup directly in place.
//
// Why: the app's screen transitions run through FadeIn, which always sets
// an explicit CSS transform (Tailwind's translate-y-0 / translate-y-2) on
// its wrapper div — even "no movement yet" is `transform: translate(0,0)`,
// not `transform: none`. Per the CSS spec, ANY element with a transform
// other than `none` becomes the containing block for its `position: fixed`
// (and absolute) descendants. Every screen is wrapped in a FadeIn, so every
// "fixed inset-0" modal rendered from inside a screen — the QR modal, the
// Settings/Stats panels, and every ExpandableText "read more" sheet — was
// secretly positioned relative to that FadeIn div, not the real viewport.
//
// Most of the time this is invisible because the FadeIn div happens to
// span the whole screen anyway, so getBoundingClientRect() still reports a
// normal full-screen rect. But it stops being "real" position:fixed, and
// browsers (this reproduced in desktop Chromium too, not just phones) can
// badly mis-composite a fixed element whose containing block is a
// transformed ancestor buried inside a scrolled container — the modal
// paints as a tiny, misplaced, overlapping fragment instead of a proper
// full-screen sheet. That's the "прозрачная панель" / overlapping-text bug.
//
// The fix is the standard one for this exact class of CSS bug: mount the
// overlay through a portal straight onto <body>, outside the transformed
// FadeIn subtree entirely, so `position: fixed` means what it says again.
function ModalPortal({ children }) {
  return ReactDOM.createPortal(children, document.body);
}

// Shared by every bottom-sheet/modal in the app (Settings, Stats, Rules,
// QR, the support chat, TextSheet) so Escape closes whichever one is open
// — this was touch-only before, which was fine when every visitor was on
// a phone, but now that the app also targets mouse/keyboard users on
// desktop it's a real gap. `active` lets a component that's always
// mounted (RulesSheet/QrCodeModal take an `open` prop and stay mounted
// with open=false) skip attaching the listener while closed, without
// having to call this hook conditionally (which Rules of Hooks forbids).
function useEscapeToClose(onClose, active = true) {
  useEffect(() => {
    if (!active) return;
    function handleKeyDown(e) {
      if (e.key === "Escape") onClose();
    }
    document.addEventListener("keydown", handleKeyDown);
    return () => document.removeEventListener("keydown", handleKeyDown);
  }, [active, onClose]);
}

// Full keyboard-accessibility package for a modal sheet: Escape closes it
// (via useEscapeToClose above), focus moves onto the sheet the moment it
// opens, Tab/Shift+Tab cycle only through controls inside it instead of
// reaching (invisible, behind the dark overlay) buttons in the rest of
// the app, and focus returns to whatever opened it once it closes. `ref`
// must be attached to the sheet's own outer content element (the visible
// card, not the fixed full-screen backdrop wrapper).
function useModalA11y(ref, onClose, active = true) {
  useEscapeToClose(onClose, active);
  useEffect(() => {
    if (!active || !ref.current) return;
    const container = ref.current;
    const previouslyFocused = document.activeElement;
    const focusableSelector = 'a[href], button:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])';
    const getFocusable = () => Array.from(container.querySelectorAll(focusableSelector)).filter((el) => el.offsetParent !== null);

    const initial = getFocusable();
    (initial[0] || container).focus({ preventScroll: true });

    function handleKeyDown(e) {
      if (e.key !== "Tab") return;
      const items = getFocusable();
      if (items.length === 0) return;
      const first = items[0];
      const last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
    document.addEventListener("keydown", handleKeyDown);
    return () => {
      document.removeEventListener("keydown", handleKeyDown);
      if (previouslyFocused && typeof previouslyFocused.focus === "function") {
        previouslyFocused.focus({ preventScroll: true });
      }
    };
  }, [active]);
}

// Wraps a single-line label that may be cut off with an ellipsis (a
// `truncate` class from Tailwind) so a tap reveals the full text in a
// TextSheet. Detects real truncation via scrollWidth vs. clientWidth, so
// short text that already fits stays a plain, non-interactive label — only
// text that's actually cut off becomes tappable. This is what fixes dossier
// traits, role descriptions, and similar randomized/variable-length content
// getting silently clipped on narrow phone screens.
function ExpandableText({ text, className, title, as }) {
  const Tag = as || "span";
  const ref = useRef(null);
  const [truncated, setTruncated] = useState(false);
  const [open, setOpen] = useState(false);

  useEffect(() => {
    function check() {
      const el = ref.current;
      if (!el) return;
      setTruncated(el.scrollWidth > el.clientWidth + 1);
    }
    check();
    window.addEventListener("resize", check);
    return () => window.removeEventListener("resize", check);
  }, [text]);

  return (
    <>
      <Tag
        ref={ref}
        className={className + (truncated ? " cursor-pointer" : "")}
        onClick={
          truncated
            ? (e) => {
                e.stopPropagation();
                setOpen(true);
              }
            : undefined
        }
      >
        {text}
      </Tag>
      {open && <TextSheet title={title} text={text} onClose={() => setOpen(false)} />}
    </>
  );
}

// Celebratory toast for the instant an achievement is newly unlocked --
// see detectNewlyUnlockedAchievements above for how "newly" is decided.
// Rendered through ModalPortal like every other "position: fixed" overlay
// in this file (see the comment on ModalPortal itself): the screens this
// shows on top of are wrapped in a transformed FadeIn, which would
// otherwise silently break `position: fixed` positioning. Auto-dismisses
// on its own; the caller (WordlessEnd/CountdownEnd) advances to the next
// queued achievement, if any, in onDone.
function AchievementUnlockToast({ achievement, onDone }) {
  const t = useT();
  const lang = useLang();
  useEffect(() => {
    const timer = setTimeout(onDone, 3200);
    return () => clearTimeout(timer);
  }, [onDone]);
  const Icon = achievement.Icon;
  const color = ACHIEVEMENT_TITLE_COLOR[achievement.id] || "var(--accent-strong)";

function LeaderboardList({ game, valueSuffix }) {
  const t = useT();
  const lang = useLang();
  const [state, setState] = useState({ loading: true, rows: [], myId: null, myRank: null });

  useEffect(() => {
    let cancelled = false;
    setState({ loading: true, rows: [], myId: null, myRank: null });
    fetchLeaderboard(game).then((res) => {
      if (!cancelled) setState({ loading: false, ...res });
    });
    return () => {
      cancelled = true;
    };
  }, [game]);

  if (state.loading) {
    return <p className="text-sm text-[var(--text-dim)] text-center py-8">{t("leaderboard.loading")}</p>;
  }
  if (state.rows.length === 0) {

  }
  return (
    <div className="flex flex-col gap-3">
      {state.myRank && !state.rows.some((r) => r.id === state.myId) && (
        <p className="text-xs text-center text-[var(--text-faint)]">{t("leaderboard.yourRank").replace("{n}", state.myRank)}</p>
      )}
      <div className="flex flex-col gap-2">

              <div className="flex-1 min-w-0 flex items-center gap-1.5">

// The real Discord webhook URL is NOT here on purpose — it lives only in
// the DISCORD_WEBHOOK_URL environment variable on Vercel, read by the
// serverless function at /api/support-ticket.js (see that file). This
// client code only ever calls our own /api/support-ticket endpoint, so
// nobody reading this page's source can extract or hijack the webhook.
// Replace with your server's real invite link (Discord → Server settings
// → Invites → create/copy a permanent invite).
const DISCORD_INVITE_URL = "https://discord.gg/GbbDBnrFjf";

// The three fixed quick-context chips shown above the chat input. The
// first two are questions sent straight to the AI; the bug-report chip
// skips the AI entirely and jumps to the escalation form, since "I found
// a bug" should always reach a human, not get an AI guess.
function getSupportQuickChips(t) {

    { key: "invite", label: t("support.chip.invite"), question: t("support.q.invite"), action: "ask" },
    { key: "report", label: t("support.chip.report"), action: "report" },
  ];

// Builds a stable, shareable join link for a Bunker/Court room: opening it
// jumps straight to that game with the code already filled in (see
// pendingInviteParams above), so the recipient never has to type a code by
// hand. Uses the Web Share API where available (native share sheet on
// phones), falling back to just copying the link to the clipboard.
function shareRoomInvite(code, game, gameLabel, onCopied) {
  const inviteLang = HATSIT_LANGS.includes(hatsitSettings.language) ? hatsitSettings.language : "ru";
  const text = t_lookup("invite.roomText", inviteLang)
    .replace("{game}", gameLabel)
    .replace("{brand}", t_lookup("brand.name", inviteLang))
    .replace("{code}", code);
  const telegram = tg();

  if (telegram) {
    // Inside the Mini App, hand out the t.me deep link (opens straight back
    // into this same Mini App with the code pre-filled via start_param --
    // see pendingInviteParams above) instead of the plain web URL, so a
    // recipient who taps it from within Telegram never leaves the app.
    const deepLink = `https://t.me/${TELEGRAM_BOT_USERNAME}/${TELEGRAM_MINIAPP_SHORTNAME}?startapp=${game}_${code}`;
    try {
      if (typeof telegram.shareURL === "function") {
        // Bot API 8.0+: opens Telegram's native "forward to chat" sheet
        // directly, no extra tab/redirect.
        telegram.shareURL(deepLink, text);
        return;
      }
      if (typeof telegram.openTelegramLink === "function") {
        // Older clients without shareURL: the same share sheet via
        // Telegram's own t.me/share/url helper page.
        telegram.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(deepLink)}&text=${encodeURIComponent(text)}`);
        return;
      }
    } catch (e) {}
    try {
      navigator.clipboard.writeText(deepLink);
      if (onCopied) onCopied();
    } catch (e) {}
    return;
  }

  const url = `${window.location.origin}${window.location.pathname}?room=${code}&game=${game}`;
  if (navigator.share) {
    navigator.share({ title: t_lookup("invite.shareTitle", inviteLang).replace("{brand}", t_lookup("brand.name", inviteLang)), text, url }).catch(() => {});
  } else {
    try {
      navigator.clipboard.writeText(url);
      if (onCopied) onCopied();
    } catch (e) {}
  }
}

// Draws a HatsitQR module matrix onto a <canvas>, entirely offline/on-device
// (no server call, no third-party API — see HatsitQR above). Always renders
// on a plain white background with a proper quiet zone regardless of the
// app's dark theme, since a QR code needs strong light/dark contrast to
// scan reliably with a phone camera.
function QrCanvas({ value, size = 220 }) {
  const canvasRef = useRef(null);
  useEffect(() => {
    if (!canvasRef.current || !value || !window.HatsitQR) return;
    let matrix;
    try {
      matrix = window.HatsitQR.encode(value);
    } catch (e) {
      return;
    }
    const quiet = 4;
    const totalModules = matrix.size + quiet * 2;
    const dpr = window.devicePixelRatio || 1;
    const canvas = canvasRef.current;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    canvas.style.width = size + "px";
    canvas.style.height = size + "px";
    const ctx = canvas.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, size, size);
    ctx.fillStyle = "#0a0a0f";
    const scale = size / totalModules;
    for (let r = 0; r < matrix.size; r++) {
      for (let c = 0; c < matrix.size; c++) {
        if (!matrix.isDark(r, c)) continue;
        // Round to whole pixels per-cell (not just a fixed cell size) so
        // adjacent modules never leave a hairline gap from rounding error.
        const x0 = Math.round((c + quiet) * scale);
        const x1 = Math.round((c + quiet + 1) * scale);
        const y0 = Math.round((r + quiet) * scale);
        const y1 = Math.round((r + quiet + 1) * scale);
        ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
      }
    }
  }, [value, size]);
  return <canvas ref={canvasRef} style={{ width: size, height: size, display: "block" }} />;
}

function SupportChatWidget() {
  const t = useT();
  const lang = useLang();
  const [open, setOpen] = useState(false);
  const [mode, setMode] = useState("chat"); // "chat" | "report"
  const [messages, setMessages] = useState([
    { role: "bot", text: t("support.greeting") },
  ]);
  const [input, setInput] = useState("");
  const [typing, setTyping] = useState(false);
  const [problem, setProblem] = useState("");
  const [contact, setContact] = useState("");
  const [sending, setSending] = useState(false);
  const [sendResult, setSendResult] = useState(null); // null | "ok" | "error"
  const listRef = useRef(null);
  const messagesRef = useRef(messages);
  messagesRef.current = messages;
  const sheetRef = useRef(null);

  useModalA11y(sheetRef, () => setOpen(false), open);

  useEffect(() => {
    if (listRef.current) listRef.current.scrollTop = listRef.current.scrollHeight;
  }, [messages, typing, open]);

  // Sends the running conversation to our own /api/ai-chat endpoint, which
  // is the only thing that holds the real Gemini API key (same reasoning
  // as /api/support-ticket.js — nothing secret ever ships in this static
  // page). Shows a "typing…" bubble while waiting.
  async function askAi(question) {
    const userMsg = { role: "user", text: question };
    setMessages((m) => [...m, userMsg]);
    setTyping(true);
    try {
      const history = [...messagesRef.current, userMsg].map((m) => ({
        role: m.role === "bot" ? "model" : "user",
        text: m.text,
      }));
      const res = await fetch("/api/ai-chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history, lang }),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok || !data || !data.text) throw new Error("bad ai response");
      setMessages((m) => [...m, { role: "bot", text: data.text }]);
    } catch (e) {
      setMessages((m) => [
        ...m,
        { role: "bot", text: t("support.aiError") },
      ]);
    } finally {
      setTyping(false);
    }
  }

  function handleSend() {
    const text = input.trim();
    if (!text) return;
    setInput("");
    askAi(text);
  }

  function handleQuickChip(chip) {
    if (chip.action === "report") {
      setMode("report");
    } else {
      askAi(chip.question);
    }
  }

  async function handleSubmitReport() {
    if (!problem.trim() || sending) return;
    setSending(true);
    setSendResult(null);
    try {
      // Goes to our own serverless proxy, not Discord directly — the real
      // webhook URL is a server-side secret (see /api/support-ticket.js).
      const res = await fetch("/api/support-ticket", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          problem: problem.trim().slice(0, 1000),
          contact: contact.trim().slice(0, 200),
          userAgent: (navigator.userAgent || "неизвестно").slice(0, 500),
        }),
      });
      if (!res.ok) throw new Error("bad status " + res.status);
      setSendResult("ok");
      setProblem("");
      setContact("");
      setMessages((m) => [...m, { role: "bot", text: t("support.thanksSent") }]);
      setMode("chat");
    } catch (e) {
      setSendResult("error");
    } finally {
      setSending(false);
    }
  }

  // Once a game has actually been picked, the floating support bubble
  // mostly just sits in the way of gameplay (and, worse, could overlap
  // in-game controls on short screens) — so hide it everywhere except the
  // Hub. If the chat happened to be open when this fires, close it too
  // rather than leaving an unreachable open panel with no visible trigger.
  const currentScreen = useHatsitCurrentScreen();
  const isHub = currentScreen === "hub";
  useEffect(() => {
    if (!isHub && open) setOpen(false);
  }, [isHub]);
  if (!isHub) return null;

  return (
    <>
      <button
        onClick={() => setOpen(true)}
        aria-label={t("support.fabLabel")}
        className="support-fab neon-pulse fixed z-40 w-14 h-14 rounded-full flex items-center justify-center text-2xl active:scale-95 transition-transform"
        style={{
          background: "var(--surface)",
          border: "2px solid rgba(168,85,247,.6)",
        }}
      >
        💬
      </button>

      {open && (
        <div className="modal-overlay fixed inset-0 z-50 flex items-end justify-center" onClick={() => setOpen(false)}>
          <div className="fixed inset-0 bg-black/60" />
          <FadeIn className="relative w-full sheet-w">
            <div
              ref={sheetRef}
              role="dialog"
              aria-modal="true"
              tabIndex={-1}
              className="bg-[var(--surface)] border-t border-[var(--border-strong)] rounded-t-3xl px-5 pt-3 pb-6 w-full flex flex-col"
              style={{ maxHeight: "85vh", paddingBottom: "calc(1.5rem + env(safe-area-inset-bottom, 0px))" }}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="w-10 h-1.5 rounded-full bg-[var(--surface-3)] mx-auto mb-4 shrink-0" />
              <div className="flex items-center justify-between mb-4 shrink-0">
                <h2 className="font-display text-2xl flex items-center gap-2">{t("support.title")}</h2>
                <button
                  onClick={() => setOpen(false)}
                  className="w-9 h-9 rounded-full flex items-center justify-center text-[var(--text-dim)] active:bg-[var(--surface-2)]"
                  aria-label={t("support.close")}
                >
                  <IconX size={20} />
                </button>
              </div>

              {mode === "chat" ? (
                <>
                  <div ref={listRef} className="flex-1 min-h-0 overflow-y-auto no-scrollbar flex flex-col gap-2.5 mb-3" style={{ minHeight: "180px" }}>
                    {messages.map((m, i) => (
                      <div
                        key={i}
                        className={"max-w-[85%] rounded-2xl px-4 py-2.5 text-sm leading-relaxed " + (m.role === "bot" ? "self-start bg-[var(--surface-2)] text-[var(--text)]" : "self-end text-white")}
                        style={m.role === "user" ? { background: "linear-gradient(135deg, #a855f7, #7c3aed)" } : undefined}
                      >
                        {m.text}
                      </div>
                    ))}
                    {typing && (
                      <div className="self-start bg-[var(--surface-2)] rounded-2xl px-4 py-3 flex items-center gap-1.5" aria-label={t("support.aiTyping")}>
                        <span className="w-1.5 h-1.5 rounded-full bg-[var(--text-faint)] typing-dot" style={{ animationDelay: "0s" }} />
                        <span className="w-1.5 h-1.5 rounded-full bg-[var(--text-faint)] typing-dot" style={{ animationDelay: ".15s" }} />
                        <span className="w-1.5 h-1.5 rounded-full bg-[var(--text-faint)] typing-dot" style={{ animationDelay: ".3s" }} />
                      </div>
                    )}
                  </div>

                  <div className="flex flex-wrap gap-2 mb-3 shrink-0">
                    {getSupportQuickChips(t).map((chip) => (
                      <button
                        key={chip.key}
                        onClick={() => handleQuickChip(chip)}
                        className="text-xs px-3 py-2 rounded-full bg-[var(--surface-2)] border border-[var(--border)] text-[var(--text-dim)] active:bg-[var(--surface-3)] shrink-0 touch-manipulation"
                      >
                        {chip.label}
                      </button>
                    ))}
                  </div>

                  <div className="flex items-center gap-2 mb-3 shrink-0">
                    <input
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      onKeyDown={(e) => e.key === "Enter" && handleSend()}
                      placeholder={t("support.inputPlaceholder")}
                      className="flex-1 bg-[var(--surface-2)] border border-[var(--border)] rounded-xl px-3 py-2.5 text-sm text-[var(--text)] placeholder:text-[var(--text-faint)] focus:outline-none focus:border-[var(--accent)]/60"
                    />
                    <button
                      onClick={handleSend}
                      disabled={typing}
                      className="w-11 h-11 rounded-xl flex items-center justify-center text-white shrink-0 touch-manipulation active:scale-95 transition-transform disabled:opacity-40"
                      style={{ background: "linear-gradient(135deg, #a855f7, #7c3aed)" }}
                      aria-label={t("support.send")}
                    >
                      <IconSend size={18} />
                    </button>
                  </div>

                  <button
                    onClick={() => setMode("report")}
                    className="w-full text-sm font-medium py-3 rounded-2xl border shrink-0"
                    style={{ borderColor: "rgba(168,85,247,.5)", color: "#c084fc" }}
                  >
                    {t("support.talkToHuman")}
                  </button>
                </>
              ) : (
                <div className="flex flex-col gap-3">
                  <button onClick={() => setMode("chat")} className="text-sm text-[var(--text-faint)] flex items-center gap-1 -mt-1 mb-1 self-start">
                    {t("support.backToChat")}
                  </button>
                  <div>
                    <label className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-2 block">{t("support.describeProblem")}</label>
                    <textarea
                      value={problem}
                      onChange={(e) => setProblem(e.target.value)}
                      placeholder={t("support.problemPlaceholder")}
                      rows={4}
                      maxLength={1000}
                      className="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-2xl px-4 py-3 text-sm text-[var(--text)] placeholder:text-[var(--text-faint)] focus:outline-none focus:border-[var(--accent)]/60 resize-none"
                    />
                  </div>
                  <div>
                    <label className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-2 block">{t("support.contactLabel")}</label>
                    <input
                      value={contact}
                      onChange={(e) => setContact(e.target.value)}
                      placeholder="@username"
                      maxLength={200}
                      className="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-2xl px-4 py-3 text-sm text-[var(--text)] placeholder:text-[var(--text-faint)] focus:outline-none focus:border-[var(--accent)]/60"
                    />
                  </div>
                  {sendResult === "error" && <p className="text-sm text-[var(--danger)]">{t("support.sendError")}</p>}
                  <button
                    onClick={handleSubmitReport}
                    disabled={!problem.trim() || sending}
                    className="w-full text-white font-display text-lg tracking-wide py-3.5 rounded-2xl disabled:opacity-30 active:scale-[0.98] transition-transform"
                    style={{ background: "linear-gradient(135deg, #a855f7, #7c3aed)" }}
                  >
                    {sending ? t("support.sending") : t("support.sendToSupport")}
                  </button>
                  <DiscordCommunityButton />
                </div>
              )}
            </div>
          </FadeIn>
        </div>
      )}
    </>
  );
}

// Small bottom-sheet card rendered on the Hub when state.feedbackPending is
// set (see the GO_HUB reducer case). Star tap -> optional comment -> one
// insert into the public.feedback table via the anon key already used for
// Bunker/Court's realtime rooms. There's deliberately no read-back: this is
// a one-way mailbox, not a reviews feature, so the RLS policy on that table
// only allows inserts, never selects, for the anon role.
function FeedbackPrompt({ gameId, dispatch }) {
  const t = useT();
  const [rating, setRating] = useState(0);
  const [comment, setComment] = useState("");
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);

  function dismiss() {
    dispatch({ type: "FEEDBACK_RESOLVED" });
  }

  async function submit() {
    if (!rating || sending) return;
    setSending(true);
    let language = null;
    try {
      language = JSON.parse(localStorage.getItem("hatsitSettings") || "{}").language || null;
    } catch (e) {}
    try {
      await supabaseClient.from("feedback").insert({
        game: gameId,
        rating,
        comment: comment.trim().slice(0, 500) || null,
        language,
      });
    } catch (e) {
      console.error("Failed to submit feedback:", e);
    }
    setSending(false);
    setSent(true);
    setTimeout(() => dispatch({ type: "FEEDBACK_RESOLVED" }), 1400);
  }

  const labelKey = FEEDBACK_GAME_LABEL_KEY[gameId];

  return (
    <div className="fixed inset-x-0 bottom-0 z-40 px-4 pb-4 pointer-events-none" style={{ paddingBottom: "calc(1rem + env(safe-area-inset-bottom, 0px))" }}>

          <p className="text-center text-sm py-2">{t("feedback.thanks")}</p>
        ) : (
          <>
            <div className="flex items-start justify-between gap-3 mb-3">
              <div className="min-w-0">
                {labelKey && <div className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-1 truncate">{t(labelKey)}</div>}
                <div className="font-display text-lg">{t("feedback.title")}</div>
              </div>
              <button onClick={dismiss} className="text-[var(--text-faint)] p-1 shrink-0" aria-label={t("common.close")}>
                <IconX size={18} />
              </button>
            </div>
            <div className="flex items-center justify-center gap-1 mb-3">
              {[1, 2, 3, 4, 5].map((n) => (
                <button key={n} onClick={() => setRating(n)} aria-label={String(n)} className="p-1 active:scale-95 transition-transform">
                  <IconStar size={30} filled={n <= rating} />
                </button>
              ))}
            </div>
            {rating > 0 && (
              <textarea
                value={comment}
                onChange={(e) => setComment(e.target.value)}
                placeholder={t("feedback.commentPlaceholder")}
                maxLength={500}
                rows={2}
                className="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-xl px-3 py-2 text-sm mb-3 resize-none text-[var(--text)] placeholder:text-[var(--text-faint)]"
              />
            )}
            <button
              onClick={submit}
              disabled={!rating || sending}
              className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-base tracking-wide py-3 rounded-2xl disabled:opacity-40 transition-opacity"
            >
              {sending ? t("common.sending") : t("feedback.submit")}
            </button>
          </>
        )}
      </div>
    </div>
  );
}

  return (
