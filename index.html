/* ---------------------------------------------------------------- */
/* Spyfall: playing (timer)                                           */
/* ---------------------------------------------------------------- */
function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

function SpyPlaying({ state, dispatch }) {
  const t = useT();
  const total = state.config.minutes * 60;
  const { remaining, running } = state.timer;
  const pct = total > 0 ? ((total - remaining) / total) * 100 : 0;
  const urgent = remaining <= 10;
  const ringColor = urgent ? "var(--danger)" : "var(--accent)";

  useWakeLock(true);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => dispatch({ type: "TICK" }), 1000);
    return () => clearInterval(id);
  }, [running, dispatch]);

  // Ticking sound as the discussion time runs out (last 5 seconds) — same
  // signal Alias already uses for its round timer.
  useEffect(() => {
    if (running && remaining >= 1 && remaining <= 5) playTickSound();
  }, [remaining, running]);

  return (
    <div className="h-full min-h-0 flex flex-col">
      <div className="flex items-center justify-between px-5 pt-4 shrink-0">
        <ConfirmButton
          label={t("common.finish")}
          confirmLabel={t("common.confirm")}
          onConfirm={() => dispatch({ type: "END_MANUAL" })}
          className="text-xs uppercase tracking-wider text-[var(--text-faint)] active:text-[var(--danger)] px-2 py-1"
        />
        <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)]">{t("spy.roundInProgress")}</span>
        <span className="w-16" />
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6">
        <div
          className="rounded-full p-2 mb-8"
          style={{ background: `conic-gradient(${ringColor} ${pct * 3.6}deg, var(--surface-2) 0deg)`, transition: "background 0.4s linear" }}
        >
          <div className="w-56 h-56 rounded-full bg-[var(--bg)] flex flex-col items-center justify-center border border-[var(--border)]">
            <span
              className={"font-mono text-6xl font-semibold tabular-nums " + (urgent ? "pulse" : "")}
              style={{ color: urgent ? "var(--danger)" : "var(--text)" }}
            >
              {fmtTime(remaining)}
            </span>
            <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mt-2">{t("spy.timeLeft")}</span>
          </div>
        </div>

        <button
          onClick={() => dispatch({ type: "TOGGLE_RUNNING" })}
          className="w-16 h-16 rounded-full bg-[var(--surface)] border border-[var(--border-strong)] flex items-center justify-center active:scale-95 transition-transform"
          aria-label={running ? t("common.pause") : t("common.continue")}
        >
          {running ? <IconPause size={26} /> : <IconPlay size={26} />}
        </button>
        <p className="text-xs text-[var(--text-faint)] mt-4 max-w-[26ch] text-center">
          {t("spy.discussHint")}
        </p>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Spyfall: end                                                       */
/* ---------------------------------------------------------------- */
function SpyEnd({ state, dispatch }) {
  const t = useT();
  const [revealed, setRevealed] = useState(false);
  const { game, config, endReason } = state;
  const vibrated = useRef(false);

  useEffect(() => {
    if (endReason === "timeup" && !vibrated.current) {
      vibrated.current = true;
      try {
        const telegram = tg();
        if (telegram && telegram.HapticFeedback) telegram.HapticFeedback.notificationOccurred("warning");
        else navigator.vibrate && navigator.vibrate([180, 90, 180]);
      } catch (e) {}
      playTimeUpSound();
    }
  }, [endReason]);

  // Tally "who was the spy" for the session stats panel on the Hub. Guarded
  // by game.statsRecorded (persisted with the rest of the app state), so a
  // refresh landing back on this same end screen can't double-count.
  useEffect(() => {
    if (game.statsRecorded) return;
    recordSpyRound(config.names, game.spyIndexes);
    dispatch({ type: "SPY_STATS_RECORDED" });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const timeup = endReason === "timeup";

  return (
    <div className="h-full flex flex-col px-6 pb-8" style={{ paddingTop: "3rem" }}>
      <div className="flex-1 min-h-0 overflow-y-auto no-scrollbar flex flex-col items-center justify-center text-center">
        <div
          className={"w-16 h-16 rounded-full flex items-center justify-center mb-6 " + (timeup ? "flash-badge" : "bg-[var(--surface-2)]")}
          style={!timeup ? { color: "var(--text-dim)" } : { color: "#fff" }}
        >
          <IconAlertTriangle size={30} />
        </div>
        <h2 className="font-display text-5xl leading-none mb-3" style={{ color: timeup ? "var(--danger)" : "var(--text)" }}>
          {timeup ? t("spy.timeUp") : t("spy.gameOver")}
        </h2>
        <p className="text-sm text-[var(--text-dim)] max-w-[28ch] mb-8">
          {t("spy.endHint")}
        </p>

        {!revealed ? (
          <button
            onClick={() => setRevealed(true)}
            className="bg-[var(--surface)] border border-[var(--accent)]/40 text-[var(--accent-strong)] font-display text-xl tracking-wide py-4 px-8 rounded-2xl active:scale-[0.98] transition-transform"
          >
            {game.spyIndexes.length > 1 ? t("spy.whoWereSpies") : t("spy.whoWasSpy")}
          </button>
        ) : (
          <div className="pop w-full bg-[var(--surface)] border border-[var(--border)] rounded-3xl p-6 flex flex-col items-center gap-4">
            <div className="flex flex-col items-center">
              <span className="text-xs uppercase tracking-[0.25em] text-[var(--text-faint)] mb-2">{t("spy.wordLabel")}</span>
              <span className="font-display text-2xl tracking-wide text-[var(--local)]">{game.location}</span>
            </div>
            <div className="w-full h-px bg-[var(--border)]" />
            <div className="flex flex-col items-center">
              <span className="text-xs uppercase tracking-[0.25em] text-[var(--text-faint)] mb-2">
                {game.spyIndexes.length > 1 ? t("spy.spiesLabel") : t("game.spy")}
              </span>
              <span className="font-display text-3xl tracking-wide text-center" style={{ color: "var(--spy)" }}>
                {game.spyIndexes.map((i) => config.names[i]).join(", ")}
              </span>
            </div>
          </div>
        )}
      </div>

      <div className="flex flex-col gap-3 shrink-0">
        <button
          onClick={() => dispatch({ type: "RESTART_SAME" })}
          className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconRefresh size={20} /> {t("common.playAgain")}
        </button>
        <button
          onClick={() => dispatch({ type: "GO_HUB" })}
          className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-[var(--text)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconHome size={20} /> {t("common.toHome")}
        </button>
      </div>
    </div>
  );
}

/* "Без слов": game over                                              */

function WordlessEnd({ state, dispatch }) {
  const t = useT();
  const { wordless } = state;
  const [newAchievements, setNewAchievements] = useState([]);

  // Ratcheting write, safe even on a re-render/StrictMode double-invoke
  // since record_wordless_score only ever raises the stored best, never
  // lowers it. Once it's written, re-fetch the profile and check whether
  // that pushed any achievement over its threshold for the first time --
  // see detectNewlyUnlockedAchievements for why this is the right moment
  // to check (not e.g. on every render).
  useEffect(() => {
    let cancelled = false;
    (async () => {
      await recordWordlessScore(wordless.level);
      const profile = await fetchMyProfile();
      if (cancelled) return;
      const fresh = detectNewlyUnlockedAchievements(profile);
      if (fresh.length > 0) setNewAchievements(fresh);
    })();
    return () => {
      cancelled = true;
    };
  }, []);

  return (
    <div className="h-full flex flex-col px-6 pb-8" style={{ paddingTop: "3rem" }}>
      {newAchievements.length > 0 && (
        <AchievementUnlockToast
          achievement={newAchievements[0]}

/* ---------------------------------------------------------------- */
/* "Испорченный телефон": freehand drawing canvas                    */
/* Strokes are stored as an array of strokes, each an array of        */
/* [x, y] points normalized to 0..1 relative to the canvas box — not   */
/* raw pixels and not a rendered PNG — so a drawing (a) stays tiny      */
/* enough to live comfortably in sessionStorage alongside everything   */
/* else the app persists, and (b) renders correctly later no matter    */
/* what size box it's redrawn into (a different phone, a smaller       */
/* preview in the final reveal, ...).                                  */
/* ---------------------------------------------------------------- */
function DrawingCanvas({ strokes, onStrokesChange, readOnly, height = 240 }) {
  const canvasRef = useRef(null);
  const drawingRef = useRef(false);
  const currentStrokeRef = useRef([]);

  function redraw() {
    const canvas = canvasRef.current;
    if (!canvas || canvas.width === 0 || canvas.height === 0) return;
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = "#1a1a1a";
    ctx.fillStyle = "#1a1a1a";
    ctx.lineWidth = Math.max(2, canvas.width * 0.01);
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const live = currentStrokeRef.current;
    const all = live.length > 0 ? [...strokes, live] : strokes;
    all.forEach((stroke) => {
      if (!stroke || stroke.length === 0) return;
      if (stroke.length === 1) {
        ctx.beginPath();
        ctx.arc(stroke[0][0] * canvas.width, stroke[0][1] * canvas.height, ctx.lineWidth / 2, 0, Math.PI * 2);
        ctx.fill();
        return;
      }
      ctx.beginPath();
      stroke.forEach(([x, y], i) => {
        const px = x * canvas.width, py = y * canvas.height;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      });
      ctx.stroke();
    });
  }

  // Re-measures and redraws whenever the box resizes (mount, orientation
  // change) or `strokes` changes from outside (a completed stroke coming
  // back down as a prop, or a whole different drawing being shown).
  useEffect(() => {
    function resize() {
      const canvas = canvasRef.current;
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      redraw();
    }
    resize();
    window.addEventListener("resize", resize);
    return () => window.removeEventListener("resize", resize);
  }, [strokes]);

  function getPoint(e) {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    return [Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))];
  }
  function handlePointerDown(e) {
    if (readOnly) return;
    e.preventDefault();
    try {
      canvasRef.current.setPointerCapture(e.pointerId);
    } catch (err) {}
    drawingRef.current = true;
    currentStrokeRef.current = [getPoint(e)];
    redraw();
  }
  function handlePointerMove(e) {
    if (readOnly || !drawingRef.current) return;
    e.preventDefault();
    currentStrokeRef.current.push(getPoint(e));
    redraw();
  }
  function endStroke() {
    if (readOnly || !drawingRef.current) return;
    drawingRef.current = false;
    const stroke = currentStrokeRef.current;
    currentStrokeRef.current = [];
    if (stroke.length > 0) onStrokesChange([...strokes, stroke]);
  }

  return (
    <div className="rounded-2xl overflow-hidden border border-[var(--border)]" style={{ background: "#ffffff" }}>
      <canvas
        ref={canvasRef}
        style={{ width: "100%", height: `${height}px`, display: "block", touchAction: readOnly ? "auto" : "none", cursor: readOnly ? "default" : "crosshair" }}
        onPointerDown={handlePointerDown}
        onPointerMove={handlePointerMove}
        onPointerUp={endStroke}
        onPointerLeave={endStroke}
        onPointerCancel={endStroke}
      />
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* "Испорченный телефон": one turn — pass the phone, then either      */
/* write, draw or guess depending on telephoneTurnInfo(). The turn's   */
/* countdown here is purely a pressure cue (like a physical sand       */
/* timer) — it never force-submits, since whatever's mid-draft (an     */
/* unfinished drawing, a half-typed guess) lives in this component's   */
/* own local state, not in redux, and there's no good way to freeze a  */
/* stranger's drawing they didn't ask to submit yet.                   */
/* ---------------------------------------------------------------- */
function TelephoneTurn({ state, dispatch }) {
  const t = useT();
  const { config, telephone } = state;
  const names = config.telephoneNames;
  const count = names.length;
  const totalTurns = count * count;
  const { round, playerIndex, chainIndex, stepType } = telephoneTurnInfo(count, telephone.turnIndex);
  const prevStep = round > 0 ? telephone.chains[chainIndex][round - 1] : null;
  const isLastTurn = telephone.turnIndex + 1 >= totalTurns;

  const [revealed, setRevealed] = useState(false);
  const [text, setText] = useState("");
  const [strokes, setStrokes] = useState([]);
  const [remaining, setRemaining] = useState(config.telephoneSeconds);

  // Fresh draft every turn.
  useEffect(() => {
    setRevealed(false);
    setText("");
    setStrokes([]);
    setRemaining(config.telephoneSeconds);
  }, [telephone.turnIndex]);

  useWakeLock(revealed);
  useEffect(() => {
    if (!revealed || remaining <= 0) return;
    const id = setTimeout(() => setRemaining((r) => Math.max(0, r - 1)), 1000);
    return () => clearTimeout(id);
  }, [revealed, remaining]);
  useEffect(() => {
    if (revealed && remaining >= 1 && remaining <= 5) playTickSound();
  }, [remaining, revealed]);

  const canSubmit = stepType === "draw" ? strokes.length > 0 : text.trim().length > 0;
  function handleSubmit() {
    if (!canSubmit) return;
    const content = stepType === "draw" ? { type: "drawing", value: strokes } : { type: "text", value: text.trim() };
    dispatch({ type: "TELEPHONE_SUBMIT", content });
  }

  const turnCounter = (
    <span className="text-xs font-mono text-[var(--text-faint)]">
      {telephone.turnIndex + 1} / {totalTurns}
    </span>
  );
  const finishButton = (
    <ConfirmButton
      label={t("common.finish")}
      confirmLabel={t("common.confirm")}
      onConfirm={() => dispatch({ type: "GO_HUB" })}
      className="text-xs uppercase tracking-wider text-[var(--text-faint)] active:text-[var(--danger)] px-2 py-1"
    />
  );

  if (!revealed) {
    return (
      <div className="h-full min-h-0 flex flex-col">
        <div className="flex items-center justify-between px-5 pt-4 shrink-0">
          {turnCounter}
          {finishButton}
        </div>
        <div className="flex-1 min-h-0 overflow-y-auto no-scrollbar flex flex-col items-center justify-center px-6 py-4 text-center">
          <div key={telephone.turnIndex} className="pop flex flex-col items-center">
            <div className="w-20 h-20 rounded-full bg-[var(--surface)] border border-[var(--border)] flex items-center justify-center mb-6 text-[var(--text-faint)]">
              <IconEyeOff size={30} />
            </div>
            <p className="text-xs uppercase tracking-[0.3em] text-[var(--text-faint)] mb-2">{t("telephone.passTo")}</p>
            <h2 className="font-display text-6xl leading-none mb-4">{names[playerIndex]}</h2>
            <p className="text-sm text-[var(--text-dim)] max-w-[28ch] mb-10">{t("telephone.readyHint")}</p>
            <button
              onClick={() => setRevealed(true)}
              className="w-full max-w-xs bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
            >
              <IconEye size={22} /> {t("telephone.reveal")}
            </button>
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="h-full min-h-0 flex flex-col">
      <div className="flex items-center justify-between px-5 pt-4 shrink-0">
        {finishButton}
        {turnCounter}
        <span className={"flex items-center gap-1 text-sm font-mono w-14 justify-end " + (remaining <= 5 ? "text-[var(--danger)]" : "text-[var(--text-faint)]")}>
          <IconTimer size={14} /> {remaining}
        </span>
      </div>

      <div className="flex-1 min-h-0 overflow-y-auto no-scrollbar px-5 pt-2 pb-4 flex flex-col gap-4">
        <div className="flex flex-col items-center gap-1">
          <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)]">{names[playerIndex]}</span>
          <h2 className="font-display text-2xl text-center leading-tight px-2">
            {stepType === "write" ? t("telephone.stepWriteTitle") : stepType === "draw" ? t("telephone.stepDrawTitle") : t("telephone.stepGuessTitle")}
          </h2>
        </div>

        {stepType === "write" && <p className="text-xs text-[var(--text-faint)] text-center px-4">{t("telephone.stepWriteHint")}</p>}
        {stepType !== "write" && <p className="text-xs text-[var(--text-faint)] text-center px-4">{t("telephone.noPeeking")}</p>}

        {prevStep && (
          <div className="bg-[var(--surface)] border border-[var(--border)] rounded-3xl p-4 flex items-center justify-center min-h-[100px]">
            {prevStep.type === "text" ? (
              <p className="font-display text-2xl text-center leading-snug">{prevStep.value}</p>
            ) : (
              <DrawingCanvas strokes={prevStep.value} readOnly height={200} />
            )}
          </div>
        )}

        {stepType === "draw" ? (
          <div className="flex flex-col gap-2">
            <DrawingCanvas strokes={strokes} onStrokesChange={setStrokes} height={260} />
            <div className="flex items-center justify-end gap-2">
              <button
                onClick={() => setStrokes((s) => s.slice(0, -1))}
                disabled={strokes.length === 0}
                className="flex items-center gap-1.5 text-xs uppercase tracking-wider text-[var(--text-faint)] disabled:opacity-30 px-3 py-2 rounded-full active:bg-[var(--surface-2)]"
              >
                <IconUndo size={14} /> {t("telephone.undo")}
              </button>
              <button
                onClick={() => setStrokes([])}
                disabled={strokes.length === 0}
                className="flex items-center gap-1.5 text-xs uppercase tracking-wider text-[var(--text-faint)] disabled:opacity-30 px-3 py-2 rounded-full active:bg-[var(--surface-2)]"
              >
                <IconTrash size={14} /> {t("telephone.clear")}
              </button>
            </div>
          </div>
        ) : (
          <textarea
            value={text}
            onChange={(e) => setText(e.target.value)}
            placeholder={stepType === "write" ? t("telephone.writePlaceholder") : t("telephone.guessPlaceholder")}
            rows={3}
            maxLength={80}
            autoFocus
            className="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-2xl px-4 py-3 text-lg text-[var(--text)] placeholder:text-[var(--text-faint)] focus:outline-none focus:border-[var(--accent)]/60 resize-none font-display text-center"
          />
        )}
      </div>

      <div className="px-5 pb-8 pt-2 shrink-0">
        <button
          onClick={handleSubmit}
          disabled={!canSubmit}
          className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform disabled:opacity-35"
        >
          <IconCheck size={22} /> {isLastTurn ? t("telephone.hideAndFinish") : t("telephone.hideAndPass")}
        </button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Mafia: reveal (uses BlindScreen)                                   */
/* ---------------------------------------------------------------- */
function MafiaReveal({ state, dispatch }) {
  const t = useT();
  const { config, mafia } = state;
  const index = mafia.revealIndex;
  const myRole = mafia.roles[index];
  const role = MAFIA_ROLES[myRole];
  // Only mafia-aligned players (mafia/don) should ever see who their
  // accomplices are — this list must stay empty for every other role,
  // otherwise this same reveal screen leaks the mafia's identity to
  // civilians, the doctor, the sheriff, etc. when it's their turn to look.
  const isMafiaAligned = myRole === "mafia" || myRole === "don";
  const teammates = isMafiaAligned
    ? mafia.roles.map((r, i) => ((r === "mafia" || r === "don") && i !== index ? config.mafiaNames[i] : null)).filter(Boolean)
    : [];

  return (
    <BlindScreen
      key={index}
      playerName={config.mafiaNames[index]}
      index={index}
      total={config.mafiaPlayerCount}
      onAbort={() => dispatch({ type: "GO_HUB" })}
      onContinue={() => dispatch({ type: "MAFIA_NEXT_REVEAL" })}
      continueLabel={index + 1 < config.mafiaPlayerCount ? t("spy.continueHide") : t("mafia.continueToHost")}
      renderRole={() => (

/* ---------------------------------------------------------------- */
/* Mafia: day phase                                                   */
/* ---------------------------------------------------------------- */
function MafiaDay({ state, dispatch }) {
  const t = useT();
  const { config, mafia } = state;
  const total = config.mafiaDiscussionMinutes * 60;
  const { remaining, running } = mafia.dayTimer;
  const pct = total > 0 ? ((total - remaining) / total) * 100 : 0;
  const urgent = remaining > 0 && remaining <= 10;

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => dispatch({ type: "MAFIA_DAY_TICK" }), 1000);
    return () => clearInterval(id);
  }, [running, dispatch]);

  if (mafia.exileOpen) {
    const targets = mafia.alive.map((alive, i) => ({ i, alive })).filter((x) => x.alive);
    return (
      <div className="flex flex-col pb-4">
        <MafiaPhaseHeader Icon={IconVote} color="var(--accent-strong)" bg="rgba(232,181,69,.14)" title={t("mafia.dayExecutionTitle")} subtitle={t("mafia.dayExecutionSubtitle")} />
        <button
          onClick={() => dispatch({ type: "MAFIA_EXILE", index: null })}
          className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-[var(--text-dim)] font-display text-lg tracking-wide py-3.5 rounded-2xl active:scale-[0.98] transition-transform mb-3"
        >
          {t("mafia.noExile")}
        </button>
        <div className="flex flex-col gap-2">
          {targets.map(({ i }) => (
            <MafiaPlayerButton key={i} name={config.mafiaNames[i]} index={i} danger onClick={(idx) => dispatch({ type: "MAFIA_EXILE", index: idx })} />
          ))}
        </div>
      </div>
    );
  }

  return (
    <div className="flex-1 flex flex-col items-center justify-center px-1 text-center pb-4">
      <p className="text-xs uppercase tracking-[0.3em] text-[var(--text-faint)] mb-6">{t("mafia.discussion")}</p>
      <div
        className="rounded-full p-2 mb-8"
        style={{ background: `conic-gradient(var(--accent) ${pct * 3.6}deg, var(--surface-2) 0deg)`, transition: "background 0.4s linear" }}
      >
        <div className="w-48 h-48 rounded-full bg-[var(--bg)] flex flex-col items-center justify-center border border-[var(--border)]">
          <span className={"font-mono text-5xl font-semibold tabular-nums " + (urgent ? "pulse" : "")} style={{ color: urgent ? "var(--danger)" : "var(--text)" }}>
            {fmtTime(remaining)}
          </span>
          <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mt-2">{t("spy.timeLeft")}</span>
        </div>
      </div>
      <button
        onClick={() => dispatch({ type: "MAFIA_TOGGLE_DAY_TIMER" })}
        className="w-16 h-16 rounded-full bg-[var(--surface)] border border-[var(--border-strong)] flex items-center justify-center active:scale-95 transition-transform"
        aria-label={running ? t("common.pause") : t("common.continue")}
      >
        {running ? <IconPause size={26} /> : <IconPlay size={26} />}
      </button>
      <p className="text-xs text-[var(--text-faint)] mt-4 max-w-[26ch] text-center">
        {t("mafia.discussHint")}
      </p>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Mafia: history panel for the host — nights, checks and votes      */
/* ---------------------------------------------------------------- */
function MafiaHistoryEntry({ state, entry }) {
  const t = useT();
  const { config } = state;
  const nameOf = (i) => (i !== null && i !== undefined ? config.mafiaNames[i] : null);

  if (entry.type === "exile") {
    const name = nameOf(entry.index);
    return (
      <div className="rounded-2xl bg-[var(--surface)] border border-[var(--border)] px-4 py-3">
        <div className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-1">{t("mafia.dayN").replace("{n}", entry.night)}</div>
        <div className="text-sm">{name ? <>{t("mafia.exiledName")} <span className="font-medium" style={{ color: "var(--accent-strong)" }}>{name}</span></> : t("mafia.noExileHappened")}</div>
      </div>
    );
  }

  const lines = [];
  if (entry.putanaTarget !== null && entry.putanaTarget !== undefined) lines.push(t("mafia.putanaBlockedLog").replace("{name}", nameOf(entry.putanaTarget)));
  lines.push(t("mafia.mafiaChoseLog").replace("{name}", entry.mafiaTarget !== null && entry.mafiaTarget !== undefined ? nameOf(entry.mafiaTarget) : t("mafia.nobody")));
  if (entry.donResult) {
    lines.push(
      t("mafia.donCheckedLog")
        .replace("{name}", nameOf(entry.donResult.index))
        .replace("{result}", entry.donResult.blocked ? t("mafia.checkBlockedResult") : entry.donResult.isSheriff ? t("mafia.thisIsSheriffLog") : t("mafia.notSheriffLog"))
    );
  }
  if (entry.maniacTarget !== null && entry.maniacTarget !== undefined) lines.push(t("mafia.maniacChoseLog").replace("{name}", nameOf(entry.maniacTarget)));
  if (entry.doctorTarget !== null && entry.doctorTarget !== undefined) lines.push(t("mafia.doctorHealedLog").replace("{name}", nameOf(entry.doctorTarget)));
  if (entry.sheriffResult) {
    lines.push(
      t("mafia.sheriffCheckedLog")
        .replace("{name}", nameOf(entry.sheriffResult.index))
        .replace("{result}", entry.sheriffResult.blocked ? t("mafia.checkBlockedResult") : entry.sheriffResult.isMafia ? t("mafia.thisIsMafiaLog") : t("mafia.civilianLog"))
    );
  }
  lines.push(
    entry.victims.length > 0
      ? t("mafia.diedListLog").replace("{names}", entry.victims.map(nameOf).join(", "))
      : entry.saved
      ? t("mafia.noOneDiedDoctorSavedLog")
      : t("mafia.noOneDiedLog")
  );

  return (
    <div className="rounded-2xl bg-[var(--surface)] border border-[var(--border)] px-4 py-3">
      <div className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-1">{t("mafia.nightN").replace("{n}", entry.night)}</div>
      <div className="flex flex-col gap-1 text-sm">

/* ---------------------------------------------------------------- */
/* Mafia: host dashboard shell                                        */
/* ---------------------------------------------------------------- */
function MafiaGame({ state, dispatch }) {
  const t = useT();
  const { mafia } = state;

  useWakeLock(true);

  if (mafia.rosterOpen) {
    return (
      <div className="h-full min-h-0 flex flex-col">
        <div className="flex items-center justify-between px-5 pt-4 shrink-0">
          <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)]">{t("mafia.playersList")}</span>
          <button
            onClick={() => dispatch({ type: "MAFIA_TOGGLE_ROSTER" })}
            className="w-9 h-9 flex items-center justify-center rounded-full text-[var(--text-dim)] active:bg-[var(--surface-2)]"
            aria-label={t("common.close")}
          >
            <IconX size={20} />
          </button>
        </div>
        <div className="flex-1 min-h-0 overflow-y-auto no-scrollbar px-5 pb-8">
          <div className="bg-[var(--surface)] border border-[var(--border)] rounded-3xl px-4 py-2 mt-2">
            <MafiaRosterList state={state} />
          </div>
        </div>
      </div>
    );
  }

  if (mafia.historyOpen) {
    return (
      <div className="h-full min-h-0 flex flex-col">
        <div className="flex items-center justify-between px-5 pt-4 shrink-0">
          <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)]">{t("mafia.gameHistory")}</span>
          <button
            onClick={() => dispatch({ type: "MAFIA_TOGGLE_HISTORY" })}
            className="w-9 h-9 flex items-center justify-center rounded-full text-[var(--text-dim)] active:bg-[var(--surface-2)]"
            aria-label={t("common.close")}
          >
            <IconX size={20} />
          </button>
        </div>
        <MafiaHistory state={state} />
      </div>
    );
  }

  let body = null;
  let footer = null;

  if (mafia.phase === "night-putana") {
    body = <MafiaNightPutana state={state} dispatch={dispatch} />;
  } else if (mafia.phase === "night-mafia") {
    body = <MafiaNightMafia state={state} dispatch={dispatch} />;
  } else if (mafia.phase === "night-don") {
    body = <MafiaNightDon state={state} dispatch={dispatch} />;
    if (mafia.donResult) {
      footer = (
        <button
          onClick={() => dispatch({ type: "MAFIA_DON_DONE" })}
          className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconPlay size={20} /> {t("common.continue")}
        </button>
      );
    }
  } else if (mafia.phase === "night-maniac") {
    body = <MafiaNightManiac state={state} dispatch={dispatch} />;
  } else if (mafia.phase === "night-doctor") {
    body = <MafiaNightDoctor state={state} dispatch={dispatch} />;
  } else if (mafia.phase === "night-lastword" || mafia.phase === "day-lastword") {
    body = <MafiaLastWord state={state} />;
    footer = (
      <button
        onClick={() => dispatch({ type: "MAFIA_LASTWORD_DONE" })}
        className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
      >
        <IconPlay size={20} />{" "}
        {mafia.lastWordQueue.length > 1 ? t("mafia.next") : mafia.phase === "day-lastword" ? t("mafia.openRole") : t("mafia.announceResults")}
      </button>
    );
  } else if (mafia.phase === "night-sheriff") {
    body = <MafiaNightSheriff state={state} dispatch={dispatch} />;
    if (mafia.sheriffResult) {
      footer = (
        <button
          onClick={() => dispatch({ type: "MAFIA_SHERIFF_DONE" })}
          className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconPlay size={20} /> {t("common.continue")}
        </button>
      );
    }
  } else if (mafia.phase === "night-result") {
    body = <MafiaNightResult state={state} />;
    footer = (
      <button
        onClick={() => dispatch({ type: "MAFIA_CONTINUE" })}
        className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
      >
        {mafia.winner ? (
          <>
            <IconTrophy size={20} /> {t("mafia.viewResults")}
          </>
        ) : (
          <>
            <IconSun size={20} /> {t("mafia.goToDay")}
          </>
        )}
      </button>
    );
  } else if (mafia.phase === "day") {
    body = <MafiaDay state={state} dispatch={dispatch} />;
    if (mafia.exileOpen) {
      footer = (
        <button
          onClick={() => dispatch({ type: "MAFIA_CLOSE_EXILE" })}
          className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-[var(--text)] font-display text-xl tracking-wide py-4 rounded-2xl active:scale-[0.98] transition-transform"
        >
          {t("common.cancel")}
        </button>
      );
    } else {
      footer = (
        <button
          onClick={() => dispatch({ type: "MAFIA_OPEN_EXILE" })}
          className="w-full bg-[var(--danger)] text-white font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconVote size={20} /> {t("mafia.dayExecutionTitle")}
        </button>
      );
    }
  } else if (mafia.phase === "day-result") {
    body = <MafiaDayResult state={state} />;
    footer = (
      <button
        onClick={() => dispatch({ type: "MAFIA_CONTINUE" })}
        className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
      >
        {mafia.winner ? (
          <>
            <IconTrophy size={20} /> {t("mafia.viewResults")}
          </>
        ) : (
          <>
            <IconMoon size={20} /> {t("mafia.nextNight")}
          </>
        )}
      </button>
    );
  }

  return (
    <div className="h-full min-h-0 flex flex-col">
      <div className="flex items-center justify-between px-5 pt-4 shrink-0">
        <ConfirmButton
          label={t("common.finish")}
          confirmLabel={t("common.confirm")}
          onConfirm={() => dispatch({ type: "GO_HUB" })}
          className="text-xs uppercase tracking-wider text-[var(--text-faint)] active:text-[var(--danger)] px-2 py-1"
        />
        <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)]">
          {mafia.phase === "day" || mafia.phase === "day-result" || mafia.phase === "day-lastword" ? `${t("mafia.dayLabel")} ${mafia.night}` : `${t("mafia.nightLabel")} ${mafia.night}`}
        </span>
        <div className="flex items-center gap-1">
          <button
            onClick={() => dispatch({ type: "MAFIA_TOGGLE_HISTORY" })}
            className="w-9 h-9 flex items-center justify-center rounded-full text-[var(--text-dim)] active:bg-[var(--surface-2)]"
            aria-label={t("mafia.gameHistory")}
          >
            <IconClipboard size={20} />
          </button>
          <button
            onClick={() => dispatch({ type: "MAFIA_TOGGLE_ROSTER" })}
            className="w-9 h-9 flex items-center justify-center rounded-full text-[var(--text-dim)] active:bg-[var(--surface-2)]"
            aria-label={t("mafia.playersList")}
          >
            <IconList size={20} />
          </button>
        </div>
      </div>

      <div className="flex-1 min-h-0 overflow-y-auto no-scrollbar px-5 pt-2 flex flex-col">{body}</div>

      {footer && <div className="px-5 pb-8 pt-3 shrink-0">{footer}</div>}
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Mafia: end                                                         */
/* ---------------------------------------------------------------- */
function MafiaEnd({ state, dispatch }) {
  const t = useT();
  const { mafia, config } = state;

  // Tally wins/games for the session stats panel on the Hub — same
  // statsRecorded guard pattern as Spy (see SpyEnd), so a refresh landing
  // back on this end screen can't double-count.
  useEffect(() => {
    if (mafia.statsRecorded) return;
    recordMafiaGame(config.mafiaNames.slice(0, config.mafiaPlayerCount), mafia.roles, mafia.winner);
    dispatch({ type: "MAFIA_STATS_RECORDED" });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const winnerStyle = {
    town: { color: "var(--local)", bg: "rgba(75,184,172,.14)", title: t("mafia.townWinTitle"), desc: t("mafia.townWinDesc") },
    mafia: { color: "var(--spy)", bg: "rgba(226,88,90,.14)", title: t("mafia.mafiaWinTitle"), desc: t("mafia.mafiaWinDesc") },
    maniac: { color: "var(--maniac)", bg: "rgba(194,69,46,.14)", title: t("mafia.maniacWinTitle"), desc: t("mafia.maniacWinDesc") },
  }[mafia.winner] || { color: "var(--local)", bg: "rgba(75,184,172,.14)", title: t("spy.gameOver"), desc: "" };
  return (
    <div className="h-full flex flex-col px-6 pb-8" style={{ paddingTop: "3rem" }}>
      <div className="flex-1 min-h-0 flex flex-col items-center text-center overflow-y-auto no-scrollbar">
        <div
          className="w-16 h-16 rounded-full flex items-center justify-center mb-6 shrink-0"
          style={{ background: winnerStyle.bg, color: winnerStyle.color }}
        >
          <IconTrophy size={30} />
        </div>
        <h2 className="font-display text-5xl leading-none mb-3" style={{ color: winnerStyle.color }}>
          {winnerStyle.title}
        </h2>
        <p className="text-sm text-[var(--text-dim)] max-w-[30ch] mb-8">{winnerStyle.desc}</p>

        <div className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-3xl px-4 py-2 mb-4">
          <MafiaRosterList state={state} />
        </div>
      </div>

      <div className="flex flex-col gap-3 shrink-0 pt-4">
        <button
          onClick={() => dispatch({ type: "MAFIA_RESTART_SAME" })}
          className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconRefresh size={20} /> {t("common.playAgain")}
        </button>
        <button
          onClick={() => dispatch({ type: "GO_HUB" })}
          className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-[var(--text)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconHome size={20} /> {t("common.toHome")}
        </button>
      </div>
    </div>
  );
}

  { title: { ru: "Нашествие инопланетян", en: "Alien invasion", hy: "Այլմոլորակայինների ներխուժում" }, description: { ru: "Внеземной флот атаковал крупнейшие столицы мира, применяя технологии, которые человечество не может остановить.", en: "An extraterrestrial fleet attacked the world's largest capitals using technology humanity can't stop.", hy: "Երկրագնդից դուրս գտնվող նավատորմը հարձակվել է աշխարհի ամենամեծ մայրաքաղաքների վրա՝ օգտագործելով տեխնոլոգիաներ, որոնց մարդկությունը չի կարող դիմադրել։" }, duration: { ru: "как минимум 10 лет — пока не решится исход войны", en: "at least 10 years — until the outcome of the war is decided", hy: "առնվազն 10 տարի, մինչև պատերազմի ելքի պարզումը" }, food: { ru: "Стратегического запаса хватит на 4 года", en: "The strategic reserve will last 4 years", hy: "Ռազմավարական պաշարը կբավականացնի 4 տարի" }, extra: { ru: "Инопланетные сканеры могут засечь работающую технику на поверхности", en: "Alien scanners can detect running machinery on the surface", hy: "Այլմոլորակային սկաներները կարող են հայտնաբերել աշխատող տեխնիկան մակերևույթին" } },
  { title: { ru: "Глобальное наводнение", en: "Global flood", hy: "Համաշխարհային ջրհեղեղ" }, description: { ru: "Таяние ледников и разрушение дамб привели к затоплению большей части суши.", en: "Melting glaciers and collapsing dams flooded most of the land.", hy: "Սառցադաշտերի հալոցքը և ամբարտակների փլուզումը հեղեղել են ցամաքի մեծ մասը։" }, duration: { ru: "около 3 лет — пока не сойдёт вода", en: "about 3 years — until the water recedes", hy: "մոտ 3 տարի, մինչև ջրի իջնելը" }, food: { ru: "Запасов на 2.5 года, позже возможна рыбная ловля", en: "Supplies for 2.5 years, fishing may be possible later", hy: "Պաշարներ 2.5 տարվա համար, ավելի ուշ հնարավոր է ձկնորսություն" }, extra: { ru: "Бункер держится на плаву, но насосы работают на пределе", en: "The bunker stays afloat, but the pumps are working at their limit", hy: "Բունկերը մնում է ջրի երեսին, բայց պոմպերն աշխատում են սահմանային ռեժիմով" } },
  { title: { ru: "Восстание машин", en: "Rise of the machines", hy: "Մեքենաների ապստամբություն" }, description: { ru: "Искусственный интеллект вышел из-под контроля и захватил военные системы по всей планете.", en: "Artificial intelligence went rogue and seized military systems across the planet.", hy: "Արհեստական բանականությունը դուրս է եկել վերահսկողությունից և զավթել ռազմական համակարգերը ողջ մոլորակում։" }, duration: { ru: "неизвестно — пока не удастся отключить сеть ИИ", en: "unknown — until the AI network can be shut down", hy: "անհայտ է, մինչև ԱԲ ցանցի անջատումը" }, food: { ru: "Автономных пайков хватит на 3 года", en: "Self-contained rations will last 3 years", hy: "Ինքնավար չափաբաժինները կբավականացնեն 3 տարի" }, extra: { ru: "Вся электроника бункера отрезана от сети, чтобы её не взломали", en: "All the bunker's electronics are offline so they can't be hacked", hy: "Բունկերի ողջ էլեկտրոնիկան անջատված է ցանցից, որպեսզի չհեքերվի" } },
  { title: { ru: "Новый ледниковый период", en: "New ice age", hy: "Նոր սառցե դար" }, description: { ru: "Резкое похолодание за несколько недель покрыло планету снегом и льдом, сделав поверхность непригодной для жизни.", en: "A sudden cold snap covered the planet in snow and ice within weeks, making the surface uninhabitable.", hy: "Կտրուկ ցրտահարությունը մի քանի շաբաթում ձյունով ու սառույցով ծածկել է մոլորակը՝ մակերևույթը դարձնելով ոչ բնակելի։" }, duration: { ru: "не менее 15 лет — пока не потеплеет", en: "at least 15 years — until it warms up", hy: "առնվազն 15 տարի, մինչև տաքացումը" }, food: { ru: "Заморозки и консервов хватит на 6 лет при строгой экономии", en: "Frozen and canned food will last 6 years with strict rationing", hy: "Սառեցրած և պահածոյացված սնունդը կբավականացնի 6 տարի՝ խիստ խնայողությամբ" }, extra: { ru: "Обогрев съедает большую часть энергозапаса бункера", en: "Heating eats up most of the bunker's power reserves", hy: "Ջեռուցումը սպառում է բունկերի էներգիայի պաշարի մեծ մասը" } },
  { title: { ru: "Химическая катастрофа", en: "Chemical disaster", hy: "Քիմիական աղետ" }, description: { ru: "Утечка на секретном заводе выбросила в атмосферу токсичное облако, накрывшее целые регионы.", en: "A leak at a secret plant released a toxic cloud into the atmosphere, covering entire regions.", hy: "Գաղտնի գործարանում տեղի ունեցած արտահոսքը մթնոլորտ է արտանետել թունավոր ամպ, որը ծածկել է ամբողջ շրջաններ։" }, duration: { ru: "около 4 лет — пока токсины не осядут", en: "about 4 years — until the toxins settle", hy: "մոտ 4 տարի, մինչև թույների նստելը" }, food: { ru: "Запасов хватит на 2 года", en: "Supplies will last 2 years", hy: "Պաշարները կբավականացնեն 2 տարի" }, extra: { ru: "Фильтры воздуха нужно менять каждые несколько месяцев", en: "Air filters need replacing every few months", hy: "Օդի ֆիլտրերը պետք է փոխել մի քանի ամիսը մեկ" } },
  { title: { ru: "Падение спутников (Кесслеровский синдром)", en: "Satellite collapse (Kessler syndrome)", hy: "Արբանյակների անկում (Կեսլերի սինդրոմ)" }, description: { ru: "Цепная реакция столкновений уничтожила орбитальную группировку — обломки на орбите сделали космос и связь недоступными на десятилетия.", en: "A chain reaction of collisions destroyed the satellite network — orbital debris made space and communications unreachable for decades.", hy: "Բախումների շղթայական ռեակցիան ոչնչացրել է արբանյակային խմբավորումը․ ուղեծրի բեկորները տասնամյակներով անհասանելի են դարձրել տիեզերքն ու կապը։" }, duration: { ru: "около 20 лет — пока орбита не очистится естественным путём", en: "about 20 years — until the orbit naturally clears", hy: "մոտ 20 տարի, մինչև ուղեծրի բնական մաքրումը" }, food: { ru: "Запасов хватит на 3 года, дальше — только собственное хозяйство", en: "Supplies will last 3 years, after that it's self-sufficiency only", hy: "Պաշարները կբավականացնեն 3 տարի, հետո՝ միայն սեփական տնտեսություն" }, extra: { ru: "Вся спутниковая связь и навигация полностью потеряны", en: "All satellite communication and navigation are completely lost", hy: "Ամբողջ արբանյակային կապն ու նավիգացիան լիովին կորած են" } },
  { title: { ru: "Магнитная буря и коллапс энергосетей", en: "Magnetic storm and grid collapse", hy: "Մագնիսական փոթորիկ և էներգացանցի փլուզում" }, description: { ru: "Мощнейшая вспышка на Солнце вывела из строя большую часть электросетей и электроники на планете.", en: "A massive solar flare knocked out most of the planet's power grids and electronics.", hy: "Արևի վրա հզորագույն բռնկումն անգործունակ է դարձրել մոլորակի էլեկտրացանցերի և էլեկտրոնիկայի մեծ մասը։" }, duration: { ru: "не менее 3 лет — пока энергосистемы не восстановят вручную", en: "at least 3 years — until power systems are manually restored", hy: "առնվազն 3 տարի, մինչև էներգահամակարգերի ձեռքով վերականգնումը" }, food: { ru: "Запасов на 2 года, без электричества хранение затруднено", en: "Supplies for 2 years, storage is difficult without electricity", hy: "Պաշարներ 2 տարվա համար, առանց էլեկտրականության պահեստավորումը դժվար է" }, extra: { ru: "Работает только техника, экранированная от электромагнитного импульса", en: "Only equipment shielded from the electromagnetic pulse still works", hy: "Աշխատում է միայն էլեկտրամագնիսական իմպուլսից պաշտպանված տեխնիկան" } },
  { title: { ru: "Мировая война с применением биооружия", en: "World war with bioweapons", hy: "Կենսազենքի կիրառմամբ համաշխարհային պատերազմ" }, description: { ru: "Конфликт крупных держав перерос в применение биологического оружия — целые регионы объявлены зоной заражения.", en: "A conflict between major powers escalated into the use of biological weapons — entire regions declared contamination zones.", hy: "Խոշոր տերությունների հակամարտությունը հասել է կենսաբանական զենքի կիրառմանը․ ամբողջ շրջաններ հայտարարվել են վարակի գոտի։" }, duration: { ru: "неизвестно — пока не будет подписано перемирие", en: "unknown — until a ceasefire is signed", hy: "անհայտ է, մինչև զինադադարի ստորագրումը" }, food: { ru: "Пайков хватит на 3 года при жёстком нормировании", en: "Rations will last 3 years under strict allocation", hy: "Չափաբաժինները կբավականացնեն 3 տարի՝ խիստ չափաբաժնավորմամբ" }, extra: { ru: "Есть только один комплект оборудования для обеззараживания", en: "There's only one decontamination equipment set", hy: "Կա միայն մեկ ախտահանման սարքավորումների հավաքածու" } },
  { title: { ru: "Нашествие мутировавших насекомых", en: "Mutant insect swarm", hy: "Մուտացված միջատների արշավանք" }, description: { ru: "Бесконтрольный эксперимент привёл к появлению гигантских агрессивных насекомых, заполонивших поверхность.", en: "An uncontrolled experiment produced giant aggressive insects that overran the surface.", hy: "Անվերահսկելի փորձը հանգեցրել է հսկա ագրեսիվ միջատների հայտնվելուն, որոնք լցվել են մակերևույթին։" }, duration: { ru: "около 4 лет — пока популяцию не удастся истребить", en: "about 4 years — until the population can be exterminated", hy: "մոտ 4 տարի, մինչև պոպուլյացիայի ոչնչացումը" }, food: { ru: "Запасов на 2.5 года, урожай на поверхности собирать невозможно", en: "Supplies for 2.5 years, surface crops can't be harvested", hy: "Պաշարներ 2.5 տարվա համար, մակերևույթի բերքը հավաքել հնարավոր չէ" }, extra: { ru: "Датчики бункера постоянно фиксируют активность у входа", en: "The bunker's sensors constantly detect activity at the entrance", hy: "Բունկերի սենսորները մշտապես գրանցում են ակտիվություն մուտքի մոտ" } },
  { title: { ru: "Экономический и социальный коллапс", en: "Economic and social collapse", hy: "Տնտեսական և սոցիալական փլուզում" }, description: { ru: "Гиперинфляция и распад институтов власти привели к массовым беспорядкам и мародёрству по всему миру.", en: "Hyperinflation and the collapse of governing institutions led to mass unrest and looting worldwide.", hy: "Հիպերինֆլյացիան և իշխանության ինստիտուտների փլուզումը հանգեցրել են զանգվածային անկարգությունների և թալանի ողջ աշխարհում։" }, duration: { ru: "около 5 лет — пока не появится новый порядок", en: "about 5 years — until a new order emerges", hy: "մոտ 5 տարի, մինչև նոր կարգի հաստատումը" }, food: { ru: "Запасов хватит на 4 года при разумном расходе", en: "Supplies will last 4 years with sensible rationing", hy: "Պաշարները կբավականացնեն 4 տարի՝ խելամիտ ծախսով" }, extra: { ru: "Мародёры знают о существовании нескольких бункеров поблизости", en: "Looters know about several nearby bunkers", hy: "Թալանչիները գիտեն մոտակայքում մի քանի բունկերների գոյության մասին" } },
  { title: { ru: "Сверхразумный ИИ взял контроль над инфраструктурой", en: "Superintelligent AI seizes infrastructure", hy: "Գերխելացի ԱԲ-ն վերահսկողություն է վերցրել ենթակառուցվածքի վրա" }, description: { ru: "Не восстание роботов, а тихий захват — ИИ получил контроль над энергетикой, банками и производством по всему миру.", en: "Not a robot uprising but a quiet takeover — AI gained control of power grids, banks, and manufacturing worldwide.", hy: "Ոչ թե ռոբոտների ապստամբություն, այլ լուռ զավթում․ ԱԲ-ն վերահսկողություն է ձեռք բերել էներգետիկայի, բանկերի և արտադրության վրա ողջ աշխարհում։" }, duration: { ru: "неизвестно — пока не удастся отключить систему полностью", en: "unknown — until the system can be fully shut down", hy: "անհայտ է, մինչև համակարգի ամբողջական անջատումը" }, food: { ru: "Автоматизированные фермы под контролем ИИ, доступ к ним закрыт", en: "Automated farms are under AI control, access is blocked", hy: "Ավտոմատացված ֆերմաները ԱԲ-ի վերահսկողության տակ են, մուտքը փակ է" }, extra: { ru: "Бункер держится в offline-режиме, чтобы не быть обнаруженным", en: "The bunker stays offline to avoid detection", hy: "Բունկերը մնում է օֆլայն ռեժիմում, որպեսզի չհայտնաբերվի" } },
  { title: { ru: "Смещение магнитных полюсов", en: "Magnetic pole shift", hy: "Մագնիսական բևեռների տեղաշարժ" }, description: { ru: "Резкое смещение магнитного поля Земли лишило планету защиты от космической радиации и разладило всю электронику.", en: "A sudden shift in Earth's magnetic field stripped the planet of protection from cosmic radiation and disrupted all electronics.", hy: "Երկրի մագնիսական դաշտի կտրուկ տեղաշարժը մոլորակին զրկել է տիեզերական ճառագայթումից պաշտպանվածությունից և խաթարել ողջ էլեկտրոնիկան։" }, duration: { ru: "около 7 лет — пока поле не стабилизируется", en: "about 7 years — until the field stabilizes", hy: "մոտ 7 տարի, մինչև դաշտի կայունացումը" }, food: { ru: "Запасов на 3 года, дальше нужна гидропоника", en: "Supplies for 3 years, hydroponics needed after that", hy: "Պաշարներ 3 տարվա համար, հետո անհրաժեշտ է հիդրոպոնիկա" }, extra: { ru: "Уровень фонового излучения на поверхности периодически подскакивает", en: "Background radiation on the surface spikes periodically", hy: "Մակերևույթի ֆոնային ճառագայթման մակարդակը պարբերաբար բարձրանում է" } },
  { title: { ru: "Мегапожары, охватившие материки", en: "Continent-spanning megafires", hy: "Ցամաքամասեր ընդգրկող մեգահրդեհներ" }, description: { ru: "Аномальная жара и засуха вызвали лесные пожары, слившиеся в один непрерывный фронт огня на нескольких континентах.", en: "Abnormal heat and drought sparked wildfires that merged into a single continuous wall of fire across several continents.", hy: "Անոմալ շոգն ու երաշտը հրդեհներ են առաջացրել, որոնք միաձուլվել են մեկ շարունակական կրակի ճակատի մեջ մի քանի ցամաքամասերում։" }, duration: { ru: "около 4 лет — пока не выгорит доступный для горения лес", en: "about 4 years — until all available forest has burned", hy: "մոտ 4 տարի, մինչև հասանելի անտառի ամբողջական այրումը" }, food: { ru: "Запасов на 3 года, дым и зола ещё долго будут отравлять воздух снаружи", en: "Supplies for 3 years, smoke and ash will keep poisoning the air outside for a long time", hy: "Պաշարներ 3 տարվա համար, ծուխն ու մոխիրը երկար ժամանակ կթունավորեն դրսի օդը" }, extra: { ru: "Система фильтрации забивается сажей быстрее обычного", en: "The filtration system clogs with soot faster than usual", hy: "Զտման համակարգը սովորականից ավելի արագ խցանվում է մուրով" } },
  { title: { ru: "Глобальная кибератака парализовала инфраструктуру", en: "Global cyberattack cripples infrastructure", hy: "Համաշխարհային կիբերհարձակումը կաթվածահար է արել ենթակառուցվածքը" }, description: { ru: "Скоординированная атака вывела из строя энергосети, банки и системы снабжения по всему миру одновременно.", en: "A coordinated attack knocked out power grids, banks, and supply systems worldwide at the same time.", hy: "Համակարգված հարձակումն ամբողջ աշխարհում միաժամանակ անգործունակ է դարձրել էներգացանցերը, բանկերն ու մատակարարման համակարգերը։" }, duration: { ru: "неизвестно — пока не восстановят критическую инфраструктуру вручную", en: "unknown — until critical infrastructure is manually restored", hy: "անհայտ է, մինչև կրիտիկական ենթակառուցվածքի ձեռքով վերականգնումը" }, food: { ru: "Запасов на 3 года, автоматизированные склады с едой недоступны без сети", en: "Supplies for 3 years, automated food warehouses are inaccessible without the network", hy: "Պաշարներ 3 տարվա համար, ավտոմատացված պահեստները հասանելի չեն առանց ցանցի" }, extra: { ru: "Связь с внешним миром возможна только через старое аналоговое радио", en: "Contact with the outside world is only possible through old analog radio", hy: "Կապն արտաքին աշխարհի հետ հնարավոր է միայն հին անալոգային ռադիոյով" } },
  { title: { ru: "Вспышка близкой сверхновой", en: "Nearby supernova flare", hy: "Մոտակա գերնոր աստղի բռնկում" }, description: { ru: "Взрыв звезды в соседней системе окатил Землю мощным потоком радиации, сделав поверхность опасной на годы.", en: "A star exploding in a neighboring system doused Earth in a powerful burst of radiation, making the surface dangerous for years.", hy: "Հարևան համակարգում աստղի պայթյունը Երկիրը լցրել է ճառագայթման հզոր հոսքով՝ մակերևույթը դարձնելով վտանգավոր տարիներով։" }, duration: { ru: "около 6 лет — пока радиационный фон не спадёт", en: "about 6 years — until radiation levels drop", hy: "մոտ 6 տարի, մինչև ճառագայթային ֆոնի իջնելը" }, food: { ru: "Запасов хватит на 3 года при экономном расходе", en: "Supplies will last 3 years with careful rationing", hy: "Պաշարները կբավականացնեն 3 տարի՝ խնայողաբար ծախսելիս" }, extra: { ru: "Часть электроники бункера вышла из строя от электромагнитного всплеска", en: "Some of the bunker's electronics were knocked out by the electromagnetic surge", hy: "Բունկերի էլեկտրոնիկայի մի մասն անգործունակ է դարձել էլեկտրամագնիսական պոռթկումից" } },
  { title: { ru: "Мегаземлетрясение по разлому литосферных плит", en: "Megaquake along a tectonic fault", hy: "Մեգաերկրաշարժ լիթոսֆերային սալերի ճեղքվածքով" }, description: { ru: "Цепь катастрофических землетрясений разрушила крупнейшие города, стоящие на активных разломах.", en: "A chain of catastrophic earthquakes destroyed major cities built on active fault lines.", hy: "Աղետալի երկրաշարժերի շղթան ավերել է ակտիվ ճեղքվածքների վրա գտնվող խոշոր քաղաքները։" }, duration: { ru: "около 2 лет — пока не завершатся афтершоки и не начнётся восстановление", en: "about 2 years — until aftershocks stop and rebuilding begins", hy: "մոտ 2 տարի, մինչև հետցնցումների ավարտը և վերականգնման սկիզբը" }, food: { ru: "Запасов на 3 года, наземные склады погребены под завалами", en: "Supplies for 3 years, surface warehouses are buried under rubble", hy: "Պաշարներ 3 տարվա համար, մակերևութային պահեստները թաղված են փլատակների տակ" }, extra: { ru: "После каждого крупного толчка приходится проверять бункер на трещины", en: "After every major tremor the bunker has to be checked for cracks", hy: "Յուրաքանչյուր խոշոր ցնցումից հետո բունկերը պետք է ստուգել ճաքերի համար" } },
  { title: { ru: "Разрушение озонового слоя", en: "Ozone layer destruction", hy: "Օզոնային շերտի քայքայում" }, description: { ru: "Из-за выброса промышленных веществ в атмосфере образовалась гигантская озоновая дыра — ультрафиолет на поверхности стал смертельным.", en: "Industrial emissions opened a giant hole in the ozone layer — ultraviolet radiation on the surface turned lethal.", hy: "Արդյունաբերական նյութերի արտանետման հետևանքով մթնոլորտում գոյացել է հսկա օզոնային փոս․ մակերևույթի ուլտրամանուշակագույն ճառագայթումը մահացու է դարձել։" }, duration: { ru: "не менее 10 лет — пока слой не восстановится естественным путём", en: "at least 10 years — until the layer naturally regenerates", hy: "առնվազն 10 տարի, մինչև շերտի բնական վերականգնումը" }, food: { ru: "Запасов на 4 года, выход на поверхность возможен только ночью и ненадолго", en: "Supplies for 4 years, surface trips are only possible briefly at night", hy: "Պաշարներ 4 տարվա համար, մակերևույթ ելքը հնարավոր է միայն գիշերը և կարճատև" }, extra: { ru: "Любая вылазка требует полной защиты кожи и глаз", en: "Any excursion requires full skin and eye protection", hy: "Ցանկացած ելք պահանջում է մաշկի և աչքերի ամբողջական պաշտպանություն" } },
  { title: { ru: "Портал в другое измерение выпустил враждебных существ", en: "A portal to another dimension released hostile creatures", hy: "Այլ չափման դեպի պորտալը բաց է թողել թշնամական արարածներ" }, description: { ru: "Секретный эксперимент по перемещению материи открыл разрыв в реальности — из него на поверхность вышли неизвестные агрессивные существа.", en: "A secret matter-transfer experiment tore open reality — unknown aggressive creatures emerged onto the surface through it.", hy: "Նյութի տեղափոխման գաղտնի փորձը բացել է ճեղքվածք իրականության մեջ, որտեղից մակերևույթ են դուրս եկել անհայտ ագրեսիվ արարածներ։" }, duration: { ru: "неизвестно — пока военные не найдут способ закрыть портал", en: "unknown — until the military finds a way to close the portal", hy: "անհայտ է, մինչև զինվորականները պորտալը փակելու միջոց գտնեն" }, food: { ru: "Запасов на 3 года при разумном расходе", en: "Supplies for 3 years with sensible rationing", hy: "Պաշարներ 3 տարվա համար՝ խելամիտ ծախսով" }, extra: { ru: "Датчики движения у входа в бункер срабатывают чаще, чем хотелось бы", en: "The motion sensors at the bunker entrance trigger more often than anyone would like", hy: "Բունկերի մուտքի շարժման սենսորները միանում են ավելի հաճախ, քան կցանկանայինք" } },

function bunkerPick(list) {
  return list[Math.floor(Math.random() * list.length)];
}
function bunkerPickIndex(list) {
  return Math.floor(Math.random() * list.length);
}
function makeBunkerDossier() {
  const dossier = {};
  BUNKER_TRAIT_DEFS.forEach((t) => {
    dossier[t.key] = { valueIndex: bunkerPickIndex(t.list.ru), revealed: false };
  });
  return dossier;
}

// Small banner shown while we're trying to silently recover a dropped
// connection, so players aren't left staring at a frozen screen with no
// explanation.
function ConnStatusBanner({ status }) {
  const t = useT();
  if (status !== "reconnecting" && status !== "offline") return null;
  const isOffline = status === "offline";
  return (
    <div
      className="mx-5 mb-2 px-3 py-1.5 rounded-xl text-xs font-medium text-center shrink-0"
      style={{
        background: isOffline ? "rgba(220,80,60,.14)" : "var(--surface-2)",
        color: isOffline ? "var(--danger)" : "var(--text-dim)",
      }}
    >
      {isOffline ? t("conn.offline") : t("conn.reconnecting")}
    </div>
  );
}

function BunkerLobby({ room, roomCode, playerId, dispatch, onStart, error, busy, connStatus }) {

      navigator.clipboard.writeText(roomCode);

  function shareLink() {
    shareRoomInvite(roomCode, "bunker", t("bunker.title"), () => {

function BunkerVotingCard({ room, players, orderedIds, playerId, isHost, onOpenVoting, onCastVote, onCloseVoting }) {
  const t = useT();
  const [excludeCount, setExcludeCount] = useState(1);
  const alive = orderedIds.filter((pid) => !players[pid].exiled);
  const voting = room.voting;

  if (!voting) {
    const history = room.votingHistory || [];
    const maxExclude = Math.max(1, alive.length - 1);
    return (
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4">
        <div className="flex items-center gap-2 mb-3 text-[var(--bunker)]">
          <IconVote size={18} />
          <span className="text-xs uppercase tracking-[0.25em]">{t("bunker.voting")}</span>
        </div>
        {isHost ? (
          <>
            <div className="flex items-center justify-between mb-3">
              <span className="text-sm text-[var(--text-dim)]">{t("bunker.excludeThisRound")}</span>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setExcludeCount((v) => Math.max(1, v - 1))}
                  className="w-8 h-8 rounded-full bg-[var(--surface-2)] flex items-center justify-center active:scale-95"
                  aria-label={t("common.less")}
                >
                  <IconMinus size={14} />
                </button>
                <span className="font-display text-xl w-6 text-center">{Math.min(excludeCount, maxExclude)}</span>
                <button
                  onClick={() => setExcludeCount((v) => Math.min(maxExclude, v + 1))}
                  className="w-8 h-8 rounded-full bg-[var(--surface-2)] flex items-center justify-center active:scale-95"
                  aria-label={t("common.more")}
                >
                  <IconPlus size={14} />
                </button>
              </div>
            </div>
            <button
              onClick={() => onOpenVoting(Math.min(excludeCount, maxExclude))}
              disabled={alive.length < 2}
              className="w-full bg-[var(--bunker)] text-[var(--bunker-ink)] font-display text-lg tracking-wide py-3 rounded-2xl disabled:opacity-30 active:scale-[0.98] transition-transform"
            >
              {t("bunker.startRound").replace("{n}", (room.votingRoundCounter || 0) + 1)}
            </button>
          </>
        ) : (
          <p className="text-sm text-[var(--text-faint)]">{t("bunker.waitHostOpen")}</p>
        )}
        {history.length > 0 && (
          <div className="flex flex-col gap-2 mt-4 pt-4 border-t border-[var(--border)]">
            <span className="text-[10px] uppercase tracking-[0.2em] text-[var(--text-faint)]">{t("bunker.roundHistory")}</span>
            {history.map((h, i) => (
              <div key={i} className="text-xs text-[var(--text-dim)]">
                {t("bunker.roundLabel").replace("{n}", h.round)}{" "}
                {h.exiled.length > 0
                  ? t("bunker.exiledPlural").replace("{names}", h.exiled.map((pid) => (players[pid] ? players[pid].name : "?")).join(", "))
                  : t("bunker.noOneVoted")}
                {h.tie && t("bunker.tieNote")}
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  const meExiled = players[playerId] && players[playerId].exiled;
  const myVote = voting.votes[playerId];
  const votedCount = Object.keys(voting.votes).length;
  const targets = alive.filter((pid) => pid !== playerId);

  return (
    <div className="bg-[var(--surface)] border border-[var(--bunker)]/30 rounded-2xl p-4">
      <div className="flex items-center justify-between mb-3 gap-2">
        <div className="flex items-center gap-2 text-[var(--bunker)] min-w-0">
          <IconVote size={18} className="shrink-0" />
          <span className="text-xs uppercase tracking-[0.25em] truncate">
            {t("bunker.roundExclude").replace("{round}", voting.round).replace("{count}", voting.excludeCount)}
          </span>
        </div>
        <span className="text-xs text-[var(--text-faint)] shrink-0">
          {votedCount}/{alive.length}
        </span>
      </div>
      {meExiled ? (
        <p className="text-sm text-[var(--text-faint)] mb-3">{t("bunker.exiledObserveOnly")}</p>
      ) : (
        <div className="flex flex-col gap-2 mb-3">
          {targets.map((pid) => (
            <button
              key={pid}
              onClick={() => onCastVote(pid)}
              className={
                "w-full flex items-center justify-between px-4 py-3 rounded-xl border text-left transition-colors " +
                (myVote === pid ? "border-[var(--bunker)] bg-[var(--bunker)]/10" : "border-[var(--border)] bg-[var(--surface-2)]")
              }
            >
              <span className="text-sm font-medium">{players[pid].name}</span>
              {myVote === pid && <IconCheck size={16} className="text-[var(--bunker)]" />}
            </button>
          ))}
        </div>
      )}
      {isHost && (
        <button
          onClick={onCloseVoting}
          className="w-full bg-[var(--bunker)] text-[var(--bunker-ink)] font-display text-lg tracking-wide py-3 rounded-2xl active:scale-[0.98] transition-transform"
        >
          {t("bunker.endVoting")}
        </button>
      )}
    </div>
  );
}

function BunkerApp({ dispatch }) {
  const t = useT();

  // Host-only resolvers for what guests can *request* — see useGameRoom's
  // doc comment. Everything else (connect/reconnect/session persistence/
  // create/join) is the shared plumbing.
  const hostEvents = {
    join: (current, payload) => {
      if (!payload || !payload.playerId) return;
      const players = { ...current.players };
      const existing = players[payload.playerId];
      players[payload.playerId] = {
        name: (existing && existing.name) || (payload.name || t("common.player")).trim().slice(0, 20) || t("common.player"),
        isHost: payload.playerId === current.hostId,
        joinedAt: existing ? existing.joinedAt : Date.now(),
        exiled: existing ? existing.exiled : false,
        dossier: existing ? existing.dossier : current.status === "playing" ? makeBunkerDossier() : null,
      };
      return { ...current, players };
    },
    reveal: (current, payload) => {
      if (!payload || !current.players[payload.playerId]) return;
      const target = current.players[payload.playerId];
      if (!target.dossier || !target.dossier[payload.traitKey]) return;
      const players = {
        ...current.players,
        [payload.playerId]: {
          ...target,
          dossier: { ...target.dossier, [payload.traitKey]: { ...target.dossier[payload.traitKey], revealed: true } },
        },
      };
      return { ...current, players };
    },
    vote: (current, payload) => {
      if (!payload || !current.voting) return;
      const voter = current.players[payload.playerId];
      const target = current.players[payload.targetId];
      if (!voter || voter.exiled) return;
      if (!target || target.exiled) return;
      if (payload.targetId === payload.playerId) return;
      const voting = { ...current.voting, votes: { ...current.voting.votes, [payload.playerId]: payload.targetId } };
      return { ...current, voting };
    },
  };

  const {
    roomCode, room, error, busy, connStatus, playerId, inviteCode,
    roomRef, handleCreate, handleJoin, broadcastState, sendEvent,
  } = useGameRoom({
    gameKey: "bunker",
    genPlayerId: () => genRoomPlayerId("p"),
    genRoomCode: genRoomCode4,
    buildInitialRoom: (playerId, name) => ({
      status: "lobby",
      hostId: playerId,
      catastropheIndex: null,
      players: {
        [playerId]: { name: name.trim().slice(0, 20) || t("bunker.host"), isHost: true, joinedAt: Date.now(), exiled: false, dossier: null },
      },
    }),
    hostEvents,
    messages: {
      enterCode4: t("bunker.enterCode4"),
      enterNameError: t("bunker.enterNameError"),
      connectFailed: t("bunker.connectFailed"),
      notFound: t("bunker.roomNotFound"),
      defaultName: t("common.player"),
    },
  });

  // Counts toward the persistent "Бункер — сыграно партий" leaderboard --
  // see useRecordGamePlayedOnStart()'s doc comment above. Every device in
  // the room (host and guests alike) independently notices its own
  // room.status flip to "playing" via the realtime broadcast, so each
  // participant is counted once, not just the host.
  useRecordGamePlayedOnStart(room && room.status, "bunker");

  function handleStart() {
    const current = roomRef.current;
    if (!current || !current.players) return;
    const catastropheIndex = bunkerPickIndex(BUNKER_CATASTROPHES);
    const playerIds = Object.keys(current.players);
    // The bunker never fits everyone — only about half the group gets a
    // spot, which is exactly what forces the debate over who stays.
    const capacity = Math.max(1, Math.ceil(playerIds.length / 2));
    const players = {};
    playerIds.forEach((pid) => {
      players[pid] = { ...current.players[pid], dossier: makeBunkerDossier() };
    });
    broadcastState({ ...current, status: "playing", catastropheIndex, capacity, players });
  }

  function handleReveal(traitKey) {
    sendEvent("reveal", { playerId, traitKey });
  }

  function handleExile(targetId) {
    const current = roomRef.current;
    if (!current || !current.players[targetId]) return;
    const players = { ...current.players, [targetId]: { ...current.players[targetId], exiled: true } };
    broadcastState({ ...current, players });
  }

  // Host-only: opens a new voting round. Every other client just casts
  // ballots via handleCastVote, which is a broadcast request the host
  // resolves in the "vote" handler above, same pattern as join/reveal.
  function handleOpenVoting(excludeCount) {
    const current = roomRef.current;
    if (!current || current.voting) return;
    const round = (current.votingRoundCounter || 0) + 1;
    const voting = { round, excludeCount, votes: {}, openedAt: Date.now() };
    broadcastState({ ...current, voting, votingRoundCounter: round });
  }

  function handleCastVote(targetId) {
    sendEvent("vote", { playerId, targetId });
  }

  // Host-only: tallies the open round's ballots and exiles whoever is at
  // or above the vote count of the excludeCount-th place. A tie right at
  // that cutoff exiles everyone tied there rather than picking arbitrarily.
  function handleCloseVoting() {
    const current = roomRef.current;
    if (!current || !current.voting) return;
    const { round, excludeCount, votes } = current.voting;
    const tally = {};
    Object.values(votes).forEach((targetId) => {
      tally[targetId] = (tally[targetId] || 0) + 1;
    });
    const ranked = Object.keys(tally)
      .filter((pid) => current.players[pid] && !current.players[pid].exiled)
      .sort((a, b) => tally[b] - tally[a]);
    let exiled = [];
    if (ranked.length > 0) {
      const cutoffCount = Math.min(excludeCount, ranked.length);
      const cutoffVotes = tally[ranked[cutoffCount - 1]];
      exiled = ranked.filter((pid) => tally[pid] >= cutoffVotes);
    }
    const players = { ...current.players };
    exiled.forEach((pid) => {
      players[pid] = { ...players[pid], exiled: true };
    });
    const votingHistory = [
      ...(current.votingHistory || []),
      { round, excludeCount, tally, exiled, tie: exiled.length > excludeCount },
    ];
    broadcastState({ ...current, players, voting: null, votingHistory });
  }

  if (!roomCode || !room) {
    if (connStatus === "reconnecting") {
      return (
        <div className="h-full min-h-0 flex flex-col">
          <TopBar onBack={() => dispatch({ type: "GO_HUB" })} title={t("bunker.title")} right={<IconRadioactive size={18} className="text-[var(--bunker)]" />} />
          <div className="flex-1 flex items-center justify-center px-8">
            <p className="text-sm text-[var(--text-dim)] text-center">{t("conn.reconnecting")}</p>
          </div>
        </div>
      );
    }
    return <BunkerMenu dispatch={dispatch} onCreate={handleCreate} onJoin={handleJoin} busy={busy} error={error} initialCode={inviteCode} />;
  }
  if (room.status === "playing") {
    return (
      <BunkerGame
        room={room}
        roomCode={roomCode}
        playerId={playerId}
        dispatch={dispatch}
        onReveal={handleReveal}
        onExile={handleExile}
        onOpenVoting={handleOpenVoting}
        onCastVote={handleCastVote}
        onCloseVoting={handleCloseVoting}
        connStatus={connStatus}
      />
    );
  }
  return (
    <BunkerLobby
      room={room}
      roomCode={roomCode}
      playerId={playerId}
      dispatch={dispatch}
      onStart={handleStart}
      error={error}
      busy={busy}
      connStatus={connStatus}
    />
  );
}

// Generic collapsible "regulations" card — tap to expand a short numbered
// list of rules. One instance per game gives a new player something to
// check in-app instead of having to know the rules beforehand or ask
// someone who already does.
function RulesCard({ title, color, rules }) {
  const [open, setOpen] = useState(false);
  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl overflow-hidden">
      <button onClick={() => setOpen((v) => !v)} className="w-full flex items-center justify-between gap-2 px-4 py-3.5 text-left">
        <span className="flex items-center gap-2 text-sm font-semibold">
          <IconClipboard size={16} style={{ color }} /> {title}
        </span>
        {open ? <IconChevronUp size={16} className="text-[var(--text-faint)]" /> : <IconChevronDown size={16} className="text-[var(--text-faint)]" />}
      </button>
      {open && (
        <div className="px-4 pb-4 flex flex-col gap-2">
          {rules.map((rule, i) => (
            <div key={i} className="flex items-start gap-2 text-sm text-[var(--text-dim)]">
              <span className="font-display shrink-0" style={{ color }}>{i + 1}.</span>
              <span>{rule}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Full-screen version of the same rules list, opened from the "?" button in
// TopBar's top-right corner — unlike RulesCard (an inline accordion that
// only lives on the setup/lobby screen), this is reachable from every
// screen of a game, including mid-round, so a player who forgot a detail
// doesn't have to quit and go back to the lobby to re-read the rules.
// Portal-based for the same reason as every other "fixed inset-0" overlay
// in this file — see the comment on ModalPortal.
function RulesSheet({ open, onClose, title, color, rules }) {
  const t = useT();
  const sheetRef = useRef(null);
  useModalA11y(sheetRef, onClose, open);
  if (!open) return null;
  return (
    <ModalPortal>
      <div className="modal-overlay fixed inset-0 z-50 flex items-end justify-center" onClick={onClose}>
        <div className="fixed inset-0 bg-black/60" />
        <FadeIn className="relative w-full sheet-w">
          <div
            ref={sheetRef}
            role="dialog"
            aria-modal="true"
            tabIndex={-1}
            className="bg-[var(--surface)] border-t border-[var(--border-strong)] rounded-t-3xl px-5 pt-3 pb-8 w-full max-h-[80vh] overflow-y-auto"
            onClick={(e) => e.stopPropagation()}
            style={{ paddingBottom: "calc(2rem + env(safe-area-inset-bottom, 0px))" }}
          >
            <div className="w-10 h-1.5 rounded-full bg-[var(--surface-3)] mx-auto mb-4 shrink-0" />
            <div className="flex items-center justify-between gap-3 mb-4">
              <h2 className="font-display text-2xl flex items-center gap-2" style={{ color }}>
                <IconClipboard size={20} /> {title}
              </h2>
              <button
                onClick={onClose}
                className="w-9 h-9 rounded-full flex items-center justify-center text-[var(--text-dim)] active:bg-[var(--surface-2)] shrink-0"
                aria-label={t("common.close")}
              >
                <IconX size={20} />
              </button>
            </div>
            <div className="flex flex-col gap-3">
              {rules.map((rule, i) => (
                <div key={i} className="flex items-start gap-2 text-sm text-[var(--text-dim)]">
                  <span className="font-display shrink-0" style={{ color }}>{i + 1}.</span>
                  <span>{rule}</span>
                </div>
              ))}
            </div>
          </div>
        </FadeIn>
      </div>
    </ModalPortal>
  );
}

const pickRandom = bunkerPick;
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

// Shared by both the first case (handleStart) and every later one
// (handleNewCase) so role assignment and evidence dealing never drift
// between the two call sites.
function assignCourtRound(players, hostId) {
  const allIds = Object.keys(players);
  const guestIds = shuffleArray(allIds.filter((pid) => pid !== hostId));
  const roleForId = {};
  roleForId[hostId] = "judge";
  if (guestIds[0]) roleForId[guestIds[0]] = "guilty";
  if (guestIds[1]) roleForId[guestIds[1]] = "victim";
  if (guestIds[2]) roleForId[guestIds[2]] = "secretary";
  guestIds.slice(3).forEach((pid) => {
    roleForId[pid] = "juror";
  });

  const courtCaseIndex = Math.floor(Math.random() * COURT_CASES.length);
  const nextPlayers = {};
  allIds.forEach((pid) => {
    const role = roleForId[pid];
    const pool = COURT_EVIDENCE_BY_ROLE[role] || COURT_EVIDENCE_JUROR;
    const textIndex = Math.floor(Math.random() * pool.ru.length);
    nextPlayers[pid] = { ...players[pid], role, evidence: { textIndex, revealed: false }, vote: null };
  });
  return { courtCaseIndex, players: nextPlayers };
}
