}

/* ---------------------------------------------------------------- */
/* Mafia: "last word" for whoever was just eliminated                */
/* ---------------------------------------------------------------- */
function MafiaLastWord({ state }) {
  const { config, mafia } = state;
  const index = mafia.lastWordQueue[0];
  const name = index !== undefined && index !== null ? config.mafiaNames[index] : null;
  const isNight = mafia.phase === "night-lastword";

  return (
    <div className="flex-1 flex flex-col items-center justify-center text-center pb-4">
      <div className="w-16 h-16 rounded-full bg-[var(--surface-2)] flex items-center justify-center mb-6 text-[var(--danger)]">
        <IconMessageCircle size={28} />
      </div>
      <p className="text-xs uppercase tracking-[0.3em] text-[var(--text-faint)] mb-2">Последнее слово</p>
      <h2 className="font-display text-4xl leading-tight mb-4">{name}</h2>
      <p className="text-sm text-[var(--text-dim)] max-w-[28ch]">
        {isNight
          ? "Дайте игроку сказать пару слов перед тем, как объявите его роль."
          : "Дайте изгнанному игроку сказать последнее слово перед тем, как объявите его роль."}
      </p>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Mafia: day phase                                                   */
/* ---------------------------------------------------------------- */
function MafiaDay({ state, dispatch }) {
  const { config, mafia } = state;
  const total = config.mafiaDiscussionMinutes * 60;
  const { remaining, running } = mafia.dayTimer;
  const pct = total > 0 ? ((total - remaining) / total) * 100 : 0;
  const urgent = remaining > 0 && remaining <= 10;

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => dispatch({ type: "MAFIA_DAY_TICK" }), 1000);
    return () => clearInterval(id);
  }, [running, dispatch]);

  if (mafia.exileOpen) {
    const targets = mafia.alive.map((alive, i) => ({ i, alive })).filter((x) => x.alive);
    return (
      <div className="flex flex-col pb-4">
        <MafiaPhaseHeader Icon={IconVote} color="var(--accent-strong)" bg="rgba(232,181,69,.14)" title="Дневная казнь" subtitle="Кого решили изгнать игроки?" />
        <button
          onClick={() => dispatch({ type: "MAFIA_EXILE", index: null })}
          className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-[var(--text-dim)] font-display text-lg tracking-wide py-3.5 rounded-2xl active:scale-[0.98] transition-transform mb-3"
        >
          Никого не изгонять
        </button>
        <div className="flex flex-col gap-2">
          {targets.map(({ i }) => (
            <MafiaPlayerButton key={i} name={config.mafiaNames[i]} index={i} danger onClick={(idx) => dispatch({ type: "MAFIA_EXILE", index: idx })} />
          ))}
        </div>
      </div>
    );
  }

  return (
    <div className="flex-1 flex flex-col items-center justify-center px-1 text-center pb-4">
      <p className="text-xs uppercase tracking-[0.3em] text-[var(--text-faint)] mb-6">Обсуждение</p>
      <div
        className="rounded-full p-2 mb-8"
        style={{ background: `conic-gradient(var(--accent) ${pct * 3.6}deg, var(--surface-2) 0deg)`, transition: "background 0.4s linear" }}
      >
        <div className="w-48 h-48 rounded-full bg-[var(--bg)] flex flex-col items-center justify-center border border-[var(--border)]">
          <span className={"font-mono text-5xl font-semibold tabular-nums " + (urgent ? "pulse" : "")} style={{ color: urgent ? "var(--danger)" : "var(--text)" }}>
            {fmtTime(remaining)}
          </span>
          <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mt-2">осталось</span>
        </div>
      </div>
      <button
        onClick={() => dispatch({ type: "MAFIA_TOGGLE_DAY_TIMER" })}
        className="w-16 h-16 rounded-full bg-[var(--surface)] border border-[var(--border-strong)] flex items-center justify-center active:scale-95 transition-transform"
        aria-label={running ? "Пауза" : "Продолжить"}
      >
        {running ? <IconPause size={26} /> : <IconPlay size={26} />}
      </button>
      <p className="text-xs text-[var(--text-faint)] mt-4 max-w-[26ch] text-center">
        Обсудите, кто ведёт себя подозрительно, а затем объявите голосование
      </p>
    </div>
  );
}

function MafiaDayResult({ state }) {
  const { config, mafia } = state;
  const exiledName = mafia.exiledIndex !== null ? config.mafiaNames[mafia.exiledIndex] : null;
  const exiledRole = mafia.exiledIndex !== null ? MAFIA_ROLES[mafia.roles[mafia.exiledIndex]] : null;

  return (
    <div className="flex flex-col items-center text-center pt-2 pb-4">
      <div className="w-16 h-16 rounded-full bg-[var(--surface-2)] flex items-center justify-center mb-6 text-[var(--accent-strong)]">
        <IconVote size={28} />
      </div>
      <p className="text-xs uppercase tracking-[0.3em] text-[var(--text-faint)] mb-2">Итог голосования</p>
      {exiledName ? (
        <>
          <h2 className="font-display text-4xl leading-tight mb-4">
            Изгнан(а) <span style={{ color: "var(--accent-strong)" }}>{exiledName}</span>
          </h2>
          <div className="flex items-center gap-2 bg-[var(--surface)] border border-[var(--border)] rounded-2xl px-4 py-3" style={{ color: exiledRole.color }}>
            <exiledRole.Icon size={18} />
            <span className="font-medium">{exiledRole.name}</span>
          </div>
        </>
      ) : (
        <h2 className="font-display text-4xl leading-tight">Игроки решили никого не изгонять</h2>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Mafia: history panel for the host — nights, checks and votes      */
/* ---------------------------------------------------------------- */
function MafiaHistoryEntry({ state, entry }) {
  const { config } = state;
  const nameOf = (i) => (i !== null && i !== undefined ? config.mafiaNames[i] : null);

  if (entry.type === "exile") {
    const name = nameOf(entry.index);
    return (
      <div className="rounded-2xl bg-[var(--surface)] border border-[var(--border)] px-4 py-3">
        <div className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-1">День {entry.night}</div>
        <div className="text-sm">{name ? <>Изгнан(а) <span className="font-medium" style={{ color: "var(--accent-strong)" }}>{name}</span></> : "Никого не изгнали"}</div>
      </div>
    );
  }

  const lines = [];
  if (entry.putanaTarget !== null && entry.putanaTarget !== undefined) lines.push(`Путана заблокировала: ${nameOf(entry.putanaTarget)}`);
  lines.push(`Мафия выбрала: ${entry.mafiaTarget !== null && entry.mafiaTarget !== undefined ? nameOf(entry.mafiaTarget) : "никого"}`);
  if (entry.donResult) {
    lines.push(`Дон проверил ${nameOf(entry.donResult.index)}: ${entry.donResult.blocked ? "проверка заблокирована" : entry.donResult.isSheriff ? "это шериф" : "не шериф"}`);
  }
  if (entry.maniacTarget !== null && entry.maniacTarget !== undefined) lines.push(`Маньяк выбрал: ${nameOf(entry.maniacTarget)}`);
  if (entry.doctorTarget !== null && entry.doctorTarget !== undefined) lines.push(`Доктор лечил: ${nameOf(entry.doctorTarget)}`);
  if (entry.sheriffResult) {
    lines.push(`Шериф проверил ${nameOf(entry.sheriffResult.index)}: ${entry.sheriffResult.blocked ? "проверка заблокирована" : entry.sheriffResult.isMafia ? "это мафия" : "мирный"}`);
  }
  lines.push(
    entry.victims.length > 0
      ? `Погибли: ${entry.victims.map(nameOf).join(", ")}`
      : entry.saved
      ? "Никто не погиб — доктор спас жертву"
      : "Никто не погиб"
  );

  return (
    <div className="rounded-2xl bg-[var(--surface)] border border-[var(--border)] px-4 py-3">
      <div className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-1">Ночь {entry.night}</div>
      <div className="flex flex-col gap-1 text-sm">
        {lines.map((l, i) => (
          <span key={i}>{l}</span>
        ))}
      </div>
    </div>
  );
}

function MafiaHistory({ state }) {
  const log = state.mafia.log;
  return (
    <div className="flex-1 min-h-0 overflow-y-auto no-scrollbar px-5 pb-8">
      {log.length === 0 ? (
        <p className="text-sm text-[var(--text-faint)] text-center mt-8">Пока нет событий — начните первую ночь.</p>
      ) : (
        <div className="flex flex-col gap-2 mt-2">
          {log.map((entry, i) => (
            <MafiaHistoryEntry key={i} state={state} entry={entry} />
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Mafia: host dashboard shell                                        */
/* ---------------------------------------------------------------- */
function MafiaGame({ state, dispatch }) {
  const { mafia } = state;

  useWakeLock(true);

  if (mafia.rosterOpen) {
    return (
      <div className="h-full min-h-0 flex flex-col">
        <div className="flex items-center justify-between px-5 pt-4 shrink-0">
          <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)]">Список игроков</span>
          <button
            onClick={() => dispatch({ type: "MAFIA_TOGGLE_ROSTER" })}
            className="w-9 h-9 flex items-center justify-center rounded-full text-[var(--text-dim)] active:bg-[var(--surface-2)]"
            aria-label="Закрыть"
          >
            <IconX size={20} />
          </button>
        </div>
        <div className="flex-1 min-h-0 overflow-y-auto no-scrollbar px-5 pb-8">
          <div className="bg-[var(--surface)] border border-[var(--border)] rounded-3xl px-4 py-2 mt-2">
            <MafiaRosterList state={state} />
          </div>
        </div>
      </div>
    );
  }

  if (mafia.historyOpen) {
    return (
      <div className="h-full min-h-0 flex flex-col">
        <div className="flex items-center justify-between px-5 pt-4 shrink-0">
          <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)]">История игры</span>
          <button
            onClick={() => dispatch({ type: "MAFIA_TOGGLE_HISTORY" })}
            className="w-9 h-9 flex items-center justify-center rounded-full text-[var(--text-dim)] active:bg-[var(--surface-2)]"
            aria-label="Закрыть"
          >
            <IconX size={20} />
          </button>
        </div>
        <MafiaHistory state={state} />
      </div>
    );
  }

  let body = null;
  let footer = null;

  if (mafia.phase === "night-putana") {
    body = <MafiaNightPutana state={state} dispatch={dispatch} />;
  } else if (mafia.phase === "night-mafia") {
    body = <MafiaNightMafia state={state} dispatch={dispatch} />;
  } else if (mafia.phase === "night-don") {
    body = <MafiaNightDon state={state} dispatch={dispatch} />;
    if (mafia.donResult) {
      footer = (
        <button
          onClick={() => dispatch({ type: "MAFIA_DON_DONE" })}
          className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconPlay size={20} /> Продолжить
        </button>
      );
    }
  } else if (mafia.phase === "night-maniac") {
    body = <MafiaNightManiac state={state} dispatch={dispatch} />;
  } else if (mafia.phase === "night-doctor") {
    body = <MafiaNightDoctor state={state} dispatch={dispatch} />;
  } else if (mafia.phase === "night-lastword" || mafia.phase === "day-lastword") {
    body = <MafiaLastWord state={state} />;
    footer = (
      <button
        onClick={() => dispatch({ type: "MAFIA_LASTWORD_DONE" })}
        className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
      >
        <IconPlay size={20} />{" "}
        {mafia.lastWordQueue.length > 1 ? "Следующий" : mafia.phase === "day-lastword" ? "Открыть роль" : "Огласить итоги"}
      </button>
    );
  } else if (mafia.phase === "night-sheriff") {
    body = <MafiaNightSheriff state={state} dispatch={dispatch} />;
    if (mafia.sheriffResult) {
      footer = (
        <button
          onClick={() => dispatch({ type: "MAFIA_SHERIFF_DONE" })}
          className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconPlay size={20} /> Продолжить
        </button>
      );
    }
  } else if (mafia.phase === "night-result") {
    body = <MafiaNightResult state={state} />;
    footer = (
      <button
        onClick={() => dispatch({ type: "MAFIA_CONTINUE" })}
        className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
      >
        {mafia.winner ? (
          <>
            <IconTrophy size={20} /> Смотреть итоги игры
          </>
        ) : (
          <>
            <IconSun size={20} /> Перейти к дню
          </>
        )}
      </button>
    );
  } else if (mafia.phase === "day") {
    body = <MafiaDay state={state} dispatch={dispatch} />;
    if (mafia.exileOpen) {
      footer = (
        <button
          onClick={() => dispatch({ type: "MAFIA_CLOSE_EXILE" })}
          className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-[var(--text)] font-display text-xl tracking-wide py-4 rounded-2xl active:scale-[0.98] transition-transform"
        >
          Отмена
        </button>
      );
    } else {
      footer = (
        <button
          onClick={() => dispatch({ type: "MAFIA_OPEN_EXILE" })}
          className="w-full bg-[var(--danger)] text-white font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconVote size={20} /> Дневная казнь
        </button>
      );
    }
  } else if (mafia.phase === "day-result") {
    body = <MafiaDayResult state={state} />;
    footer = (
      <button
        onClick={() => dispatch({ type: "MAFIA_CONTINUE" })}
        className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
      >
        {mafia.winner ? (
          <>
            <IconTrophy size={20} /> Смотреть итоги игры
          </>
        ) : (
          <>
            <IconMoon size={20} /> Следующая ночь
          </>
        )}
      </button>
    );
  }

  return (
    <div className="h-full min-h-0 flex flex-col">
      <div className="flex items-center justify-between px-5 pt-4 shrink-0">
        <ConfirmButton
          label="Завершить"
          confirmLabel="Точно?"
          onConfirm={() => dispatch({ type: "GO_HUB" })}
          className="text-xs uppercase tracking-wider text-[var(--text-faint)] active:text-[var(--danger)] px-2 py-1"
        />
        <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)]">
          {mafia.phase === "day" || mafia.phase === "day-result" || mafia.phase === "day-lastword" ? `День ${mafia.night}` : `Ночь ${mafia.night}`}
        </span>
        <div className="flex items-center gap-1">
          <button
            onClick={() => dispatch({ type: "MAFIA_TOGGLE_HISTORY" })}
            className="w-9 h-9 flex items-center justify-center rounded-full text-[var(--text-dim)] active:bg-[var(--surface-2)]"
            aria-label="История игры"
          >
            <IconClipboard size={20} />
          </button>
          <button
            onClick={() => dispatch({ type: "MAFIA_TOGGLE_ROSTER" })}
            className="w-9 h-9 flex items-center justify-center rounded-full text-[var(--text-dim)] active:bg-[var(--surface-2)]"
            aria-label="Список игроков"
          >
            <IconList size={20} />
          </button>
        </div>
      </div>

      <div className="flex-1 min-h-0 overflow-y-auto no-scrollbar px-5 pt-2 flex flex-col">{body}</div>

      {footer && <div className="px-5 pb-8 pt-3 shrink-0">{footer}</div>}
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Mafia: end                                                         */
/* ---------------------------------------------------------------- */
function MafiaEnd({ state, dispatch }) {
  const { mafia, config } = state;

  // Tally wins/games for the session stats panel on the Hub — same
  // statsRecorded guard pattern as Spy (see SpyEnd), so a refresh landing
  // back on this end screen can't double-count.
  useEffect(() => {
    if (mafia.statsRecorded) return;
    recordMafiaGame(config.mafiaNames.slice(0, config.mafiaPlayerCount), mafia.roles, mafia.winner);
    dispatch({ type: "MAFIA_STATS_RECORDED" });
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const winnerStyle = {
    town: { color: "var(--local)", bg: "rgba(75,184,172,.14)", title: "ПОБЕДА МИРНЫХ", desc: "Город очистился от мафии." },
    mafia: { color: "var(--spy)", bg: "rgba(226,88,90,.14)", title: "ПОБЕДА МАФИИ", desc: "Мафия сравнялась по числу с мирными жителями и захватила город." },
    maniac: { color: "var(--maniac)", bg: "rgba(194,69,46,.14)", title: "ПОБЕДА МАНЬЯКА", desc: "Маньяк остался единственным живым игроком." },
  }[mafia.winner] || { color: "var(--local)", bg: "rgba(75,184,172,.14)", title: "ИГРА ОКОНЧЕНА", desc: "" };
  return (
    <div className="h-full flex flex-col px-6 pb-8" style={{ paddingTop: "3rem" }}>
      <div className="flex-1 min-h-0 flex flex-col items-center text-center overflow-y-auto no-scrollbar">
        <div
          className="w-16 h-16 rounded-full flex items-center justify-center mb-6 shrink-0"
          style={{ background: winnerStyle.bg, color: winnerStyle.color }}
        >
          <IconTrophy size={30} />
        </div>
        <h2 className="font-display text-5xl leading-none mb-3" style={{ color: winnerStyle.color }}>
          {winnerStyle.title}
        </h2>
        <p className="text-sm text-[var(--text-dim)] max-w-[30ch] mb-8">{winnerStyle.desc}</p>

        <div className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-3xl px-4 py-2 mb-4">
          <MafiaRosterList state={state} />
        </div>
      </div>

      <div className="flex flex-col gap-3 shrink-0 pt-4">
        <button
          onClick={() => dispatch({ type: "MAFIA_RESTART_SAME" })}
          className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconRefresh size={20} /> Играть ещё раз
        </button>
        <button
          onClick={() => dispatch({ type: "GO_HUB" })}
          className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-[var(--text)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconHome size={20} /> На главную
        </button>
      </div>
    </div>
  );
}

function bunkerPick(list) {
  return list[Math.floor(Math.random() * list.length)];
}
function genBunkerCode() {
  return String(Math.floor(1000 + Math.random() * 9000));
}
function genBunkerPlayerId() {
  return "p" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function makeBunkerDossier() {
  const dossier = {};
  BUNKER_TRAIT_DEFS.forEach((t) => {
    dossier[t.key] = { value: bunkerPick(t.list), revealed: false };
  });
  return dossier;
}

// Session-scoped "what room was I in" snapshot, so a page refresh (or the
// tab being killed and restored by the OS on a phone) can silently rejoin
// the game instead of dumping the player back at the create/join menu.
// The Host's copy also carries the last-known authoritative room object,
// since the Host is the only source of truth and it otherwise lives only
// in that tab's memory — without this, a Host refresh would strand every
// guest with no one left to resolve join/reveal/vote requests.
function persistBunkerSession(code, isHost, room) {
  try {
    const data = { code, isHost, savedAt: Date.now() };
    if (isHost && room) data.room = room;
    sessionStorage.setItem("bunkerSession", JSON.stringify(data));
  } catch (e) {}
}
function loadBunkerSession() {
  try {
    const raw = sessionStorage.getItem("bunkerSession");
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
function clearBunkerSession() {
  try {
    sessionStorage.removeItem("bunkerSession");
  } catch (e) {}
}

// Small banner shown while we're trying to silently recover a dropped
// connection, so players aren't left staring at a frozen screen with no
// explanation.
function ConnStatusBanner({ status }) {
  if (status !== "reconnecting" && status !== "offline") return null;
  const isOffline = status === "offline";
  return (
    <div
      className="mx-5 mb-2 px-3 py-1.5 rounded-xl text-xs font-medium text-center shrink-0"
      style={{
        background: isOffline ? "rgba(220,80,60,.14)" : "var(--surface-2)",
        color: isOffline ? "var(--danger)" : "var(--text-dim)",
      }}
    >
      {isOffline ? "Нет соединения — переподключаемся…" : "Переподключение к комнате…"}
    </div>
  );
}

              onClick={() => onCreate(name)}
              disabled={busy || !name.trim()}
              className="w-full bg-[var(--bunker)] text-[var(--bunker-ink)] font-display text-xl tracking-wide py-4 rounded-2xl disabled:opacity-30 active:scale-[0.98] transition-transform"
            >
              {busy ? "Создаём…" : "Создать"}
            </button>
            <button onClick={() => setMode(null)} className="text-sm text-[var(--text-faint)] py-2">Назад</button>

              />
            </div>
            <div>
              <label className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-2 block">Код комнаты</label>
              <input
                value={code}
                onChange={(e) => setCode(e.target.value.replace(/\D/g, "").slice(0, 4))}
                placeholder="0000"
                inputMode="numeric"
                className="w-full bg-[var(--surface)] border border-[var(--border)] rounded-2xl px-4 py-3.5 text-[var(--text)] outline-none focus:border-[var(--accent)] font-mono text-2xl tracking-[0.3em] text-center"
              />
            </div>
            {error && <p className="text-sm text-[var(--danger)]">{error}</p>}
            <button
              onClick={() => onJoin(name, code)}
              disabled={busy || !name.trim() || code.length !== 4}
              className="w-full bg-[var(--bunker)] text-[var(--bunker-ink)] font-display text-xl tracking-wide py-4 rounded-2xl disabled:opacity-30 active:scale-[0.98] transition-transform"
            >
              {busy ? "Подключаемся…" : "Войти"}
            </button>
            <button onClick={() => setMode(null)} className="text-sm text-[var(--text-faint)] py-2">Назад</button>
          </div>
        )}
      </div>
    </div>
  );
}

function BunkerLobby({ room, roomCode, playerId, dispatch, onStart, error, busy, connStatus }) {
  const players = room && room.players ? room.players : {};
  const orderedIds = Object.keys(players).sort((a, b) => (players[a].joinedAt || 0) - (players[b].joinedAt || 0));
  const isHost = room && room.hostId === playerId;
  const [copied, setCopied] = useState(false);
  const [linkCopied, setLinkCopied] = useState(false);
  const [qrOpen, setQrOpen] = useState(false);
  const [rulesOpen, setRulesOpen] = useState(false);

  function copyCode() {
    try {
      navigator.clipboard.writeText(roomCode);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {}
  }

  function shareLink() {
    shareRoomInvite(roomCode, "bunker", "Бункер", () => {
      setLinkCopied(true);
      setTimeout(() => setLinkCopied(false), 1500);
    });
  }

  return (
    <div className="h-full min-h-0 flex flex-col">
      <TopBar
        onBack={() => dispatch({ type: "GO_HUB" })}
        title="БУНКЕР"
        right={<IconRadioactive size={18} className="text-[var(--bunker)]" />}
        onRightClick={() => setRulesOpen(true)}
      />
      <RulesSheet open={rulesOpen} onClose={() => setRulesOpen(false)} title="Правила Бункера" color="var(--bunker)" rules={BUNKER_RULES} />
      <ConnStatusBanner status={connStatus} />
      <div className="flex-1 min-h-0 overflow-y-auto no-scrollbar px-5 pb-6 flex flex-col">
        <div className="text-center my-6">
          <p className="text-xs uppercase tracking-[0.25em] text-[var(--text-faint)] mb-3">Код комнаты</p>
          <button onClick={copyCode} className="font-mono text-6xl tracking-[0.15em] font-semibold active:scale-95 transition-transform">
            {roomCode}
          </button>
          <p className="text-xs text-[var(--text-faint)] mt-2">{copied ? "Скопировано!" : "Нажмите, чтобы скопировать · сообщите игрокам"}</p>
          <div className="mt-3 flex items-center justify-center gap-2 flex-wrap">
            <button
              onClick={shareLink}
              className="inline-flex items-center gap-1.5 text-xs px-3 py-2 rounded-full bg-[var(--surface)] border border-[var(--border-strong)] text-[var(--text-dim)]"
            >
              <IconSend size={13} /> {linkCopied ? "Ссылка скопирована!" : "Поделиться ссылкой-приглашением"}
            </button>
            <button
              onClick={() => setQrOpen(true)}
              className="inline-flex items-center gap-1.5 text-xs px-3 py-2 rounded-full bg-[var(--surface)] border border-[var(--border-strong)] text-[var(--text-dim)]"
            >
              <IconQrCode size={13} /> QR-код
            </button>
          </div>
        </div>
        <QrCodeModal open={qrOpen} onClose={() => setQrOpen(false)} code={roomCode} game="bunker" gameLabel="Бункер" />

        <div className="flex flex-col gap-2.5 mb-4">
          {orderedIds.map((pid) => {
            const p = players[pid];
            return (
              <div key={pid} className="flex items-center gap-3 bg-[var(--surface)] border border-[var(--border)] rounded-2xl px-4 py-3.5">
                <div className="w-9 h-9 rounded-full bg-[var(--surface-2)] flex items-center justify-center text-[var(--text-dim)] shrink-0">
                  <IconUsers size={16} />
                </div>
                <ExpandableText as="span" className="font-medium truncate" text={p.name} title="Игрок" />
                {p.isHost && (
                  <span className="ml-auto shrink-0 text-[10px] uppercase tracking-widest text-[var(--accent-strong)] bg-[var(--accent)]/10 px-2 py-0.5 rounded-full">Хост</span>
                )}
                {pid === playerId && !p.isHost && <span className="ml-auto shrink-0 text-[10px] uppercase tracking-widest text-[var(--text-faint)]">(вы)</span>}
              </div>
            );
          })}
        </div>

        <div className="mb-4">
          <RulesCard title="Правила Бункера" color="var(--bunker)" rules={BUNKER_RULES} />
        </div>

        <div className="mb-4">
          <DiscordCommunityButton />
        </div>

        {error && <p className="text-sm text-[var(--danger)] text-center mb-3">{error}</p>}

        <div className="mt-auto pt-2">
          {isHost ? (
            <button
              onClick={onStart}
              disabled={orderedIds.length < 2 || busy}
              className="w-full bg-[var(--bunker)] text-[var(--bunker-ink)] font-display text-xl tracking-wide py-4 rounded-2xl disabled:opacity-30 active:scale-[0.98] transition-transform"
            >
              Начать игру
            </button>
          ) : (
            <p className="text-center text-sm text-[var(--text-dim)] py-2">Ожидание хоста…</p>
          )}
        </div>
      </div>
    </div>
  );
}

function BunkerDossierTab({ me, onReveal }) {

    return <div className="pt-10 text-center text-[var(--text-dim)] text-sm">Досье готовится…</div>;

              <t.Icon size={20} />
            </div>
            <div className="min-w-0 flex-1">
              <div className="text-[10px] uppercase tracking-[0.2em] text-[var(--text-faint)] mb-0.5">{t.label}</div>
              <ExpandableText as="div" className="text-sm font-medium truncate" text={entry.value} title={t.label} />

              >
                Вскрыть
              </button>

          </div>
        );

function BunkerVotingCard({ room, players, orderedIds, playerId, isHost, onOpenVoting, onCastVote, onCloseVoting }) {
  const [excludeCount, setExcludeCount] = useState(1);
  const alive = orderedIds.filter((pid) => !players[pid].exiled);
  const voting = room.voting;

  if (!voting) {
    const history = room.votingHistory || [];
    const maxExclude = Math.max(1, alive.length - 1);
    return (
      <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4">
        <div className="flex items-center gap-2 mb-3 text-[var(--bunker)]">
          <IconVote size={18} />
          <span className="text-xs uppercase tracking-[0.25em]">Голосование</span>
        </div>
        {isHost ? (
          <>
            <div className="flex items-center justify-between mb-3">
              <span className="text-sm text-[var(--text-dim)]">Исключить в этом раунде</span>
              <div className="flex items-center gap-3">
                <button
                  onClick={() => setExcludeCount((v) => Math.max(1, v - 1))}
                  className="w-8 h-8 rounded-full bg-[var(--surface-2)] flex items-center justify-center active:scale-95"
                  aria-label="Меньше"
                >
                  <IconMinus size={14} />
                </button>
                <span className="font-display text-xl w-6 text-center">{Math.min(excludeCount, maxExclude)}</span>
                <button
                  onClick={() => setExcludeCount((v) => Math.min(maxExclude, v + 1))}
                  className="w-8 h-8 rounded-full bg-[var(--surface-2)] flex items-center justify-center active:scale-95"
                  aria-label="Больше"
                >
                  <IconPlus size={14} />
                </button>
              </div>
            </div>
            <button
              onClick={() => onOpenVoting(Math.min(excludeCount, maxExclude))}
              disabled={alive.length < 2}
              className="w-full bg-[var(--bunker)] text-[var(--bunker-ink)] font-display text-lg tracking-wide py-3 rounded-2xl disabled:opacity-30 active:scale-[0.98] transition-transform"
            >
              Начать раунд {(room.votingRoundCounter || 0) + 1}
            </button>
          </>
        ) : (
          <p className="text-sm text-[var(--text-faint)]">Ждём, пока Хост откроет раунд голосования.</p>
        )}
        {history.length > 0 && (
          <div className="flex flex-col gap-2 mt-4 pt-4 border-t border-[var(--border)]">
            <span className="text-[10px] uppercase tracking-[0.2em] text-[var(--text-faint)]">История раундов</span>
            {history.map((h, i) => (
              <div key={i} className="text-xs text-[var(--text-dim)]">
                Раунд {h.round}:{" "}
                {h.exiled.length > 0
                  ? `изгнан(ы) ${h.exiled.map((pid) => (players[pid] ? players[pid].name : "?")).join(", ")}`
                  : "никто не набрал голосов"}
                {h.tie && " (ничья на границе — исключены все)"}
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  const meExiled = players[playerId] && players[playerId].exiled;
  const myVote = voting.votes[playerId];
  const votedCount = Object.keys(voting.votes).length;
  const targets = alive.filter((pid) => pid !== playerId);

  return (
    <div className="bg-[var(--surface)] border border-[var(--bunker)]/30 rounded-2xl p-4">
      <div className="flex items-center justify-between mb-3 gap-2">
        <div className="flex items-center gap-2 text-[var(--bunker)] min-w-0">
          <IconVote size={18} className="shrink-0" />
          <span className="text-xs uppercase tracking-[0.25em] truncate">
            Раунд {voting.round} · исключить {voting.excludeCount}
          </span>
        </div>
        <span className="text-xs text-[var(--text-faint)] shrink-0">
          {votedCount}/{alive.length}
        </span>
      </div>
      {meExiled ? (
        <p className="text-sm text-[var(--text-faint)] mb-3">Вы выбыли и можете только наблюдать за голосованием.</p>
      ) : (
        <div className="flex flex-col gap-2 mb-3">
          {targets.map((pid) => (
            <button
              key={pid}
              onClick={() => onCastVote(pid)}
              className={
                "w-full flex items-center justify-between px-4 py-3 rounded-xl border text-left transition-colors " +
                (myVote === pid ? "border-[var(--bunker)] bg-[var(--bunker)]/10" : "border-[var(--border)] bg-[var(--surface-2)]")
              }
            >
              <span className="text-sm font-medium">{players[pid].name}</span>
              {myVote === pid && <IconCheck size={16} className="text-[var(--bunker)]" />}
            </button>
          ))}
        </div>
      )}
      {isHost && (
        <button
          onClick={onCloseVoting}
          className="w-full bg-[var(--bunker)] text-[var(--bunker-ink)] font-display text-lg tracking-wide py-3 rounded-2xl active:scale-[0.98] transition-transform"
        >
          Завершить голосование
        </button>
      )}
    </div>
  );
}

          return (

              className={
                "rounded-2xl border p-4 " +
                (p.exiled ? "border-[var(--border)] bg-[var(--surface)]/40 opacity-50" : "border-[var(--border)] bg-[var(--surface)]")
              }
            >
              <div className="flex items-center justify-between mb-3">
                <div className="flex items-center gap-2 min-w-0">

                  {isMe && <span className="text-[10px] uppercase tracking-widest text-[var(--text-faint)] shrink-0">(вы)</span>}
                  {p.exiled && <span className="text-[10px] uppercase tracking-widest text-[var(--danger)] bg-[var(--danger)]/10 px-2 py-0.5 rounded-full shrink-0">Изгнан</span>}
                </div>
                {isHost && !p.exiled && (
                  <ConfirmButton
                    label="Изгнать"
                    confirmLabel="Точно?"
                    onConfirm={() => onExile(pid)}
                    className="shrink-0 text-[10px] uppercase tracking-wider text-[var(--danger)] border border-[var(--danger)]/40 px-2.5 py-1.5 rounded-full active:bg-[var(--danger)]/10"
                  />
                )}
              </div>
              {p.dossier ? (
                <div className="grid grid-cols-2 gap-2">

                    return (
                      <div key={t.key} className="bg-[var(--surface-2)] rounded-xl px-2.5 py-2">

                          <div className="text-xs font-medium truncate text-[var(--text-faint)] italic">Скрыто</div>
                        )}
                      </div>

                  })}

                <p className="text-xs text-[var(--text-faint)]">Досье ещё не готово</p>

function BunkerGame({ room, roomCode, playerId, dispatch, onReveal, onExile, onOpenVoting, onCastVote, onCloseVoting, connStatus }) {
  const [tab, setTab] = useState("dossier");
  const players = room && room.players ? room.players : {};
  const me = players[playerId];
  const isHost = room && room.hostId === playerId;
  const orderedIds = Object.keys(players).sort((a, b) => (players[a].joinedAt || 0) - (players[b].joinedAt || 0));
  const [rulesOpen, setRulesOpen] = useState(false);

  useWakeLock(true);

  return (
    <div className="h-full min-h-0 flex flex-col">
      <TopBar
        onBack={() => dispatch({ type: "GO_HUB" })}
        title="БУНКЕР"
        right={<IconRadioactive size={18} className="text-[var(--bunker)]" />}
        onRightClick={() => setRulesOpen(true)}
      />
      <RulesSheet open={rulesOpen} onClose={() => setRulesOpen(false)} title="Правила Бункера" color="var(--bunker)" rules={BUNKER_RULES} />
      <ConnStatusBanner status={connStatus} />
      <FadeIn key={tab} className="flex-1 min-h-0 overflow-y-auto no-scrollbar px-5 pb-4">
        {tab === "dossier" ? (
          <BunkerDossierTab me={me} onReveal={onReveal} />
        ) : (
          <BunkerTableTab
            room={room}
            players={players}
            orderedIds={orderedIds}
            playerId={playerId}
            isHost={isHost}
            onExile={onExile}
            onOpenVoting={onOpenVoting}
            onCastVote={onCastVote}
            onCloseVoting={onCloseVoting}
          />
        )}
      </FadeIn>
      <BunkerTabBar tab={tab} setTab={setTab} />
    </div>
  );
}

function BunkerApp({ dispatch }) {
  const [roomCode, setRoomCode] = useState(null);
  // Consumed exactly once, same pattern as pendingReconnectScreen — an
  // invite link pre-fills the join code so the player only has to type
  // their name, not copy a 4-digit code by hand.
  const [inviteCode] = useState(() => {
    if (pendingInviteParams && pendingInviteParams.game === "bunker") {
      const code = pendingInviteParams.room;
      pendingInviteParams = null;
      return code;
    }
    return null;
  });
  const [playerId] = useState(() => {
    try {
      const saved = sessionStorage.getItem("bunkerPlayerId");
      if (saved) return saved;
    } catch (e) {}
    const id = genBunkerPlayerId();
    try {
      sessionStorage.setItem("bunkerPlayerId", id);
    } catch (e) {}
    return id;
  });
  const [room, setRoom] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  // "idle" | "reconnecting" | "offline" — surfaced to the player so a dropped
  // connection mid-game shows *something* instead of a silently frozen screen.
  const [connStatus, setConnStatus] = useState("idle");

  const roomRef = useRef(null);
  const roomCodeRef = useRef(null);
  const channelRef = useRef(null);
  const joinTimeoutRef = useRef(null);
  const prevPlayerCountRef = useRef(null);
  const isHostRef = useRef(false);
  // Flips true the first time we actually receive real room state. Lets us
  // tell "first connect" apart from "reconnected after a drop" in the
  // subscribe callbacks below, so a later hiccup doesn't stomp on live state
  // or throw up a scary error banner nobody can see anyway once in-game.
  const initializedRef = useRef(false);

  useEffect(() => {
    roomRef.current = room;
  }, [room]);
  useEffect(() => {
    roomCodeRef.current = roomCode;
  }, [roomCode]);

  // Bell sound whenever a new player shows up while everyone is still in
  // the lobby (fires for the Host and for every other player already in).
  useEffect(() => {
    if (!room || !room.players || room.status !== "lobby") return;
    const count = Object.keys(room.players).length;
    if (prevPlayerCountRef.current !== null && count > prevPlayerCountRef.current) {
      playChimeSound();
      vibrate([30, 40, 30]);
    }
    prevPlayerCountRef.current = count;
  }, [room]);

  // On mount, try to silently resume whatever room we were last in — covers
  // a page refresh, or a phone browser reloading a backgrounded tab. The
  // Host also carries its last-known authoritative room snapshot (see
  // persistBunkerSession) since it's the only source of truth and it
  // otherwise lives purely in this tab's memory.
  //
  // Gated on pendingReconnectScreen: BunkerApp also mounts every time the
  // player taps the Бункер tile from the Hub, not just on a real reload —
  // without this check, a room left over from a visit that wasn't closed
  // via the back arrow would resurface instead of a fresh menu.
  useEffect(() => {
    const eligible = pendingReconnectScreen === "bunker";
    pendingReconnectScreen = null;
    if (!eligible) {
      clearBunkerSession();
      return;
    }
    const saved = loadBunkerSession();
    if (!saved || !saved.code) return;
    if (saved.isHost && saved.room) {
      isHostRef.current = true;
      initializedRef.current = true;
      setRoom(saved.room);
      setRoomCode(saved.code);
      setConnStatus("reconnecting");
      const channel = attachChannel(saved.code, true);
      channel.subscribe((status) => {
        if (status === "SUBSCRIBED") {
          setConnStatus("idle");
          // Re-broadcast so any guests who reconnected first resync to us.
          broadcastState(saved.room);
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
          setConnStatus("offline");
        }
      });
    } else if (!saved.isHost) {
      setConnStatus("reconnecting");
      const channel = attachChannel(saved.code, false);
      channel.subscribe((status) => {
        if (status === "SUBSCRIBED") {
          channel.send({ type: "broadcast", event: "bunker_join", payload: { playerId, name: "Игрок" } });
          joinTimeoutRef.current = setTimeout(() => {
            // No response — the room is probably gone. Fall back to the
            // normal menu rather than leaving the player stuck.
            setConnStatus("idle");
            setRoomCode(null);
            clearBunkerSession();
            supabaseClient.removeChannel(channel);
            channelRef.current = null;
          }, 6000);
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
          if (!initializedRef.current) setConnStatus("offline");
        }
      });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    return () => {
      if (joinTimeoutRef.current) clearTimeout(joinTimeoutRef.current);
      if (channelRef.current) {
        supabaseClient.removeChannel(channelRef.current);
        channelRef.current = null;
      }
      // A real unmount here only happens when the player navigates back to
      // the hub in-app (a page refresh remounts fresh and reads the saved
      // session instead) — so this is the right place to forget the room.
      clearBunkerSession();
    };
  }, []);

  function broadcastState(nextRoom) {
    setRoom(nextRoom);
    if (isHostRef.current) persistBunkerSession(roomCodeRef.current, true, nextRoom);
    if (channelRef.current) {
      channelRef.current.send({ type: "broadcast", event: "bunker_state", payload: { room: nextRoom } });
    }
  }

  // Creates (host) or joins (guest) the Supabase Realtime channel for a room
  // code, and wires up the broadcast events the Bunker game relies on.
  function attachChannel(code, isHostChannel) {
    const channel = supabaseClient.channel("bunker-room-" + code, {
      config: { broadcast: { self: true } },
    });

    channel.on("broadcast", { event: "bunker_state" }, ({ payload }) => {
      if (!payload || !payload.room) return;
      if (joinTimeoutRef.current) {
        clearTimeout(joinTimeoutRef.current);
        joinTimeoutRef.current = null;
      }
      initializedRef.current = true;
      setRoom(payload.room);
      setRoomCode(code);
      setBusy(false);
      setConnStatus("idle");
      if (!isHostChannel) persistBunkerSession(code, false, null);
    });

    // Only the Host resolves join/reveal requests into authoritative state
    // and rebroadcasts it — every other client just renders what it gets.
    if (isHostChannel) {
      channel.on("broadcast", { event: "bunker_join" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload || !payload.playerId) return;
        const players = { ...current.players };
        const existing = players[payload.playerId];
        players[payload.playerId] = {
          name: (existing && existing.name) || (payload.name || "Игрок").trim().slice(0, 20) || "Игрок",
          isHost: payload.playerId === current.hostId,
          joinedAt: existing ? existing.joinedAt : Date.now(),
          exiled: existing ? existing.exiled : false,
          dossier: existing ? existing.dossier : current.status === "playing" ? makeBunkerDossier() : null,
        };
        broadcastState({ ...current, players });
      });

      channel.on("broadcast", { event: "bunker_reveal" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload || !current.players[payload.playerId]) return;
        const target = current.players[payload.playerId];
        if (!target.dossier || !target.dossier[payload.traitKey]) return;
        const players = {
          ...current.players,
          [payload.playerId]: {
            ...target,
            dossier: { ...target.dossier, [payload.traitKey]: { ...target.dossier[payload.traitKey], revealed: true } },
          },
        };
        broadcastState({ ...current, players });
      });

      channel.on("broadcast", { event: "bunker_vote" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload || !current.voting) return;
        const voter = current.players[payload.playerId];
        const target = current.players[payload.targetId];
        if (!voter || voter.exiled) return;
        if (!target || target.exiled) return;
        if (payload.targetId === payload.playerId) return;
        const voting = { ...current.voting, votes: { ...current.voting.votes, [payload.playerId]: payload.targetId } };
        broadcastState({ ...current, voting });
      });
    }

    channelRef.current = channel;
    return channel;
  }

  function handleCreate(name) {
    setBusy(true);
    setError("");
    isHostRef.current = true;
    initializedRef.current = false;
    const code = genBunkerCode();
    const initialRoom = {
      status: "lobby",
      hostId: playerId,
      catastrophe: null,
      players: {
        [playerId]: { name: name.trim().slice(0, 20) || "Хост", isHost: true, joinedAt: Date.now(), exiled: false, dossier: null },
      },
    };
    const channel = attachChannel(code, true);
    channel.subscribe((status) => {
      if (status === "SUBSCRIBED") {
        if (!initializedRef.current) {
          // First-ever connect: seed the brand-new room.
          initializedRef.current = true;
          setRoom(initialRoom);
          setRoomCode(code);
          setBusy(false);
          persistBunkerSession(code, true, initialRoom);
        } else if (roomRef.current) {
          // Reconnected mid-game after a drop — resync everyone to what we
          // actually have now, never to the stale room object captured
          // above when the room was first created.
          setConnStatus("idle");
          broadcastState(roomRef.current);
        }
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        if (!initializedRef.current) {
          setError("Не удалось подключиться к Supabase. Проверьте интернет-соединение.");
          setBusy(false);
        } else {
          setConnStatus("offline");
        }
      }
    });
  }

  function handleJoin(name, code) {
    if (!/^\d{4}$/.test(code)) {
      setError("Введите 4-значный код");
      return;
    }
    if (!name.trim()) {
      setError("Введите имя");
      return;
    }
    setBusy(true);
    setError("");
    isHostRef.current = false;
    initializedRef.current = false;
    const channel = attachChannel(code, false);
    channel.subscribe((status) => {
      if (status === "SUBSCRIBED") {
        channel.send({ type: "broadcast", event: "bunker_join", payload: { playerId, name: name.trim().slice(0, 20) } });
        if (!initializedRef.current) {
          joinTimeoutRef.current = setTimeout(() => {
            setError("Комната не найдена или Хост сейчас offline. Проверьте код.");
            setBusy(false);
            supabaseClient.removeChannel(channel);
            channelRef.current = null;
          }, 4000);
        } else {
          setConnStatus("idle");
        }
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        if (!initializedRef.current) {
          setError("Не удалось подключиться к Supabase. Проверьте интернет-соединение.");
          setBusy(false);
        } else {
          setConnStatus("offline");
        }
      }
    });
  }

  function handleStart() {
    const current = roomRef.current;
    if (!current || !current.players) return;
    const catastrophe = bunkerPick(BUNKER_CATASTROPHES);
    const playerIds = Object.keys(current.players);
    // The bunker never fits everyone — only about half the group gets a
    // spot, which is exactly what forces the debate over who stays.
    const capacity = Math.max(1, Math.ceil(playerIds.length / 2));
    const players = {};
    playerIds.forEach((pid) => {
      players[pid] = { ...current.players[pid], dossier: makeBunkerDossier() };
    });
    broadcastState({ ...current, status: "playing", catastrophe, capacity, players });
  }

  function handleReveal(traitKey) {
    if (!channelRef.current) return;
    channelRef.current.send({ type: "broadcast", event: "bunker_reveal", payload: { playerId, traitKey } });
  }

  function handleExile(targetId) {
    const current = roomRef.current;
    if (!current || !current.players[targetId]) return;
    const players = { ...current.players, [targetId]: { ...current.players[targetId], exiled: true } };
    broadcastState({ ...current, players });
  }

  // Host-only: opens a new voting round. Every other client just casts
  // ballots via handleCastVote, which is a broadcast request the host
  // resolves in the "bunker_vote" handler above, same pattern as join/reveal.
  function handleOpenVoting(excludeCount) {
    const current = roomRef.current;
    if (!current || current.voting) return;
    const round = (current.votingRoundCounter || 0) + 1;
    const voting = { round, excludeCount, votes: {}, openedAt: Date.now() };
    broadcastState({ ...current, voting, votingRoundCounter: round });
  }

  function handleCastVote(targetId) {
    if (!channelRef.current) return;
    channelRef.current.send({ type: "broadcast", event: "bunker_vote", payload: { playerId, targetId } });
  }

  // Host-only: tallies the open round's ballots and exiles whoever is at
  // or above the vote count of the excludeCount-th place. A tie right at
  // that cutoff exiles everyone tied there rather than picking arbitrarily.
  function handleCloseVoting() {
    const current = roomRef.current;
    if (!current || !current.voting) return;
    const { round, excludeCount, votes } = current.voting;
    const tally = {};
    Object.values(votes).forEach((targetId) => {
      tally[targetId] = (tally[targetId] || 0) + 1;
    });
    const ranked = Object.keys(tally)
      .filter((pid) => current.players[pid] && !current.players[pid].exiled)
      .sort((a, b) => tally[b] - tally[a]);
    let exiled = [];
    if (ranked.length > 0) {
      const cutoffCount = Math.min(excludeCount, ranked.length);
      const cutoffVotes = tally[ranked[cutoffCount - 1]];
      exiled = ranked.filter((pid) => tally[pid] >= cutoffVotes);
    }
    const players = { ...current.players };
    exiled.forEach((pid) => {
      players[pid] = { ...players[pid], exiled: true };
    });
    const votingHistory = [
      ...(current.votingHistory || []),
      { round, excludeCount, tally, exiled, tie: exiled.length > excludeCount },
    ];
    broadcastState({ ...current, players, voting: null, votingHistory });
  }

  if (!roomCode || !room) {
    if (connStatus === "reconnecting") {
      return (
        <div className="h-full min-h-0 flex flex-col">
          <TopBar onBack={() => dispatch({ type: "GO_HUB" })} title="БУНКЕР" right={<IconRadioactive size={18} className="text-[var(--bunker)]" />} />
          <div className="flex-1 flex items-center justify-center px-8">
            <p className="text-sm text-[var(--text-dim)] text-center">Переподключение к комнате…</p>
          </div>
        </div>
      );
    }
    return <BunkerMenu dispatch={dispatch} onCreate={handleCreate} onJoin={handleJoin} busy={busy} error={error} initialCode={inviteCode} />;
  }
  if (room.status === "playing") {
    return (
      <BunkerGame
        room={room}
        roomCode={roomCode}
        playerId={playerId}
        dispatch={dispatch}
        onReveal={handleReveal}
        onExile={handleExile}
        onOpenVoting={handleOpenVoting}
        onCastVote={handleCastVote}
        onCloseVoting={handleCloseVoting}
        connStatus={connStatus}
      />
    );
  }
  return (
    <BunkerLobby
      room={room}
      roomCode={roomCode}
      playerId={playerId}
      dispatch={dispatch}
      onStart={handleStart}
      error={error}
      busy={busy}
      connStatus={connStatus}
    />
  );
}

const pickRandom = bunkerPick;
function genCourtCode() {
  return String(Math.floor(1000 + Math.random() * 9000));
}
function genCourtPlayerId() {
  return "c" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

// Shared by both the first case (handleStart) and every later one
// (handleNewCase) so role assignment and evidence dealing never drift
// between the two call sites.
function assignCourtRound(players, hostId) {
  const allIds = Object.keys(players);
  const guestIds = shuffleArray(allIds.filter((pid) => pid !== hostId));
  const roleForId = {};
  roleForId[hostId] = "judge";
  if (guestIds[0]) roleForId[guestIds[0]] = "guilty";
  if (guestIds[1]) roleForId[guestIds[1]] = "victim";
  if (guestIds[2]) roleForId[guestIds[2]] = "secretary";
  guestIds.slice(3).forEach((pid) => {
    roleForId[pid] = "juror";
  });

  const courtCase = pickRandom(COURT_CASES);
  const nextPlayers = {};
  allIds.forEach((pid) => {
    const role = roleForId[pid];
    const pool = COURT_EVIDENCE_BY_ROLE[role] || COURT_EVIDENCE_JUROR;
    nextPlayers[pid] = { ...players[pid], role, evidence: { text: pickRandom(pool), revealed: false }, vote: null };
  });
  return { courtCase, players: nextPlayers };
}

// Same reconnect-snapshot pattern as Bunker (see persistBunkerSession) — the
// judge/Host is the only source of truth for the room and otherwise only
// holds it in that tab's memory, so its refresh would strand every juror
// with no one left to resolve join/reveal/vote/verdict requests.
function persistCourtSession(code, isHost, room) {
  try {
    const data = { code, isHost, savedAt: Date.now() };
    if (isHost && room) data.room = room;
    sessionStorage.setItem("courtSession", JSON.stringify(data));
  } catch (e) {}
}
function loadCourtSession() {
  try {
    const raw = sessionStorage.getItem("courtSession");
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}
function clearCourtSession() {
  try {
    sessionStorage.removeItem("courtSession");
  } catch (e) {}
}

function CourtVoteTimer({ room, isJudge, onStart, onStop }) {
  const [now, setNow] = useState(Date.now());
  const timer = room.voteTimer;

  useEffect(() => {
    if (!timer) return;
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, [timer]);

  const remaining = timer ? Math.max(0, Math.ceil((timer.endsAt - now) / 1000)) : 0;
  const expired = !!timer && remaining <= 0;

  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-2xl p-4">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-2 text-[var(--court)]">
          <IconTimer size={18} />
          <span className="text-xs uppercase tracking-[0.25em]">Время на голосование</span>
        </div>
        {timer && (
          <span className={"font-mono text-lg font-semibold tabular-nums " + (expired ? "text-[var(--danger)]" : "text-[var(--text)]")}>
            {fmtTime(remaining)}
          </span>
        )}
      </div>
      {isJudge ? (
        timer ? (
          <button
            onClick={onStop}
            className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-sm font-semibold py-2.5 rounded-xl active:scale-[0.98] transition-transform"
          >
            Остановить таймер
          </button>
        ) : (
          <div className="flex gap-2">
            {[60, 120, 180].map((sec) => (
              <button
                key={sec}
                onClick={() => onStart(sec)}
                className="flex-1 bg-[var(--court)] text-[var(--court-ink)] font-semibold text-sm py-2.5 rounded-xl active:scale-[0.98] transition-transform"
              >
                {Math.round(sec / 60)} мин
              </button>
            ))}
          </div>
        )
      ) : (
        !timer && <p className="text-xs text-[var(--text-faint)]">Судья ещё не запустил таймер.</p>
      )}
      {expired && <p className="text-xs text-[var(--danger)] mt-2">Время вышло — пора подводить итоги.</p>}
    </div>
  );
}
