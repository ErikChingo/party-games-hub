  @keyframes softPulse{ 0%,100%{ opacity:1;} 50%{ opacity:.45;} }

  @keyframes badgeFlash{ 0%,100%{ background:var(--danger);} 50%{ background:#8f2b2c;} }

  @keyframes dotBreathe{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.35); } }
  .breathe{ animation:dotBreathe 1.4s ease-in-out infinite; }

  @keyframes neonPulse{
    0%,100%{ box-shadow:0 0 0 2px rgba(168,85,247,.55), 0 0 16px rgba(168,85,247,.55), 0 0 32px rgba(168,85,247,.25); }

  }
  .neon-pulse{ animation:neonPulse 2.2s ease-in-out infinite; }

  @keyframes typingBounce{ 0%,60%,100%{ transform:translateY(0); opacity:.4;} 30%{ transform:translateY(-4px); opacity:1;} }
  .typing-dot{ animation:typingBounce 1s ease-in-out infinite; }

  /* Player title cosmetics (badge/icon + color-matched frame around the
     name, used identically in ProfilePanel and Leaderboard rows -- see
     PLAYER_TITLES/getPlayerTitle()). The color itself is always applied
     inline (style={{ color, borderColor }}) since it's per-tier data, not
     something worth a CSS variable for; these classes only add the parts
     that are the same for every tier (the pill shape) or unique to the one
     rare tier (the gold glow/shimmer). */
  .title-frame{
    display:inline-flex; align-items:center; gap:.3em;
    padding:.05em .55em; border-radius:999px; border:1.5px solid currentColor;
  }
  .title-frame .title-icon{ font-size:.95em; line-height:1; }

  @keyframes titleRareGlow{
    0%,100%{ box-shadow:0 0 0 1.5px rgba(246,207,114,.9), 0 0 10px rgba(246,207,114,.55), 0 0 22px rgba(246,207,114,.3); }
    50%{ box-shadow:0 0 0 1.5px rgba(246,207,114,1), 0 0 18px rgba(246,207,114,.85), 0 0 34px rgba(246,207,114,.5); }
  }
  @keyframes titleRareShimmer{ 0%{ background-position:0% 50%; } 100%{ background-position:200% 50%; } }
  .title-frame-rare{
    background-image:linear-gradient(120deg, rgba(246,207,114,.28), rgba(232,181,69,.05), rgba(246,207,114,.28));
    background-size:200% 100%;
    animation: titleRareGlow 2.4s ease-in-out infinite, titleRareShimmer 3s linear infinite;
  }

  @media (prefers-reduced-motion: reduce){
    .pop, .pulse, .flash-badge, .breathe, .neon-pulse, .typing-dot, .title-frame-rare{ animation:none !important; }
  }

  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

  /* App shell height: a plain inline style={{height:"100dvh"}} can't express a  */
  /* fallback for browsers/WebViews that don't support dvh units (some older     */
  /* Android Chrome/WebView) — there an unsupported value falls through to       */
  /* "auto", which can break the h-full/flex-1 height chain used by every        */
  /* screen and, combined with overflow:hidden on this same element, silently    */
  /* clips (rather than scrolls) any content taller than the broken height       */
  /* instead of showing it. A real CSS class can declare the same property       */
  /* twice; the browser keeps the last one it understands and ignores the rest.  */
  .app-shell{
    height: 100vh;   /* fallback for browsers without dvh support */
    height: 100dvh;  /* real viewport height on mobile browsers that support it */
    max-width: var(--shell-w);
  }

  /* Every bottom-sheet/modal shares this width with .app-shell (via the   */
  /* same --shell-w variable) so a sheet never looks narrower or wider     */
  /* than the "phone" card it's opened from, on any screen size.          */
  .sheet-w{
    max-width: var(--shell-w);
  }

  /* Base (mobile) position of the floating support bubble — identical to  */
  /* the values that used to live inline on the element; pulled out here   */
  /* only so the desktop media query below can override just this one      */
  /* rule instead of fighting an inline style.                             */
  .support-fab{
    right: max(1.25rem, env(safe-area-inset-right, 0px));
    bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
  }
  .update-banner{
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  }
  .telegram-promo-banner{
    top: calc(1rem + env(safe-area-inset-top, 0px));
  }

  /* Desktop/laptop framing: gated on having a real mouse/trackpad         */
  /* (hover:hover + pointer:fine describe the PRIMARY input device, not    */
  /* the window size) rather than a viewport-width breakpoint. A phone or  */
  /* touch tablet never matches this, no matter its screen size — but      */
  /* neither does a desktop browser window that's been resized narrow,     */
  /* which a plain min-width breakpoint would have wrongly treated as      */
  /* "mobile". The "phone" card gets a bit more room, a visible frame,     */
  /* and a soft decorative background fills the space that would           */
  /* otherwise sit empty around it — down to whatever width is actually    */
  /* available, so a narrow desktop window still looks intentional.        */
  @media (hover: hover) and (pointer: fine){
    :root{ --shell-w: 32rem; }
    html, body{ height: auto; min-height: 100%; }
    body{
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 2.5rem 1.5rem;
      background:
        radial-gradient(1100px 640px at 12% -8%, rgba(232,181,69,.12) 0%, rgba(232,181,69,0) 60%),
        radial-gradient(900px 620px at 100% 108%, rgba(168,85,247,.11) 0%, rgba(168,85,247,0) 60%),
        var(--bg);
    }
    #root{ height: auto; }
    .app-shell{
      height: min(880px, 94vh);
      border-radius: 2.25rem;
      border: 1px solid var(--border-strong);
      box-shadow: 0 40px 90px -24px rgba(0,0,0,.55);
    }
    /* Keeps the support bubble pinned to the "phone" card's own corner    */
    /* instead of drifting off to the real browser window's corner once    */
    /* the card stops filling the whole viewport.                          */
    .support-fab{
      right: calc(50vw - (var(--shell-w) / 2) + 1.25rem);
      bottom: calc(50vh - (min(880px, 94vh) / 2) + 1.25rem);
    }
    /* Same reasoning as .support-fab above: keep it anchored to the       */
    /* card's own bottom edge, not the real browser window's.              */
    .update-banner{
      bottom: calc(50vh - (min(880px, 94vh) / 2) + 1rem);
    }
    .telegram-promo-banner{
      top: calc(50vh - (min(880px, 94vh) / 2) + 1rem);
    }
    /* Bottom sheets (Settings, Rules, Stats, QR, Support chat…) still dim */
    /* the whole browser window — that reads fine as a normal dialog       */
    /* backdrop — but the sheet itself should slide up from the "phone"    */
    /* card's own bottom edge, not the real window's, or it'd look like    */
    /* it's floating below the card with a gap underneath it.              */
    .modal-overlay{
      padding-bottom: calc(50vh - (min(880px, 94vh) / 2));
    }
    /* A small bit of extra polish for mouse pointers, on top of           */
    /* GameCard's own hover:scale-105 — guarded by the same media query so */
    /* a touchscreen never gets a "stuck" hover state from a tap.          */
    button:not(:disabled):hover{ filter: brightness(1.07); }
  }

  /* Mobile-first button safety net: every <button> in the app gets a         */
  /* comfortable tap target, can't be squeezed by flex siblings, wraps long   */
  /* text instead of overflowing, and gets crisp touch behavior — without     */
  /* having to hand-edit every single button's className. Small round icon   */
  /* buttons (back arrows, the settings gear, close ×, steppers) keep their   */
  /* own compact circular size instead of being stretched to the floor.      */
  button{
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  button:not([class*="rounded-full"]){
    min-height: 50px;
  }
</style>

<script>
  // Last-resort crash reporting: a fatal error anywhere (React render,
  // an event handler, a rejected promise, or a plain script error) shows
  // a small overlay with a "copy report" button, instead of a silent
  // frozen screen with no way to tell us what happened. Deliberately
  // vanilla JS (not React) and registered before the app script runs, so
  // it still works even if the crash is inside React itself or the babel
  // script fails to parse.
  // Returns a structured report (not just formatted text) so the overlay
  // below can both show a human-readable copy of it AND silently beacon
  // the same fields to /api/support-ticket — that endpoint already relays
  // to the Discord webhook used for manual bug reports, so this just
  // means Erik finds out about a crash from Discord instead of only ever
  // hearing about it if someone bothers to copy-paste and send the report
  // themselves. The on-screen overlay and its "copy report"/"start over"
  // buttons are unchanged; this only adds a background beacon alongside them.
  function hatsitFormatErrorReport(error, extra) {
    var message = error && error.message ? error.message : String(error);
    var stack = error && error.stack ? String(error.stack).split("\n").slice(0, 15).join("\n") : "";
    var componentStack = extra && extra.componentStack ? String(extra.componentStack).split("\n").slice(0, 10).join("\n") : "";
    var screen = "неизвестен";
    try {
      var saved = sessionStorage.getItem("hatsit_app_state_v1");
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && parsed.screen) screen = parsed.screen;
      }
    } catch (e) {}
    var userAgent = navigator.userAgent;
    var online = navigator.onLine;

    var lines = [];
    lines.push("Хатсит — отчёт об ошибке");
    lines.push("Время: " + new Date().toISOString());
    lines.push("Сообщение: " + message);
    if (stack) lines.push("Stack:\n" + stack);
    if (componentStack) lines.push("Component stack:\n" + componentStack);
    lines.push("Экран: " + screen);
    lines.push("Браузер: " + userAgent);
    lines.push("Онлайн: " + (online ? "да" : "нет"));

    return { text: lines.join("\n"), message: message, stack: stack, componentStack: componentStack, screen: screen, userAgent: userAgent, online: online };
  }

  // Fire-and-forget: never blocks or delays the crash overlay below, and
  // any failure (offline, endpoint down, webhook not configured yet) is
  // silently swallowed — a user mid-crash should never see a second error
  // about the error-reporting itself.
  function hatsitBeaconCrashReport(report) {
    try {
      var payload = JSON.stringify({
        type: "crash",
        message: report.message,
        stack: [report.stack, report.componentStack].filter(Boolean).join("\n\n"),
        screen: report.screen,
        userAgent: report.userAgent,
        online: report.online,
      });
      if (navigator.sendBeacon) {
        navigator.sendBeacon("/api/support-ticket", payload);
      } else {
        fetch("/api/support-ticket", { method: "POST", headers: { "Content-Type": "application/json" }, body: payload, keepalive: true }).catch(function () {});
      }
    } catch (e) {}
  }

  var __hatsitCrashShown = false;
  function hatsitShowCrashOverlay(report) {
    if (__hatsitCrashShown) return;
    __hatsitCrashShown = true;
    hatsitBeaconCrashReport(report);
    try {
      var overlay = document.createElement("div");
      overlay.setAttribute(
        "style",
        "position:fixed;inset:0;z-index:99999;background:#0b0e14;color:#f2f2f2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;text-align:center;"
      );
      overlay.innerHTML =
        '<div style="font-size:40px;margin-bottom:12px;">⚠️</div>' +
        '<div style="font-size:20px;font-weight:600;margin-bottom:8px;">Что-то пошло не так</div>' +
        '<div style="font-size:14px;opacity:.7;max-width:320px;margin-bottom:24px;">Приложение столкнулось с ошибкой. Скопируйте отчёт и пришлите его — это поможет быстро найти причину.</div>' +
        '<button id="__hatsitCrashCopyBtn" style="width:260px;padding:14px;border-radius:16px;background:#e8b545;color:#0b0e14;font-weight:600;font-size:15px;border:none;margin-bottom:12px;">Скопировать отчёт</button>' +
        '<button id="__hatsitCrashReloadBtn" style="width:260px;padding:14px;border-radius:16px;background:transparent;color:#f2f2f2;font-weight:500;font-size:15px;border:1px solid rgba(255,255,255,.2);">Начать заново</button>';
      document.body.appendChild(overlay);
      var copyBtn = overlay.querySelector("#__hatsitCrashCopyBtn");
      var reloadBtn = overlay.querySelector("#__hatsitCrashReloadBtn");
      copyBtn.addEventListener("click", function () {
        try {
          navigator.clipboard.writeText(report.text);
          copyBtn.textContent = "Скопировано!";
          setTimeout(function () {
            copyBtn.textContent = "Скопировать отчёт";
          }, 1500);
        } catch (e) {}
      });
      reloadBtn.addEventListener("click", function () {
        try {
          sessionStorage.clear();
        } catch (e) {}
        window.location.reload();
      });
    } catch (e) {}
  }

  window.addEventListener("error", function (e) {
    // Scripts from other origins (React/Babel/Supabase-js/Telegram's own
    // SDK, all loaded from CDNs) get their error details stripped by the
    // browser for security — no real message, no filename, no e.error
    // object, just the literal string "Script error.". This happens a lot
    // right when the user backgrounds/minimizes the Telegram WebView (a
    // socket or fetch gets cut off mid-flight) and is essentially always
    // harmless noise, not an actual app crash — there's nothing in it we
    // could act on even if we wanted to. Showing the full "something broke"
    // overlay (and pinging Discord) for these was scaring users over
    // nothing, so they're ignored here; a real bug in our own code always
    // comes through with a proper message/stack and still triggers the
    // overlay normally below.
    if (!e.error && !e.filename && e.message === "Script error.") return;
    hatsitShowCrashOverlay(hatsitFormatErrorReport(e.error || new Error(e.message || "Unknown error")));
  });
  window.addEventListener("unhandledrejection", function (e) {
    hatsitShowCrashOverlay(hatsitFormatErrorReport(e.reason instanceof Error ? e.reason : new Error(String(e.reason))));
  });
</script>

<script>
  /*
   * Minimal, dependency-free QR Code encoder (Byte mode only, EC level L,
   * versions 1-6). Written from scratch so the app never depends on an
   * external CDN for this feature. Exposes `HatsitQR.encode(text)` which
   * returns { size, isDark(row, col) } describing the module matrix.
   *
   * Verified with an extensive offline round-trip test suite (own bit-level
   * decoder plus two independent real QR decoders across versions 1-6 and
   * many realistic invite URLs) before being inlined here.
   */
  (function (global) {
    "use strict";

    // ---------- GF(256) tables (primitive polynomial x^8+x^4+x^3+x^2+1 = 0x11D) ----------
    var GF_EXP = new Array(512);
    var GF_LOG = new Array(256);
    (function initGF() {
      var x = 1;
      for (var i = 0; i < 255; i++) {
        GF_EXP[i] = x;
        GF_LOG[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11d;
      }
      for (var i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
    })();

    function gfMul(a, b) {
      if (a === 0 || b === 0) return 0;
      return GF_EXP[GF_LOG[a] + GF_LOG[b]];
    }

    // Reed-Solomon generator polynomial for `degree` EC codewords.
    function rsGeneratorPoly(degree) {
      var poly = [1];
      for (var i = 0; i < degree; i++) {
        var res = new Array(poly.length + 1).fill(0);
        for (var j = 0; j < poly.length; j++) {
          res[j] ^= poly[j];
          res[j + 1] ^= gfMul(poly[j], GF_EXP[i]);
        }
        poly = res;
      }
      return poly;
    }

    function rsEncode(dataCodewords, ecCount) {
      var generator = rsGeneratorPoly(ecCount);
      var remainder = dataCodewords.concat(new Array(ecCount).fill(0));
      for (var i = 0; i < dataCodewords.length; i++) {
        var coef = remainder[i];
        if (coef === 0) continue;
        for (var j = 0; j < generator.length; j++) {
          remainder[i + j] ^= gfMul(generator[j], coef);
        }
      }
      return remainder.slice(dataCodewords.length);
    }

    // ---------- Version table: EC level L only, versions 1-6 ----------
    var VERSION_TABLE = {
      1: { totalCw: 26, ecPerBlock: 7, numBlocks: 1, size: 21 },
      2: { totalCw: 44, ecPerBlock: 10, numBlocks: 1, size: 25 },
      3: { totalCw: 70, ecPerBlock: 15, numBlocks: 1, size: 29 },
      4: { totalCw: 100, ecPerBlock: 20, numBlocks: 1, size: 33 },
      5: { totalCw: 134, ecPerBlock: 26, numBlocks: 1, size: 37 },
      6: { totalCw: 172, ecPerBlock: 18, numBlocks: 2, size: 41 },
    };
    var ALIGNMENT_CENTER = { 2: 18, 3: 22, 4: 26, 5: 30, 6: 34 }; // single extra alignment pattern at (c,c)

    function dataCodewordCount(v) {
      var t = VERSION_TABLE[v];
      return t.totalCw - t.ecPerBlock * t.numBlocks;
    }

    function charCountBits(v) {
      return v <= 9 ? 8 : 16; // byte mode; we only go up to v6 so always 8
    }

    function pickVersion(byteLen) {
      for (var v = 1; v <= 6; v++) {
        var dataCw = dataCodewordCount(v);
        var headerBits = 4 + charCountBits(v);
        var capacityBits = dataCw * 8;
        var neededBits = headerBits + byteLen * 8;
        if (neededBits <= capacityBits) return v;
      }
      return null; // caller must handle (shouldn't happen for our URLs)
    }

    function utf8Bytes(str) {
      return Array.from(new TextEncoder().encode(str));
    }

    function buildBitStream(bytes, version) {
      var bits = [];
      function push(value, len) {
        for (var i = len - 1; i >= 0; i--) bits.push((value >> i) & 1);
      }
      push(0x4, 4); // byte mode indicator
      push(bytes.length, charCountBits(version));
      for (var i = 0; i < bytes.length; i++) push(bytes[i], 8);

      var dataCw = dataCodewordCount(version);
      var capacityBits = dataCw * 8;

      // Terminator (up to 4 bits)
      for (var i = 0; i < 4 && bits.length < capacityBits; i++) bits.push(0);
      // Pad to byte boundary
      while (bits.length % 8 !== 0) bits.push(0);
      // Convert to bytes so far
      var codewords = [];
      for (var i = 0; i < bits.length; i += 8) {
        var b = 0;
        for (var j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
        codewords.push(b);
      }
      // Pad codewords with 0xEC/0x11 alternating
      var padToggle = true;
      while (codewords.length < dataCw) {
        codewords.push(padToggle ? 0xec : 0x11);
        padToggle = !padToggle;
      }
      return codewords;
    }

    function interleave(dataCodewords, version) {
      var t = VERSION_TABLE[version];
      var numBlocks = t.numBlocks;
      var ecPerBlock = t.ecPerBlock;
      var totalData = dataCodewords.length;
      var baseLen = Math.floor(totalData / numBlocks);
      var extra = totalData % numBlocks; // blocks with one extra data codeword, higher index blocks get it
      var blocks = [];
      var ecBlocks = [];
      var offset = 0;
      for (var b = 0; b < numBlocks; b++) {
        var len = baseLen + (b >= numBlocks - extra ? 1 : 0);
        var block = dataCodewords.slice(offset, offset + len);
        offset += len;
        blocks.push(block);
        ecBlocks.push(rsEncode(block, ecPerBlock));
      }
      var result = [];
      var maxDataLen = Math.max.apply(null, blocks.map(function (b) { return b.length; }));
      for (var i = 0; i < maxDataLen; i++) {
        for (var b = 0; b < numBlocks; b++) {
          if (i < blocks[b].length) result.push(blocks[b][i]);
        }
      }
      for (var i = 0; i < ecPerBlock; i++) {
        for (var b = 0; b < numBlocks; b++) {

    }

    // ---------- Matrix construction ----------
    function makeMatrix(size) {

    }

    function placeFinder(m, row, col) {
      for (var r = -1; r <= 7; r++) {
        for (var c = -1; c <= 7; c++) {
          var rr = row + r, cc = col + c;
          if (rr < 0 || cc < 0 || rr >= m.length || cc >= m.length) continue;
          var dark = false;
          if (r >= 0 && r <= 6 && c >= 0 && c <= 6) {
            if (r === 0 || r === 6 || c === 0 || c === 6) dark = true;
            else if (r >= 2 && r <= 4 && c >= 2 && c <= 4) dark = true;
            else dark = false;
          } else {
            dark = false; // separator (white border)
          }
          m[rr][cc] = dark;
        }
      }
    }

    function placeAlignment(m, row, col) {
      for (var r = -2; r <= 2; r++) {
        for (var c = -2; c <= 2; c++) {
          var dark = (Math.max(Math.abs(r), Math.abs(c)) !== 1);
          m[row + r][col + c] = dark;
        }
      }
    }

    function placeTiming(m) {
      var size = m.length;
      for (var i = 8; i < size - 8; i++) {
        if (m[6][i] === null) m[6][i] = i % 2 === 0;
        if (m[i][6] === null) m[i][6] = i % 2 === 0;
      }
    }

    function buildReservedMask(size, version) {
      var mask = [];
      for (var r = 0; r < size; r++) mask.push(new Array(size).fill(false));
      function markBlock(r0, c0, r1, c1) {
        for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) {
          if (r >= 0 && c >= 0 && r < size && c < size) mask[r][c] = true;
        }
      }
      // Finder + separators (8x8 corners)
      markBlock(0, 0, 7, 7);
      markBlock(0, size - 8, 7, size - 1);
      markBlock(size - 8, 0, size - 1, 7);
      // Timing patterns
      for (var i = 0; i < size; i++) { mask[6][i] = true; mask[i][6] = true; }
      // Alignment pattern
      if (ALIGNMENT_CENTER[version]) {
        var c = ALIGNMENT_CENTER[version];
        markBlock(c - 2, c - 2, c + 2, c + 2);
      }
      // Dark module + format info areas
      markBlock(size - 8, 8, size - 8, 8);
      markBlock(0, 8, 8, 8);
      markBlock(8, 0, 8, 8);
      markBlock(8, size - 8, 8, size - 1);
      markBlock(size - 7, 8, size - 1, 8);
      return mask;
    }

    var MASK_FUNCS = [
      function (r, c) { return (r + c) % 2 === 0; },
      function (r, c) { return r % 2 === 0; },
      function (r, c) { return c % 3 === 0; },
      function (r, c) { return (r + c) % 3 === 0; },
      function (r, c) { return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0; },
      function (r, c) { return ((r * c) % 2) + ((r * c) % 3) === 0; },
      function (r, c) { return (((r * c) % 2) + ((r * c) % 3)) % 2 === 0; },
      function (r, c) { return (((r + c) % 2) + ((r * c) % 3)) % 2 === 0; },
    ];

    function placeData(m, reserved, codewords) {
      var size = m.length;
      var bitIndex = 0;
      var bits = [];
      for (var i = 0; i < codewords.length; i++) {
        for (var b = 7; b >= 0; b--) bits.push((codewords[i] >> b) & 1);
      }
      var col = size - 1;
      var upward = true;
      while (col > 0) {
        if (col === 6) col--; // skip timing column
        for (var i = 0; i < size; i++) {
          var row = upward ? size - 1 - i : i;
          for (var cOff = 0; cOff < 2; cOff++) {
            var cc = col - cOff;
            if (reserved[row][cc]) continue;
            var bit = bitIndex < bits.length ? bits[bitIndex] : 0;
            bitIndex++;
            m[row][cc] = bit === 1;
          }
        }
        upward = !upward;
        col -= 2;
      }
    }

    function applyMask(m, reserved, maskFn) {
      var size = m.length;
      var out = makeMatrix(size);
      for (var r = 0; r < size; r++) {
        for (var c = 0; c < size; c++) {
          if (reserved[r][c]) { out[r][c] = m[r][c]; continue; }
          var bit = m[r][c] === true ? 1 : 0;
          if (maskFn(r, c)) bit ^= 1;
          out[r][c] = bit === 1;
        }
      }
      return out;
    }

    function penalty(m) {
      var size = m.length;
      var score = 0;
      // Rule 1: runs of 5+ same color in a row/column
      function runPenalty(getVal) {
        var p = 0;
        for (var i = 0; i < size; i++) {
          var run = 1;
          var prev = getVal(i, 0);
          for (var j = 1; j < size; j++) {
            var v = getVal(i, j);
            if (v === prev) {
              run++;
            } else {
              if (run >= 5) p += 3 + (run - 5);
              run = 1;
              prev = v;
            }
          }
          if (run >= 5) p += 3 + (run - 5);
        }
        return p;
      }
      score += runPenalty(function (i, j) { return m[i][j]; });
      score += runPenalty(function (i, j) { return m[j][i]; });
      // Rule 2: 2x2 blocks of the same color
      for (var r = 0; r < size - 1; r++) {
        for (var c = 0; c < size - 1; c++) {
          var v = m[r][c];
          if (v === m[r][c + 1] && v === m[r + 1][c] && v === m[r + 1][c + 1]) score += 3;
        }
      }
      // Rule 3: finder-pattern-like runs (1:1:3:1:1 with 4 light modules on
      // either side) confuse real-world scanners even though the data is
      // still technically valid — this is what keeps a mask pattern that
      // scans unreliably from ever being selected.
      function hasFinderLikeRun(vals, start) {
        var core = [true, false, true, true, true, false, true];
        for (var k = 0; k < 7; k++) if (vals[start + k] !== core[k]) return false;
        var beforeOk = true;
        for (var k = 1; k <= 4; k++) { var idx = start - k; if (idx >= 0 && vals[idx] !== false) { beforeOk = false; break; } }
        var afterOk = true;
        for (var k = 0; k < 4; k++) { var idx = start + 7 + k; if (idx < vals.length && vals[idx] !== false) { afterOk = false; break; } }
        return beforeOk || afterOk;
      }
      function rule3Penalty(getVal) {
        var p = 0;
        for (var i = 0; i < size; i++) {
          var vals = [];
          for (var j = 0; j < size; j++) vals.push(getVal(i, j));
          for (var j = 0; j + 7 <= size; j++) {
            if (hasFinderLikeRun(vals, j)) p += 40;
          }
        }
        return p;
      }
      score += rule3Penalty(function (i, j) { return m[i][j]; });
      score += rule3Penalty(function (i, j) { return m[j][i]; });
      // Rule 4: overall dark/light balance, penalizing deviation from 50%.
      var dark = 0;
      for (var r = 0; r < size; r++) for (var c = 0; c < size; c++) if (m[r][c]) dark++;
      var percent = (dark / (size * size)) * 100;
      var prevMult = Math.floor(percent / 5) * 5;
      var nextMult = prevMult + 5;
      score += Math.min(Math.abs(prevMult - 50), Math.abs(nextMult - 50)) / 5 * 10;
      return score;
    }

    // ---------- Format info (EC level L = binary 01) ----------
    function formatBCH(data5) {
      var g = 0x537; // generator polynomial 10100110111
      var val = data5 << 10;
      for (var i = 4; i >= 0; i--) {
        if (val & (1 << (i + 10))) val ^= g << i;
      }
      return val & 0x3ff;
    }

    function writeFormatInfo(m, maskIdx, size) {
      var ecBits = 0x01; // L
      var data5 = (ecBits << 3) | maskIdx;
      var bch = formatBCH(data5);
      var format = ((data5 << 10) | bch) ^ 0x5412;
      var f = [];
      for (var i = 14; i >= 0; i--) f.push((format >> i) & 1); // f[0..14], MSB first

      // First (top-left) copy, per ISO 18004 Fig. 25.
      for (var c = 0; c <= 5; c++) m[8][c] = f[c] === 1;
      m[8][7] = f[6] === 1;
      m[8][8] = f[7] === 1;
      m[7][8] = f[8] === 1;
      var vertRows2 = [5, 4, 3, 2, 1, 0];
      for (var i = 0; i < vertRows2.length; i++) m[vertRows2[i]][8] = f[9 + i] === 1;

      // Second (redundant) copy.
      for (var i = 0; i < 8; i++) m[8][size - 1 - i] = f[i] === 1;
      for (var i = 0; i < 7; i++) m[size - 7 + i][8] = f[8 + i] === 1;
    }

    function encode(text) {
      var bytes = utf8Bytes(text);
      var version = pickVersion(bytes.length);
      if (!version) throw new Error("QR: text too long for supported versions (max ~130 bytes)");
      var size = VERSION_TABLE[version].size;

      var dataCodewords = buildBitStream(bytes, version);
      var allCodewords = interleave(dataCodewords, version);

      var base = makeMatrix(size);
      placeFinder(base, 0, 0);
      placeFinder(base, 0, size - 7);
      placeFinder(base, size - 7, 0);
      placeTiming(base);
      if (ALIGNMENT_CENTER[version]) {
        var c = ALIGNMENT_CENTER[version];
        placeAlignment(base, c, c);
      }
      base[size - 8][8] = true; // dark module

      var reserved = buildReservedMask(size, version);
      placeData(base, reserved, allCodewords);

      // Mask pattern 7 is deliberately excluded here: extensive round-trip
      // testing (a from-scratch bit-level decoder plus two independent
      // real QR decoders) showed patterns 0-6 always scan reliably for
      // this app's inputs, while pattern 7 intermittently failed on real
      // decoders despite passing our own bit-level correctness check — so
      // rather than risk shipping something occasionally unscannable, we
      // simply never pick it.

րդագույն ֆլամինգո, իսկ բնակարանի տերը երդվում է, որ երբեք թռչուն չի գնել։"}},{title:{ru:"Дело о неправильно припаркованном самокате",en:"The Case of the Badly Parked Scooter",hy:"Սխալ կայանված սամոկատի գործը"},description:{ru:"Электросамокат перегородил единственный въезд во двор, из-за чего скорая помощь не смогла проехать вовремя, вызвав скандал среди жильцов.",en:"An e-scooter blocked the only entrance to the courtyard, so an ambulance couldn't get through in time, sparking outrage among the residents.",hy:"Էլեկտրական սամոկատը փակել է բակի միակ մուտքը, ինչի պատճառով շտապօգնությունը ժամանակին չի կարողացել հասնել՝ բնակիչների մոտ սկանդալ առաջացնելով։"}},{title:{ru:"Дело о краже последнего пельменя",en:"The Case of the Last Dumpling",hy:"Վերջին խինկալիի գողության գործը"},description:{ru:"На корпоративе кто-то съел последний пельмень с общей тарелки, хотя рядом лежала записка «Не трогать — для Валеры».",en:`At the office party someone ate the last dumpling off the shared plate, even though a note next to it read "Don't touch — for Steve."`,hy:"Կորպորատիվում ինչ-որ մեկը կերել է ընդհանուր ափսեից վերջին խինկալին, թեև կողքին գրառում կար՝ «Մի դիպչեք՝ Վալերայի համար է»։"}},{title:{ru:"Дело о перевороте в офисе",en:"The Case of the Office Coup",hy:"Գրասենյակային հեղաշրջման գործը"},description:{ru:"Офисный кот Барсик оказался заперт в переговорной вместе с важными документами, а печать компании отпечаталась на его лапе.",en:"The office cat got locked in the meeting room with important documents, and the company stamp somehow ended up printed on its paw.",hy:"Գրասենյակի Բարսիկ կատուն փակված է հայտնվել բանակցությունների սենյակում կարևոր փաստաթղթերի հետ միասին, և ընկերության կնիքը հայտնվել է նրա թաթին։"}},{title:{ru:"Дело о фальшивом дипломе клоуна",en:"The Case of the Fake Clown Diploma",hy:"Կլոունի կեղծ դիպլոմի գործը"},description:{ru:"Аниматор на детском празднике предъявил диплом «магистра баллонного моделирования», который оказался нарисован цветными фломастерами.",en:`A children's party entertainer presented a "Master of Balloon Modeling" diploma that turned out to be hand-drawn with colored markers.`,hy:"Մանկական տոնակատարության վրա անիմատորը ցույց է տվել «փուչիկների մոդելավորման մագիստրոսի» դիպլոմ, որը, պարզվել է, նկարված է եղել գունավոր ֆլոմաստերներով։"}},{title:{ru:"Дело о соседском Wi-Fi",en:"The Case of the Neighbor's Wi-Fi",hy:"Հարևանի Wi-Fi-ի գործը"},description:{ru:"Один из соседей несколько месяцев тайно пользовался чужим Wi-Fi под именем сети «FBI Surveillance Van 4», о чём хозяин узнал только из счёта за трафик.",en:`One neighbor secretly used someone else's Wi-Fi network, named "FBI Surveillance Van 4," for months — the owner only found out from the data bill.`,hy:"Հարևաններից մեկը մի քանի ամիս գաղտնի օգտվել է ուրիշի Wi-Fi-ից՝ «FBI Surveillance Van 4» անունով ցանցից, ինչի մասին տերը իմացել է միայն ինտերնետի հաշվից։"}},{title:{ru:"Дело о громкой музыке в 3 часа ночи",en:"The Case of the 3 AM Karaoke",hy:"Գիշերվա ժամը 3-ի բարձր երաժշտության գործը"},description:{ru:"В квартире на пятом этаже кто-то включил караоке на полную громкость в 3 часа ночи, распевая один и тот же куплет по кругу.",en:"Someone in the fifth-floor apartment blasted karaoke at 3 AM, singing the same verse over and over on a loop.",hy:"Հինգերորդ հարկի բնակարանում ինչ-որ մեկը գիշերվա ժամը 3-ին լիաձայն միացրել է կարաոկե՝ նույն տողը կրկնելով անընդհատ։"}},{title:{ru:"Дело о съеденном подарке",en:"The Case of the Eaten Gift",hy:"Կերած նվերի գործը"},description:{ru:"Праздничный торт, купленный в подарок начальнику на юбилей, был найден наполовину съеденным в комнате отдыха за час до вручения.",en:"The cake bought as a birthday gift for the boss was found half-eaten in the break room, an hour before it was supposed to be presented.",hy:"Պետի հոբելյանի համար նվեր գնված տոնական տորթը հանգստի սենյակում հայտնաբերվել է կիսակեր՝ հանձնումից մեկ ժամ առաջ։"}},{title:{ru:"Дело о секретном рецепте бабушки",en:"The Case of Grandma's Secret Recipe",hy:"Տատիկի գաղտնի բաղադրատոմսի գործը"},description:{ru:"Фамильный рецепт пирога, который семья хранила три поколения, оказался опубликован в интернете под чужим именем за неделю до семейного ужина.",en:"The family pie recipe, kept secret for three generations, turned up published online under someone else's name a week before the family dinner.",hy:"Ընտանեկան կարկանդակի բաղադրատոմսը, որը երեք սերունդ գաղտնի էր պահվել, հայտնվել է ինտերնետում ուրիշի անունով՝ ընտանեկան ընթրիքից մեկ շաբաթ առաջ։"}}],COURT_EVIDENCE_GUILTY={ru:["На вашей одежде найдены следы, совпадающие с местом происшествия.","Свидетели видели вас поблизости незадолго до случившегося.","У вас не было алиби на момент происшествия.","Вы поспешно покинули место действия, никому не сказав ни слова.","В вашей переписке найдено подозрительное упоминание этого дела.","Вы единственный, кто знал код от двери в комнату происшествия.","Ваши отпечатки обнаружены на ключевом предмете улик.","Незадолго до происшествия вы публично высказывали недовольство пострадавшим.","У вас была явная выгода от произошедшего.","Вы дважды меняли свою версию событий при опросе."],en:["Traces matching the scene were found on your clothes.","Witnesses saw you nearby shortly before it happened.","You had no alibi at the time of the incident.","You left the scene in a hurry without a word to anyone.","A suspicious mention of this case was found in your messages.","You were the only one who knew the door code to the room.","Your fingerprints were found on a key piece of evidence.","Shortly before the incident you publicly voiced complaints about the victim.","You clearly stood to benefit from what happened.","You changed your version of events twice during questioning."],hy:["Ձեր հագուստի վրա հայտնաբերվել են դեպքի վայրին համընկնող հետքեր։","Վկաները ձեզ տեսել են մոտակայքում դեպքից քիչ առաջ։","Դեպքի պահին դուք ալիբի չունեիք։","Դուք շտապ լքել եք դեպքի վայրը՝ ոչ մեկին ոչինչ չասելով։","Ձեր նամակագրության մեջ հայտնաբերվել է այս գործի կասկածելի հիշատակում։","Դուք միակն էիք, ով գիտեր դեպքի սենյակի դռան կոդը։","Ձեր մատնահետքերը հայտնաբերվել են ապացույցի հիմնական իրի վրա։","Դեպքից քիչ առաջ դուք հրապարակավ դժգոհություն էիք հայտնել տուժողից։","Դուք ակնհայտ շահ ունեիք կատարվածից։","Հարցաքննության ժամանակ դուք երկու անգամ փոխել եք ձեր վարկածը։"]},COURT_EVIDENCE_VICTIM={ru:["Именно вы обнаружили пропажу и подняли тревогу.","У вас есть запись с камеры, но она обрывается на важном моменте.","Ваши показания несколько раз менялись в мелких деталях.","Вы могли выиграть от сочувствия окружающих в этой ситуации.","Свидетели подтверждают, что вы были расстроены ещё до происшествия.","У вас есть скрытый мотив, о котором вы не хотите говорить.","Вы отказались показать содержимое своей сумки при проверке.","Ваш рассказ во всех деталях совпадает с уликами на месте.","Незадолго до случившегося вы громко жаловались на то, что вскоре пострадало.","Вы единственный, кто не удивился, узнав о произошедшем."],en:["You were the one who discovered the loss and raised the alarm.","You have camera footage, but it cuts off at the key moment.","Your account has changed slightly in the details a few times.","You stood to gain from other people's sympathy in this situation.","Witnesses confirm you were upset even before the incident.","You have a hidden motive you don't want to talk about.","You refused to show the contents of your bag when asked.","Your story matches the evidence at the scene down to the last detail.","Shortly before it happened, you loudly complained about the very thing that got damaged.","You're the only one who wasn't surprised to hear what happened."],hy:["Հենց դուք եք հայտնաբերել կորուստը և տագնապ բարձրացրել։","Դուք ունեք տեսախցիկի տեսագրություն, բայց այն ընդհատվում է կարևոր պահին։","Ձեր ցուցմունքները մի քանի անգամ մի փոքր փոփոխվել են մանրամասներում։","Այս իրավիճակում շրջապատի կարեկցանքից դուք կարող էիք շահել։","Վկաները հաստատում են, որ դեպքից առաջ էլ դուք վրդովված էիք։","Դուք ունեք թաքնված մոտիվ, որի մասին չեք ուզում խոսել։","Ստուգման ժամանակ դուք հրաժարվել եք ցույց տալ ձեր պայուսակի պարունակությունը։","Ձեր պատմությունը բոլոր մանրամասներով համընկնում է դեպքի վայրի ապացույցների հետ։","Դեպքից քիչ առաջ դուք բարձրաձայն դժգոհում էիք հենց այն բանից, ինչը հետո տուժեց։","Դուք միակն էիք, ով չզարմացավ՝ իմանալով կատարվածի մասին։"]},COURT_EVIDENCE_SECRETARY={ru:["Вам поручено вести протокол и подсчитывать голоса присяжных — будьте предельно точны.","У вас случайно оказалась черновая записка с чьими-то первыми показаниями.","Вы слышали обрывок разговора в коридоре суда, но не уверены, что это важно.","Ваша обязанность — объявить итоговые цифры голосования, не добавляя своего мнения.","На вашем столе лежит список свидетелей, которых ещё не опросили.","Вы заметили, что один из документов дела помечен как «неполный».","Судья доверил именно вам хранить оригинал протокола заседания.","Вы обязаны подсчитать голоса присяжных и передать итог Судье.","У вас есть блокнот, куда стоит записывать интересные детали процесса.","Ваша роль формально нейтральна, но именно от вашей точности зависит исход."],en:["You're in charge of the minutes and counting the jury's votes — be precise.","You happen to have a rough note with someone's first statement.","You overheard a snippet of conversation in the courthouse hallway, though you're not sure it matters.","It's your job to announce the final vote count without adding your own opinion.","There's a list on your desk of witnesses who haven't been questioned yet.",'You noticed one of the case documents is marked "incomplete."',"The Judge trusted you specifically to keep the original meeting record.","You're required to tally the jury's votes and hand the result to the Judge.","You have a notebook where you should jot down interesting details of the trial.","Your role is formally neutral, but the outcome depends on your accuracy."],hy:["Ձեզ հանձնարարված է վարել արձանագրությունը և հաշվել երդվյալների ձայները․ եղեք չափազանց ճշգրիտ։","Ձեր մոտ պատահաբար հայտնվել է սևագիր գրառում ինչ-որ մեկի առաջին ցուցմունքով։","Դուք լսել եք դատարանի միջանցքում խոսակցության մի հատված, բայց վստահ չեք, որ դա կարևոր է։","Ձեր պարտականությունն է հայտարարել քվեարկության վերջնական թվերը՝ առանց ձեր կարծիքն ավելացնելու։","Ձեր սեղանին կա դեռ չհարցաքննված վկաների ցուցակ։","Դուք նկատել եք, որ գործի փաստաթղթերից մեկը նշված է որպես «թերի»։","Հենց ձեզ է Դատավորը վստահել նիստի արձանագրության բնօրինակը պահելը։","Դուք պարտավոր եք հաշվել երդվյալների ձայները և արդյունքը հանձնել Դատավորին։","Ձեզ մոտ կա տետր, որտեղ արժե գրանցել գործընթացի հետաքրքիր մանրամասները։","Ձեր դերը ձևականորեն չեզոք է, բայց հենց ձեր ճշգրտությունից է կախված ելքը։"]},COURT_EVIDENCE_JUROR={ru:["Вам показалось, что Виновный слишком нервничает для невиновного человека.","Вы вспомнили похожий случай из жизни, который случайно подтверждает версию Пострадавшего.","Один из свидетелей ранее говорил вам кое-что, что не прозвучало в зале суда.","Вы сомневаетесь в надёжности представленных улик.","Вам показалось подозрительным поведение Секретаря во время заседания.","Вы уверены, что важная деталь дела до сих пор скрыта от суда.","Интуиция подсказывает вам, что дело не так однозначно, как кажется.","Вы заметили нестыковку в показаниях одного из участников.","Вам симпатизирует один из участников процесса, и это может повлиять на ваше решение.","Вы решили доверять только фактам, озвученным вслух в зале суда."],en:["It seemed to you that the Guilty party is too nervous for an innocent person.","You recalled a similar real-life case that happens to support the Victim's version.","One of the witnesses once told you something that was never mentioned in court.","You have doubts about the reliability of the evidence presented.","The Secretary's behavior during the session struck you as suspicious.","You're sure an important detail of the case is still being hidden from the court.","Your gut tells you the case isn't as clear-cut as it seems.","You noticed an inconsistency in one participant's testimony.","You're sympathetic toward one of the participants, and it may affect your decision.","You've decided to trust only the facts stated out loud in the courtroom."],hy:["Ձեզ թվաց, թե Մեղավորը չափազանց նյարդայնանում է անմեղ մարդու համար։","Դուք հիշեցիք կյանքից նման դեպք, որը պատահաբար հաստատում է Տուժողի վարկածը։","Վկաներից մեկը ձեզ ավելի վաղ ասել էր մի բան, որը դատարանում չհնչեց։","Դուք կասկածում եք ներկայացված ապացույցների հուսալիությանը։","Ձեզ կասկածելի թվաց Քարտուղարի վարքագիծը նիստի ընթացքում։","Դուք վստահ եք, որ գործի կարևոր մի մանրամասն դեռ թաքցված է դատարանից։","Ինտուիցիան ձեզ ասում է, որ գործն այնքան էլ միանշանակ չէ, որքան թվում է։","Դուք նկատել եք անհամապատասխանություն մասնակիցներից մեկի ցուցմունքում։","Ձեզ համակրելի է գործընթացի մասնակիցներից մեկը, և դա կարող է ազդել ձեր որոշման վրա։","Դուք որոշել եք վստահել միայն դատարանում բարձրաձայն հնչած փաստերին։"]},COURT_EVIDENCE_JUDGE={ru:["Вы ведёте процесс: разрешайте говорить по очереди и пресекайте хаос.","Ваше слово — закон в зале суда; выступления начинаются только с вашего разрешения.","Именно вы объявляете начало и завершение прений сторон.","После голосования присяжных и подсчёта Секретаря именно вы выносите вердикт.","Вы вправе прервать любого участника, если порядок в зале нарушен.","Ваша задача — сохранять беспристрастность до самого оглашения вердикта.","Вы решаете, когда предоставить слово Виновному, Пострадавшему или свидетелям.","У вас есть право попросить любого участника предъявить его улику раньше срока.","Финальное решение по делу остаётся за вами — взвесьте все факты.","Вы следите за дисциплиной и обеспечиваете, чтобы суд не превратился в балаган."],en:["You run the trial: keep speakers in order and shut down chaos.","Your word is law in the courtroom; no one speaks without your permission.","You're the one who declares the start and end of each side's arguments.","After the jury vote and the Secretary's count, you deliver the verdict.","You may interrupt any participant if order in the room breaks down.","Your job is to stay impartial right up until the verdict is announced.","You decide when to give the floor to the Guilty, the Victim, or the witnesses.","You have the right to ask any participant to reveal their evidence early.","The final decision on the case is yours — weigh all the facts.","You keep discipline and make sure the trial doesn't turn into a circus."],hy:["Դուք վարում եք գործընթացը․ թույլ տվեք խոսել հերթով և ընդհատեք քաոսը։","Ձեր խոսքը դատարանում օրենք է․ ելույթները սկսվում են միայն ձեր թույլտվությամբ։","Հենց դուք եք հայտարարում կողմերի բանավեճի սկիզբն ու ավարտը։","Երդվյալների քվեարկությունից և Քարտուղարի հաշվարկից հետո հենց դուք եք կայացնում վճիռը։","Դուք իրավունք ունեք ընդհատել ցանկացած մասնակցի, եթե դահլիճում կարգը խախտվում է։","Ձեր խնդիրն է անաչառ մնալ մինչև իսկ վճռի հայտարարումը։","Դուք որոշում եք, թե երբ տալ խոսք Մեղավորին, Տուժողին կամ վկաներին։","Դուք իրավունք ունեք ցանկացած մասնակցից խնդրել ներկայացնել իր ապացույցը ժամանակից շուտ։","Գործի վերջնական որոշումը ձերն է․ կշռադատեք բոլոր փաստերը։","Դուք հետևում եք կարգապահությանը՝ ապահովելով, որ դատարանը բալագան չվերածվի։"]},COURT_ROLE_DEFS={judge:{label:"Судья",Icon:IconBank,color:"var(--court)",bg:"rgba(224,149,74,.14)"},guilty:{label:"Виновный",Icon:IconAlertTriangle,color:"var(--danger)",bg:"rgba(226,88,90,.14)"},victim:{label:"Пострадавший",Icon:IconHeart,color:"var(--doctor)",bg:"rgba(94,168,230,.14)"},secretary:{label:"Секретарь суда",Icon:IconClipboard,color:"var(--sheriff)",bg:"rgba(166,126,232,.14)"},juror:{label:"Присяжный",Icon:IconUsers,color:"var(--local)",bg:"rgba(75,184,172,.14)"}},COURT_EVIDENCE_BY_ROLE={guilty:COURT_EVIDENCE_GUILTY,victim:COURT_EVIDENCE_VICTIM,secretary:COURT_EVIDENCE_SECRETARY,juror:COURT_EVIDENCE_JUROR,judge:COURT_EVIDENCE_JUDGE};function RulesCard({title:e,color:a,rules:t}){const[n,r]=useState(!1);return React.createElement("div",{className:"bg-[var(--surface)] border border-[var(--border)] rounded-2xl overflow-hidden"},React.createElement("button",{onClick:()=>r(c=>!c),className:"w-full flex items-center justify-between gap-2 px-4 py-3.5 text-left"},React.createElement("span",{className:"flex items-center gap-2 text-sm font-semibold"},React.createElement(IconClipboard,{size:16,style:{color:a}})," ",e),n?React.createElement(IconChevronUp,{size:16,className:"text-[var(--text-faint)]"}):React.createElement(IconChevronDown,{size:16,className:"text-[var(--text-faint)]"})),n&&React.createElement("div",{className:"px-4 pb-4 flex flex-col gap-2"},t.map((c,o)=>React.createElement("div",{key:o,className:"flex items-start gap-2 text-sm text-[var(--text-dim)]"},React.createElement("span",{className:"font-display shrink-0",style:{color:a}},o+1,"."),React.createElement("span",null,c)))))}function RulesSheet({open:e,onClose:a,title:t,color:n,rules:r}){const c=useT(),o=useRef(null);return useModalA11y(o,a,e),e?React.createElement(ModalPortal,null,React.createElement("div",{className:"modal-overlay fixed inset-0 z-50 flex items-end justify-center",onClick:a},React.createElement("div",{className:"fixed inset-0 bg-black/60"}),React.createElement(FadeIn,{className:"relative w-full sheet-w"},React.createElement("div",{ref:o,role:"dialog","aria-modal":"true",tabIndex:-1,className:"bg-[var(--surface)] border-t border-[var(--border-strong)] rounded-t-3xl px-5 pt-3 pb-8 w-full max-h-[80vh] overflow-y-auto",onClick:l=>l.stopPropagation(),style:{paddingBottom:"calc(2rem + env(safe-area-inset-bottom, 0px))"}},React.createElement("div",{className:"w-10 h-1.5 rounded-full bg-[var(--surface-3)] mx-auto mb-4 shrink-0"}),React.createElement("div",{className:"flex items-center justify-between gap-3 mb-4"},React.createElement("h2",{className:"font-display text-2xl flex items-center gap-2",style:{color:n}},React.createElement(IconClipboard,{size:20})," ",t),React.createElement("button",{onClick:a,className:"w-9 h-9 rounded-full flex items-center justify-center text-[var(--text-dim)] active:bg-[var(--surface-2)] shrink-0","aria-label":c("common.close")},React.createElement(IconX,{size:20}))),React.createElement("div",{className:"flex flex-col gap-3"},r.map((l,i)=>React.createElement("div",{key:i,className:"flex items-start gap-2 text-sm text-[var(--text-dim)]"},React.createElement("span",{className:"font-display shrink-0",style:{color:n}},i+1,"."),React.createElement("span",null,l)))))))):null}const SPY_RULES={ru:["Каждый по очереди смотрит на свой экран — локацию либо статус шпиона — и никому его не показывает.","По кругу задавайте друг другу вопросы о месте, стараясь не спалить, знаете вы его или нет.","Шпион не знает локацию и должен вычислить её по ответам, оставаясь незамеченным.","Когда время вышло или все готовы, вслух решите, кто шпион, — само приложение голос не считает.","Если шпиона поймали, он может попытаться угадать локацию и всё равно спастись."],en:["Each player looks at their own screen in turn — the location or their spy status — and shows it to no one.","Take turns asking each other questions about the place, trying not to give away whether you know it or not.","The spy doesn't know the location and must work it out from the answers, without being spotted.","When time runs out or everyone's ready, decide out loud who the spy is — the app itself doesn't count votes.","If the spy gets caught, they can try to guess the location and still escape."],hy:["Յուրաքանչյուրը հերթով նայում է իր էկրանին՝ վայրը կամ իր՝ լրտես լինելու կարգավիճակը, և ոչ ոքի չի ցույց տալիս այն։","Հերթով հարցեր տվեք միմյանց վայրի մասին՝ փորձելով չբացահայտել, թե գիտեք այն, թե ոչ։","Լրտեսը չգիտի վայրը և պետք է այն գուշակի պատասխանների միջոցով՝ առանց նկատվելու։","Երբ ժամանակը սպառվում է կամ բոլորը պատրաստ են, բարձրաձայն որոշեք, թե ով է լրտեսը — հավելվածն ինքը ձայներ չի հաշվում։","Եթե լրտեսը բռնվում է, նա կարող է փորձել գուշակել վայրը և այնուամենայնիվ փրկվել։"]},ALIAS_RULES={ru:["Объясняющий не называет однокоренные слова, части слова и не переводит его на другой язык.","Жесты и пантомима запрещены — только слова.","Угаданное слово — плюс балл, слово пропустили — минус балл.","Объясняющий передаёт телефон следующей команде, когда время выходит."],en:["The person explaining may not use words with the same root, parts of the word, or translate it into another language.","Gestures and mime are forbidden — words only.","A guessed word is plus one point, a skipped word is minus one point.","The explainer passes the phone to the next team when time runs out."],hy:["Բացատրողը չի կարող օգտագործել նույնարմատ բառեր, բառի մասեր կամ թարգմանել այն այլ լեզվի։","Ժեստերն ու պանտոմիման արգելված են — միայն բառեր։","Գուշակված բառը՝ գումարած մեկ միավոր, բաց թողնված բառը՝ մինուս մեկ միավոր։","Բացատրողը հեռախոսը փոխանցում է հաջորդ թիմին, երբ ժամանակը սպառվում է։"]},CROC_RULES={ru:["Показывающий объясняет слово только жестами и мимикой — никаких слов, звуков и шевеления губами.","Нельзя показывать буквы, их количество или части слова жестами — только образ целиком.","Угаданное слово — плюс балл, слово пропустили — минус балл.","Показывающий передаёт телефон следующей команде, когда время выходит."],en:["The performer explains the word using only gestures and body language — no words, sounds, or mouthing.","You can't spell out letters, show how many there are, or act out parts of the word — only the whole thing.","A guessed word is plus one point, a skipped word is minus one point.","The performer passes the phone to the next team when time runs out."],hy:["Ցուցադրողը բացատրում է բառը միայն ժեստերով ու դիմախաղով — առանց խոսքերի, ձայների ու շուրթերի շարժման։","Չի կարելի ցույց տալ տառերը, դրանց քանակը կամ բառի մասերը ժեստերով — միայն ամբողջական կերպարը։","Գուշակված բառը՝ գումարած մեկ միավոր, բաց թողնված բառը՝ մինուս մեկ միավոր։","Ցուցադրողը հեռախոսը փոխանցում է հաջորդ թիմին, երբ ժամանակը սպառվում է։"]},WORDLESS_RULES={ru:["Каждый раунд все получают свои числа втайне от других — нельзя показывать экран.","Нельзя разговаривать, считать вслух или подавать сигналы — только интуиция и чувство момента.","Кто чувствует, что держит самое маленькое из оставшихся чисел, нажимает своё имя на экране.","Если число оказалось не самым маленьким — минус жизнь, но игра продолжается.","Когда все числа уровня сыграны, начинается следующий уровень — чисел у каждого станет больше."],en:["Each round everyone gets their own numbers in secret — never show your screen to anyone else.","No talking, counting out loud, or signaling — only intuition and a sense of timing.","Whoever feels they're holding the smallest number left taps their own name on the screen.","If the number wasn't actually the smallest, that costs a life, but play continues.","Once every number in the level has been played, the next level starts — everyone gets more numbers."],hy:["Ամեն ռաունդում բոլորը գաղտնի ստանում են իրենց թվերը — երբեք մի ցույց տվեք ձեր էկրանը մյուսներին։","Չի կարելի խոսել, հաշվել բարձրաձայն կամ ազդանշաններ տալ — միայն ինտուիցիա և ժամանակի զգացում։","Ով զգում է, որ իր մոտ մնացած ամենափոքր թիվն է, սեղմում է իր անունը էկրանին։","Եթե թիվը ամենափոքրը չի եղել, դա նվազեցնում է կյանք, բայց խաղը շարունակվում է։","Երբ մակարդակի բոլոր թվերը խաղացվեն, սկսվում է հաջորդ մակարդակը՝ ավելի շատ թվերով յուրաքանչյուրի մոտ։"]},COUNTDOWN_RULES={ru:["Телефон по очереди выдаёт всей компании короткое живое задание — выполняйте его сообща.","У каждого задания есть ограничение по времени — таймер идёт на экране.","Компания сама решает, выполнено задание или нет, и нажимает «Успех» или «Провал».","Иногда вместо задания появляется новое правило — оно остаётся в силе до конца игры и складывается с предыдущими.","Ошибка или время, вышедшее без ответа, стоит жизни; когда жизни заканчиваются — игра окончена."],en:["The phone hands the whole group a short, live task in turn — do it together.","Every task has a time limit — the timer runs on screen.",'The group itself decides whether the task was completed and taps "Success" or "Fail".',"Sometimes a new rule appears instead of a task — it stays in effect for the rest of the game and stacks with earlier ones.","A failure, or running out of time without an answer, costs a life; the game ends when lives run out."],hy:["Հեռախոսը հերթով խաղին տալիս է կարճ, կենդանի առաջադրանք — կատարեք այն միասին։","Յուրաքանչյուր առաջադրանք ունի ժամանակային սահմանափակում — հաշվիչը աշխատում է էկրանին։","Ընկերությունն ինքն է որոշում՝ առաջադրանքը կատարվե՞լ է, թե ոչ, և սեղմում «Հաջողվեց» կամ «Ձախողվեց»։","Երբեմն առաջադրանքի փոխարեն հայտնվում է նոր կանոն — այն մնում է ուժի մեջ մինչև խաղի ավարտը և միանում է նախորդներին։","Ձախողումը կամ ժամանակի ավարտը՝ առանց պատասխանի, նվազեցնում է կյանք. խաղն ավարտվում է, երբ կյանքերը վերջանում են։"]},TELEPHONE_RULES={ru:["Каждый втайне придумывает и записывает свою фразу — это старт его собственной цепочки.","Дальше телефон идёт по кругу: рисуете то, что видите написанным, или угадываете словами то, что видите нарисованным.","Каждый ход видно только то, что оставил предыдущий игрок, — не подглядывайте в более ранние шаги той же цепочки.","За ход отвечает только один человек — все остальные не смотрят на экран, пока не придёт их очередь.","Когда все цепочки пройдут полный круг, приложение покажет каждую целиком — от исходной фразы до последней догадки."],en:["Everyone secretly writes their own phrase — that's the start of their own chain.","Then the phone goes around the circle: draw what you see written, or guess in words what you see drawn.","Each turn you only see what the previous player left — don't peek at earlier steps of the same chain.","Only one person handles each turn — everyone else looks away from the screen until it's their turn.","Once every chain has gone all the way around, the app shows each one in full, from the original phrase to the final guess."],hy:["Յուրաքանչյուրը գաղտնի մտածում և գրում է իր արտահայտությունը — դա իր սեփական շղթայի սկիզբն է։","Հետո հեռախոսը գնում է շրջանով՝ նկարեք այն, ինչ տեսնում եք գրված, կամ բառերով գուշակեք այն, ինչ տեսնում եք նկարված։","Յուրաքանչյուր քայլում երևում է միայն այն, ինչ թողել է նախորդ խաղացողը — մի նայեք նույն շղթայի ավելի վաղ քայլերին։","Յուրաքանչյուր քայլի համար պատասխանատու է միայն մեկ մարդ — մնացածները չեն նայում էկրանին, մինչև իրենց հերթը հասնի։","Երբ բոլոր շղթաները անցնեն ամբողջական շրջան, հավելվածը ցույց կտա յուրաքանչյուրը ամբողջությամբ՝ սկզբնական արտահայտությունից մինչև վերջին գուշակությունը։"]},MAFIA_RULES={ru:["Ночью все закрывают глаза и молчат, пока телефон не попросит открыть их для своего хода.","Роль видит только её обладатель — не показывайте экран соседям.","Днём обсуждение идёт вслух по кругу, затем открытое голосование за исключение.","Исключённый или убитый ночью говорит последнее слово, и лишь потом раскрывается его роль.","Мафия и другие ночные роли не должны выдавать себя жестами или взглядами."],en:["At night everyone closes their eyes and stays silent until the phone asks them to open them for their turn.","Only the role's owner sees it — don't show your screen to your neighbors.","During the day, discussion happens out loud in a circle, followed by an open vote to eliminate someone.","A player who is eliminated or killed at night gets a final word, and only then is their role revealed.","The mafia and other night roles must not give themselves away with gestures or looks."],hy:["Գիշերը բոլորը փակում են աչքերը և լռում, մինչև հեռախոսը կխնդրի բացել դրանք իրենց քայլի համար։","Դերը տեսնում է միայն դրա տերը — էկրանը հարևաններին մի ցույց տվեք։","Ցերեկը քննարկումը տեղի է ունենում բարձրաձայն՝ շրջանով, ապա բացահայտ քվեարկություն՝ ինչ-որ մեկին հեռացնելու համար։","Հեռացված կամ գիշերը սպանված խաղացողն ասում է վերջին խոսքը, և միայն դրանից հետո բացահայտվում է նրա դերը։","Մաֆիան և գիշերային մյուս դերերը չպետք է մատնեն իրենց ժեստերով կամ հայացքներով։"]},BUNKER_RULES={ru:["Каждый раскрывает характеристики своего досье по одной за ход, а не все сразу.","Раскрытую характеристику нельзя скрыть обратно — выбирайте порядок раскрытия обдуманно.","После обсуждения ведущий открывает голосование за то, кто покидает бункер.","Цель — остаться среди выживших или убедить остальных, что вы полезны <script>
  // Service worker for offline support of the fully local games (Шпион,
  // Алиас, Мафия). See sw.js for the caching strategy and, importantly,
  // for why it's deliberately "network-first" everywhere it can be — an
  // earlier, buggier version of this left people stuck on a stale cached
  // copy of the site, which is why this registration is intentionally
  // this conservative. If sw.js is ever missing from a deploy (e.g. only
  // index.html got uploaded), registration just fails silently below and
  // the app keeps working online exactly as before, just without offline
  // support until sw.js is present again.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    });
  }
</script>
