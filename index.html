<script type="text/babel" data-presets="react">
const { useState, useEffect, useReducer, useRef } = React;

/* ---------------------------------------------------------------- */
/* Supabase — used only by Bunker (online multiplayer, Realtime      */
/* Broadcast channels). The other games stay fully offline / local.  */
/* ---------------------------------------------------------------- */
const SUPABASE_URL = "https://zocoaqqcrxpbkyzlfzsf.supabase.co";
const SUPABASE_KEY = "sb_publishable_Lx0UeYb_4GCVq72mbkQRjw_jJk_i3QL";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ---------------------------------------------------------------- */
/* App settings — sound & vibration toggles, persisted on the device */
/* (localStorage). A tiny pub/sub lets any component subscribe, while*/
/* plain (non-React) helpers like the sound engine read the value    */
/* straight off the module-level `hatsitSettings` object.            */
/* ---------------------------------------------------------------- */
function loadHatsitSettings() {
  try {
    const raw = localStorage.getItem("hatsitSettings");
    if (raw) {
      const parsed = JSON.parse(raw);
      return { sound: parsed.sound !== false, vibration: parsed.vibration !== false };
    }
  } catch (e) {}
  return { sound: true, vibration: true };
}
let hatsitSettings = loadHatsitSettings();
const hatsitSettingsListeners = new Set();
function updateHatsitSettings(patch) {
  hatsitSettings = { ...hatsitSettings, ...patch };
  try {
    localStorage.setItem("hatsitSettings", JSON.stringify(hatsitSettings));
  } catch (e) {}
  hatsitSettingsListeners.forEach((fn) => fn(hatsitSettings));
}
function useHatsitSettings() {
  const [settings, setSettings] = useState(hatsitSettings);
  useEffect(() => {
    hatsitSettingsListeners.add(setSettings);
    return () => hatsitSettingsListeners.delete(setSettings);
  }, []);
  return settings;
}
function vibrate(pattern) {
  if (!hatsitSettings.vibration) return;
  try {
    if (navigator.vibrate) navigator.vibrate(pattern);
  } catch (e) {}
}

/* ---------------------------------------------------------------- */
/* Screen Wake Lock — keeps the phone's screen on while an "active   */
/* round" of any game is on screen, and releases it the moment that  */
/* component unmounts (back to the hub, game over, etc). The browser */
/* itself force-releases the lock whenever the tab is hidden, so we   */
/* also re-acquire it on visibilitychange (e.g. phone was locked and   */
/* unlocked mid-round without leaving the page).                     */
/* ---------------------------------------------------------------- */
function useWakeLock(active) {
  const lockRef = useRef(null);
  useEffect(() => {
    if (!active || !("wakeLock" in navigator)) return;
    let cancelled = false;
    async function acquire() {
      try {
        const lock = await navigator.wakeLock.request("screen");
        if (cancelled) {
          lock.release().catch(() => {});
          return;
        }
        lockRef.current = lock;
        lock.addEventListener && lock.addEventListener("release", () => {
          if (lockRef.current === lock) lockRef.current = null;
        });
      } catch (e) {}
    }
    acquire();
    function handleVisibility() {
      if (document.visibilityState === "visible" && !lockRef.current) acquire();
    }
    document.addEventListener("visibilitychange", handleVisibility);
    return () => {
      cancelled = true;
      document.removeEventListener("visibilitychange", handleVisibility);
      if (lockRef.current) {
        lockRef.current.release().catch(() => {});
        lockRef.current = null;
      }
    };
  }, [active]);
}

/* ---------------------------------------------------------------- */
/* PWA install prompt — captures the browser's `beforeinstallprompt`  */
/* event once (module scope, so it isn't missed while no component   */
/* is listening yet) and exposes it to React via a tiny pub/sub, so a */
/* "Установить приложение" button can show up on the hub only when    */
/* the browser has actually offered installation.                    */
/* ---------------------------------------------------------------- */
let deferredInstallPrompt = null;
const installPromptListeners = new Set();
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installPromptListeners.forEach((fn) => fn());
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  installPromptListeners.forEach((fn) => fn());
});
function useInstallPrompt() {
  const [available, setAvailable] = useState(() => !!deferredInstallPrompt);
  useEffect(() => {
    function handleChange() {
      setAvailable(!!deferredInstallPrompt);
    }
    installPromptListeners.add(handleChange);
    return () => installPromptListeners.delete(handleChange);
  }, []);
  async function promptInstall() {
    if (!deferredInstallPrompt) return;
    try {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
    } catch (e) {}
    deferredInstallPrompt = null;
    installPromptListeners.forEach((fn) => fn());
  }
  return { available, promptInstall };
}

/* ---------------------------------------------------------------- */
/* Sound engine — tiny Web Audio API synth, no external audio files. */
/* ---------------------------------------------------------------- */
let __audioCtx = null;
function getAudioCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!__audioCtx) __audioCtx = new AC();
  if (__audioCtx.state === "suspended") {
    __audioCtx.resume().catch(() => {});
  }
  return __audioCtx;
}

function playTone(freq, duration, opts) {
  if (!hatsitSettings.sound) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  const o = opts || {};
  const startTime = ctx.currentTime + (o.delay || 0);
  const osc = ctx.createOscillator();
  const gainNode = ctx.createGain();
  osc.type = o.type || "sine";
  osc.frequency.setValueAtTime(freq, startTime);
  if (o.freqTo != null) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.freqTo), startTime + duration);
  }
  const peak = o.gain != null ? o.gain : 0.12;
  gainNode.gain.setValueAtTime(0.0001, startTime);
  gainNode.gain.linearRampToValueAtTime(peak, startTime + 0.008);
  gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gainNode);
  gainNode.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.03);
}

/* Soft "click" — used for every button press across the whole app. */
function playClickSound() {
  try {
    playTone(520, 0.07, { type: "sine", freqTo: 260, gain: 0.09 });
  } catch (e) {}
}

/* Gentle two-note "dzynь" bell — new player joined the Bunker lobby. */
function playChimeSound() {
  try {
    playTone(880, 0.35, { type: "sine", gain: 0.11 });
    playTone(1318.5, 0.45, { type: "sine", gain: 0.09, delay: 0.09 });
  } catch (e) {}
}

/* Short high tick — Alias countdown in its last seconds. */
function playTickSound() {
  try {
    playTone(1000, 0.05, { type: "square", gain: 0.05 });
  } catch (e) {}
}

/* One global listener plays the click sound for literally any button in  */
/* the app (offline games and Bunker alike) — no need to touch every      */
/* individual onClick handler.                                            */
if (typeof document !== "undefined") {
  document.addEventListener(
    "click",
    (e) => {
      const btn = e.target && e.target.closest && e.target.closest("button");
      if (btn && !btn.disabled) {
        playClickSound();
        vibrate(10);
      }
    },
    true
  );
}

  sheriff: { id: "sheriff", name: "Шериф", short: "Шериф", desc: "Каждую ночь можете проверить одного игрока и узнать, мафия он или нет.", Icon: IconShield, color: "var(--sheriff)", bg: "rgba(166,126,232,.14)" },
  civilian: { id: "civilian", name: "Мирный житель", short: "Мирный", desc: "Внимательно слушайте и вычисляйте мафию вместе с остальными днём.", Icon: IconUsers, color: "var(--local)", bg: "rgba(75,184,172,.14)" },
};

const MIN_PLAYERS = 3, MAX_PLAYERS = 8;
const MIN_MINUTES = 3, MAX_MINUTES = 15;
const MIN_TEAMS = 2, MAX_TEAMS = 4;
const MIN_ALIAS_SECONDS = 30, MAX_ALIAS_SECONDS = 120, ALIAS_SECONDS_STEP = 15;
const MIN_MAFIA_PLAYERS = 5, MAX_MAFIA_PLAYERS = 20;
const MIN_MAFIA_COUNT = 1;
const MIN_MAFIA_DISCUSSION_MIN = 1, MAX_MAFIA_DISCUSSION_MIN = 10;

const defaultNames = (n) => Array.from({ length: n }, (_, i) => `Игрок ${i + 1}`);
const defaultTeamNames = (n) => Array.from({ length: n }, (_, i) => `Команда ${i + 1}`);

const initialMafiaState = {
  roles: [],
  alive: [],
  phase: "roster",
  night: 0,
  revealIndex: 0,
  mafiaTarget: null,
  doctorTarget: null,
  sheriffTarget: null,
  sheriffResult: null,
  lastNightVictim: null,
  lastNightSaved: false,
  dayTimer: { remaining: 0, running: false },
  exileOpen: false,
  exiledIndex: null,
  rosterOpen: false,
  winner: null,
};

const initialState = {
  screen: "hub", // hub | spy-setup | spy-reveal | spy-playing | spy-end | alias-setup | alias-team-intro | alias-playing | alias-round-end | mafia-setup | mafia-reveal | mafia-roster | mafia-game | mafia-end | bunker
  config: {
    count: 4, minutes: 8, names: defaultNames(4),
    aliasTeams: defaultTeamNames(2), aliasSeconds: 60,
    mafiaPlayerCount: 8, mafiaNames: defaultNames(8), mafiaCount: 2, mafiaDoctor: true, mafiaSheriff: true, mafiaDiscussionMinutes: 3,
  },
  game: { location: null, spyIndex: null },
  revealIndex: 0,
  timer: { remaining: 0, running: false },
  endReason: null, // 'timeup' | 'manual'
  alias: {
    scores: [0, 0],
    currentTeam: 0,
    wordOrder: [],
    wordPointer: 0,
    currentWord: "",
    roundScore: 0,
    timer: { remaining: 0, running: false },
  },
  mafia: initialMafiaState,
};

function resizeNames(names, n) {
  const next = names.slice(0, n);
  for (let i = next.length; i < n; i++) next.push(`Игрок ${i + 1}`);
  return next;
}

function resizeTeams(names, n) {
  const next = names.slice(0, n);
  for (let i = next.length; i < n; i++) next.push(`Команда ${i + 1}`);
  return next;
}

function shuffledIndices(len) {
  const arr = Array.from({ length: len }, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function nextAliasWord(alias) {
  let { wordOrder, wordPointer } = alias;
  let pointer = wordPointer + 1;
  if (pointer >= wordOrder.length) {
    wordOrder = shuffledIndices(WORDS.length);
    pointer = 0;
  }
  return { wordOrder, wordPointer: pointer, currentWord: WORDS[wordOrder[pointer]] };
}

function clampMafiaCount(playerCount, mafiaCount) {
  const max = Math.max(MIN_MAFIA_COUNT, Math.floor((playerCount - 1) / 2));
  return Math.min(max, Math.max(MIN_MAFIA_COUNT, mafiaCount));
}

function buildMafiaRoles(playerCount, mafiaCount, doctor, sheriff) {
  const roles = [];
  for (let i = 0; i < mafiaCount; i++) roles.push("mafia");
  if (doctor) roles.push("doctor");
  if (sheriff) roles.push("sheriff");
  while (roles.length < playerCount) roles.push("civilian");
  const order = shuffledIndices(roles.length);
  return order.map((i) => roles[i]);
}

function checkMafiaWinner(roles, alive) {
  let mafiaAlive = 0, othersAlive = 0;
  roles.forEach((r, i) => {
    if (!alive[i]) return;
    if (r === "mafia") mafiaAlive++;
    else othersAlive++;
  });
  if (mafiaAlive === 0) return "town";
  if (mafiaAlive >= othersAlive) return "mafia";
  return null;
}

function nextNightPhase(roles, alive, after) {
  const doctorAlive = roles.some((r, i) => r === "doctor" && alive[i]);
  const sheriffAlive = roles.some((r, i) => r === "sheriff" && alive[i]);
  if (after === "mafia") {
    if (doctorAlive) return "night-doctor";
    if (sheriffAlive) return "night-sheriff";
    return "night-result";
  }
  if (after === "doctor") {
    if (sheriffAlive) return "night-sheriff";
    return "night-result";
  }
  return "night-result";
}

function finalizeMafiaNight(mafia) {
  const { roles, alive, mafiaTarget, doctorTarget } = mafia;
  const nextAlive = alive.slice();
  let victim = null, saved = false;
  if (mafiaTarget !== null && mafiaTarget !== undefined) {
    if (mafiaTarget === doctorTarget) saved = true;
    else {
      victim = mafiaTarget;
      nextAlive[victim] = false;
    }
  }
  const winner = checkMafiaWinner(roles, nextAlive);
  return { alive: nextAlive, victim, saved, winner };
}

function reducer(state, action) {
  switch (action.type) {
    case "GO_HUB":
      return { ...initialState, config: state.config };
    case "OPEN_SPY_SETUP":
      return { ...state, screen: "spy-setup", endReason: null };
    case "OPEN_BUNKER":
      return { ...state, screen: "bunker" };
    case "OPEN_COURT":
      return { ...state, screen: "court" };
    case "SET_COUNT": {
      const count = Math.min(MAX_PLAYERS, Math.max(MIN_PLAYERS, action.value));
      return { ...state, config: { ...state.config, count, names: resizeNames(state.config.names, count) } };
    }
    case "SET_MINUTES": {
      const minutes = Math.min(MAX_MINUTES, Math.max(MIN_MINUTES, action.value));
      return { ...state, config: { ...state.config, minutes } };
    }
    case "SET_NAME": {
      const names = state.config.names.slice();
      names[action.index] = action.value;
      return { ...state, config: { ...state.config, names } };
    }
    case "LAUNCH_SPY": {
      const location = LOCATIONS[Math.floor(Math.random() * LOCATIONS.length)];
      const spyIndex = Math.floor(Math.random() * state.config.count);
      return { ...state, screen: "spy-reveal", revealIndex: 0, game: { location, spyIndex }, endReason: null };
    }
    case "NEXT_REVEAL": {
      const next = state.revealIndex + 1;
      if (next < state.config.count) return { ...state, revealIndex: next };
      return { ...state, screen: "spy-playing", timer: { remaining: state.config.minutes * 60, running: true } };
    }
    case "TICK": {
      if (!state.timer.running) return state;
      const remaining = state.timer.remaining - 1;
      if (remaining <= 0) {
        return { ...state, timer: { remaining: 0, running: false }, screen: "spy-end", endReason: "timeup" };
      }
      return { ...state, timer: { ...state.timer, remaining } };
    }
    case "TOGGLE_RUNNING":
      return { ...state, timer: { ...state.timer, running: !state.timer.running } };
    case "END_MANUAL":
      return { ...state, screen: "spy-end", endReason: "manual", timer: { ...state.timer, running: false } };
    case "RESTART_SAME":
      return { ...state, screen: "spy-setup", endReason: null, game: { location: null, spyIndex: null } };

    case "OPEN_ALIAS_SETUP":
      return { ...state, screen: "alias-setup" };
    case "ALIAS_SET_TEAM_COUNT": {
      const n = Math.min(MAX_TEAMS, Math.max(MIN_TEAMS, action.value));
      const aliasTeams = resizeTeams(state.config.aliasTeams, n);
      const scores = Array.from({ length: n }, (_, i) => state.alias.scores[i] || 0);
      return { ...state, config: { ...state.config, aliasTeams }, alias: { ...state.alias, scores } };
    }
    case "ALIAS_SET_TEAM_NAME": {
      const aliasTeams = state.config.aliasTeams.slice();
      aliasTeams[action.index] = action.value;
      return { ...state, config: { ...state.config, aliasTeams } };
    }
    case "ALIAS_SET_SECONDS": {
      const aliasSeconds = Math.min(MAX_ALIAS_SECONDS, Math.max(MIN_ALIAS_SECONDS, action.value));
      return { ...state, config: { ...state.config, aliasSeconds } };
    }
    case "ALIAS_LAUNCH": {
      const wordOrder = shuffledIndices(WORDS.length);
      return {
        ...state,
        screen: "alias-team-intro",
        alias: {
          scores: state.config.aliasTeams.map(() => 0),
          currentTeam: 0,
          wordOrder,
          wordPointer: 0,
          currentWord: WORDS[wordOrder[0]],
          roundScore: 0,
          timer: { remaining: state.config.aliasSeconds, running: false },
        },
      };
    }
    case "ALIAS_START_ROUND":
      return {
        ...state,
        screen: "alias-playing",
        alias: { ...state.alias, roundScore: 0, timer: { remaining: state.config.aliasSeconds, running: true } },
      };
    case "ALIAS_CORRECT": {
      const { wordOrder, wordPointer, currentWord } = nextAliasWord(state.alias);
      return { ...state, alias: { ...state.alias, roundScore: state.alias.roundScore + 1, wordOrder, wordPointer, currentWord } };
    }
    case "ALIAS_SKIP": {
      const { wordOrder, wordPointer, currentWord } = nextAliasWord(state.alias);
      return { ...state, alias: { ...state.alias, roundScore: state.alias.roundScore - 1, wordOrder, wordPointer, currentWord } };
    }
    case "ALIAS_TICK": {
      if (!state.alias.timer.running) return state;
      const remaining = state.alias.timer.remaining - 1;
      if (remaining <= 0) {
        const scores = state.alias.scores.slice();
        scores[state.alias.currentTeam] += state.alias.roundScore;
        return { ...state, screen: "alias-round-end", alias: { ...state.alias, scores, timer: { remaining: 0, running: false } } };
      }
      return { ...state, alias: { ...state.alias, timer: { ...state.alias.timer, remaining } } };
    }
    case "ALIAS_END_ROUND_MANUAL": {
      const scores = state.alias.scores.slice();
      scores[state.alias.currentTeam] += state.alias.roundScore;
      return { ...state, screen: "alias-round-end", alias: { ...state.alias, scores, timer: { ...state.alias.timer, running: false } } };
    }
    case "ALIAS_NEXT_TEAM": {
      const currentTeam = (state.alias.currentTeam + 1) % state.config.aliasTeams.length;
      return { ...state, screen: "alias-team-intro", alias: { ...state.alias, currentTeam, roundScore: 0 } };
    }

    case "OPEN_MAFIA_SETUP":
      return { ...state, screen: "mafia-setup" };
    case "MAFIA_SET_COUNT": {
      const mafiaPlayerCount = Math.min(MAX_MAFIA_PLAYERS, Math.max(MIN_MAFIA_PLAYERS, action.value));
      const mafiaNames = resizeNames(state.config.mafiaNames, mafiaPlayerCount);
      const mafiaCount = clampMafiaCount(mafiaPlayerCount, state.config.mafiaCount);
      return { ...state, config: { ...state.config, mafiaPlayerCount, mafiaNames, mafiaCount } };
    }
    case "MAFIA_SET_NAME": {
      const mafiaNames = state.config.mafiaNames.slice();
      mafiaNames[action.index] = action.value;
      return { ...state, config: { ...state.config, mafiaNames } };
    }
    case "MAFIA_SET_MAFIA_COUNT": {
      const mafiaCount = clampMafiaCount(state.config.mafiaPlayerCount, action.value);
      return { ...state, config: { ...state.config, mafiaCount } };
    }
    case "MAFIA_TOGGLE_DOCTOR":
      return { ...state, config: { ...state.config, mafiaDoctor: !state.config.mafiaDoctor } };
    case "MAFIA_TOGGLE_SHERIFF":
      return { ...state, config: { ...state.config, mafiaSheriff: !state.config.mafiaSheriff } };
    case "MAFIA_SET_DISCUSSION_MINUTES": {
      const mafiaDiscussionMinutes = Math.min(MAX_MAFIA_DISCUSSION_MIN, Math.max(MIN_MAFIA_DISCUSSION_MIN, action.value));
      return { ...state, config: { ...state.config, mafiaDiscussionMinutes } };
    }
    case "MAFIA_LAUNCH": {
      const { mafiaPlayerCount, mafiaCount, mafiaDoctor, mafiaSheriff } = state.config;
      const roles = buildMafiaRoles(mafiaPlayerCount, mafiaCount, mafiaDoctor, mafiaSheriff);
      return {
        ...state,
        screen: "mafia-reveal",
        mafia: {
          ...initialMafiaState,
          roles,
          alive: roles.map(() => true),
          revealIndex: 0,
          phase: "roster",
        },
      };
    }
    case "MAFIA_NEXT_REVEAL": {
      const next = state.mafia.revealIndex + 1;
      if (next < state.config.mafiaPlayerCount) return { ...state, mafia: { ...state.mafia, revealIndex: next } };
      return { ...state, screen: "mafia-roster", mafia: { ...state.mafia, revealIndex: next } };
    }
    case "MAFIA_SELECT_MAFIA_TARGET": {
      const mafiaTarget = action.index;
      const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "mafia");
      if (nextPhase === "night-result") {
        const { alive, victim, saved, winner } = finalizeMafiaNight({ ...state.mafia, mafiaTarget });
        return { ...state, mafia: { ...state.mafia, mafiaTarget, alive, lastNightVictim: victim, lastNightSaved: saved, winner, phase: "night-result" } };
      }
      return { ...state, mafia: { ...state.mafia, mafiaTarget, phase: nextPhase } };
    }
    case "MAFIA_SELECT_DOCTOR_TARGET": {
      const doctorTarget = action.index;
      const nextPhase = nextNightPhase(state.mafia.roles, state.mafia.alive, "doctor");
      if (nextPhase === "night-result") {
        const { alive, victim, saved, winner } = finalizeMafiaNight({ ...state.mafia, doctorTarget });
        return { ...state, mafia: { ...state.mafia, doctorTarget, alive, lastNightVictim: victim, lastNightSaved: saved, winner, phase: "night-result" } };
      }
      return { ...state, mafia: { ...state.mafia, doctorTarget, phase: nextPhase } };
    }
    case "MAFIA_SELECT_SHERIFF_TARGET": {
      const index = action.index;
      if (index === null || index === undefined) {
        const { alive, victim, saved, winner } = finalizeMafiaNight({ ...state.mafia, sheriffTarget: null });
        return { ...state, mafia: { ...state.mafia, sheriffTarget: null, sheriffResult: null, alive, lastNightVictim: victim, lastNightSaved: saved, winner, phase: "night-result" } };
      }
      const isMafia = state.mafia.roles[index] === "mafia";
      return { ...state, mafia: { ...state.mafia, sheriffTarget: index, sheriffResult: { index, isMafia } } };
    }
    case "MAFIA_SHERIFF_DONE": {
      const { alive, victim, saved, winner } = finalizeMafiaNight(state.mafia);
      return { ...state, mafia: { ...state.mafia, alive, lastNightVictim: victim, lastNightSaved: saved, winner, phase: "night-result" } };
    }
    case "MAFIA_DAY_TICK": {
      if (!state.mafia.dayTimer.running) return state;
      const remaining = state.mafia.dayTimer.remaining - 1;
      if (remaining <= 0) return { ...state, mafia: { ...state.mafia, dayTimer: { remaining: 0, running: false } } };
      return { ...state, mafia: { ...state.mafia, dayTimer: { ...state.mafia.dayTimer, remaining } } };
    }
    case "MAFIA_TOGGLE_DAY_TIMER":
      return { ...state, mafia: { ...state.mafia, dayTimer: { ...state.mafia.dayTimer, running: !state.mafia.dayTimer.running } } };
    case "MAFIA_OPEN_EXILE":
      return { ...state, mafia: { ...state.mafia, exileOpen: true } };
    case "MAFIA_CLOSE_EXILE":
      return { ...state, mafia: { ...state.mafia, exileOpen: false } };
    case "MAFIA_EXILE": {
      const index = action.index;
      const alive = state.mafia.alive.slice();
      if (index !== null && index !== undefined) alive[index] = false;
      const winner = checkMafiaWinner(state.mafia.roles, alive);
      return { ...state, mafia: { ...state.mafia, alive, exiledIndex: index, exileOpen: false, winner, phase: "day-result" } };
    }
    case "MAFIA_TOGGLE_ROSTER":
      return { ...state, mafia: { ...state.mafia, rosterOpen: !state.mafia.rosterOpen } };
    case "MAFIA_CONTINUE": {
      const { mafia, config } = state;
      if (mafia.phase === "night-result") {
        if (mafia.winner) return { ...state, screen: "mafia-end" };
        return { ...state, mafia: { ...mafia, phase: "day", exileOpen: false, dayTimer: { remaining: config.mafiaDiscussionMinutes * 60, running: true } } };
      }
      if (mafia.phase === "day-result") {
        if (mafia.winner) return { ...state, screen: "mafia-end" };
        return {
          ...state,
          mafia: {
            ...mafia,
            phase: "night-mafia",
            night: mafia.night + 1,
            mafiaTarget: null,
            doctorTarget: null,
            sheriffTarget: null,
            sheriffResult: null,
            lastNightVictim: null,
            lastNightSaved: false,
          },
        };
      }
      if (mafia.phase === "roster") {
        return { ...state, screen: "mafia-game", mafia: { ...mafia, phase: "night-mafia", night: 1 } };
      }
      return state;
    }
    case "MAFIA_RESTART_SAME":
      return { ...state, screen: "mafia-setup", mafia: initialMafiaState };

    default:
      return state;
  }
}

/* ---------------------------------------------------------------- */
/* Small building blocks                                             */

/* Soft fade + slight slide-up on mount — used to transition between      */
/* whole screens and between tabs. Give it a fresh `key` to replay it.    */
function FadeIn({ children, className }) {
  const [shown, setShown] = useState(false);
  useEffect(() => {
    const id = requestAnimationFrame(() => setShown(true));
    return () => cancelAnimationFrame(id);
  }, []);
  return (
    <div
      className={
        "transition-all duration-300 ease-in-out " +
        (shown ? "opacity-100 translate-y-0" : "opacity-0 translate-y-2") +
        (className ? " " + className : "")
      }
    >
      {children}
    </div>
  );
}

function TopBar({ onBack, title, right }) {
  return (
    <div className="flex items-center justify-between px-4 py-3 shrink-0">
      <button onClick={onBack} className="w-10 h-10 -ml-2 flex items-center justify-center rounded-full text-[var(--text-dim)] active:bg-[var(--surface-2)]" aria-label="Назад">
        <IconArrowLeft size={22} />
      </button>
      <h1 className="font-display text-xl tracking-wide text-[var(--text-dim)]">{title}</h1>
      <div className="w-10 h-10 flex items-center justify-center">{right}</div>
    </div>
  );
}

function ConfirmButton({ label, confirmLabel, onConfirm, className }) {
  const [armed, setArmed] = useState(false);
  const timeoutRef = useRef(null);
  useEffect(() => () => clearTimeout(timeoutRef.current), []);
  return (
    <button
      className={className}
      onClick={() => {
        if (armed) {
          clearTimeout(timeoutRef.current);
          setArmed(false);
          onConfirm();
        } else {
          setArmed(true);
          timeoutRef.current = setTimeout(() => setArmed(false), 2200);
        }
      }}
    >
      {armed ? confirmLabel : label}
    </button>
  );
}

function Stepper({ label, value, min, max, step = 1, onChange, suffix }) {
  return (
    <div className="bg-[var(--surface)] border border-[var(--border)] rounded-3xl px-5 py-4">
      <div className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mb-3">{label}</div>
      <div className="flex items-center justify-between gap-4">
        <button
          onClick={() => onChange(value - step)}
          disabled={value <= min}
          className="w-12 h-12 rounded-full border border-[var(--border-strong)] flex items-center justify-center text-[var(--text)] disabled:opacity-25 active:bg-[var(--surface-2)] shrink-0"
          aria-label="Меньше"
        >
          <IconMinus size={20} />
        </button>
        <div className="flex-1 text-center">
          <span className="font-display text-5xl leading-none">{value}</span>
          {suffix && <span className="ml-1.5 text-sm text-[var(--text-dim)] font-mono">{suffix}</span>}
        </div>
        <button
          onClick={() => onChange(value + step)}
          disabled={value >= max}
          className="w-12 h-12 rounded-full border border-[var(--border-strong)] flex items-center justify-center text-[var(--text)] disabled:opacity-25 active:bg-[var(--surface-2)] shrink-0"
          aria-label="Больше"
        >
          <IconPlus size={20} />
        </button>
      </div>
    </div>
  );
}

function LocationsGrid({ highlightId }) {
  return (
    <div className="grid grid-cols-2 gap-2 w-full">
      {LOCATIONS.map((loc) => {
        const active = loc.id === highlightId;
        return (
          <div
            key={loc.id}
            className={
              "flex items-center gap-2 rounded-xl px-3 py-2.5 border text-sm " +
              (active
                ? "border-[var(--accent)] bg-[var(--accent)]/10 text-[var(--accent-strong)]"
                : "border-[var(--border)] text-[var(--text-dim)]")
            }
          >
            <loc.Icon size={16} className="shrink-0" />
            <span className="truncate">{loc.name}</span>
            {active && <IconCheck size={14} className="ml-auto shrink-0" />}
          </div>
        );
      })}
    </div>
  );
}

/* Blind Screen — the universal "pass the phone" component           */
/* ---------------------------------------------------------------- */
function BlindScreen({ playerName, index, total, onContinue, onAbort, renderRole, continueLabel }) {
  const [revealed, setRevealed] = useState(false);

  return (
    <div className="h-full flex flex-col">
      <div className="flex items-center justify-between px-5 pt-4 shrink-0">
        <div className="flex items-center gap-1.5">
          {Array.from({ length: total }).map((_, i) => (
            <span
              key={i}
              className={
                "w-2 h-2 rounded-full " +
                (i < index ? "bg-[var(--accent)]" : i === index ? "bg-[var(--accent)] breathe" : "bg-[var(--surface-3)]")
              }
            />
          ))}
        </div>
        <ConfirmButton
          label="Завершить"
          confirmLabel="Точно?"
          onConfirm={onAbort}
          className="text-xs uppercase tracking-wider text-[var(--text-faint)] active:text-[var(--danger)] px-2 py-1"
        />
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6 text-center">
        {!revealed ? (
          <div key="hidden" className="pop flex flex-col items-center">
            <div className="w-20 h-20 rounded-full bg-[var(--surface)] border border-[var(--border)] flex items-center justify-center mb-6 text-[var(--text-faint)]">
              <IconEyeOff size={30} />

  return (

/* ---------------------------------------------------------------- */
/* Spyfall: playing (timer)                                           */
/* ---------------------------------------------------------------- */
function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${String(m).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
}

function SpyPlaying({ state, dispatch }) {
  const total = state.config.minutes * 60;
  const { remaining, running } = state.timer;
  const pct = total > 0 ? ((total - remaining) / total) * 100 : 0;
  const urgent = remaining <= 10;
  const ringColor = urgent ? "var(--danger)" : "var(--accent)";

  useWakeLock(true);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => dispatch({ type: "TICK" }), 1000);
    return () => clearInterval(id);
  }, [running, dispatch]);

  return (
    <div className="h-full flex flex-col">
      <div className="flex items-center justify-between px-5 pt-4 shrink-0">
        <ConfirmButton
          label="Завершить"
          confirmLabel="Точно?"
          onConfirm={() => dispatch({ type: "END_MANUAL" })}
          className="text-xs uppercase tracking-wider text-[var(--text-faint)] active:text-[var(--danger)] px-2 py-1"
        />
        <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)]">Раунд идёт</span>
        <span className="w-16" />
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6">
        <div
          className="rounded-full p-2 mb-8"
          style={{ background: `conic-gradient(${ringColor} ${pct * 3.6}deg, var(--surface-2) 0deg)`, transition: "background 0.4s linear" }}
        >
          <div className="w-56 h-56 rounded-full bg-[var(--bg)] flex flex-col items-center justify-center border border-[var(--border)]">
            <span
              className={"font-mono text-6xl font-semibold tabular-nums " + (urgent ? "pulse" : "")}
              style={{ color: urgent ? "var(--danger)" : "var(--text)" }}
            >
              {fmtTime(remaining)}
            </span>
            <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mt-2">осталось</span>
          </div>
        </div>

        <button
          onClick={() => dispatch({ type: "TOGGLE_RUNNING" })}
          className="w-16 h-16 rounded-full bg-[var(--surface)] border border-[var(--border-strong)] flex items-center justify-center active:scale-95 transition-transform"
          aria-label={running ? "Пауза" : "Продолжить"}
        >
          {running ? <IconPause size={26} /> : <IconPlay size={26} />}
        </button>
        <p className="text-xs text-[var(--text-faint)] mt-4 max-w-[26ch] text-center">
          Обсуждайте, задавайте вопросы и попробуйте вычислить шпиона до конца времени
        </p>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Spyfall: end                                                       */
/* ---------------------------------------------------------------- */
function SpyEnd({ state, dispatch }) {
  const [revealed, setRevealed] = useState(false);
  const { game, config, endReason } = state;
  const vibrated = useRef(false);

  useEffect(() => {
    if (endReason === "timeup" && !vibrated.current) {
      vibrated.current = true;
      try {
        navigator.vibrate && navigator.vibrate([180, 90, 180]);
      } catch (e) {}
    }
  }, [endReason]);

  const timeup = endReason === "timeup";

  return (
    <div className="h-full flex flex-col px-6 pb-8" style={{ paddingTop: "3rem" }}>
      <div className="flex-1 overflow-y-auto no-scrollbar flex flex-col items-center justify-center text-center">
        <div
          className={"w-16 h-16 rounded-full flex items-center justify-center mb-6 " + (timeup ? "flash-badge" : "bg-[var(--surface-2)]")}
          style={!timeup ? { color: "var(--text-dim)" } : { color: "#fff" }}
        >
          <IconAlertTriangle size={30} />
        </div>
        <h2 className="font-display text-5xl leading-none mb-3" style={{ color: timeup ? "var(--danger)" : "var(--text)" }}>
          {timeup ? "ВРЕМЯ ВЫШЛО" : "ИГРА ОКОНЧЕНА"}
        </h2>
        <p className="text-sm text-[var(--text-dim)] max-w-[28ch] mb-8">
          Обсудите последние догадки, а затем раскройте, кто скрывался среди вас.
        </p>

        {!revealed ? (
          <button
            onClick={() => setRevealed(true)}
            className="bg-[var(--surface)] border border-[var(--accent)]/40 text-[var(--accent-strong)] font-display text-xl tracking-wide py-4 px-8 rounded-2xl active:scale-[0.98] transition-transform"
          >
            Кто был шпионом?
          </button>
        ) : (
          <div className="pop w-full bg-[var(--surface)] border border-[var(--border)] rounded-3xl p-6 flex flex-col items-center gap-4">
            <div className="flex flex-col items-center">
              <span className="text-xs uppercase tracking-[0.25em] text-[var(--text-faint)] mb-2">Локация</span>
              <div className="flex items-center gap-2 text-[var(--local)]">
                <game.location.Icon size={20} />
                <span className="font-display text-2xl tracking-wide">{game.location.name}</span>
              </div>
            </div>
            <div className="w-full h-px bg-[var(--border)]" />
            <div className="flex flex-col items-center">
              <span className="text-xs uppercase tracking-[0.25em] text-[var(--text-faint)] mb-2">Шпион</span>
              <span className="font-display text-3xl tracking-wide" style={{ color: "var(--spy)" }}>
                {config.names[game.spyIndex]}
              </span>
            </div>
          </div>
        )}
      </div>

      <div className="flex flex-col gap-3 shrink-0">
        <button
          onClick={() => dispatch({ type: "RESTART_SAME" })}
          className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconRefresh size={20} /> Играть ещё раз
        </button>
        <button
          onClick={() => dispatch({ type: "GO_HUB" })}
          className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-[var(--text)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconHome size={20} /> На главную
        </button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------- */
/* Alias: playing                                                     */
/* ---------------------------------------------------------------- */
function AliasPlaying({ state, dispatch }) {
  const { alias, config } = state;
  const { remaining, running } = alias.timer;
  const urgent = remaining <= 10;

  useWakeLock(true);

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => dispatch({ type: "ALIAS_TICK" }), 1000);
    return () => clearInterval(id);
  }, [running, dispatch]);

  // Ticking sound as the round runs out (last 5 seconds).
  useEffect(() => {
    if (running && remaining >= 1 && remaining <= 5) playTickSound();
  }, [remaining, running]);

  return (
    <div className="h-full flex flex-col">
      <div className="flex items-center justify-between px-5 pt-4 shrink-0">
        <ConfirmButton
          label="Завершить"
          confirmLabel="Точно?"
          onConfirm={() => dispatch({ type: "ALIAS_END_ROUND_MANUAL" })}
          className="text-xs uppercase tracking-wider text-[var(--text-faint)] active:text-[var(--danger)] px-2 py-1"
        />
        <span
          className={"font-mono text-lg font-semibold tabular-nums " + (urgent ? "pulse" : "")}
          style={{ color: urgent ? "var(--danger)" : "var(--text-dim)" }}
        >
          {fmtTime(remaining)}
        </span>
        <span className="text-sm font-mono text-[var(--text-dim)] w-16 text-right">
          {alias.roundScore >= 0 ? `+${alias.roundScore}` : alias.roundScore}
        </span>
      </div>

      <div className="flex-1 flex flex-col items-center justify-center px-6 text-center">
        <p className="text-xs uppercase tracking-[0.3em] text-[var(--text-faint)] mb-4">{config.aliasTeams[alias.currentTeam]}</p>
        <h2 className="font-display text-6xl leading-tight break-words px-2">{alias.currentWord}</h2>
      </div>

      <div className="grid grid-cols-2 gap-3 px-5 pb-8 pt-2 shrink-0">
        <button
          onClick={() => dispatch({ type: "ALIAS_SKIP" })}
          className="bg-[var(--surface-2)] border border-[var(--danger)]/40 text-[var(--danger)] font-display text-2xl tracking-wide py-7 rounded-3xl flex flex-col items-center justify-center gap-1 active:scale-[0.97] transition-transform"
        >
          <IconX size={30} />
          Пропуск
        </button>
        <button
          onClick={() => dispatch({ type: "ALIAS_CORRECT" })}
          className="bg-[var(--local)] text-[var(--local-ink)] font-display text-2xl tracking-wide py-7 rounded-3xl flex flex-col items-center justify-center gap-1 active:scale-[0.97] transition-transform"
        >
          <IconCheck size={30} />
          Угадали
        </button>
      </div>
    </div>
  );
}

      total={config.mafiaPlayerCount}
      onAbort={() => dispatch({ type: "GO_HUB" })}

      continueLabel={index + 1 < config.mafiaPlayerCount ? "Скрыть и передать" : "Скрыть и передать Ведущему"}
      renderRole={() => (
        <div className="flex flex-col items-center w-full">
          <span className="text-xs uppercase tracking-[0.3em] text-[var(--text-faint)] mb-2">Твоя роль</span>

    />
  );
}

/* ---------------------------------------------------------------- */
/* Mafia: day phase                                                   */
/* ---------------------------------------------------------------- */
function MafiaDay({ state, dispatch }) {
  const { config, mafia } = state;
  const total = config.mafiaDiscussionMinutes * 60;
  const { remaining, running } = mafia.dayTimer;
  const pct = total > 0 ? ((total - remaining) / total) * 100 : 0;
  const urgent = remaining > 0 && remaining <= 10;

  useEffect(() => {
    if (!running) return;
    const id = setInterval(() => dispatch({ type: "MAFIA_DAY_TICK" }), 1000);
    return () => clearInterval(id);
  }, [running, dispatch]);

  if (mafia.exileOpen) {
    const targets = mafia.alive.map((alive, i) => ({ i, alive })).filter((x) => x.alive);
    return (
      <div className="flex flex-col pb-4">
        <MafiaPhaseHeader Icon={IconVote} color="var(--accent-strong)" bg="rgba(232,181,69,.14)" title="Дневная казнь" subtitle="Кого решили изгнать игроки?" />
        <button
          onClick={() => dispatch({ type: "MAFIA_EXILE", index: null })}
          className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-[var(--text-dim)] font-display text-lg tracking-wide py-3.5 rounded-2xl active:scale-[0.98] transition-transform mb-3"
        >
          Никого не изгонять
        </button>
        <div className="flex flex-col gap-2">
          {targets.map(({ i }) => (
            <MafiaPlayerButton key={i} name={config.mafiaNames[i]} index={i} danger onClick={(idx) => dispatch({ type: "MAFIA_EXILE", index: idx })} />
          ))}
        </div>
      </div>
    );
  }

  return (
    <div className="flex-1 flex flex-col items-center justify-center px-1 text-center pb-4">
      <p className="text-xs uppercase tracking-[0.3em] text-[var(--text-faint)] mb-6">Обсуждение</p>
      <div
        className="rounded-full p-2 mb-8"
        style={{ background: `conic-gradient(var(--accent) ${pct * 3.6}deg, var(--surface-2) 0deg)`, transition: "background 0.4s linear" }}
      >
        <div className="w-48 h-48 rounded-full bg-[var(--bg)] flex flex-col items-center justify-center border border-[var(--border)]">
          <span className={"font-mono text-5xl font-semibold tabular-nums " + (urgent ? "pulse" : "")} style={{ color: urgent ? "var(--danger)" : "var(--text)" }}>
            {fmtTime(remaining)}
          </span>
          <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)] mt-2">осталось</span>
        </div>
      </div>
      <button
        onClick={() => dispatch({ type: "MAFIA_TOGGLE_DAY_TIMER" })}
        className="w-16 h-16 rounded-full bg-[var(--surface)] border border-[var(--border-strong)] flex items-center justify-center active:scale-95 transition-transform"
        aria-label={running ? "Пауза" : "Продолжить"}
      >
        {running ? <IconPause size={26} /> : <IconPlay size={26} />}
      </button>
      <p className="text-xs text-[var(--text-faint)] mt-4 max-w-[26ch] text-center">
        Обсудите, кто ведёт себя подозрительно, а затем объявите голосование
      </p>
    </div>
  );
}

function MafiaDayResult({ state }) {
  const { config, mafia } = state;
  const exiledName = mafia.exiledIndex !== null ? config.mafiaNames[mafia.exiledIndex] : null;
  const exiledRole = mafia.exiledIndex !== null ? MAFIA_ROLES[mafia.roles[mafia.exiledIndex]] : null;

  return (
    <div className="flex flex-col items-center text-center pt-2 pb-4">
      <div className="w-16 h-16 rounded-full bg-[var(--surface-2)] flex items-center justify-center mb-6 text-[var(--accent-strong)]">
        <IconVote size={28} />
      </div>
      <p className="text-xs uppercase tracking-[0.3em] text-[var(--text-faint)] mb-2">Итог голосования</p>
      {exiledName ? (
        <>
          <h2 className="font-display text-4xl leading-tight mb-4">
            Изгнан(а) <span style={{ color: "var(--accent-strong)" }}>{exiledName}</span>
          </h2>
          <div className="flex items-center gap-2 bg-[var(--surface)] border border-[var(--border)] rounded-2xl px-4 py-3" style={{ color: exiledRole.color }}>
            <exiledRole.Icon size={18} />
            <span className="font-medium">{exiledRole.name}</span>
          </div>
        </>
      ) : (
        <h2 className="font-display text-4xl leading-tight">Игроки решили никого не изгонять</h2>
      )}

  );
}

function MafiaGame({ state, dispatch }) {
  const { mafia } = state;

  useWakeLock(true);

  if (mafia.rosterOpen) {
    return (
      <div className="h-full flex flex-col">
        <div className="flex items-center justify-between px-5 pt-4 shrink-0">
          <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)]">Список игроков</span>
          <button
            onClick={() => dispatch({ type: "MAFIA_TOGGLE_ROSTER" })}
            className="w-9 h-9 flex items-center justify-center rounded-full text-[var(--text-dim)] active:bg-[var(--surface-2)]"
            aria-label="Закрыть"
          >
            <IconX size={20} />
          </button>
        </div>
        <div className="flex-1 overflow-y-auto no-scrollbar px-5 pb-8">
          <div className="bg-[var(--surface)] border border-[var(--border)] rounded-3xl px-4 py-2 mt-2">
            <MafiaRosterList state={state} />
          </div>
        </div>
      </div>
    );
  }

  let body = null;
  let footer = null;

  if (mafia.phase === "night-mafia") {
    body = <MafiaNightMafia state={state} dispatch={dispatch} />;
  } else if (mafia.phase === "night-doctor") {
    body = <MafiaNightDoctor state={state} dispatch={dispatch} />;
  } else if (mafia.phase === "night-sheriff") {
    body = <MafiaNightSheriff state={state} dispatch={dispatch} />;
    if (mafia.sheriffResult) {
      footer = (
        <button
          onClick={() => dispatch({ type: "MAFIA_SHERIFF_DONE" })}
          className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconPlay size={20} /> Продолжить
        </button>
      );
    }
  } else if (mafia.phase === "night-result") {
    body = <MafiaNightResult state={state} />;
    footer = (
      <button
        onClick={() => dispatch({ type: "MAFIA_CONTINUE" })}
        className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
      >
        {mafia.winner ? (
          <>
            <IconTrophy size={20} /> Смотреть итоги игры
          </>
        ) : (
          <>
            <IconSun size={20} /> Перейти к дню
          </>
        )}
      </button>
    );
  } else if (mafia.phase === "day") {
    body = <MafiaDay state={state} dispatch={dispatch} />;
    if (mafia.exileOpen) {
      footer = (
        <button
          onClick={() => dispatch({ type: "MAFIA_CLOSE_EXILE" })}
          className="w-full bg-[var(--surface-2)] border border-[var(--border-strong)] text-[var(--text)] font-display text-xl tracking-wide py-4 rounded-2xl active:scale-[0.98] transition-transform"
        >
          Отмена
        </button>
      );
    } else {
      footer = (
        <button
          onClick={() => dispatch({ type: "MAFIA_OPEN_EXILE" })}
          className="w-full bg-[var(--danger)] text-white font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
        >
          <IconVote size={20} /> Дневная казнь
        </button>
      );
    }
  } else if (mafia.phase === "day-result") {
    body = <MafiaDayResult state={state} />;
    footer = (
      <button
        onClick={() => dispatch({ type: "MAFIA_CONTINUE" })}
        className="w-full bg-[var(--accent)] text-[var(--accent-ink)] font-display text-xl tracking-wide py-4 rounded-2xl flex items-center justify-center gap-2 active:scale-[0.98] transition-transform"
      >
        {mafia.winner ? (
          <>
            <IconTrophy size={20} /> Смотреть итоги игры
          </>
        ) : (
          <>
            <IconMoon size={20} /> Следующая ночь
          </>
        )}
      </button>
    );
  }

  return (
    <div className="h-full flex flex-col">
      <div className="flex items-center justify-between px-5 pt-4 shrink-0">
        <ConfirmButton
          label="Завершить"
          confirmLabel="Точно?"
          onConfirm={() => dispatch({ type: "GO_HUB" })}
          className="text-xs uppercase tracking-wider text-[var(--text-faint)] active:text-[var(--danger)] px-2 py-1"
        />
        <span className="text-xs uppercase tracking-[0.2em] text-[var(--text-faint)]">
          {mafia.phase === "day" || mafia.phase === "day-result" ? `День ${mafia.night}` : `Ночь ${mafia.night}`}
        </span>
        <button
          onClick={() => dispatch({ type: "MAFIA_TOGGLE_ROSTER" })}
          className="w-9 h-9 flex items-center justify-center rounded-full text-[var(--text-dim)] active:bg-[var(--surface-2)]"
          aria-label="Список игроков"
        >
          <IconList size={20} />
        </button>
      </div>

      <div className="flex-1 overflow-y-auto no-scrollbar px-5 pt-2 flex flex-col">{body}</div>

      {footer && <div className="px-5 pb-8 pt-3 shrink-0">{footer}</div>}
    </div>
  );
}

function BunkerLobby({ room, roomCode, playerId, dispatch, onStart, error, busy }) {
  const players = room && room.players ? room.players : {};
  const orderedIds = Object.keys(players).sort((a, b) => (players[a].joinedAt || 0) - (players[b].joinedAt || 0));
  const isHost = room && room.hostId === playerId;

  function copyCode() {
    try {

      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {}

  return (
    <div className="h-full flex flex-col">
      <TopBar onBack={() => dispatch({ type: "GO_HUB" })} title="БУНКЕР" right={<IconRadioactive size={18} className="text-[var(--bunker)]" />} />
      <div className="flex-1 overflow-y-auto no-scrollbar px-5 pb-6 flex flex-col">
        <div className="text-center my-6">
          <p className="text-xs uppercase tracking-[0.25em] text-[var(--text-faint)] mb-3">Код комнаты</p>
          <button onClick={copyCode} className="font-mono text-6xl tracking-[0.15em] font-semibold active:scale-95 transition-transform">
            {roomCode}
          </button>
          <p className="text-xs text-[var(--text-faint)] mt-2">{copied ? "Скопировано!" : "Нажмите, чтобы скопировать · сообщите игрокам"}</p>

          {orderedIds.map((pid) => {

            return (
              <div key={pid} className="flex items-center gap-3 bg-[var(--surface)] border border-[var(--border)] rounded-2xl px-4 py-3.5">
                <div className="w-9 h-9 rounded-full bg-[var(--surface-2)] flex items-center justify-center text-[var(--text-dim)] shrink-0">
                  <IconUsers size={16} />
                </div>
                <span className="font-medium truncate">{p.name}</span>

function BunkerApp({ dispatch }) {
  const [roomCode, setRoomCode] = useState(null);
  const [playerId] = useState(() => {
    try {
      const saved = sessionStorage.getItem("bunkerPlayerId");
      if (saved) return saved;
    } catch (e) {}
    const id = genBunkerPlayerId();
    try {
      sessionStorage.setItem("bunkerPlayerId", id);
    } catch (e) {}
    return id;
  });
  const [room, setRoom] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const roomRef = useRef(null);
  const channelRef = useRef(null);
  const joinTimeoutRef = useRef(null);
  const prevPlayerCountRef = useRef(null);

  useEffect(() => {
    roomRef.current = room;
  }, [room]);

  // Bell sound whenever a new player shows up while everyone is still in
  // the lobby (fires for the Host and for every other player already in).
  useEffect(() => {
    if (!room || !room.players || room.status !== "lobby") return;
    const count = Object.keys(room.players).length;
    if (prevPlayerCountRef.current !== null && count > prevPlayerCountRef.current) {
      playChimeSound();
      vibrate([30, 40, 30]);
    }
    prevPlayerCountRef.current = count;
  }, [room]);

  useEffect(() => {
    return () => {
      if (joinTimeoutRef.current) clearTimeout(joinTimeoutRef.current);
      if (channelRef.current) {
        supabaseClient.removeChannel(channelRef.current);
        channelRef.current = null;
      }
    };
  }, []);

  function broadcastState(nextRoom) {
    setRoom(nextRoom);
    if (channelRef.current) {
      channelRef.current.send({ type: "broadcast", event: "bunker_state", payload: { room: nextRoom } });
    }
  }

  // Creates (host) or joins (guest) the Supabase Realtime channel for a room
  // code, and wires up the broadcast events the Bunker game relies on.
  function attachChannel(code, isHostChannel) {
    const channel = supabaseClient.channel("bunker-room-" + code, {
      config: { broadcast: { self: true } },
    });

    channel.on("broadcast", { event: "bunker_state" }, ({ payload }) => {
      if (!payload || !payload.room) return;
      if (joinTimeoutRef.current) {
        clearTimeout(joinTimeoutRef.current);
        joinTimeoutRef.current = null;
      }
      setRoom(payload.room);
      setRoomCode(code);
      setBusy(false);
    });

    // Only the Host resolves join/reveal requests into authoritative state
    // and rebroadcasts it — every other client just renders what it gets.
    if (isHostChannel) {
      channel.on("broadcast", { event: "bunker_join" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload || !payload.playerId) return;
        const players = { ...current.players };
        const existing = players[payload.playerId];
        players[payload.playerId] = {
          name: (existing && existing.name) || (payload.name || "Игрок").trim().slice(0, 20) || "Игрок",
          isHost: payload.playerId === current.hostId,
          joinedAt: existing ? existing.joinedAt : Date.now(),
          exiled: existing ? existing.exiled : false,
          dossier: existing ? existing.dossier : current.status === "playing" ? makeBunkerDossier() : null,
        };
        broadcastState({ ...current, players });
      });

      channel.on("broadcast", { event: "bunker_reveal" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload || !current.players[payload.playerId]) return;
        const target = current.players[payload.playerId];
        if (!target.dossier || !target.dossier[payload.traitKey]) return;
        const players = {
          ...current.players,
          [payload.playerId]: {
            ...target,
            dossier: { ...target.dossier, [payload.traitKey]: { ...target.dossier[payload.traitKey], revealed: true } },
          },
        };
        broadcastState({ ...current, players });
      });
    }

    channelRef.current = channel;
    return channel;
  }

  function handleCreate(name) {
    setBusy(true);
    setError("");
    const code = genBunkerCode();
    const initialRoom = {
      status: "lobby",
      hostId: playerId,
      catastrophe: null,
      players: {
        [playerId]: { name: name.trim().slice(0, 20) || "Хост", isHost: true, joinedAt: Date.now(), exiled: false, dossier: null },
      },
    };
    const channel = attachChannel(code, true);
    channel.subscribe((status) => {
      if (status === "SUBSCRIBED") {
        setRoom(initialRoom);
        setRoomCode(code);
        setBusy(false);
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        setError("Не удалось подключиться к Supabase. Проверьте интернет-соединение.");
        setBusy(false);
      }
    });
  }

  function handleJoin(name, code) {
    if (!/^\d{4}$/.test(code)) {
      setError("Введите 4-значный код");
      return;
    }
    if (!name.trim()) {
      setError("Введите имя");
      return;
    }
    setBusy(true);
    setError("");
    const channel = attachChannel(code, false);
    channel.subscribe((status) => {
      if (status === "SUBSCRIBED") {
        channel.send({ type: "broadcast", event: "bunker_join", payload: { playerId, name: name.trim().slice(0, 20) } });
        joinTimeoutRef.current = setTimeout(() => {
          setError("Комната не найдена или Хост сейчас offline. Проверьте код.");
          setBusy(false);
          supabaseClient.removeChannel(channel);
          channelRef.current = null;
        }, 4000);
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        setError("Не удалось подключиться к Supabase. Проверьте интернет-соединение.");
        setBusy(false);
      }
    });
  }

  function handleStart() {
    const current = roomRef.current;
    if (!current || !current.players) return;
    const catastrophe = bunkerPick(BUNKER_CATASTROPHES);
    const players = {};
    Object.keys(current.players).forEach((pid) => {
      players[pid] = { ...current.players[pid], dossier: makeBunkerDossier() };
    });
    broadcastState({ ...current, status: "playing", catastrophe, players });
  }

  function handleReveal(traitKey) {
    if (!channelRef.current) return;
    channelRef.current.send({ type: "broadcast", event: "bunker_reveal", payload: { playerId, traitKey } });
  }

  function handleExile(targetId) {
    const current = roomRef.current;
    if (!current || !current.players[targetId]) return;
    const players = { ...current.players, [targetId]: { ...current.players[targetId], exiled: true } };
    broadcastState({ ...current, players });
  }

  if (!roomCode || !room) {
    return <BunkerMenu dispatch={dispatch} onCreate={handleCreate} onJoin={handleJoin} busy={busy} error={error} />;
  }
  if (room.status === "playing") {
    return <BunkerGame room={room} roomCode={roomCode} playerId={playerId} dispatch={dispatch} onReveal={handleReveal} onExile={handleExile} />;
  }
  return <BunkerLobby room={room} roomCode={roomCode} playerId={playerId} dispatch={dispatch} onStart={handleStart} error={error} busy={busy} />;
}

const pickRandom = bunkerPick;
function genCourtCode() {
  return String(Math.floor(1000 + Math.random() * 9000));
}
function genCourtPlayerId() {
  return "c" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i];
    a[i] = a[j];
    a[j] = tmp;
  }
  return a;
}

function CourtLobby({ room, roomCode, playerId, dispatch, onStart, error, busy }) {
  const players = room && room.players ? room.players : {};
  const orderedIds = Object.keys(players).sort((a, b) => (players[a].joinedAt || 0) - (players[b].joinedAt || 0));
  const isHost = room && room.hostId === playerId;
  const canStart = orderedIds.length >= 4;
  const [copied, setCopied] = useState(false);

  function copyCode() {
    try {
      navigator.clipboard.writeText(roomCode);
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    } catch (e) {}
  }

  return (
    <div className="h-full flex flex-col">
      <TopBar onBack={() => dispatch({ type: "GO_HUB" })} title="СУД" right={<IconBank size={18} className="text-[var(--court)]" />} />
      <div className="flex-1 overflow-y-auto no-scrollbar px-5 pb-6 flex flex-col">
        <div className="text-center my-6">
          <p className="text-xs uppercase tracking-[0.25em] text-[var(--text-faint)] mb-3">Код заседания</p>
          <button onClick={copyCode} className="font-mono text-6xl tracking-[0.15em] font-semibold active:scale-95 transition-transform">
            {roomCode}
          </button>
          <p className="text-xs text-[var(--text-faint)] mt-2">{copied ? "Скопировано!" : "Нажмите, чтобы скопировать · сообщите участникам"}</p>
        </div>

        <div className="flex flex-col gap-2.5 mb-4">
          {orderedIds.map((pid) => {
            const p = players[pid];
            return (
              <div key={pid} className="flex items-center gap-3 bg-[var(--surface)] border border-[var(--border)] rounded-2xl px-4 py-3.5">
                <div className="w-9 h-9 rounded-full bg-[var(--surface-2)] flex items-center justify-center text-[var(--text-dim)] shrink-0">
                  <IconUsers size={16} />
                </div>
                <span className="font-medium truncate">{p.name}</span>
                {p.isHost && (
                  <span className="ml-auto shrink-0 text-[10px] uppercase tracking-widest text-[var(--accent-strong)] bg-[var(--accent)]/10 px-2 py-0.5 rounded-full">Судья</span>
                )}
                {pid === playerId && !p.isHost && <span className="ml-auto shrink-0 text-[10px] uppercase tracking-widest text-[var(--text-faint)]">(вы)</span>}
              </div>
            );
          })}
        </div>

        <CourtRulesCard />

        {error && <p className="text-sm text-[var(--danger)] text-center mt-3 mb-1">{error}</p>}

        <div className="mt-auto pt-4">
          {isHost ? (
            <>
              <button
                onClick={onStart}
                disabled={!canStart || busy}
                className="w-full bg-[var(--court)] text-[var(--court-ink)] font-display text-xl tracking-wide py-4 rounded-2xl disabled:opacity-30 active:scale-[0.98] transition-transform"
              >
                Начать дело
              </button>
              {!canStart && <p className="text-center text-xs text-[var(--text-faint)] mt-2">Нужно минимум 4 участника (сейчас {orderedIds.length})</p>}
            </>
          ) : (
            <p className="text-center text-sm text-[var(--text-dim)] py-2">Ожидание Судьи…</p>
          )}
        </div>
      </div>
    </div>
  );
}

                className="w-full bg-[var(--surface-2)] border border-[var(--border)] rounded-xl px-3 py-2.5 text-sm outline-none focus:border-[var(--accent)] resize-none mb-3"
              />
              <ConfirmButton
                label="Вынести вердикт"
                confirmLabel="Точно завершить?"
                onConfirm={() => onVerdict(verdictText)}
                className="w-full bg-[var(--court)] text-[var(--court-ink)] font-display text-lg tracking-wide py-3 rounded-2xl active:scale-[0.98] transition-transform"
              />
            </>
          )}
        </div>
      )}

      <div className="flex flex-col gap-3">
        {orderedIds.map((pid) => {
          const p = players[pid];
          const isMe = pid === playerId;
          const rDef = COURT_ROLE_DEFS[p.role] || {};
          const RIcon = rDef.Icon || IconUsers;
          return (
            <div key={pid} className="rounded-2xl border border-[var(--border)] bg-[var(--surface)] p-4">
              <div className="flex items-center justify-between mb-2 gap-2">
                <div className="flex items-center gap-2 min-w-0">
                  <span className="font-display text-lg tracking-wide truncate">{p.name}</span>
                  {isMe && <span className="text-[10px] uppercase tracking-widest text-[var(--text-faint)] shrink-0">(вы)</span>}
                </div>
                {p.role && (
                  <span className="shrink-0 text-[10px] uppercase tracking-widest px-2 py-0.5 rounded-full flex items-center gap-1" style={{ background: rDef.bg, color: rDef.color }}>
                    <RIcon size={11} /> {rDef.label}
                  </span>
                )}
              </div>
              {p.evidence ? (
                <p className={"text-xs " + (p.evidence.revealed ? "text-[var(--text-dim)]" : "text-[var(--text-faint)] italic")}>
                  {p.evidence.revealed ? p.evidence.text : "Улика скрыта"}
                </p>
              ) : (
                <p className="text-xs text-[var(--text-faint)]">Улика ещё не готова</p>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

          onClick={() => setTab("evidence")}
          className={
            "flex-1 py-2.5 rounded-xl text-sm font-semibold tracking-wide flex items-center justify-center gap-1.5 " +
            (tab === "evidence" ? "bg-[var(--surface-3)] text-[var(--text)]" : "text-[var(--text-faint)]")
          }
        >

        <button
          onClick={() => setTab("table")}
          className={
            "flex-1 py-2.5 rounded-xl text-sm font-semibold tracking-wide flex items-center justify-center gap-1.5 " +
            (tab === "table" ? "bg-[var(--surface-3)] text-[var(--text)]" : "text-[var(--text-faint)]")
          }

function CourtGame({ room, roomCode, playerId, dispatch, onReveal, onVote, onTally, onVerdict }) {
  const [tab, setTab] = useState("evidence");
  const players = room && room.players ? room.players : {};
  const me = players[playerId];
  const orderedIds = Object.keys(players).sort((a, b) => (players[a].joinedAt || 0) - (players[b].joinedAt || 0));

  useWakeLock(true);

  return (
    <div className="h-full flex flex-col">
      <TopBar onBack={() => dispatch({ type: "GO_HUB" })} title="СУД" right={<IconBank size={18} className="text-[var(--court)]" />} />
      <FadeIn key={tab} className="flex-1 overflow-y-auto no-scrollbar px-5 pb-4">
        {tab === "evidence" ? (
          <CourtDossierTab me={me} onReveal={onReveal} />
        ) : (
          <CourtTableTab room={room} players={players} orderedIds={orderedIds} playerId={playerId} onVote={onVote} onTally={onTally} onVerdict={onVerdict} />
        )}
      </FadeIn>
      <CourtTabBar tab={tab} setTab={setTab} />
    </div>
  );
}

function CourtApp({ dispatch }) {
  const [roomCode, setRoomCode] = useState(null);
  const [playerId] = useState(() => {
    try {
      const saved = sessionStorage.getItem("courtPlayerId");
      if (saved) return saved;
    } catch (e) {}
    const id = genCourtPlayerId();
    try {
      sessionStorage.setItem("courtPlayerId", id);
    } catch (e) {}
    return id;
  });
  const [room, setRoom] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  const roomRef = useRef(null);
  const channelRef = useRef(null);
  const joinTimeoutRef = useRef(null);
  const prevPlayerCountRef = useRef(null);

  useEffect(() => {
    roomRef.current = room;
  }, [room]);

  // Bell sound whenever a new participant shows up while everyone is still
  // in the lobby (fires for the Judge and for every other participant already in).
  useEffect(() => {
    if (!room || !room.players || room.status !== "lobby") return;
    const count = Object.keys(room.players).length;
    if (prevPlayerCountRef.current !== null && count > prevPlayerCountRef.current) {
      playChimeSound();
      vibrate([30, 40, 30]);
    }
    prevPlayerCountRef.current = count;
  }, [room]);

  useEffect(() => {
    return () => {
      if (joinTimeoutRef.current) clearTimeout(joinTimeoutRef.current);
      if (channelRef.current) {
        supabaseClient.removeChannel(channelRef.current);
        channelRef.current = null;
      }
    };
  }, []);

  function broadcastState(nextRoom) {
    setRoom(nextRoom);
    if (channelRef.current) {
      channelRef.current.send({ type: "broadcast", event: "court_state", payload: { room: nextRoom } });
    }
  }

  // Creates (Judge) or joins (guest) the Supabase Realtime channel for a
  // room code, and wires up the broadcast events the Court game relies on.
  function attachChannel(code, isHostChannel) {
    const channel = supabaseClient.channel("court-room-" + code, {
      config: { broadcast: { self: true } },
    });

    channel.on("broadcast", { event: "court_state" }, ({ payload }) => {
      if (!payload || !payload.room) return;
      if (joinTimeoutRef.current) {
        clearTimeout(joinTimeoutRef.current);
        joinTimeoutRef.current = null;
      }
      setRoom(payload.room);
      setRoomCode(code);
      setBusy(false);
    });

    // Only the Judge's channel resolves join/reveal/vote/tally/verdict
    // requests into authoritative state and rebroadcasts it — every other
    // client just renders what it gets.
    if (isHostChannel) {
      channel.on("broadcast", { event: "court_join" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload || !payload.playerId) return;
        const players = { ...current.players };
        const existing = players[payload.playerId];
        players[payload.playerId] = {
          name: (existing && existing.name) || (payload.name || "Участник").trim().slice(0, 20) || "Участник",
          isHost: payload.playerId === current.hostId,
          joinedAt: existing ? existing.joinedAt : Date.now(),
          role: existing ? existing.role : null,
          evidence: existing ? existing.evidence : null,
          vote: existing ? existing.vote : null,
        };
        broadcastState({ ...current, players });
      });

      channel.on("broadcast", { event: "court_reveal" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload || !current.players[payload.playerId]) return;
        const target = current.players[payload.playerId];
        if (!target.evidence) return;
        const players = {
          ...current.players,
          [payload.playerId]: { ...target, evidence: { ...target.evidence, revealed: true } },
        };
        broadcastState({ ...current, players });
      });

      channel.on("broadcast", { event: "court_vote" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload || !current.players[payload.playerId]) return;
        const target = current.players[payload.playerId];
        if (target.role !== "juror") return;
        if (payload.vote !== "guilty" && payload.vote !== "victim") return;
        const players = { ...current.players, [payload.playerId]: { ...target, vote: payload.vote } };
        broadcastState({ ...current, players });
      });

      channel.on("broadcast", { event: "court_tally" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload) return;
        const target = current.players[payload.playerId];
        if (!target || target.role !== "secretary") return;
        const guilty = Math.max(0, parseInt(payload.guilty, 10) || 0);
        const victim = Math.max(0, parseInt(payload.victim, 10) || 0);
        broadcastState({ ...current, tally: { guilty, victim, submittedBy: payload.playerId } });
      });

      channel.on("broadcast", { event: "court_verdict" }, ({ payload }) => {
        const current = roomRef.current;
        if (!current || !payload) return;
        const target = current.players[payload.playerId];
        if (!target || target.role !== "judge") return;
        const text = (payload.text || "").trim().slice(0, 280);
        if (!text) return;
        broadcastState({ ...current, status: "verdict", verdict: { text, decidedBy: payload.playerId } });
      });
    }

    channelRef.current = channel;
    return channel;
  }

  function handleCreate(name) {
    setBusy(true);
    setError("");
    const code = genCourtCode();
    const initialRoom = {
      status: "lobby",
      hostId: playerId,
      case: null,
      tally: null,
      verdict: null,
      players: {
        [playerId]: { name: name.trim().slice(0, 20) || "Судья", isHost: true, joinedAt: Date.now(), role: null, evidence: null, vote: null },
      },
    };
    const channel = attachChannel(code, true);
    channel.subscribe((status) => {
      if (status === "SUBSCRIBED") {
        setRoom(initialRoom);
        setRoomCode(code);
        setBusy(false);
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        setError("Не удалось подключиться к Supabase. Проверьте интернет-соединение.");
        setBusy(false);
      }
    });
  }

  function handleJoin(name, code) {
    if (!/^\d{4}$/.test(code)) {
      setError("Введите 4-значный код");
      return;
    }
    if (!name.trim()) {
      setError("Введите имя");
      return;
    }
    setBusy(true);
    setError("");
    const channel = attachChannel(code, false);
    channel.subscribe((status) => {
      if (status === "SUBSCRIBED") {
        channel.send({ type: "broadcast", event: "court_join", payload: { playerId, name: name.trim().slice(0, 20) } });
        joinTimeoutRef.current = setTimeout(() => {
          setError("Заседание не найдено или Судья сейчас offline. Проверьте код.");
          setBusy(false);
          supabaseClient.removeChannel(channel);
          channelRef.current = null;
        }, 4000);
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        setError("Не удалось подключиться к Supabase. Проверьте интернет-соединение.");
        setBusy(false);
      }
    });
  }

  function handleStart() {
    const current = roomRef.current;
    if (!current || !current.players) return;
    const allIds = Object.keys(current.players);
    if (allIds.length < 4) return;
    const guestIds = shuffleArray(allIds.filter((pid) => pid !== current.hostId));
    const roleForId = {};
    roleForId[current.hostId] = "judge";
    if (guestIds[0]) roleForId[guestIds[0]] = "guilty";
    if (guestIds[1]) roleForId[guestIds[1]] = "victim";
    if (guestIds[2]) roleForId[guestIds[2]] = "secretary";
    guestIds.slice(3).forEach((pid) => {
      roleForId[pid] = "juror";
    });

    const courtCase = pickRandom(COURT_CASES);
    const players = {};
    allIds.forEach((pid) => {
      const role = roleForId[pid];
      const pool = COURT_EVIDENCE_BY_ROLE[role] || COURT_EVIDENCE_JUROR;
      players[pid] = { ...current.players[pid], role, evidence: { text: pickRandom(pool), revealed: false }, vote: null };
    });
    broadcastState({ ...current, status: "playing", case: courtCase, tally: null, verdict: null, players });
  }

  function handleReveal() {
    if (!channelRef.current) return;
    channelRef.current.send({ type: "broadcast", event: "court_reveal", payload: { playerId } });
  }

  function handleVote(vote) {
    if (!channelRef.current) return;
    channelRef.current.send({ type: "broadcast", event: "court_vote", payload: { playerId, vote } });
  }

  function handleTally(guilty, victim) {
    if (!channelRef.current) return;
    channelRef.current.send({ type: "broadcast", event: "court_tally", payload: { playerId, guilty, victim } });
  }

  function handleVerdict(text) {
    if (!channelRef.current || !text || !text.trim()) return;
    channelRef.current.send({ type: "broadcast", event: "court_verdict", payload: { playerId, text } });
  }

  if (!roomCode || !room) {
    return <CourtMenu dispatch={dispatch} onCreate={handleCreate} onJoin={handleJoin} busy={busy} error={error} />;
  }
  if (room.status === "playing" || room.status === "verdict") {
    return (
      <CourtGame
        room={room}
        roomCode={roomCode}
        playerId={playerId}
        dispatch={dispatch}
        onReveal={handleReveal}
        onVote={handleVote}
        onTally={handleTally}
        onVerdict={handleVerdict}
      />
    );
  }
  return <CourtLobby room={room} roomCode={roomCode} playerId={playerId} dispatch={dispatch} onStart={handleStart} error={error} busy={busy} />;
}

function App() {
  const [state, dispatch] = useReducer(reducer, initialState);

  let screen;
  if (state.screen === "spy-setup") screen = <SpySetup state={state} dispatch={dispatch} />;
  else if (state.screen === "spy-reveal") screen = <SpyReveal state={state} dispatch={dispatch} />;
  else if (state.screen === "spy-playing") screen = <SpyPlaying state={state} dispatch={dispatch} />;
  else if (state.screen === "spy-end") screen = <SpyEnd state={state} dispatch={dispatch} />;
  else if (state.screen === "alias-setup") screen = <AliasSetup state={state} dispatch={dispatch} />;
  else if (state.screen === "alias-team-intro") screen = <AliasTeamIntro state={state} dispatch={dispatch} />;
  else if (state.screen === "alias-playing") screen = <AliasPlaying state={state} dispatch={dispatch} />;
  else if (state.screen === "alias-round-end") screen = <AliasRoundEnd state={state} dispatch={dispatch} />;
  else if (state.screen === "mafia-setup") screen = <MafiaSetup state={state} dispatch={dispatch} />;
  else if (state.screen === "mafia-reveal") screen = <MafiaReveal state={state} dispatch={dispatch} />;
  else if (state.screen === "mafia-roster") screen = <MafiaRoster state={state} dispatch={dispatch} />;
  else if (state.screen === "mafia-game") screen = <MafiaGame state={state} dispatch={dispatch} />;
  else if (state.screen === "mafia-end") screen = <MafiaEnd state={state} dispatch={dispatch} />;
  else if (state.screen === "bunker") screen = <BunkerApp dispatch={dispatch} />;
  else if (state.screen === "court") screen = <CourtApp dispatch={dispatch} />;
  else screen = <Hub dispatch={dispatch} />;

  return (
    <div
      className="max-w-md mx-auto relative"
      style={{
        height: "100dvh",
        background: "var(--bg)",
        paddingTop: "env(safe-area-inset-top, 0px)",
        paddingBottom: "env(safe-area-inset-bottom, 0px)",
        boxSizing: "border-box",
        overflow: "hidden",
      }}
    >
      <FadeIn key={state.screen} className="h-full">
        {screen}
      </FadeIn>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
  // No service worker is used by this app. Actively unregister any that may
  // have been installed by an older version and clear its caches, so phones
  // that got "stuck" serving an old offline-cached copy pick up new updates.
  if ("serviceWorker" in navigator && navigator.serviceWorker.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then((regs) => {
      regs.forEach((reg) => reg.unregister());
    }).catch(() => {});
  }
  if (window.caches && caches.keys) {
    caches.keys().then((keys) => {
      keys.forEach((key) => caches.delete(key));
    }).catch(() => {});
  }
</script>
