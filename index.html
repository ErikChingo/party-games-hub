  @keyframes typingBounce{ 0%,60%,100%{ transform:translateY(0); opacity:.4;} 30%{ transform:translateY(-4px); opacity:1;} }

  @media (prefers-reduced-motion: reduce){
    .pop, .pulse, .flash-badge, .breathe, .neon-pulse, .typing-dot{ animation:none !important; }
  }

  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }

  /* App shell height: a plain inline style={{height:"100dvh"}} can't express a  */
  /* fallback for browsers/WebViews that don't support dvh units (some older     */
  /* Android Chrome/WebView) — there an unsupported value falls through to       */
  /* "auto", which can break the h-full/flex-1 height chain used by every        */
  /* screen and, combined with overflow:hidden on this same element, silently    */
  /* clips (rather than scrolls) any content taller than the broken height       */
  /* instead of showing it. A real CSS class can declare the same property       */
  /* twice; the browser keeps the last one it understands and ignores the rest.  */
  .app-shell{
    height: 100vh;   /* fallback for browsers without dvh support */
    height: 100dvh;  /* real viewport height on mobile browsers that support it */
    max-width: var(--shell-w);
  }

  /* Every bottom-sheet/modal shares this width with .app-shell (via the   */
  /* same --shell-w variable) so a sheet never looks narrower or wider     */
  /* than the "phone" card it's opened from, on any screen size.          */
  .sheet-w{
    max-width: var(--shell-w);
  }

  /* Base (mobile) position of the floating support bubble — identical to  */
  /* the values that used to live inline on the element; pulled out here   */
  /* only so the desktop media query below can override just this one      */
  /* rule instead of fighting an inline style.                             */
  .support-fab{
    right: max(1.25rem, env(safe-area-inset-right, 0px));
    bottom: calc(1.25rem + env(safe-area-inset-bottom, 0px));
  }
  .update-banner{
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  }

  /* Desktop/laptop framing: gated on having a real mouse/trackpad         */
  /* (hover:hover + pointer:fine describe the PRIMARY input device, not    */
  /* the window size) rather than a viewport-width breakpoint. A phone or  */
  /* touch tablet never matches this, no matter its screen size — but      */
  /* neither does a desktop browser window that's been resized narrow,     */
  /* which a plain min-width breakpoint would have wrongly treated as      */
  /* "mobile". The "phone" card gets a bit more room, a visible frame,     */
  /* and a soft decorative background fills the space that would           */
  /* otherwise sit empty around it — down to whatever width is actually    */
  /* available, so a narrow desktop window still looks intentional.        */
  @media (hover: hover) and (pointer: fine){
    :root{ --shell-w: 32rem; }
    html, body{ height: auto; min-height: 100%; }
    body{
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 2.5rem 1.5rem;
      background:
        radial-gradient(1100px 640px at 12% -8%, rgba(232,181,69,.12) 0%, rgba(232,181,69,0) 60%),
        radial-gradient(900px 620px at 100% 108%, rgba(168,85,247,.11) 0%, rgba(168,85,247,0) 60%),
        var(--bg);
    }
    #root{ height: auto; }
    .app-shell{
      height: min(880px, 94vh);
      border-radius: 2.25rem;
      border: 1px solid var(--border-strong);
      box-shadow: 0 40px 90px -24px rgba(0,0,0,.55);
    }
    /* Keeps the support bubble pinned to the "phone" card's own corner    */
    /* instead of drifting off to the real browser window's corner once    */
    /* the card stops filling the whole viewport.                          */
    .support-fab{
      right: calc(50vw - (var(--shell-w) / 2) + 1.25rem);
      bottom: calc(50vh - (min(880px, 94vh) / 2) + 1.25rem);
    }
    /* Same reasoning as .support-fab above: keep it anchored to the       */
    /* card's own bottom edge, not the real browser window's.              */
    .update-banner{
      bottom: calc(50vh - (min(880px, 94vh) / 2) + 1rem);
    }
    /* Bottom sheets (Settings, Rules, Stats, QR, Support chat…) still dim */
    /* the whole browser window — that reads fine as a normal dialog       */
    /* backdrop — but the sheet itself should slide up from the "phone"    */
    /* card's own bottom edge, not the real window's, or it'd look like    */
    /* it's floating below the card with a gap underneath it.              */
    .modal-overlay{
      padding-bottom: calc(50vh - (min(880px, 94vh) / 2));
    }
    /* A small bit of extra polish for mouse pointers, on top of           */
    /* GameCard's own hover:scale-105 — guarded by the same media query so */
    /* a touchscreen never gets a "stuck" hover state from a tap.          */
    button:not(:disabled):hover{ filter: brightness(1.07); }
  }

  /* Mobile-first button safety net: every <button> in the app gets a         */
  /* comfortable tap target, can't be squeezed by flex siblings, wraps long   */
  /* text instead of overflowing, and gets crisp touch behavior — without     */
  /* having to hand-edit every single button's className. Small round icon   */
  /* buttons (back arrows, the settings gear, close ×, steppers) keep their   */
  /* own compact circular size instead of being stretched to the floor.      */
  button{
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    flex-shrink: 0;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  button:not([class*="rounded-full"]){
    min-height: 50px;
  }

  // Last-resort crash reporting: a fatal error anywhere (React render,

  // below can both show a human-readable copy of it AND silently beacon
  // the same fields to /api/support-ticket — that endpoint already relays
  // to the Discord webhook used for manual bug reports, so this just
  // means Erik finds out about a crash from Discord instead of only ever
  // hearing about it if someone bothers to copy-paste and send the report
  // themselves. The on-screen overlay and its "copy report"/"start over"
  // buttons are unchanged; this only adds a background beacon alongside them.
  function hatsitFormatErrorReport(error, extra) {
    var message = error && error.message ? error.message : String(error);
    var stack = error && error.stack ? String(error.stack).split("\n").slice(0, 15).join("\n") : "";
    var componentStack = extra && extra.componentStack ? String(extra.componentStack).split("\n").slice(0, 10).join("\n") : "";
    var screen = "неизвестен";
    try {
      var saved = sessionStorage.getItem("hatsit_app_state_v1");
      if (saved) {
        var parsed = JSON.parse(saved);
        if (parsed && parsed.screen) screen = parsed.screen;
      }
    } catch (e) {}
    var userAgent = navigator.userAgent;
    var online = navigator.onLine;

    var lines = [];
    lines.push("Хатсит — отчёт об ошибке");
    lines.push("Время: " + new Date().toISOString());
    lines.push("Сообщение: " + message);
    if (stack) lines.push("Stack:\n" + stack);
    if (componentStack) lines.push("Component stack:\n" + componentStack);
    lines.push("Экран: " + screen);
    lines.push("Браузер: " + userAgent);
    lines.push("Онлайн: " + (online ? "да" : "нет"));

    return { text: lines.join("\n"), message: message, stack: stack, componentStack: componentStack, screen: screen, userAgent: userAgent, online: online };
  }

  // Fire-and-forget: never blocks or delays the crash overlay below, and
  // any failure (offline, endpoint down, webhook not configured yet) is
  // silently swallowed — a user mid-crash should never see a second error
  // about the error-reporting itself.
  function hatsitBeaconCrashReport(report) {
    try {
      var payload = JSON.stringify({
        type: "crash",
        message: report.message,
        stack: [report.stack, report.componentStack].filter(Boolean).join("\n\n"),
        screen: report.screen,
        userAgent: report.userAgent,
        online: report.online,
      });
      if (navigator.sendBeacon) {
        navigator.sendBeacon("/api/support-ticket", payload);
      } else {
        fetch("/api/support-ticket", { method: "POST", headers: { "Content-Type": "application/json" }, body: payload, keepalive: true }).catch(function () {});
      }
    } catch (e) {}
  }

  var __hatsitCrashShown = false;
  function hatsitShowCrashOverlay(report) {
    if (__hatsitCrashShown) return;
    __hatsitCrashShown = true;
    hatsitBeaconCrashReport(report);
    try {
      var overlay = document.createElement("div");
      overlay.setAttribute(
        "style",
        "position:fixed;inset:0;z-index:99999;background:#0b0e14;color:#f2f2f2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;text-align:center;"
      );
      overlay.innerHTML =
        '<div style="font-size:40px;margin-bottom:12px;">⚠️</div>' +
        '<div style="font-size:20px;font-weight:600;margin-bottom:8px;">Что-то пошло не так</div>' +
        '<div style="font-size:14px;opacity:.7;max-width:320px;margin-bottom:24px;">Приложение столкнулось с ошибкой. Скопируйте отчёт и пришлите его — это поможет быстро найти причину.</div>' +
        '<button id="__hatsitCrashCopyBtn" style="width:260px;padding:14px;border-radius:16px;background:#e8b545;color:#0b0e14;font-weight:600;font-size:15px;border:none;margin-bottom:12px;">Скопировать отчёт</button>' +
        '<button id="__hatsitCrashReloadBtn" style="width:260px;padding:14px;border-radius:16px;background:transparent;color:#f2f2f2;font-weight:500;font-size:15px;border:1px solid rgba(255,255,255,.2);">Начать заново</button>';
      document.body.appendChild(overlay);
      var copyBtn = overlay.querySelector("#__hatsitCrashCopyBtn");
      var reloadBtn = overlay.querySelector("#__hatsitCrashReloadBtn");
      copyBtn.addEventListener("click", function () {
        try {
          navigator.clipboard.writeText(report.text);
          copyBtn.textContent = "Скопировано!";
          setTimeout(function () {
            copyBtn.textContent = "Скопировать отчёт";
          }, 1500);
        } catch (e) {}
      });
      reloadBtn.addEventListener("click", function () {
        try {
          sessionStorage.clear();
        } catch (e) {}
        window.location.reload();
      });
    } catch (e) {}
  }

  window.addEventListener("error", function (e) {
    // Scripts from other origins (React/Babel/Supabase-js/Telegram's own
    // SDK, all loaded from CDNs) get their error details stripped by the
    // browser for security — no real message, no filename, no e.error
    // object, just the literal string "Script error.". This happens a lot
    // right when the user backgrounds/minimizes the Telegram WebView (a
    // socket or fetch gets cut off mid-flight) and is essentially always
    // harmless noise, not an actual app crash — there's nothing in it we
    // could act on even if we wanted to. Showing the full "something broke"
    // overlay (and pinging Discord) for these was scaring users over
    // nothing, so they're ignored here; a real bug in our own code always
    // comes through with a proper message/stack and still triggers the
    // overlay normally below.
    if (!e.error && !e.filename && e.message === "Script error.") return;
    hatsitShowCrashOverlay(hatsitFormatErrorReport(e.error || new Error(e.message || "Unknown error")));
  });
  window.addEventListener("unhandledrejection", function (e) {
    hatsitShowCrashOverlay(hatsitFormatErrorReport(e.reason instanceof Error ? e.reason : new Error(String(e.reason))));
  });
</script>

<script>
  /*
   * Minimal, dependency-free QR Code encoder (Byte mode only, EC level L,
   * versions 1-6). Written from scratch so the app never depends on an
   * external CDN for this feature. Exposes `HatsitQR.encode(text)` which
   * returns { size, isDark(row, col) } describing the module matrix.
   *
   * Verified with an extensive offline round-trip test suite (own bit-level
   * decoder plus two independent real QR decoders across versions 1-6 and
   * many realistic invite URLs) before being inlined here.
   */
  (function (global) {
    "use strict";

    // ---------- GF(256) tables (primitive polynomial x^8+x^4+x^3+x^2+1 = 0x11D) ----------
    var GF_EXP = new Array(512);
    var GF_LOG = new Array(256);
    (function initGF() {
      var x = 1;
      for (var i = 0; i < 255; i++) {
        GF_EXP[i] = x;
        GF_LOG[x] = i;
        x <<= 1;
        if (x & 0x100) x ^= 0x11d;
      }
      for (var i = 255; i < 512; i++) GF_EXP[i] = GF_EXP[i - 255];
    })();

    function gfMul(a, b) {
      if (a === 0 || b === 0) return 0;
      return GF_EXP[GF_LOG[a] + GF_LOG[b]];
    }

    // Reed-Solomon generator polynomial for `degree` EC codewords.
    function rsGeneratorPoly(degree) {
      var poly = [1];
      for (var i = 0; i < degree; i++) {
        var res = new Array(poly.length + 1).fill(0);
        for (var j = 0; j < poly.length; j++) {
          res[j] ^= poly[j];
          res[j + 1] ^= gfMul(poly[j], GF_EXP[i]);
        }
        poly = res;
      }
      return poly;
    }

    function rsEncode(dataCodewords, ecCount) {
      var generator = rsGeneratorPoly(ecCount);
      var remainder = dataCodewords.concat(new Array(ecCount).fill(0));
      for (var i = 0; i < dataCodewords.length; i++) {
        var coef = remainder[i];
        if (coef === 0) continue;
        for (var j = 0; j < generator.length; j++) {
          remainder[i + j] ^= gfMul(generator[j], coef);
        }
      }
      return remainder.slice(dataCodewords.length);
    }

    // ---------- Version table: EC level L only, versions 1-6 ----------
    var VERSION_TABLE = {
      1: { totalCw: 26, ecPerBlock: 7, numBlocks: 1, size: 21 },
      2: { totalCw: 44, ecPerBlock: 10, numBlocks: 1, size: 25 },
      3: { totalCw: 70, ecPerBlock: 15, numBlocks: 1, size: 29 },
      4: { totalCw: 100, ecPerBlock: 20, numBlocks: 1, size: 33 },
      5: { totalCw: 134, ecPerBlock: 26, numBlocks: 1, size: 37 },
      6: { totalCw: 172, ecPerBlock: 18, numBlocks: 2, size: 41 },
    };
    var ALIGNMENT_CENTER = { 2: 18, 3: 22, 4: 26, 5: 30, 6: 34 }; // single extra alignment pattern at (c,c)

    function dataCodewordCount(v) {
      var t = VERSION_TABLE[v];
      return t.totalCw - t.ecPerBlock * t.numBlocks;
    }

    function charCountBits(v) {
      return v <= 9 ? 8 : 16; // byte mode; we only go up to v6 so always 8
    }

    function pickVersion(byteLen) {
      for (var v = 1; v <= 6; v++) {
        var dataCw = dataCodewordCount(v);
        var headerBits = 4 + charCountBits(v);
        var capacityBits = dataCw * 8;
        var neededBits = headerBits + byteLen * 8;
        if (neededBits <= capacityBits) return v;
      }
      return null; // caller must handle (shouldn't happen for our URLs)
    }

    function utf8Bytes(str) {
      return Array.from(new TextEncoder().encode(str));
    }

    function buildBitStream(bytes, version) {
      var bits = [];
      function push(value, len) {
        for (var i = len - 1; i >= 0; i--) bits.push((value >> i) & 1);
      }
      push(0x4, 4); // byte mode indicator
      push(bytes.length, charCountBits(version));
      for (var i = 0; i < bytes.length; i++) push(bytes[i], 8);

      var dataCw = dataCodewordCount(version);
      var capacityBits = dataCw * 8;

      // Terminator (up to 4 bits)
      for (var i = 0; i < 4 && bits.length < capacityBits; i++) bits.push(0);
      // Pad to byte boundary
      while (bits.length % 8 !== 0) bits.push(0);
      // Convert to bytes so far
      var codewords = [];
      for (var i = 0; i < bits.length; i += 8) {
        var b = 0;
        for (var j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
        codewords.push(b);
      }
      // Pad codewords with 0xEC/0x11 alternating
      var padToggle = true;
      while (codewords.length < dataCw) {
        codewords.push(padToggle ? 0xec : 0x11);
        padToggle = !padToggle;
      }
      return codewords;
    }

    function interleave(dataCodewords, version) {
      var t = VERSION_TABLE[version];
      var numBlocks = t.numBlocks;
      var ecPerBlock = t.ecPerBlock;
      var totalData = dataCodewords.length;
      var baseLen = Math.floor(totalData / numBlocks);
      var extra = totalData % numBlocks; // blocks with one extra data codeword, higher index blocks get it
      var blocks = [];
      var ecBlocks = [];
      var offset = 0;
      for (var b = 0; b < numBlocks; b++) {
        var len = baseLen + (b >= numBlocks - extra ? 1 : 0);
        var block = dataCodewords.slice(offset, offset + len);
        offset += len;
        blocks.push(block);
        ecBlocks.push(rsEncode(block, ecPerBlock));
      }
      var result = [];
      var maxDataLen = Math.max.apply(null, blocks.map(function (b) { return b.length; }));
      for (var i = 0; i < maxDataLen; i++) {
        for (var b = 0; b < numBlocks; b++) {
          if (i < blocks[b].length) result.push(blocks[b][i]);
        }
      }
      for (var i = 0; i < ecPerBlock; i++) {
        for (var b = 0; b < numBlocks; b++) {
          result.push(ecBlocks[b][i]);
        }
      }
      return result;
    }

    // ---------- Matrix construction ----------
    function makeMatrix(size) {
      var m = [];
      for (var r = 0; r < size; r++) {
        m.push(new Array(size).fill(null)); // null = not yet assigned
      }
      return m;
    }

    function placeFinder(m, row, col) {
      for (var r = -1; r <= 7; r++) {
        for (var c = -1; c <= 7; c++) {
          var rr = row + r, cc = col + c;
          if (rr < 0 || cc < 0 || rr >= m.length || cc >= m.length) continue;
          var dark = false;
          if (r >= 0 && r <= 6 && c >= 0 && c <= 6) {
            if (r === 0 || r === 6 || c === 0 || c === 6) dark = true;
            else if (r >= 2 && r <= 4 && c >= 2 && c <= 4) dark = true;
            else dark = false;
          } else {
            dark = false; // separator (white border)
          }
          m[rr][cc] = dark;
        }
      }
    }

    function placeAlignment(m, row, col) {
      for (var r = -2; r <= 2; r++) {
        for (var c = -2; c <= 2; c++) {
          var dark = (Math.max(Math.abs(r), Math.abs(c)) !== 1);
          m[row + r][col + c] = dark;
        }
      }
    }

    function placeTiming(m) {
      var size = m.length;
      for (var i = 8; i < size - 8; i++) {
        if (m[6][i] === null) m[6][i] = i % 2 === 0;
        if (m[i][6] === null) m[i][6] = i % 2 === 0;
      }
    }

    function buildReservedMask(size, version) {
      var mask = [];
      for (var r = 0; r < size; r++) mask.push(new Array(size).fill(false));
      function markBlock(r0, c0, r1, c1) {
        for (var r = r0; r <= r1; r++) for (var c = c0; c <= c1; c++) {
          if (r >= 0 && c >= 0 && r < size && c < size) mask[r][c] = true;
        }
      }
      // Finder + separators (8x8 corners)
      markBlock(0, 0, 7, 7);
      markBlock(0, size - 8, 7, size - 1);
      markBlock(size - 8, 0, size - 1, 7);
      // Timing patterns
      for (var i = 0; i < size; i++) { mask[6][i] = true; mask[i][6] = true; }
      // Alignment pattern
      if (ALIGNMENT_CENTER[version]) {
        var c = ALIGNMENT_CENTER[version];
        markBlock(c - 2, c - 2, c + 2, c + 2);
      }
      // Dark module + format info areas
      markBlock(size - 8, 8, size - 8, 8);
      markBlock(0, 8, 8, 8);
      markBlock(8, 0, 8, 8);
      markBlock(8, size - 8, 8, size - 1);
      markBlock(size - 7, 8, size - 1, 8);
      return mask;
    }

    var MASK_FUNCS = [
      function (r, c) { return (r + c) % 2 === 0; },
      function (r, c) { return r % 2 === 0; },
      function (r, c) { return c % 3 === 0; },
      function (r, c) { return (r + c) % 3 === 0; },
      function (r, c) { return (Math.floor(r / 2) + Math.floor(c / 3)) % 2 === 0; },
      function (r, c) { return ((r * c) % 2) + ((r * c) % 3) === 0; },
      function (r, c) { return (((r * c) % 2) + ((r * c) % 3)) % 2 === 0; },
      function (r, c) { return (((r + c) % 2) + ((r * c) % 3)) % 2 === 0; },
    ];

    function placeData(m, reserved, codewords) {
      var size = m.length;
      var bitIndex = 0;
      var bits = [];
      for (var i = 0; i < codewords.length; i++) {
        for (var b = 7; b >= 0; b--) bits.push((codewords[i] >> b) & 1);
      }
      var col = size - 1;
      var upward = true;
      while (col > 0) {
        if (col === 6) col--; // skip timing column
        for (var i = 0; i < size; i++) {
          var row = upward ? size - 1 - i : i;
          for (var cOff = 0; cOff < 2; cOff++) {
            var cc = col - cOff;
            if (reserved[row][cc]) continue;
            var bit = bitIndex < bits.length ? bits[bitIndex] : 0;
            bitIndex++;
            m[row][cc] = bit === 1;
          }
        }
        upward = !upward;
        col -= 2;
      }
    }

    function applyMask(m, reserved, maskFn) {
      var size = m.length;
      var out = makeMatrix(size);
      for (var r = 0; r < size; r++) {
        for (var c = 0; c < size; c++) {
          if (reserved[r][c]) { out[r][c] = m[r][c]; continue; }
          var bit = m[r][c] === true ? 1 : 0;
          if (maskFn(r, c)) bit ^= 1;
          out[r][c] = bit === 1;
        }
      }
      return out;
    }

    function penalty(m) {
      var size = m.length;
      var score = 0;
      // Rule 1: runs of 5+ same color in a row/column
      function runPenalty(getVal) {
        var p = 0;
        for (var i = 0; i < size; i++) {
          var run = 1;
          var prev = getVal(i, 0);
          for (var j = 1; j < size; j++) {
            var v = getVal(i, j);
            if (v === prev) {
              run++;
            } else {
              if (run >= 5) p += 3 + (run - 5);
              run = 1;
              prev = v;
            }
          }
          if (run >= 5) p += 3 + (run - 5);
        }
        return p;
      }
      score += runPenalty(function (i, j) { return m[i][j]; });
      score += runPenalty(function (i, j) { return m[j][i]; });
      // Rule 2: 2x2 blocks of the same color
      for (var r = 0; r < size - 1; r++) {
        for (var c = 0; c < size - 1; c++) {
          var v = m[r][c];
          if (v === m[r][c + 1] && v === m[r + 1][c] && v === m[r + 1][c + 1]) score += 3;
        }
      }
      // Rule 3: finder-pattern-like runs (1:1:3:1:1 with 4 light modules on
      // either side) confuse real-world scanners even though the data is
      // still technically valid — this is what keeps a mask pattern that
      // scans unreliably from ever being selected.
      function hasFinderLikeRun(vals, start) {
        var core = [true, false, true, true, true, false, true];
        for (var k = 0; k < 7; k++) if (vals[start + k] !== core[k]) return false;
        var beforeOk = true;
        for (var k = 1; k <= 4; k++) { var idx = start - k; if (idx >= 0 && vals[idx] !== false) { beforeOk = false; break; } }
        var afterOk = true;
        for (var k = 0; k < 4; k++) { var idx = start + 7 + k; if (idx < vals.length && vals[idx] !== false) { afterOk = false; break; } }
        return beforeOk || afterOk;
      }
      function rule3Penalty(getVal) {
        var p = 0;
        for (var i = 0; i < size; i++) {
          var vals = [];
          for (var j = 0; j < size; j++) vals.push(getVal(i, j));
          for (var j = 0; j + 7 <= size; j++) {
            if (hasFinderLikeRun(vals, j)) p += 40;
          }
        }
        return p;
      }
      score += rule3Penalty(function (i, j) { return m[i][j]; });
      score += rule3Penalty(function (i, j) { return m[j][i]; });
      // Rule 4: overall dark/light balance, penalizing deviation from 50%.
      var dark = 0;
      for (var r = 0; r < size; r++) for (var c = 0; c < size; c++) if (m[r][c]) dark++;
      var percent = (dark / (size * size)) * 100;
      var prevMult = Math.floor(percent / 5) * 5;
      var nextMult = prevMult + 5;
      score += Math.min(Math.abs(prevMult - 50), Math.abs(nextMult - 50)) / 5 * 10;
      return score;
    }

    // ---------- Format info (EC level L = binary 01) ----------
    function formatBCH(data5) {
      var g = 0x537; // generator polynomial 10100110111
      var val = data5 << 10;
      for (var i = 4; i >= 0; i--) {
        if (val & (1 << (i + 10))) val ^= g << i;
      }
      return val & 0x3ff;
    }

    function writeFormatInfo(m, maskIdx, size) {
      var ecBits = 0x01; // L
      var data5 = (ecBits << 3) | maskIdx;
      var bch = formatBCH(data5);
      var format = ((data5 << 10) | bch) ^ 0x5412;
      var f = [];
      for (var i = 14; i >= 0; i--) f.push((format >> i) & 1); // f[0..14], MSB first

      // First (top-left) copy, per ISO 18004 Fig. 25.
      for (var c = 0; c <= 5; c++) m[8][c] = f[c] === 1;
      m[8][7] = f[6] === 1;
      m[8][8] = f[7] === 1;
      m[7][8] = f[8] === 1;
      var vertRows2 = [5, 4, 3, 2, 1, 0];
      for (var i = 0; i < vertRows2.length; i++) m[vertRows2[i]][8] = f[9 + i] === 1;

      // Second (redundant) copy.
      for (var i = 0; i < 8; i++) m[8][size - 1 - i] = f[i] === 1;
      for (var i = 0; i < 7; i++) m[size - 7 + i][8] = f[8 + i] === 1;
    }

    function encode(text) {
      var bytes = utf8Bytes(text);
      var version = pickVersion(bytes.length);
      if (!version) throw new Error("QR: text too long for supported versions (max ~130 bytes)");
      var size = VERSION_TABLE[version].size;

      var dataCodewords = buildBitStream(bytes, version);
      var allCodewords = interleave(dataCodewords, version);

      var base = makeMatrix(size);
      placeFinder(base, 0, 0);
      placeFinder(base, 0, size - 7);
      placeFinder(base, size - 7, 0);
      placeTiming(base);
      if (ALIGNMENT_CENTER[version]) {
        var c = ALIGNMENT_CENTER[version];
        placeAlignment(base, c, c);
      }
      base[size - 8][8] = true; // dark module

      var reserved = buildReservedMask(size, version);
      placeData(base, reserved, allCodewords);

      // Mask pattern 7 is deliberately excluded here: extensive round-trip
      // testing (a from-scratch bit-level decoder plus two independent
      // real QR decoders) showed patterns 0-6 always scan reliably for
      // this app's inputs, while pattern 7 intermittently failed on real
      // decoders despite passing our own bit-level correctness check — so
      // rather than risk shipping something occasionally unscannable, we
      // simply never pick it.
      var best = null, bestScore = Infinity, bestMaskIdx = 0;
      for (var mi = 0; mi <= 6; mi++) {
        var masked = applyMask(base, reserved, MASK_FUNCS[mi]);
        writeFormatInfo(masked, mi, size);
        var s = penalty(masked);
        if (s < bestScore) { bestScore = s; best = masked; bestMaskIdx = mi; }
      }
      return {
        size: size,
        version: version,
        maskIdx: bestMaskIdx,
        isDark: function (r, c) { return best[r][c] === true; },
      };
    }

    global.HatsitQR = { encode: encode };
  })(window);
</script>

// need to change if Telegram ever renames the global.
function tg() {
  return (window.Telegram && window.Telegram.WebApp) || null;
}

/* ---------------------------------------------------------------- */
/* Persistent player identity ("Удержание и вовлечение")             */
/*                                                                    */
/* Unlike STATS_KEY above (sessionStorage, one evening only), the      */
/* features below -- leaderboards, achievements, daily streak -- need  */
/* an id that survives real sessions. Inside the Telegram Mini App we   */
/* use the real Telegram user id (stable forever, no setup needed);     */
/* everywhere else there's no such thing, so a random id is generated   */
/* once and kept in localStorage. Either way this id is written to the  */
/* public.player_profiles table (see the migration) only through        */
/* SECURITY DEFINER RPCs, never a raw upsert -- see recordWordlessScore  */
/* etc. below.                                                          */
/* ---------------------------------------------------------------- */
const PLAYER_ID_KEY = "hatsit_player_id_v1";
const PLAYER_NAME_KEY = "hatsit_player_name_v1";

function generateAnonId() {
  try {
    if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID();
  } catch (e) {}
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function getPlayerId() {
  try {
    const telegram = tg();
    const tgUser = telegram && telegram.initDataUnsafe && telegram.initDataUnsafe.user;
    if (tgUser && tgUser.id) return "tg:" + tgUser.id;
  } catch (e) {}
  try {
    let id = localStorage.getItem(PLAYER_ID_KEY);
    if (!id) {
      id = "anon:" + generateAnonId();
      localStorage.setItem(PLAYER_ID_KEY, id);
    }
    return id;
  } catch (e) {
    return "anon:" + generateAnonId();
  }
}

// The name shown on the leaderboard/profile. Inside Telegram this comes
// straight from the account (no input needed); on a plain web visit it
// falls back to whatever the player typed into the Profile panel, kept in
// localStorage -- see setPlayerName().
function getPlayerName() {
  try {
    const telegram = tg();
    const tgUser = telegram && telegram.initDataUnsafe && telegram.initDataUnsafe.user;
    if (tgUser) {
      const full = [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" ").trim();
      if (full) return full;
      if (tgUser.username) return "@" + tgUser.username;
    }
  } catch (e) {}
  try {
    const saved = (localStorage.getItem(PLAYER_NAME_KEY) || "").trim();
    if (saved) return saved;
  } catch (e) {}
  return null;
}

function isPlayerNameEditable() {
  return !tg();
}

function setPlayerName(name) {
  const trimmed = (name || "").trim().slice(0, 40);
  try {
    localStorage.setItem(PLAYER_NAME_KEY, trimmed);
  } catch (e) {}
  supabaseClient.rpc("set_display_name", { p_id: getPlayerId(), p_name: trimmed }).catch((e) => {
    console.error("setPlayerName failed:", e);
  });
  return trimmed;
}

// Ratcheting score writes -- see record_wordless_score / record_countdown_score
// in the migration: the server keeps whichever of (old, new) is higher, so
// calling this after every single round, win or lose, is always safe.
async function recordWordlessScore(level) {
  try {
    await supabaseClient.rpc("record_wordless_score", { p_id: getPlayerId(), p_name: getPlayerName(), p_level: level });
  } catch (e) {
    console.error("recordWordlessScore failed:", e);
  }
}
async function recordCountdownScore(rounds) {
  try {
    await supabaseClient.rpc("record_countdown_score", { p_id: getPlayerId(), p_name: getPlayerName(), p_rounds: rounds });
  } catch (e) {
    console.error("recordCountdownScore failed:", e);
  }
}
// Bunker/Court have no computed win condition (the host/judge ends them by
// judgement call -- see the GO_HUB reducer comment), so unlike the two
// functions above there's no "score" to ratchet: this just increments a
// plain games-played counter. See useRecordGamePlayedOnStart() below for
// where it's called from (once per room actually starting play).
async function recordGamePlayed(game) {
  try {
    await supabaseClient.rpc("record_game_played", { p_id: getPlayerId(), p_name: getPlayerName(), p_game: game });
  } catch (e) {
    console.error("recordGamePlayed failed:", e);
  }
}
// Fires recordGamePlayed(game) exactly when `status` transitions INTO
// "playing" from something else -- not on every re-render while already
// playing (Bunker/Court broadcast a state update on nearly every action).
// Court can start a fresh case without leaving the room (status goes
// "playing" -> "verdict" -> "playing" again via handleNewCase), and this
// correctly counts each new case as its own played game, since the edge
// re-arms itself once status leaves "playing".
function useRecordGamePlayedOnStart(status, game) {
  const prevRef = useRef(status);
  useEffect(() => {
    if (status === "playing" && prevRef.current !== "playing") {
      recordGamePlayed(game);
    }
    prevRef.current = status;
  }, [status, game]);
}

// Local mirror of the server's streak_current/streak_longest, cached so the
// Hub can show the flame badge instantly without an extra round trip on
// every open. pingDailyStreak() below is the only writer; it's always
// followed by an update to this cache.
const STREAK_CACHE_KEY = "hatsit_streak_cache_v1";
function loadStreakCache() {
  try {
    const raw = localStorage.getItem(STREAK_CACHE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return { current: parsed.current || 0, longest: parsed.longest || 0, pingedOn: parsed.pingedOn || null };
    }
  } catch (e) {}
  return { current: 0, longest: 0, pingedOn: null };
}
function saveStreakCache(patch) {
  const next = { ...loadStreakCache(), ...patch };
  try {
    localStorage.setItem(STREAK_CACHE_KEY, JSON.stringify(next));
  } catch (e) {}
  return next;
}
function todayDateString() {
  // YYYY-MM-DD in the player's local timezone (not UTC), so "today" matches
  // what the player actually perceives as today.
  const d = new Date();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}
// Records "the player opened Hatsit today" toward the daily streak, at most
// once per calendar day (the pingedOn guard below) so opening the Hub
// repeatedly in one day doesn't spam the RPC. Safe to call unconditionally
// on every Hub mount.
async function pingDailyStreak() {
  const today = todayDateString();
  const cache = loadStreakCache();
  if (cache.pingedOn === today) return cache;
  try {
    const { data, error } = await supabaseClient.rpc("record_daily_play", { p_id: getPlayerId(), p_name: getPlayerName() });
    if (error) throw error;
    const row = Array.isArray(data) ? data[0] : data;
    if (row) {
      return saveStreakCache({ current: row.streak_current, longest: row.streak_longest, pingedOn: today });
    }
  } catch (e) {
    console.error("pingDailyStreak failed:", e);
  }
  return cache;
}

async function fetchMyProfile() {
  try {
    const { data, error } = await supabaseClient.from("player_profiles").select("*").eq("id", getPlayerId()).maybeSingle();
    if (error) throw error;
    return data;
  } catch (e) {
    console.error("fetchMyProfile failed:", e);
    return null;
  }
}

// Top N rows for one leaderboard column, plus (if the player isn't already
// in that page) a cheap COUNT to work out their own rank.
const LEADERBOARD_COLUMNS = {
  wordless: "wordless_best",
  countdown: "countdown_best",
  bunker: "bunker_played",
  court: "court_played",
};
// Drives both the ProfilePanel leaderboard tab grid and which column
// fetchLeaderboard() above reads -- one list to keep in sync instead of two.
const LEADERBOARD_TABS = [
  { key: "wordless", labelKey: "leaderboard.wordlessTab" },
  { key: "countdown", labelKey: "leaderboard.countdownTab" },
  { key: "bunker", labelKey: "leaderboard.bunkerTab" },
  { key: "court", labelKey: "leaderboard.courtTab" },
];
async function fetchLeaderboard(game, limit = 20) {
  const column = LEADERBOARD_COLUMNS[game] || "wordless_best";
  const rows = [];
  try {
    // Also fetches the three fields computeUnlockedAchievementIds() reads
    // (wordless_best/countdown_best/streak_longest), even when they're not
    // this tab's own column, so getPlayerTitle() can show every row's
    // cosmetic nickname/color on the leaderboard -- not just the viewer's.
    const { data, error } = await supabaseClient
      .from("player_profiles")
      .select(`id, display_name, wordless_best, countdown_best, streak_longest, ${column}`)
      .gt(column, 0)
      .order(column, { ascending: false })
      .limit(limit);
    if (error) throw error;
    (data || []).forEach((r) =>
      rows.push({
        id: r.id,
        name: r.display_name,
        value: r[column],
        wordless_best: r.wordless_best,
        countdown_best: r.countdown_best,
        streak_longest: r.streak_longest,
      })
    );
  } catch (e) {
    console.error("fetchLeaderboard failed:", e);
  }

  const myId = getPlayerId();
  let myRank = null;
  const myRowInPage = rows.find((r) => r.id === myId);
  if (myRowInPage) {
    myRank = rows.indexOf(myRowInPage) + 1;
  } else {
    try {
      const mine = await fetchMyProfile();
      const myValue = mine ? mine[column] || 0 : 0;
      if (myValue > 0) {
        const { count, error } = await supabaseClient
          .from("player_profiles")
          .select("id", { count: "exact", head: true })
          .gt(column, myValue);
        if (error) throw error;
        myRank = (count || 0) + 1;
      }
    } catch (e) {
      console.error("fetchLeaderboard rank lookup failed:", e);
    }
  }
  return { rows, myId, myRank };
}

// computeUnlockedAchievementIds() and the ACHIEVEMENTS list it walks live
// further down, right after the icon set they reference (Icon components
// like IconFlame aren't defined yet at this point in the file).

// Generic "tell someone about this result" share -- distinct from
// shareRoomInvite() above (that one encodes a joinable room code; this one
// is just bragging rights, no state to carry), but the same
// Telegram-share-sheet -> Web Share API -> clipboard fallback chain.
function shareAppResult(text, onCopied) {
  const telegram = tg();
  const appUrl = `https://t.me/${TELEGRAM_BOT_USERNAME}/${TELEGRAM_MINIAPP_SHORTNAME}`;
  if (telegram) {
    try {
      if (typeof telegram.shareURL === "function") {
        telegram.shareURL(appUrl, text);
        return;
      }
      if (typeof telegram.openTelegramLink === "function") {
        telegram.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(appUrl)}&text=${encodeURIComponent(text)}`);
        return;
      }
    } catch (e) {}
    try {
      navigator.clipboard.writeText(text + " " + appUrl);
      if (onCopied) onCopied();
    } catch (e) {}
    return;
  }

  const url = `${window.location.origin}${window.location.pathname}`;
  if (navigator.share) {
    const shareLang = HATSIT_LANGS.includes(hatsitSettings.language) ? hatsitSettings.language : "ru";
    navigator.share({ title: t_lookup("brand.name", shareLang), text, url }).catch(() => {});
  } else {
    try {
      navigator.clipboard.writeText(text + " " + url);
      if (onCopied) onCopied();
    } catch (e) {}
  }
}

/* ---------------------------------------------------------------- */
/* App settings — sound & vibration toggles, persisted on the device */
/* (localStorage). A tiny pub/sub lets any component subscribe, while*/
/* plain (non-React) helpers like the sound engine read the value    */
/* straight off the module-level `hatsitSettings` object.            */
/* ---------------------------------------------------------------- */
const HATSIT_LANGS = ["ru", "en", "hy"];
function loadHatsitSettings() {
  try {
    const raw = localStorage.getItem("hatsitSettings");
    if (raw) {
      const parsed = JSON.parse(raw);
      return {
        sound: parsed.sound !== false,
        vibration: parsed.vibration !== false,
        theme: parsed.theme === "light" ? "light" : "dark",
        language: HATSIT_LANGS.includes(parsed.language) ? parsed.language : "ru",
      };
    }
  } catch (e) {}
  return { sound: true, vibration: true, theme: "dark", language: "ru" };
}
let hatsitSettings = loadHatsitSettings();
try {
  document.documentElement.setAttribute("data-theme", hatsitSettings.theme);
} catch (e) {}
const hatsitSettingsListeners = new Set();
function updateHatsitSettings(patch) {
  hatsitSettings = { ...hatsitSettings, ...patch };
  try {
    localStorage.setItem("hatsitSettings", JSON.stringify(hatsitSettings));
  } catch (e) {}
  try {
    document.documentElement.setAttribute("data-theme", hatsitSettings.theme);
  } catch (e) {}
  hatsitSettingsListeners.forEach((fn) => fn(hatsitSettings));
}
function useHatsitSettings() {
  const [settings, setSettings] = useState(hatsitSettings);
  useEffect(() => {
    hatsitSettingsListeners.add(setSettings);
    return () => hatsitSettingsListeners.delete(setSettings);
  }, []);
  return settings;
}
// Active UI language, clamped to a known one — the single source of truth
// every localized-content lookup (useRules, useLocalized, pickLang calls
// scattered through the game screens) is built on top of.
function useLang() {
  const settings = useHatsitSettings();
  return HATSIT_LANGS.includes(settings.language) ? settings.language : "ru";
}
// Resolves a {ru, en, hy} content object (a word, a title, a whole list —
// anything shaped like the i18n dictionary's per-key entries) to the given
// language, falling back to Russian for anything not yet translated. Safe
// to call with a plain non-localized value too (returns it unchanged).
function pickLang(obj, lang) {
  if (obj == null || typeof obj !== "object" || Array.isArray(obj)) return obj;
  if (Object.prototype.hasOwnProperty.call(obj, lang) && obj[lang] != null) return obj[lang];
  return obj.ru;
}
function useLocalized(obj) {
  const lang = useLang();
  return pickLang(obj, lang);
}
function vibrate(pattern) {
  if (!hatsitSettings.vibration) return;
  const telegram = tg();
  if (telegram && telegram.HapticFeedback) {
    // Telegram's in-app browser blocks the raw Vibration API, and its own
    // haptics API only takes discrete style names, not a millisecond
    // pattern -- there's no exact translation, so this approximates: a
    // single short tap maps to a light impact, anything longer/multi-part
    // (e.g. the timer's-up alert) maps to a warning notification, which
    // reads on-device as a stronger, more "something happened" buzz.
    try {
      if (Array.isArray(pattern) && pattern.length > 1) {
        telegram.HapticFeedback.notificationOccurred("warning");
      } else {
        telegram.HapticFeedback.impactOccurred("light");
      }
    } catch (e) {}
    return;
  }
  try {
    if (navigator.vibrate) navigator.vibrate(pattern);
  } catch (e) {}
}

/* ---------------------------------------------------------------- */
/* Shared online-room infrastructure (Bunker, Court, and any future   */
/* Supabase-synced game — see the "adding a new game" checklist below */
/* the i18n block). Every online game here follows the same shape: a  */
/* 4-digit room code, one Host client holding the authoritative room  */
/* object, and every other client only ever *requesting* a change via */
/* a named broadcast event that the Host resolves and re-broadcasts   */
/* as the new authoritative state (fixed event suffix "_state"). This */
/* hook owns all of the connect/reconnect/cleanup/session-persistence */
/* plumbing that used to be copy-pasted between BunkerApp and         */
/* CourtApp line for line; a new online game supplies only:           */
/*   - buildInitialRoom(playerId, name) — the Host's freshly created  */
/*     room object                                                    */
/*   - hostEvents: { eventSuffix: (current, payload, ctx) => nextRoom */
/*     | undefined } — one entry per action guests can *request*      */
/*     (only the Host's channel runs these; everyone else just        */
/*     renders whatever "_state" it receives)                         */
/*   - messages: { enterCode4, enterNameError, connectFailed,         */
/*     notFound, defaultName } — the handful of user-facing strings   */
/* and then layers its own game-specific actions (start round, vote,  */
/* reveal, …) on top using the returned broadcastState()/sendEvent(). */
/* ---------------------------------------------------------------- */
function genRoomCode4() {
  return String(Math.floor(1000 + Math.random() * 9000));
}
function genRoomPlayerId(prefix) {
  return prefix + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}
// Session-scoped "what room was I in" snapshot, so a page refresh (or the
// tab being killed and restored by the OS on a phone) can silently rejoin
// the game instead of dumping the player back at the create/join menu. The
// Host's copy also carries the last-known authoritative room object, since
// the Host is the only source of truth and it otherwise lives only in that
// tab's memory.
function makeRoomSessionStore(storageKey) {
  return {
    persist(code, isHost, room) {
      try {
        const data = { code, isHost, savedAt: Date.now() };
        if (isHost && room) data.room = room;
        sessionStorage.setItem(storageKey, JSON.stringify(data));
      } catch (e) {}
    },
    load() {
      try {
        const raw = sessionStorage.getItem(storageKey);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    },
    clear() {
      try {
        sessionStorage.removeItem(storageKey);
      } catch (e) {}
    },
  };
}

function useGameRoom(config) {
  const { gameKey, genPlayerId, genRoomCode, buildInitialRoom, hostEvents, messages } = config;
  const session = makeRoomSessionStore(gameKey + "Session");

  const [roomCode, setRoomCode] = useState(null);
  // Consumed exactly once — an invite link pre-fills the join code so the
  // player only has to type their name, not copy a 4-digit code by hand.
  const [inviteCode] = useState(() => {
    if (pendingInviteParams && pendingInviteParams.game === gameKey) {
      const code = pendingInviteParams.room;
      pendingInviteParams = null;
      return code;
    }
    return null;
  });
  const [playerId] = useState(() => {
    try {
      const saved = sessionStorage.getItem(gameKey + "PlayerId");
      if (saved) return saved;
    } catch (e) {}
    const id = genPlayerId();
    try {
      sessionStorage.setItem(gameKey + "PlayerId", id);
    } catch (e) {}
    return id;
  });
  const [room, setRoom] = useState(null);
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  // "idle" | "reconnecting" | "offline" — surfaced to the player so a dropped
  // connection mid-game shows *something* instead of a silently frozen screen.
  const [connStatus, setConnStatus] = useState("idle");

  const roomRef = useRef(null);
  const roomCodeRef = useRef(null);
  const channelRef = useRef(null);
  const joinTimeoutRef = useRef(null);
  const prevPlayerCountRef = useRef(null);
  const isHostRef = useRef(false);
  // Flips true the first time we actually receive real room state. Lets us
  // tell "first connect" apart from "reconnected after a drop" in the
  // subscribe callbacks below, so a later hiccup doesn't stomp on live state
  // or throw up a scary error banner nobody can see anyway once in-game.
  const initializedRef = useRef(false);
  // hostEvents/messages come from the caller's render and can reference that
  // render's `t()` closures — refs keep attachChannel's listeners (registered
  // once per channel, not once per render) reading the latest versions.
  const hostEventsRef = useRef(hostEvents);
  hostEventsRef.current = hostEvents;
  const messagesRef = useRef(messages);
  messagesRef.current = messages;

  useEffect(() => {
    roomRef.current = room;
  }, [room]);
  useEffect(() => {
    roomCodeRef.current = roomCode;
  }, [roomCode]);

  // Bell sound whenever a new player shows up while everyone is still in
  // the lobby (fires for the Host and for every other player already in).
  useEffect(() => {
    if (!room || !room.players || room.status !== "lobby") return;
    const count = Object.keys(room.players).length;
    if (prevPlayerCountRef.current !== null && count > prevPlayerCountRef.current) {
      playChimeSound();
      vibrate([30, 40, 30]);
    }
    prevPlayerCountRef.current = count;
  }, [room]);

  function broadcastState(nextRoom) {
    setRoom(nextRoom);
    if (isHostRef.current) session.persist(roomCodeRef.current, true, nextRoom);
    if (channelRef.current) {
      channelRef.current.send({ type: "broadcast", event: gameKey + "_state", payload: { room: nextRoom } });
    }
  }

  function sendEvent(suffix, payload) {
    if (!channelRef.current) return;
    channelRef.current.send({ type: "broadcast", event: gameKey + "_" + suffix, payload });
  }

  // Creates (host) or joins (guest) the Supabase Realtime channel for a room
  // code, and wires up the broadcast events this game relies on.
  function attachChannel(code, isHostChannel) {
    const channel = supabaseClient.channel(gameKey + "-room-" + code, {
      config: { broadcast: { self: true } },
    });

    channel.on("broadcast", { event: gameKey + "_state" }, ({ payload }) => {
      if (!payload || !payload.room) return;
      if (joinTimeoutRef.current) {
        clearTimeout(joinTimeoutRef.current);
        joinTimeoutRef.current = null;
      }
      initializedRef.current = true;
      setRoom(payload.room);
      setRoomCode(code);
      setBusy(false);
      setConnStatus("idle");
      if (!isHostChannel) session.persist(code, false, null);
    });

    // Only the Host resolves join/action requests into authoritative state
    // and rebroadcasts it — every other client just renders what it gets.
    if (isHostChannel) {
      Object.keys(hostEventsRef.current || {}).forEach((suffix) => {
        channel.on("broadcast", { event: gameKey + "_" + suffix }, ({ payload }) => {
          const current = roomRef.current;
          if (!current) return;
          const nextRoom = hostEventsRef.current[suffix](current, payload, { playerId, messages: messagesRef.current });
          if (nextRoom) broadcastState(nextRoom);
        });
      });
    }

    channelRef.current = channel;
    return channel;
  }

  // On mount, try to silently resume whatever room we were last in — covers
  // a page refresh, or a phone browser reloading a backgrounded tab. Gated
  // on pendingReconnectScreen: this component also mounts every time the
  // player taps its tile from the Hub, not just on a real reload — without
  // this check, a room left over from an earlier visit that wasn't closed
  // via the back arrow would resurface every time instead of a fresh menu.
  useEffect(() => {
    const eligible = pendingReconnectScreen === gameKey;
    pendingReconnectScreen = null;
    if (!eligible) {
      session.clear();
      return;
    }
    const saved = session.load();
    if (!saved || !saved.code) return;
    if (saved.isHost && saved.room) {
      isHostRef.current = true;
      initializedRef.current = true;
      setRoom(saved.room);
      setRoomCode(saved.code);
      setConnStatus("reconnecting");
      const channel = attachChannel(saved.code, true);
      channel.subscribe((status) => {
        if (status === "SUBSCRIBED") {
          setConnStatus("idle");
          // Re-broadcast so any guests who reconnected first resync to us.
          broadcastState(saved.room);
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
          setConnStatus("offline");
        }
      });
    } else if (!saved.isHost) {
      setConnStatus("reconnecting");
      const channel = attachChannel(saved.code, false);
      channel.subscribe((status) => {
        if (status === "SUBSCRIBED") {
          channel.send({ type: "broadcast", event: gameKey + "_join", payload: { playerId, name: messagesRef.current.defaultName } });
          joinTimeoutRef.current = setTimeout(() => {
            // No response — the room is probably gone. Fall back to the
            // normal menu rather than leaving the player stuck.
            setConnStatus("idle");
            setRoomCode(null);
            session.clear();
            supabaseClient.removeChannel(channel);
            channelRef.current = null;
          }, 6000);
        } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
          if (!initializedRef.current) setConnStatus("offline");
        }
      });
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  useEffect(() => {
    return () => {
      if (joinTimeoutRef.current) clearTimeout(joinTimeoutRef.current);
      if (channelRef.current) {
        supabaseClient.removeChannel(channelRef.current);
        channelRef.current = null;
      }
      // A real unmount here only happens when the player navigates back to
      // the hub in-app (a page refresh remounts fresh and reads the saved
      // session instead) — so this is the right place to forget the room.
      session.clear();
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function handleCreate(name) {
    setBusy(true);
    setError("");
    isHostRef.current = true;
    initializedRef.current = false;
    const code = genRoomCode();
    const initialRoom = buildInitialRoom(playerId, name);
    const channel = attachChannel(code, true);
    channel.subscribe((status) => {
      if (status === "SUBSCRIBED") {
        if (!initializedRef.current) {
          // First-ever connect: seed the brand-new room.
          initializedRef.current = true;
          setRoom(initialRoom);
          setRoomCode(code);
          setBusy(false);
          session.persist(code, true, initialRoom);
        } else if (roomRef.current) {
          // Reconnected mid-game after a drop — resync everyone to what we
          // actually have now, never to the stale room object captured
          // above when the room was first created.
          setConnStatus("idle");
          broadcastState(roomRef.current);
        }
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        if (!initializedRef.current) {
          setError(messagesRef.current.connectFailed);
          setBusy(false);
        } else {
          setConnStatus("offline");
        }
      }
    });
  }

  function handleJoin(name, code) {
    if (!/^\d{4}$/.test(code)) {
      setError(messagesRef.current.enterCode4);
      return;
    }
    if (!name.trim()) {
      setError(messagesRef.current.enterNameError);
      return;
    }
    setBusy(true);
    setError("");
    isHostRef.current = false;
    initializedRef.current = false;
    const channel = attachChannel(code, false);
    channel.subscribe((status) => {
      if (status === "SUBSCRIBED") {
        channel.send({ type: "broadcast", event: gameKey + "_join", payload: { playerId, name: name.trim().slice(0, 20) } });
        if (!initializedRef.current) {
          joinTimeoutRef.current = setTimeout(() => {
            setError(messagesRef.current.notFound);
            setBusy(false);
            supabaseClient.removeChannel(channel);
            channelRef.current = null;
          }, 4000);
        } else {
          setConnStatus("idle");
        }
      } else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT" || status === "CLOSED") {
        if (!initializedRef.current) {
          setError(messagesRef.current.connectFailed);
          setBusy(false);
        } else {
          setConnStatus("offline");
        }
      }
    });
  }

  return {
    roomCode, room, error, busy, connStatus, playerId, inviteCode,
    isHostRef, roomRef,
    handleCreate, handleJoin, broadcastState, sendEvent,
  };
}

/* i18n — translation dictionary + useT() hook.                      */
/* Scope: UI chrome + game rules text for all 5 games (useT/useRules) */
/* AND the game content itself — Bunker traits/catastrophes, Court   */
/* cases/evidence, Spy locations and the Alias word bank — via       */
/* {ru,en,hy}-shaped values resolved with pickLang()/useLocalized().  */
/* Multiplayer rooms (Bunker, Court) broadcast a stable index/key,   */
/* never the localized text itself, so each player's client renders  */
/* the same assigned trait/case/evidence in their own language.      */
/* The AI support chat replies in the visitor's selected language    */
/* too (the client tells /api/ai-chat which one).                    */
/* Usage: const t = useT(); ... {t("some.key")}                      */
/* A missing key falls back to "ru", then to the key itself.         */
/* ---------------------------------------------------------------- */
/* ================================================================ */
/* ADDING A NEW GAME — checklist                                     */
/*                                                                    */
/* The app has been through several rounds of new games, so this is  */
/* now a deliberately small, repeatable list rather than something   */
/* to re-derive from scratch each time. Follow it in order:          */
/*                                                                    */
/*  1. Content: write the game's data as {ru, en, hy} objects/arrays  */
/*     (see ALIAS_CATEGORIES, BUNKER_CATASTROPHES, COURT_CASES for    */
/*     three real shapes — flat word list, field-by-field object,    */
/*     list-of-objects). Resolve it with pickLang()/useLocalized(),   */
/*     never by branching on hatsitSettings.language by hand.         */
/*  2. i18n: add its UI strings (setup screen, rules, etc.) to I18N   */
/*     above, one {ru, en, hy} entry per key. Rules text goes through */
/*     useRules() the same way the 5 existing games' rules do.        */
/*  3a. LOCAL game (pass-the-phone, like Spy/Alias/Mafia): add its    */
/*     screens as ordinary components reading `state`/`dispatch`,     */
/*     its slice of `initialState.config` (+ game-specific state if   */
/*     needed), and its "OPEN_<GAME>_SETUP" case + screen-transition  */
/*     cases in `reducer()`.                                          */
/*  3b. ONLINE game (Supabase-synced, like Bunker/Court): call         */
/*     useGameRoom({ gameKey, genPlayerId, genRoomCode, buildInitialRoom,*/
/*     hostEvents, messages }) from your <Game>App({ dispatch })      */
/*     component instead of hand-rolling connect/reconnect/session    */
/*     logic — see its doc comment a few hundred lines up (right      */
/*     after useLocalized/vibrate) and BunkerApp/CourtApp for two     */
/*     full examples. You only write: buildInitialRoom(playerId,name),*/
/*     one hostEvents resolver per action a guest can *request*, and  */
/*     the purely game-specific actions (start round, etc.) layered   */
/*     on top with the hook's broadcastState()/sendEvent(). Genuinely */
/*     use genRoomCode4/genRoomPlayerId(prefix) unless the game needs  */
/*     a different code/id shape.                                     */
/*  4. Register its screen(s) in SCREEN_COMPONENTS (a few hundred     */
/*     lines down, right before Hub/App) — one line per screen name,  */
/*     `"screen-name": ComponentFunction`. An online game usually has */
/*     just one entry (its <Game>App root component).                */
/*  5. Add one entry to GAMES (same area, right above                 */
/*     SCREEN_COMPONENTS) — id, titleKey/subtitleKey, Icon, the       */
/*     dispatch action that opens it, and badgeKey/badgeClassName     */
/*     only if it's online. This is what makes it show up on the Hub  */
/*     and be searchable; nothing else needs touching for that.       */
/*                                                                    */
/* Steps 4-5 are intentionally the only places a new game's *routing* */
/* is wired in — everything else (content, i18n, the game's own       */
/* screens/logic) necessarily stays bespoke to that game.             */
/* ================================================================ */

function t_lookup(key, lang) {
  const entry = I18N[key];
  if (!entry) return key;
  return entry[lang] || entry.ru || key;
}
function useT() {
  const settings = useHatsitSettings();
  const lang = HATSIT_LANGS.includes(settings.language) ? settings.language : "ru";
  return function t(key) {
    return t_lookup(key, lang);
  };
}

// Lets SupportChatWidget know which top-level screen is showing, even
// though it's rendered as a sibling of <App/> rather than a descendant of
// it (see the render root at the bottom of the file) — so the floating
// support bubble can hide itself once a game has actually been picked,
// instead of floating over gameplay screens where it mostly gets in the
// way. Same module-level pub/sub shape as hatsitSettings above.
let hatsitCurrentScreen = "hub";
const hatsitScreenListeners = new Set();
function setHatsitCurrentScreen(screen) {
  hatsitCurrentScreen = screen;
  hatsitScreenListeners.forEach((fn) => fn(screen));
}
function useHatsitCurrentScreen() {
  const [screen, setScreen] = useState(hatsitCurrentScreen);
  useEffect(() => {
    hatsitScreenListeners.add(setScreen);
    return () => hatsitScreenListeners.delete(setScreen);
  }, []);
  return screen;
}

/* ---------------------------------------------------------------- */
/* Session stats — "who was the spy how many times", "who won Mafia  */
/* how often" for the current evening. Scoped to sessionStorage (not */
/* localStorage) on purpose: it's meant to answer "how did tonight   */
/* go", not accumulate forever across unrelated get-togethers — it   */
/* resets the same way the rest of the app's resumable state does,   */
/* when the tab is actually closed rather than just refreshed.       */
/* ---------------------------------------------------------------- */
const STATS_KEY = "hatsit_stats_v1";
function loadStats() {
  try {
    const raw = sessionStorage.getItem(STATS_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return { spy: parsed.spy || {}, mafia: parsed.mafia || {} };
    }
  } catch (e) {}
  return { spy: {}, mafia: {} };
}
function saveStats(stats) {
  try {
    sessionStorage.setItem(STATS_KEY, JSON.stringify(stats));
  } catch (e) {}
}
function clearStats() {
  try {
    sessionStorage.removeItem(STATS_KEY);
  } catch (e) {}
}
function useStats() {
  const [stats, setStats] = useState(loadStats);
  const refresh = () => setStats(loadStats());
  return [stats, refresh];
}
function recordSpyRound(names, spyIndexes) {
  const stats = loadStats();
  names.forEach((rawName, i) => {
    const fallback = `${t_lookup("common.player", currentLangForDefaults())} ${i + 1}`;
    const name = (rawName || fallback).trim() || fallback;
    const entry = stats.spy[name] || { rounds: 0, timesSpy: 0 };
    entry.rounds += 1;
    if (spyIndexes.includes(i)) entry.timesSpy += 1;
    stats.spy[name] = entry;
  });
  saveStats(stats);
}
// Mafia team = "mafia" + "don"; Maniac is a lone third faction; everyone
// else (civilian, doctor, sheriff, putana) is Town — mirrors the exact
// grouping checkMafiaWinner uses to decide who won.
function recordMafiaGame(names, roles, winner) {
  const stats = loadStats();
  names.forEach((rawName, i) => {
    const fallback = `${t_lookup("common.player", currentLangForDefaults())} ${i + 1}`;
    const name = (rawName || fallback).trim() || fallback;
    const role = roles[i];
    const won =
      winner === "mafia"
        ? role === "mafia" || role === "don"
        : winner === "maniac"
        ? role === "maniac"
        : winner === "town"
        ? role !== "mafia" && role !== "don" && role !== "maniac"
        : false;
    const entry = stats.mafia[name] || { games: 0, wins: 0 };
    entry.games += 1;
    if (won) entry.wins += 1;
    stats.mafia[name] = entry;
  });
  saveStats(stats);
}

/* ---------------------------------------------------------------- */
/* Screen Wake Lock — keeps the phone's screen on while an "active   */
/* round" of any game is on screen, and releases it the moment that  */
/* component unmounts (back to the hub, game over, etc). The browser */
/* itself force-releases the lock whenever the tab is hidden, so we   */
/* also re-acquire it on visibilitychange (e.g. phone was locked and   */
/* unlocked mid-round without leaving the page).                     */
/* ---------------------------------------------------------------- */
function useWakeLock(active) {
  const lockRef = useRef(null);
  useEffect(() => {
    if (!active || !("wakeLock" in navigator)) return;
    let cancelled = false;
    async function acquire() {
      try {
        const lock = await navigator.wakeLock.request("screen");
        if (cancelled) {
          lock.release().catch(() => {});
          return;
        }
        lockRef.current = lock;
        lock.addEventListener && lock.addEventListener("release", () => {
          if (lockRef.current === lock) lockRef.current = null;
        });
      } catch (e) {}
    }
    acquire();
    function handleVisibility() {
      if (document.visibilityState === "visible" && !lockRef.current) acquire();
    }
    document.addEventListener("visibilitychange", handleVisibility);
    return () => {
      cancelled = true;
      document.removeEventListener("visibilitychange", handleVisibility);
      if (lockRef.current) {
        lockRef.current.release().catch(() => {});
        lockRef.current = null;
      }
    };
  }, [active]);
}

/* ---------------------------------------------------------------- */
/* PWA install prompt — captures the browser's `beforeinstallprompt`  */
/* event once (module scope, so it isn't missed while no component   */
/* is listening yet) and exposes it to React via a tiny pub/sub, so a */
/* "Установить приложение" button can show up on the hub only when    */
/* the browser has actually offered installation.                    */
/* ---------------------------------------------------------------- */
let deferredInstallPrompt = null;
const installPromptListeners = new Set();
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installPromptListeners.forEach((fn) => fn());
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  installPromptListeners.forEach((fn) => fn());
});
function useInstallPrompt() {
  const [available, setAvailable] = useState(() => !!deferredInstallPrompt);
  useEffect(() => {
    function handleChange() {
      setAvailable(!!deferredInstallPrompt);
    }
    installPromptListeners.add(handleChange);
    return () => installPromptListeners.delete(handleChange);
  }, []);
  async function promptInstall() {
    if (!deferredInstallPrompt) return;
    try {
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
    } catch (e) {}
    deferredInstallPrompt = null;
    installPromptListeners.forEach((fn) => fn());
  }
  return { available, promptInstall };
}

/* ---------------------------------------------------------------- */
/* Sound engine — tiny Web Audio API synth, no external audio files. */
/* ---------------------------------------------------------------- */
let __audioCtx = null;
function getAudioCtx() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  if (!__audioCtx) __audioCtx = new AC();
  if (__audioCtx.state === "suspended") {
    __audioCtx.resume().catch(() => {});
  }
  return __audioCtx;
}

function playTone(freq, duration, opts) {
  if (!hatsitSettings.sound) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  const o = opts || {};
  const startTime = ctx.currentTime + (o.delay || 0);
  const osc = ctx.createOscillator();
  const gainNode = ctx.createGain();
  osc.type = o.type || "sine";
  osc.frequency.setValueAtTime(freq, startTime);
  if (o.freqTo != null) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.freqTo), startTime + duration);
  }
  const peak = o.gain != null ? o.gain : 0.12;
  gainNode.gain.setValueAtTime(0.0001, startTime);
  gainNode.gain.linearRampToValueAtTime(peak, startTime + 0.008);
  gainNode.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gainNode);
  gainNode.connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.03);
}

/* Soft "click" — used for every button press across the whole app. */
function playClickSound() {
  try {
    playTone(520, 0.07, { type: "sine", freqTo: 260, gain: 0.09 });
  } catch (e) {}
}

/* Gentle two-note "dzynь" bell — new player joined the Bunker lobby. */
function playChimeSound() {
  try {
    playTone(880, 0.35, { type: "sine", gain: 0.11 });
    playTone(1318.5, 0.45, { type: "sine", gain: 0.09, delay: 0.09 });
  } catch (e) {}
}

/* Short high tick — Alias/Spy countdown in its last seconds. */
function playTickSound() {
  try {
    playTone(1000, 0.05, { type: "square", gain: 0.05 });
  } catch (e) {}
}

/* Two-note descending buzz — a discussion timer (Spy) ran out. */
function playTimeUpSound() {
  try {
    playTone(320, 0.28, { type: "sawtooth", gain: 0.1 });
    playTone(220, 0.4, { type: "sawtooth", gain: 0.1, delay: 0.16 });
  } catch (e) {}
}

/* One global listener plays the click sound for literally any button in  */
/* the app (offline games and Bunker alike) — no need to touch every      */
/* individual onClick handler.                                            */
if (typeof document !== "undefined") {
  document.addEventListener(
    "click",
    (e) => {
      const btn = e.target && e.target.closest && e.target.closest("button");
      if (btn && !btn.disabled) {
        playClickSound();
        vibrate(10);
      }
    },
    true
  );
}

// streak_longest) -- fetchLeaderboard() below fetches exactly those for

function getPlayerTitle(profile) {

const ACHIEVEMENT_TITLE_COLOR = Object.fromEntries(PLAYER_TITLES.map((tr) => [tr.achievementId, tr.color]));

// Before this, a newly-crossed achievement only ever showed up quietly
// next time someone happened to open the Profile panel -- the "oh, I got
// something!" moment right after the game, which is most of the point of
// having achievements at all, was silently lost. This tracks (per device,
// in localStorage) which achievement ids have already been celebrated, so
// WordlessEnd/CountdownEnd can pop a toast for exactly the ones that are
// new since last time and never repeat one.
const ACHIEVEMENTS_SEEN_KEY = "hatsit_achievements_seen_v1";
function loadSeenAchievementIds() {
  try {
    const raw = localStorage.getItem(ACHIEVEMENTS_SEEN_KEY);
    if (raw === null) return null; // never initialized on this device
    const arr = JSON.parse(raw);
    return new Set(Array.isArray(arr) ? arr : []);
  } catch (e) {
    return null;
  }
}
function saveSeenAchievementIds(idsSet) {
  try {
    localStorage.setItem(ACHIEVEMENTS_SEEN_KEY, JSON.stringify(Array.from(idsSet)));
  } catch (e) {}
}
// Compares a freshly-fetched profile's unlocked achievements against the
// seen-set and returns the ACHIEVEMENTS entries that are newly crossed
// (never celebrated on this device before), updating the seen-set so each
// is only ever shown once. On the very first call ever made on a device
// (no seen-set stored yet -- e.g. right after this feature ships to an
// existing player who already has achievements unlocked), everything
// already unlocked is adopted silently instead of reported as "new", so
// shipping this doesn't flood existing players with toasts for
// achievements they actually earned long ago.
function detectNewlyUnlockedAchievements(profile) {
  const unlockedNow = computeUnlockedAchievementIds(profile);
  const seen = loadSeenAchievementIds();
  if (seen === null) {
    saveSeenAchievementIds(new Set(unlockedNow));
    return [];
  }
  const freshIds = unlockedNow.filter((id) => !seen.has(id));
  if (freshIds.length > 0) {
    const next = new Set(seen);
    unlockedNow.forEach((id) => next.add(id));
    saveSeenAchievementIds(next);
  }
  return freshIds.map((id) => ACHIEVEMENTS.find((a) => a.id === id)).filter(Boolean);
}

function getActiveSpyLocations(spyCategories) {
  const lang = HATSIT_LANGS.includes(hatsitSettings.language) ? hatsitSettings.language : "ru";
  const active = Object.keys(SPY_LOCATION_CATEGORIES).filter((key) => spyCategories[key]);
  const keys = active.length > 0 ? active : Object.keys(SPY_LOCATION_CATEGORIES);
  return keys.flatMap((key) => pickLang(SPY_LOCATION_CATEGORIES[key], lang));
}

function getActiveAliasWords(aliasCategories) {
  const lang = HATSIT_LANGS.includes(hatsitSettings.language) ? hatsitSettings.language : "ru";
  const keys = Object.keys(ALIAS_CATEGORIES).filter((key) => aliasCategories && aliasCategories[key]);
  const activeKeys = keys.length > 0 ? keys : Object.keys(ALIAS_CATEGORIES);
  return activeKeys.flatMap((key) => pickLang(ALIAS_CATEGORIES[key], lang));
}

function defaultAliasCategories() {
  const result = {};
  Object.keys(ALIAS_CATEGORIES).forEach((key) => {
    result[key] = true;
  });
  return result;
}

// Base per-round seconds ratchets down as rounds pass (see countdownSecondsForRound
// below) so the game gets objectively harder even before new rules stack up —
// never below this floor, so it always stays humanly possible to react.
const COUNTDOWN_SECONDS_FLOOR = 5;
// Every Nth round introduces a new persistent handicap instead of a regular
// task — see advanceCountdownRound() below.
const COUNTDOWN_RULE_INTERVAL = 3;
// "Испорченный телефон": capped at 6 (not 8, like Wordless/Mafia) because the
